<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">PROD</text><text x="20" y="76" class="h2inv" text-anchor="start">Platform Admin Home</text><rect x="16" y="108" width="358" height="88" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="30" y="134" class="small" text-anchor="start">Top signals</text><text x="30" y="166" class="metric" text-anchor="start">98%</text><text x="102" y="166" class="body" text-anchor="start">Platform health</text><rect x="250" y="122" width="106" height="28" rx="14" fill="#FEF3C7"/><text x="303.0" y="140" class="small" text-anchor="middle">Impact 24</text><rect x="250" y="156" width="106" height="28" rx="14" fill="#FEE2E2"/><text x="303.0" y="174" class="small" text-anchor="middle">Jobs 05</text><circle cx="28" cy="114" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="119" class="inverse" text-anchor="middle">1</text><rect x="16" y="212" width="358" height="154" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="236" class="h3" text-anchor="start">Urgent queue</text><text x="32" y="254" class="small" text-anchor="start">Approval and exception work surfaced first on mobile</text><circle cx="34" cy="272" r="3" fill="#2563EB"/><text x="46" y="276" class="body" text-anchor="start">Provisioning approval</text><circle cx="34" cy="292" r="3" fill="#2563EB"/><text x="46" y="296" class="body" text-anchor="start">Privacy review</text><circle cx="34" cy="312" r="3" fill="#2563EB"/><text x="46" y="316" class="body" text-anchor="start">Failed publish</text><circle cx="30" cy="228" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="233" class="inverse" text-anchor="middle">2</text><rect x="16" y="382" width="358" height="154" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="406" class="h3" text-anchor="start">Health cards</text><text x="32" y="424" class="small" text-anchor="start">Critical platform services condensed into stacked cards</text><rect x="30" y="430" width="154" height="74" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="42" y="454" class="h3" text-anchor="start">Identity</text><text x="42" y="478" class="small" text-anchor="start">Healthy</text><rect x="200" y="430" width="154" height="74" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="212" y="454" class="h3" text-anchor="start">Audit</text><text x="212" y="478" class="small" text-anchor="start">Healthy</text><rect x="30" y="518" width="154" height="74" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="42" y="542" class="h3" text-anchor="start">Backup</text><text x="42" y="566" class="small" text-anchor="start">Healthy</text><rect x="200" y="518" width="154" height="74" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="212" y="542" class="h3" text-anchor="start">Integrations</text><text x="212" y="566" class="small" text-anchor="start">Healthy</text><circle cx="30" cy="398" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="403" class="inverse" text-anchor="middle">3</text><rect x="16" y="550" width="358" height="128" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="574" class="h3" text-anchor="start">Risks and shortcuts</text><text x="32" y="592" class="small" text-anchor="start">Governance signals remain above secondary actions</text><circle cx="34" cy="604" r="3" fill="#2563EB"/><text x="46" y="608" class="body" text-anchor="start">Privileged access review</text><circle cx="34" cy="624" r="3" fill="#2563EB"/><text x="46" y="628" class="body" text-anchor="start">Retention warning</text><circle cx="34" cy="644" r="3" fill="#2563EB"/><text x="46" y="648" class="body" text-anchor="start">Open metadata explorer</text><circle cx="30" cy="566" r="14" fill="#B42318" stroke="white" stroke-width="3"/><text x="30" y="571" class="inverse" text-anchor="middle">4</text><rect x="16" y="694" width="358" height="132" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="722" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="746" r="12" fill="#2563EB"/><text x="40" y="750" class="inverse" text-anchor="middle">1</text><text x="62" y="748" class="annoTitle" text-anchor="start">Signal compression</text><text x="62" y="766" class="annoText" text-anchor="start">Top metrics collapse into a single summary card instead of a wide strip.</text><circle cx="40" cy="798" r="12" fill="#2563EB"/><text x="40" y="802" class="inverse" text-anchor="middle">2</text><text x="62" y="800" class="annoTitle" text-anchor="start">Queue before analytics</text><text x="62" y="818" class="annoText" text-anchor="start">Urgent control-plane tasks stay ahead of lower-priority summary content.</text></svg>
