<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Import</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Template</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Validate</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Preview</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Commit</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">IMPORT</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Bulk Import Wizard</text><rect x="296" y="152" width="118" height="28" rx="14" fill="#DBEAFE"/><text x="355.0" y="170" class="small" text-anchor="middle">Rows 24,860</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="426" y="152" width="106" height="28" rx="14" fill="#FEF3C7"/><text x="479.0" y="170" class="small" text-anchor="middle">Errors 182</text><rect x="544" y="152" width="88" height="28" rx="14" fill="#FEE2E2"/><text x="588.0" y="170" class="small" text-anchor="middle">Preview</text><rect x="808" y="146" width="170" height="40" rx="14" fill="#2563EB"/><text x="893.0" y="172" class="inverse" text-anchor="middle">Validate import</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="990" y="146" width="158" height="40" rx="14" fill="#0F766E"/><text x="1069.0" y="172" class="inverse" text-anchor="middle">Commit import</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search row, source key, error cluster, duplicate group, or import batch</text><rect x="856" y="226" width="94" height="28" rx="14" fill="#EAF2F8"/><text x="903.0" y="244" class="small" text-anchor="middle">Template</text><rect x="960" y="226" width="70" height="28" rx="14" fill="#EAF2F8"/><text x="995.0" y="244" class="small" text-anchor="middle">Rows</text><rect x="1040" y="226" width="66" height="28" rx="14" fill="#10324A"/><text x="1073.0" y="244" class="inverse" text-anchor="middle">Commit</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Uploaded</text><text x="364" y="362" class="metric" text-anchor="start">24860</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Valid</text><text x="586" y="362" class="metric" text-anchor="start">24510</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Errors</text><text x="808" y="362" class="metric" text-anchor="start">182</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Warnings</text><text x="1030" y="362" class="metric" text-anchor="start">96</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Dupes</text><text x="1252" y="362" class="metric" text-anchor="start">27</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Step rail and staging summary</text><text x="312" y="464" class="small" text-anchor="start">Resumable import flow needs clear progress and template rules</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Template headers validated before upload</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Rows staged successfully in preview area</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">27 duplicate clusters detected</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Import draft can be resumed across sessions</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Row-level validation and correction</text><text x="664" y="464" class="small" text-anchor="start">Error clusters and preview state become the primary surface once staging completes</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Import preview insight</text><text x="684" y="522" class="body" text-anchor="start">Most blocking rows fail because employee_code duplicates an active tenant record while date_of_birth also violates plausibility rules in the same cluster.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open row cluster, correct source values, and commit only after duplicate-resolution policy is satisfied.</text><rect x="666" y="574" width="142" height="40" rx="14" fill="#2563EB"/><text x="737.0" y="600" class="inverse" text-anchor="middle">Open rows</text><rect x="822" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="884.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="960" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1033.0" y="600" class="body" text-anchor="middle">Open policy</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Error clusters and duplicate policy</text><text x="312" y="754" class="small" text-anchor="start">Correction patterns and duplicate handling stay visible before commit</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">182 blocking rows grouped into 11 clusters</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Tenant-scoped uniqueness rules active</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Masked columns remain protected in preview</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Top cluster affects employee master import</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Commit summary and blast radius</text><text x="664" y="754" class="small" text-anchor="start">Validation success is distinct from business approval to write data</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">24,510 rows are commit-ready</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Commit touches employee, bank, and PF entities</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Warnings remain allowed under current policy</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">One final approval needed before write</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned import-governance lenses</text><text x="312" y="994" class="small" text-anchor="start">Implementation teams can pin row, cluster, entity, duplicate, and commit-focused import views</text><rect x="320" y="990" width="108" height="28" rx="14" fill="#DCFCE7"/><text x="374.0" y="1008" class="small" text-anchor="middle">Employee</text><rect x="440" y="990" width="110" height="28" rx="14" fill="#DBEAFE"/><text x="495.0" y="1008" class="small" text-anchor="middle">Duplicate</text><rect x="562" y="990" width="92" height="28" rx="14" fill="#FEF3C7"/><text x="608.0" y="1008" class="small" text-anchor="middle">Errors</text><rect x="666" y="990" width="98" height="28" rx="14" fill="#FEE2E2"/><text x="715.0" y="1008" class="small" text-anchor="middle">Preview</text><rect x="776" y="990" width="94" height="28" rx="14" fill="#EDE9FE"/><text x="823.0" y="1008" class="small" text-anchor="middle">Commit</text><rect x="882" y="990" width="90" height="28" rx="14" fill="#F8FAFC"/><text x="927.0" y="1008" class="small" text-anchor="middle">Policy</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Progress is explicit</text><text x="1224" y="224" class="annoText" text-anchor="start">Imports span sessions, so the step model stays visible throughout the wizard.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Template rules come early</text><text x="1224" y="276" class="annoText" text-anchor="start">Most avoidable failures happen before validation, so header and format guidance stays near the top.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Preview promotes rows</text><text x="1224" y="328" class="annoText" text-anchor="start">Once staging succeeds, row-level review becomes the primary operational plane.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Errors reshape layout</text><text x="1224" y="380" class="annoText" text-anchor="start">Error-heavy states expand clustering and correction instead of hiding failures in tabs.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Commit is governed</text><text x="1224" y="432" class="annoText" text-anchor="start">Commit authority is distinct from validation success because writing data is a business decision.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Masking persists in preview</text><text x="1224" y="484" class="annoText" text-anchor="start">Broad implementation access still respects sensitive-column masking during import review.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Blast radius is clear</text><text x="1224" y="536" class="annoText" text-anchor="start">The summary always shows which objects and counts will be written before commit.</text></svg>
