#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Notification Console</text><rect x="296" y="152" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="344.0" y="170" class="small" text-anchor="middle">Drafts 5</text><rect x="404" y="152" width="116" height="28" rx="14" fill="#FEF3C7"/><text x="462.0" y="170" class="small" text-anchor="middle">SMS warning</text><rect x="1012" y="146" width="146" height="40" rx="14" fill="#0F766E"/><text x="1085" y="172" class="inverse" text-anchor="middle">Publish draft</text><circle cx="1024" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="1024" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="248" height="636" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="230" class="h3" text-anchor="start">Template catalog</text><text x="312" y="248" class="small" text-anchor="start">Search and filter by event and channel</text><rect x="314" y="248" width="212" height="34" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="328" y="270" class="small" text-anchor="start">Search template</text><circle cx="314" cy="318" r="3" fill="#2563EB"/><text x="326" y="322" class="body" text-anchor="start">Offer issued</text><circle cx="314" cy="338" r="3" fill="#2563EB"/><text x="326" y="342" class="body" text-anchor="start">Password reset</text><circle cx="314" cy="358" r="3" fill="#2563EB"/><text x="326" y="362" class="body" text-anchor="start">Workflow escalated</text><circle cx="314" cy="378" r="3" fill="#2563EB"/><text x="326" y="382" class="body" text-anchor="start">Payslip ready</text><circle cx="314" cy="398" r="3" fill="#2563EB"/><text x="326" y="402" class="body" text-anchor="start">Document signed</text><circle cx="316" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="316" y="225" class="inverse" text-anchor="middle">2</text><rect x="564" y="206" width="402" height="636" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="580" y="230" class="h3" text-anchor="start">Editor and preview</text><text x="580" y="248" class="small" text-anchor="start">Edit once and compare across channels</text><rect x="582" y="248" width="76" height="28" rx="14" fill="#2563EB"/><text x="620.0" y="266" class="inverse" text-anchor="middle">Email</text><rect x="668" y="248" width="72" height="28" rx="14" fill="#EAF2F8"/><text x="704.0" y="266" class="small" text-anchor="middle">SMS</text><rect x="750" y="248" width="72" height="28" rx="14" fill="#EAF2F8"/><text x="786.0" y="266" class="small" text-anchor="middle">Push</text><rect x="832" y="248" width="108" height="28" rx="14" fill="#EAF2F8"/><text x="886.0" y="266" class="small" text-anchor="middle">WhatsApp</text><rect x="582" y="304" width="366" height="184" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="598" y="330" class="small" text-anchor="start">Subject</text><text x="598" y="356" class="body" text-anchor="start">Your offer letter is ready</text><text x="598" y="392" class="small" text-anchor="start">Body preview</text><circle cx="598" cy="426" r="3" fill="#2563EB"/><text x="610" y="430" class="body" text-anchor="start">Hi {employee_name}</text><circle cx="598" cy="446" r="3" fill="#2563EB"/><text x="610" y="450" class="body" text-anchor="start">Your offer for {designation} is attached</text><circle cx="598" cy="466" r="3" fill="#2563EB"/><text x="610" y="470" class="body" text-anchor="start">Please review before {expiry_date}</text><rect x="582" y="516" width="366" height="146" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="598" y="542" class="small" text-anchor="start">Merge helper</text><rect x="598" y="558" width="108" height="28" rx="14" fill="#E3F2FD"/><text x="652.0" y="576" class="small" text-anchor="middle">{employee}</text><rect x="716" y="558" width="102" height="28" rx="14" fill="#E3F2FD"/><text x="767.0" y="576" class="small" text-anchor="middle">{expiry}</text><rect x="828" y="558" width="108" height="28" rx="14" fill="#E3F2FD"/><text x="882.0" y="576" class="small" text-anchor="middle">{company}</text><circle cx="582" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="582" y="225" class="inverse" text-anchor="middle">3</text><rect x="986" y="206" width="172" height="636" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="1002" y="230" class="h3" text-anchor="start">Delivery diagnostics</text><text x="1002" y="248" class="small" text-anchor="start">Channel health and failure reasons</text><rect x="998" y="246" width="148" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1010" y="258" width="44" height="44" rx="12" fill="#15803D"/><text x="1066" y="276" class="small" text-anchor="start">Success</text><text x="1066" y="306" class="metric" text-anchor="start">97%</text><rect x="998" y="348" width="148" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1010" y="360" width="44" height="44" rx="12" fill="#D97706"/><text x="1066" y="378" class="small" text-anchor="start">Retries</text><text x="1066" y="408" class="metric" text-anchor="start">12</text><circle cx="1004" cy="474" r="3" fill="#2563EB"/><text x="1016" y="478" class="body" text-anchor="start">SMS provider timeout</text><circle cx="1004" cy="494" r="3" fill="#2563EB"/><text x="1016" y="498" class="body" text-anchor="start">WhatsApp policy lock</text><circle cx="1004" cy="514" r="3" fill="#2563EB"/><text x="1016" y="518" class="body" text-anchor="start">Missing locale fallback</text><circle cx="998" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="998" y="225" class="inverse" text-anchor="middle">4</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Publish control</text><text x="1224" y="224" class="annoText" text-anchor="start">Publishing is explicit and separated from casual editing to reduce accidental changes.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Template discovery</text><text x="1224" y="276" class="annoText" text-anchor="start">Category and event-based selection remain quick even in a large template library.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Channel-aware preview</text><text x="1224" y="328" class="annoText" text-anchor="start">Preview stays close to editing so content and output constraints can be checked together.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Diagnostics nearby</text><text x="1224" y="380" class="annoText" text-anchor="start">Delivery failures are visible beside the template instead of in a disconnected report.</text></svg>
