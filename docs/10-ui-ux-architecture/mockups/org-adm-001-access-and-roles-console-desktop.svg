  <rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/>
  <text x="60" y="168" class="inverse">Access and Roles</text>
  <rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="220" class="inverse">Delegated Admin</text>
  <rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="272" class="inverse">Access Requests</text>
  <rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="324" class="inverse">Segregation Rules</text>
  <rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="376" class="inverse">Scope Governance</text>
  <rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="428" class="inverse">Audit Trail</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="40" width="380" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="61" class="small">Search user, role, policy, access request, delegated admin batch, or audit event</text>
  <rect x="1064" y="40" width="102" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1115" y="58" class="small" text-anchor="middle">Org Admin</text>
  <rect x="1180" y="40" width="118" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1239" y="58" class="small" text-anchor="middle">SoD alerts 03</text>
  <rect x="1312" y="40" width="88" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1356" y="58" class="small" text-anchor="middle">Queue 11</text>

  <text x="310" y="128" class="title">Access and Roles Console</text>
  <rect x="296" y="152" width="126" height="28" rx="14" fill="#DBEAFE"/>
  <text x="359" y="170" class="small" text-anchor="middle">Tenant owned</text>
  <circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="312" y="171" class="inverse" text-anchor="middle">1</text>
  <rect x="434" y="152" width="150" height="28" rx="14" fill="#DCFCE7"/>
  <text x="509" y="170" class="small" text-anchor="middle">Delegations 07</text>
  <rect x="596" y="152" width="164" height="28" rx="14" fill="#FEE2E2"/>
  <text x="678" y="170" class="small" text-anchor="middle">Scope conflicts 03</text>
  <rect x="808" y="146" width="164" height="40" rx="14" fill="#2563EB"/>
  <text x="890" y="172" class="inverse" text-anchor="middle">Review SoD warnings</text>
  <rect x="986" y="146" width="168" height="40" rx="14" fill="#0F766E"/>
  <text x="1070" y="172" class="inverse" text-anchor="middle">Assign access safely</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="226" width="540" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="249" class="body">Filter by active role, request status, org scope, temporary delegation, or role owner</text>
  <rect x="876" y="226" width="96" height="28" rx="14" fill="#EAF2F8"/>
  <text x="924" y="244" class="small" text-anchor="middle">Assignments</text>
  <rect x="982" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1028" y="244" class="small" text-anchor="middle">Requests</text>
  <rect x="1084" y="226" width="64" height="28" rx="14" fill="#10324A"/>
  <text x="1116" y="244" class="inverse" text-anchor="middle">Live</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">2</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small">Active roles</text>
  <text x="364" y="362" class="metric">34</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">3</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="586" y="332" class="small">Assigned users</text>
  <text x="586" y="362" class="metric">612</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="808" y="332" class="small">Pending queue</text>
  <text x="808" y="362" class="metric">11</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#7C3AED"/>
  <text x="1030" y="332" class="small">Delegations</text>
  <text x="1030" y="362" class="metric">07</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="1252" y="332" class="small">SoD holds</text>
  <text x="1252" y="362" class="metric">03</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Role catalog and tenant-safe scope cues</text>
  <text x="312" y="464" class="small">The catalog distinguishes tenant-created roles from inherited platform baselines before any assignment.</text>
  <rect x="312" y="480" width="292" height="56" rx="12" fill="#FBFDFF" stroke="#D9E2EC"/>
  <text x="328" y="502" class="body">HR-OPS-ADMIN can manage employee records, workflows, imports, and local setup across ApexOne India only.</text>
  <text x="328" y="522" class="small">Scope: Tenant / Legal entities 06 / Mutable locally / Last reviewed 10 Jul 2026</text>
  <rect x="312" y="548" width="292" height="56" rx="12" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="328" y="570" class="body">PAYROLL-REVIEWER inherits finance-safe payroll views but cannot publish payroll runs or alter tax setup.</text>
  <text x="328" y="590" class="small">Scope: Tenant / Read-mostly / Provider baseline extended with local reports</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Assignment queue, delegation context, and warnings</text>
  <text x="664" y="464" class="small">PAT-18 review keeps assignment actions adjacent to temporary delegation and separation checks.</text>
  <rect x="666" y="474" width="474" height="82" rx="12" fill="#FBFDFF" stroke="#D9E2EC"/>
  <text x="684" y="496" class="small">Pending item</text>
  <text x="684" y="522" class="body">Assign FINANCE-APPROVER to Neha Bhat for South region payroll exception review from 18 Jul 2026 to 31 Jul 2026 while primary approver is on leave.</text>
  <text x="684" y="544" class="small">Delegated by Arjun Rao / Scope limited to payroll exceptions and arrear approvals / OTP revalidation required</text>
  <rect x="666" y="574" width="150" height="40" rx="14" fill="#2563EB"/>
  <text x="741" y="600" class="inverse" text-anchor="middle">Approve assignment</text>
  <rect x="830" y="574" width="144" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="902" y="600" class="body" text-anchor="middle">Edit scope</text>
  <rect x="988" y="574" width="126" height="40" rx="14" fill="#FEE2E2"/>
  <text x="1051" y="600" class="body" text-anchor="middle">Hold for SoD</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">Segregation-of-duties and risk review</text>
  <text x="312" y="754" class="small">Risk logic is visible in the console so org admins understand why a request is blocked or routed.</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body">No user may hold payroll publisher and payroll auditor together inside the same tenant scope.</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body">Recruitment approver plus offer compensation override requires second-line approval from Head HR.</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body">Delegated access inherits end date, device challenge, and action cap before activation.</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body">Emergency break-glass access always writes a high-risk audit marker with post-facto review.</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3">Scope governance and audit context</text>
  <text x="664" y="754" class="small">Tenant boundaries, delegated ownership, and immutable baselines stay explicit while configuring access.</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body">Local org admins may clone provider roles but must rename and document the tenant-owned variant before activation.</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body">Assignments can be limited by legal entity, department, workflow family, or data-domain permission pack.</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body">Delegated admin actions are stamped with source principal, acting principal, time window, and approval reason.</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body">Revocations propagate to sessions, approvals, and API tokens according to configured policy switches.</text>
  <circle cx="666" cy="728" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3">Pinned access lenses</text>
  <text x="312" y="994" class="small">Frequently reviewed slices keep org admins close to access operations without leaving the console frame.</text>
  <rect x="320" y="990" width="100" height="28" rx="14" fill="#DCFCE7"/>
  <text x="370" y="1008" class="small" text-anchor="middle">HR roles</text>
  <rect x="432" y="990" width="108" height="28" rx="14" fill="#DBEAFE"/>
  <text x="486" y="1008" class="small" text-anchor="middle">Delegations</text>
  <rect x="552" y="990" width="126" height="28" rx="14" fill="#FEF3C7"/>
  <text x="615" y="1008" class="small" text-anchor="middle">Approval queues</text>
  <rect x="690" y="990" width="116" height="28" rx="14" fill="#FEE2E2"/>
  <text x="748" y="1008" class="small" text-anchor="middle">SoD holds</text>
  <rect x="818" y="990" width="134" height="28" rx="14" fill="#EDE9FE"/>
  <text x="885" y="1008" class="small" text-anchor="middle">Audit review</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">7</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Tenant-safe framing first</text>
  <text x="1224" y="224" class="annoText">The signal strip tells admins they are operating inside org-owned access boundaries, not platform controls.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">One search for roles and requests</text>
  <text x="1224" y="276" class="annoText">Assignments, requests, and delegated access resolve through one operational filter bar.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">Health strip before edits</text>
  <text x="1224" y="328" class="annoText">Counts for roles, users, queues, delegations, and SoD holds show current risk posture up front.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Catalog explains ownership</text>
  <text x="1224" y="380" class="annoText">Role cards explain whether the role is tenant-created, provider-baseline, mutable, or constrained by scope.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">Assignments next to delegation</text>
  <text x="1224" y="432" class="annoText">Temporary acting access is reviewed in the same workspace as primary assignments to reduce hidden risk.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">SoD logic is visible</text>
  <text x="1224" y="484" class="annoText">The mockup exposes blocked combinations and review routing rather than burying them in back-end rules.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Audit remains operational</text>
  <text x="1224" y="536" class="annoText">Revocations, acting-principal markers, and downstream session effects stay part of the access console story.</text>
</svg>
