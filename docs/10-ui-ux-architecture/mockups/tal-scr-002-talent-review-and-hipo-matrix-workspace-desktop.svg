  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Talent matrix and confidentiality</text>
  <text x="312" y="464" class="small">The matrix must remain readable while protecting highly sensitive talent data.</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>
  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>9-box view shows distribution and movement candidates</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Confidential notes remain tightly role-scoped</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>HiPo and bench indicators stay visible without exposing everything to all reviewers</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Matrix filters support level, function, and geography</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Panel review and action queue</text>
  <text x="664" y="464" class="small">Talent review should end with concrete follow-up, not just labels.</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>
  <circle cx='666' cy='482' r='3' fill='#2563EB'/>
<text x='678' y='486' class='body'>Action panels track promotion, succession, risk, or development follow-up</text>
<circle cx='666' cy='504' r='3' fill='#2563EB'/>
<text x='678' y='508' class='body'>Calibration notes remain adjacent to the same employee card</text>
<circle cx='666' cy='526' r='3' fill='#2563EB'/>
<text x='678' y='530' class='body'>Cross-panel disagreement is visible before closure</text>
<circle cx='666' cy='548' r='3' fill='#2563EB'/>
<text x='678' y='552' class='body'>Decision trace remains available for later review</text>

  <rect x="296" y="712" width="862" height="222" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">Follow-through and governance</text>
  <text x="312" y="754" class="small">Talent review should create clear next steps across leadership and HRBP teams.</text>
  <circle cx="314" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="733" class="inverse" text-anchor="middle">6</text>
  <circle cx='314' cy='782' r='3' fill='#2563EB'/>
<text x='326' y='786' class='body'>HiPo decisions connect to development actions</text>
<circle cx='314' cy='804' r='3' fill='#2563EB'/>
<text x='326' y='808' class='body'>Confidential handling remains explicit</text>
<circle cx='314' cy='826' r='3' fill='#2563EB'/>
<text x='326' y='830' class='body'>History helps compare talent decisions across cycles</text>

  <rect x="1178" y="152" width="238" height="782" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
    <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Sensitive matrix</text>
  <text x="1224" y="224" class="annoText">Talent matrix views should remain useful without overexposing sensitive data.</text>
  <circle cx="1202" cy="258" r="12" fill="#2563EB"/>
  <text x="1202" y="262" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="260" class="annoTitle">HiPo with context</text>
  <text x="1224" y="278" class="annoText">HiPo labels need surrounding context and next steps.</text>
  <circle cx="1202" cy="312" r="12" fill="#2563EB"/>
  <text x="1202" y="316" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="314" class="annoTitle">Panel disagreement visibility</text>
  <text x="1224" y="332" class="annoText">Panel disagreement should be visible before final decisions.</text>
  <circle cx="1202" cy="366" r="12" fill="#2563EB"/>
  <text x="1202" y="370" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="368" class="annoTitle">Action after review</text>
  <text x="1224" y="386" class="annoText">Every review should generate follow-through actions.</text>
  <circle cx="1202" cy="420" r="12" fill="#2563EB"/>
  <text x="1202" y="424" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="422" class="annoTitle">Scoped confidentiality</text>
  <text x="1224" y="440" class="annoText">Confidentiality needs obvious scope boundaries.</text>
  <circle cx="1202" cy="474" r="12" fill="#2563EB"/>
  <text x="1202" y="478" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="476" class="annoTitle">Cycle comparison</text>
  <text x="1224" y="494" class="annoText">Cycle-over-cycle comparison helps catch inconsistent decisions.</text>
