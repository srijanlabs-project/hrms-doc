<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Analytics Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Reports</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Builder</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Fields</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Schedules</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Analytics</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Custom Reporting</text><rect x="296" y="152" width="89" height="28" rx="14" fill="#DBEAFE"/><text x="340.5" y="170" class="small" text-anchor="middle">Scheduled</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="397" y="152" width="138" height="28" rx="14" fill="#FEF3C7"/><text x="466.0" y="170" class="small" text-anchor="middle">Restricted field</text><rect x="547" y="152" width="89" height="28" rx="14" fill="#FEE2E2"/><text x="591.5" y="170" class="small" text-anchor="middle">Empty set</text><rect x="808" y="146" width="110" height="40" rx="14" fill="#2563EB"/><text x="863.0" y="172" class="inverse" text-anchor="middle">Open builder</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="930" y="146" width="124" height="40" rx="14" fill="#0F766E"/><text x="992.0" y="172" class="inverse" text-anchor="middle">Preview output</text><rect x="1066" y="146" width="110" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1121.0" y="172" class="body" text-anchor="middle">Schedule run</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search report, field, dataset, schedule, approval, or access rule</text><rect x="856" y="226" width="75" height="28" rx="14" fill="#EAF2F8"/><text x="893.5" y="244" class="small" text-anchor="middle">Builder</text><rect x="941" y="226" width="96" height="28" rx="14" fill="#EAF2F8"/><text x="989.0" y="244" class="small" text-anchor="middle">Restricted</text><rect x="1047" y="226" width="89" height="28" rx="14" fill="#10324A"/><text x="1091.5" y="244" class="inverse" text-anchor="middle">Schedules</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Draft reports</text><text x="364" y="362" class="metric" text-anchor="start">12</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="586" y="332" class="small" text-anchor="start">Scheduled</text><text x="586" y="362" class="metric" text-anchor="start">19</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Approval pending</text><text x="808" y="362" class="metric" text-anchor="start">04</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="1030" y="332" class="small" text-anchor="start">Restricted refs</text><text x="1030" y="362" class="metric" text-anchor="start">07</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Reusable templates</text><text x="1252" y="362" class="metric" text-anchor="start">15</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Field library and report canvas</text><text x="312" y="464" class="small" text-anchor="start">Builder users need a governed field catalog beside the report draft.</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Field library groups dimensions, facts, and derived measures</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Builder canvas shows selected fields and grouping logic</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Restricted fields display governance cues before use</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Empty dataset warnings remain visible during design</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Governance and execution controls</text><text x="664" y="464" class="small" text-anchor="start">Build, preview, schedule, and approval should stay in one flow.</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Report-governance note</text><text x="684" y="522" class="body" text-anchor="start">Reports that include restricted fields should require approval before schedule or export.</text><text x="684" y="544" class="small" text-anchor="start">Next step: add fields, preview the output, and route approval if needed.</text><rect x="666" y="574" width="108" height="40" rx="14" fill="#2563EB"/><text x="720.0" y="600" class="inverse" text-anchor="middle">Preview run</text><rect x="788" y="574" width="110" height="40" rx="14" fill="#EEF2FF"/><text x="843.0" y="600" class="body" text-anchor="middle">Check access</text><rect x="912" y="574" width="124" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="974.0" y="600" class="body" text-anchor="middle">Route approval</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Templates and schedule posture</text><text x="312" y="754" class="small" text-anchor="start">Reusable report patterns should stay close to execution controls.</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Template library stores trusted board-pack and ops patterns</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Schedules show cadence, owner, and destination controls</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Failed runs remain visible beside the report draft</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Dataset freshness stays visible before publication</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Audit and explainability</text><text x="664" y="754" class="small" text-anchor="start">Consumers should be able to understand what a report contains and why.</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Field-level lineage remains inspectable</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Approval decisions are attached to the report version</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Row-level security cues remain visible to designers</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Exports stay tied to the saved report definition</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned workspace lenses</text><text x="312" y="994" class="small" text-anchor="start">Repeat views keep the highest-value slices close without re-filtering.</text><rect x="320" y="990" width="75" height="28" rx="14" fill="#DCFCE7"/><text x="357.5" y="1008" class="small" text-anchor="middle">Builder</text><rect x="407" y="990" width="145" height="28" rx="14" fill="#DBEAFE"/><text x="479.5" y="1008" class="small" text-anchor="middle">Restricted fields</text><rect x="564" y="990" width="89" height="28" rx="14" fill="#FEF3C7"/><text x="608.5" y="1008" class="small" text-anchor="middle">Templates</text><rect x="665" y="990" width="89" height="28" rx="14" fill="#FEE2E2"/><text x="709.5" y="1008" class="small" text-anchor="middle">Schedules</text><rect x="766" y="990" width="89" height="28" rx="14" fill="#EDE9FE"/><text x="810.5" y="1008" class="small" text-anchor="middle">Approvals</text><rect x="867" y="990" width="75" height="28" rx="14" fill="#F8FAFC"/><text x="904.5" y="1008" class="small" text-anchor="middle">Lineage</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Governed builder</text><text x="1224" y="224" class="annoText" text-anchor="start">The reporting surface should feel powerful but explicitly controlled.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Field library first</text><text x="1224" y="276" class="annoText" text-anchor="start">Users need discoverable fields and definitions before dragging them into a report.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Restriction visible</text><text x="1224" y="328" class="annoText" text-anchor="start">Restricted-field access should be visible before schedule or export.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Preview in flow</text><text x="1224" y="380" class="annoText" text-anchor="start">Preview and execution checks belong inside the builder flow.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Template reuse</text><text x="1224" y="432" class="annoText" text-anchor="start">Trusted patterns should lower effort and improve consistency.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Lineage matters</text><text x="1224" y="484" class="annoText" text-anchor="start">Report consumers and auditors need field and approval lineage.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile is oversight-only</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should support review, schedule, and approval rather than full building.</text></svg>
