="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Attendance Control Center</text><rect x="296" y="152" width="138" height="28" rx="14" fill="#FEE2E2"/><text x="365.0" y="170" class="small" text-anchor="middle">Exceptions 24</text><rect x="446" y="152" width="158" height="28" rx="14" fill="#FEF3C7"/><text x="525.0" y="170" class="small" text-anchor="middle">Selfie review 07</text><rect x="616" y="152" width="168" height="28" rx="14" fill="#EDE9FE"/><text x="700.0" y="170" class="small" text-anchor="middle">Devices degraded 02</text><rect x="808" y="146" width="180" height="40" rx="14" fill="#2563EB"/><text x="898" y="172" class="inverse" text-anchor="middle">Review anomalies</text><rect x="1000" y="146" width="158" height="40" rx="14" fill="#0F766E"/><text x="1079" y="172" class="inverse" text-anchor="middle">Open regularizations</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, day, device, or anomaly like geofence mismatch</text><rect x="856" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/><text x="911.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="976" y="226" width="126" height="28" rx="14" fill="#EAF2F8"/><text x="1039.0" y="244" class="small" text-anchor="middle">Confidence</text><rect x="1112" y="226" width="28" height="28" rx="14" fill="#10324A"/><text x="1126.0" y="244" class="inverse" text-anchor="middle">&gt;</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Present today</text><text x="364" y="362" class="metric" text-anchor="start">1,248</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="586" y="332" class="small" text-anchor="start">Open exceptions</text><text x="586" y="362" class="metric" text-anchor="start">24</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Regularizations</text><text x="808" y="362" class="metric" text-anchor="start">18</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Geo mismatches</text><text x="1030" y="362" class="metric" text-anchor="start">05</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Spoof risk</text><text x="1252" y="362" class="metric" text-anchor="start">03</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Exception queue</text><text x="312" y="464" class="small" text-anchor="start">Attendance operations begin with unresolved exceptions, not raw punch volume</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Riya Sen - missing out punch - shift B</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Manoj Das - mobile check-in outside geofence</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Kiosk lane 3 - duplicate punch burst detected</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Nikita Rao - cross-midnight shift unresolved</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI confidence and capture review</text><text x="664" y="464" class="small" text-anchor="start">Selfie, kiosk, GPS, QR, and biometric anomalies need an explainable review surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Confidence review</text><text x="684" y="522" class="body" text-anchor="start">Selfie check-in confidence fell below threshold for employee 10492 at Pune plant gate 2.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: compare prior captures, confirm geofence, then route for manual verification.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review evidence</text><rect x="834" y="574" width="136" height="36" rx="12" fill="#EEF2FF"/><text x="902" y="598" class="body" text-anchor="middle">Ask why</text><rect x="984" y="574" width="156" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1062" y="598" class="small" text-anchor="middle">Manual verify</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Capture mode coverage</text><text x="312" y="754" class="small" text-anchor="start">Operations must see how attendance arrived before deciding whether an exception is genuine</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Biometric 61%</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Mobile GPS 18%</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">QR 9%</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">AI selfie and kiosk 8%</text><circle cx="314" cy="850" r="3" fill="#2563EB"/><text x="326" y="854" class="body" text-anchor="start">Manual correction 4%</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Regularization and finalization readiness</text><text x="664" y="754" class="small" text-anchor="start">Regularizations, payroll-lock windows, and device health belong in the same operational screen</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">18 regularizations pending manager or admin action</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Payroll period closes in 2 days with 6 unresolved records</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Device HUB-03 offline since 09:42</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Auto-finalization blocked for plant east unit</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned filters and operating widgets</text><text x="312" y="994" class="small" text-anchor="start">Attendance teams can pin shift, location, source mode, payroll period, and anomaly type views</text><rect x="320" y="990" width="92" height="28" rx="14" fill="#DCFCE7"/><text x="366.0" y="1008" class="small" text-anchor="middle">Shift B</text><rect x="424" y="990" width="118" height="28" rx="14" fill="#DBEAFE"/><text x="483.0" y="1008" class="small" text-anchor="middle">Pune plant</text><rect x="554" y="990" width="132" height="28" rx="14" fill="#FEE2E2"/><text x="620.0" y="1008" class="small" text-anchor="middle">Geo mismatch</text><rect x="698" y="990" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="759.0" y="1008" class="small" text-anchor="middle">Kiosk review</text><rect x="832" y="990" width="110" height="28" rx="14" fill="#EDE9FE"/><text x="887.0" y="1008" class="small" text-anchor="middle">July P2</text><rect x="954" y="990" width="142" height="28" rx="14" fill="#F8FAFC"/><text x="1025.0" y="1008" class="small" text-anchor="middle">Needs payroll</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Operations-first hero</text><text x="1224" y="224" class="annoText" text-anchor="start">The top strip directs users to anomaly review and regularization closure before passive exploration.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Issue-driven search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search and filters are centered on exception handling, not just attendance lookup.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Decision metrics</text><text x="1224" y="328" class="annoText" text-anchor="start">The signal row balances attendance volume, exception load, and fraud or confidence indicators.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Queue-led workflow</text><text x="1224" y="380" class="annoText" text-anchor="start">The left primary card keeps unresolved cases as the visual anchor for time operations.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable AI review</text><text x="1224" y="432" class="annoText" text-anchor="start">AI-assisted confidence review exposes reason, evidence path, and manual override route.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Exception plus close readiness</text><text x="1224" y="484" class="annoText" text-anchor="start">Regularization backlog and payroll finalization risk remain side-by-side.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Shift and source context</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned widgets help ops teams stay inside the exact plant, source, and period lens they manage.</text></svg>
