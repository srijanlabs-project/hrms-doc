  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>OCR issues remain visible beside the affected document set</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Retention and expiry policies stay easy to inspect</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>Legal hold states stand out strongly</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Policy scope remains understandable</text>

