<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Security</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Policies</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Reveal</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Exports</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Audit</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Privacy</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Data Masking Policy Console</text><rect x="296" y="152" width="116" height="28" rx="14" fill="#DBEAFE"/><text x="354.0" y="170" class="small" text-anchor="middle">Policies 184</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="424" y="152" width="102" height="28" rx="14" fill="#FEF3C7"/><text x="475.0" y="170" class="small" text-anchor="middle">Reveal 12</text><rect x="538" y="152" width="104" height="28" rx="14" fill="#FEE2E2"/><text x="590.0" y="170" class="small" text-anchor="middle">Exposure 5</text><rect x="808" y="146" width="174" height="40" rx="14" fill="#2563EB"/><text x="895.0" y="172" class="inverse" text-anchor="middle">Preview masking</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="994" y="146" width="184" height="40" rx="14" fill="#0F766E"/><text x="1086.0" y="172" class="inverse" text-anchor="middle">Review reveal queue</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search field class, policy, reveal rule, export scope, or masking incident</text><rect x="856" y="226" width="94" height="28" rx="14" fill="#EAF2F8"/><text x="903.0" y="244" class="small" text-anchor="middle">Preview</text><rect x="960" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="1006.0" y="244" class="small" text-anchor="middle">Reveal</text><rect x="1062" y="226" width="62" height="28" rx="14" fill="#10324A"/><text x="1093.0" y="244" class="inverse" text-anchor="middle">Policy</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Coverage</text><text x="364" y="362" class="metric" text-anchor="start">184</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Reveal pending</text><text x="586" y="362" class="metric" text-anchor="start">12</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Masked exports</text><text x="808" y="362" class="metric" text-anchor="start">41</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Incidents</text><text x="1030" y="362" class="metric" text-anchor="start">05</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Drift</text><text x="1252" y="362" class="metric" text-anchor="start">03</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Policy summary and channel coverage</text><text x="312" y="464" class="small" text-anchor="start">UI, API, and export exposure are governed together, not separately</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Payroll PII policy covers 18 sensitive fields</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">3 export-only exceptions still active</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">1 medical-data reveal policy expires tomorrow</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">2 policies drift from approved baseline</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Masked preview studio</text><text x="664" y="464" class="small" text-anchor="start">Before-and-after previews remain adjacent to policy definitions</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Masking preview</text><text x="684" y="522" class="body" text-anchor="start">Aadhaar, passport, and bank account values are partially masked in UI and fully tokenized in export, but one derived label still reveals last-four values.</text><text x="684" y="544" class="small" text-anchor="start">Next step: run derived-field leak check, review reveal path, and publish only after export preview is safe.</text><rect x="666" y="574" width="150" height="40" rx="14" fill="#2563EB"/><text x="741.0" y="600" class="inverse" text-anchor="middle">Open preview</text><rect x="830" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="892.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="968" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1041.0" y="600" class="body" text-anchor="middle">Review reveal</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Reveal request queue</text><text x="312" y="754" class="small" text-anchor="start">Just-in-time reveal remains tightly coupled to masking policy decisions</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">12 reveal approvals pending</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">3 requests target payroll exports</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Approver scope expires on 1 reveal path</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">2 requests require legal comment</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Downstream impact and audit</text><text x="664" y="754" class="small" text-anchor="start">Reports, APIs, and exports affected by masking changes stay visible before publish</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">5 reports touched by the selected rule</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">3 API endpoints inherit current mask</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">One enforcement incident opened yesterday</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Audit export ready with policy diff</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned masking-policy lenses</text><text x="312" y="994" class="small" text-anchor="start">Privacy teams can pin field class, channel, reveal, incident, and export-focused views</text><rect x="320" y="990" width="116" height="28" rx="14" fill="#DCFCE7"/><text x="378.0" y="1008" class="small" text-anchor="middle">Payroll PII</text><rect x="448" y="990" width="76" height="28" rx="14" fill="#DBEAFE"/><text x="486.0" y="1008" class="small" text-anchor="middle">API</text><rect x="536" y="990" width="92" height="28" rx="14" fill="#FEF3C7"/><text x="582.0" y="1008" class="small" text-anchor="middle">Reveal</text><rect x="640" y="990" width="100" height="28" rx="14" fill="#FEE2E2"/><text x="690.0" y="1008" class="small" text-anchor="middle">Incident</text><rect x="752" y="990" width="92" height="28" rx="14" fill="#EDE9FE"/><text x="798.0" y="1008" class="small" text-anchor="middle">Export</text><rect x="856" y="990" width="94" height="28" rx="14" fill="#F8FAFC"/><text x="903.0" y="1008" class="small" text-anchor="middle">Derived</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Decision-first privacy</text><text x="1224" y="224" class="annoText" text-anchor="start">Masking mistakes are governance failures, so review and preview outrank general admin actions.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Preview sits beside policy</text><text x="1224" y="276" class="annoText" text-anchor="start">Admins can validate UI, API, and export outcomes without leaving the policy screen.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Channel-specific exposure</text><text x="1224" y="328" class="annoText" text-anchor="start">A field can behave differently by channel, so each path is shown separately.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Reveal is nearby</text><text x="1224" y="380" class="annoText" text-anchor="start">Reveal approvals are part of masking operations, not a detached helpdesk flow.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Derived leaks are explicit</text><text x="1224" y="432" class="annoText" text-anchor="start">Computed labels can leak masked values, so leak checks get dedicated space.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Impact is a peer surface</text><text x="1224" y="484" class="annoText" text-anchor="start">Reports and APIs are visible because masking edits can silently expose or break downstream consumers.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile is review-first</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support triage and approval while heavy matrix authoring stays desktop-led.</text></svg>
