  <text x="629" y="1008" class="small" text-anchor="middle">High-risk</text>
  <rect x="696" y="990" width="92" height="28" rx="14" fill="#FEE2E2"/>
  <text x="742" y="1008" class="small" text-anchor="middle">SoD</text>
  <rect x="800" y="990" width="110" height="28" rx="14" fill="#EDE9FE"/>
  <text x="855" y="1008" class="small" text-anchor="middle">Review due</text>
  <rect x="922" y="990" width="116" height="28" rx="14" fill="#F8FAFC"/>
  <text x="980" y="1008" class="small" text-anchor="middle">Tenant draft</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">8</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle" text-anchor="start">Tenant-safe scope</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">Everything shown belongs to tenant role administration rather than provider-level identity control.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Matrix stays literal</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">Admins need visible row-column logic to understand how grants, denials, and inherited access behave.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Delegation is not hidden</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">Time-bound delegated authority stays beside the selected role so exposure is visible during edits.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">High-risk is elevated</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Privileged tenant roles deserve their own posture instead of blending into generic permission counts.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Conflict with posture</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">SoD warnings are paired with reviewer posture so the screen communicates how resolution work proceeds.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Primary personas fit</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">Org admins and security admins both get structure, evidence, and release controls without over-designing the UI.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile reduces safely</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">The companion mobile view prioritizes warning review and targeted follow-up instead of dense matrix editing.</text>
