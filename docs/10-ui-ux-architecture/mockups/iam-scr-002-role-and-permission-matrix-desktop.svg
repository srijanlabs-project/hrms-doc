  <text x="328" y="573" class="tiny" text-anchor="start">Security Admin</text>
  <circle cx="430" cy="568" r="8" fill="#2563EB"/>
  <circle cx="500" cy="568" r="8" fill="#B42318"/>
  <circle cx="570" cy="568" r="8" fill="#2563EB"/>
  <rect x="312" y="586" width="296" height="32" rx="8" fill="#FFFFFF" stroke="#E6EDF5" stroke-width="1"/>
  <text x="328" y="607" class="tiny" text-anchor="start">Payroll Approver</text>
  <circle cx="430" cy="602" r="8" fill="#D9E2EC"/>
  <circle cx="500" cy="602" r="8" fill="#2563EB"/>
  <circle cx="570" cy="602" r="8" fill="#D9E2EC"/>
  <circle cx="314" cy="638" r="3" fill="#2563EB"/>
  <text x="326" y="642" class="body" text-anchor="start">Rows represent tenant-owned roles, not provider-wide identities</text>
  <circle cx="314" cy="658" r="3" fill="#2563EB"/>
  <text x="326" y="662" class="body" text-anchor="start">Cells distinguish grant, deny, and guarded-review states</text>
  <circle cx="314" cy="678" r="3" fill="#2563EB"/>
  <text x="326" y="682" class="body" text-anchor="start">Inheritance is visible before admins touch sensitive exceptions</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3" text-anchor="start">Selected role, delegation, and conflict context</text>
  <text x="664" y="464" class="small" text-anchor="start">High-risk tenant roles keep permission evidence, delegate state, and warnings in one governed surface</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="684" y="496" class="small" text-anchor="start">Conflict insight</text>
  <text x="684" y="522" class="body" text-anchor="start">The Payroll Approver draft adds vendor-bank maintenance while an active delegation still permits payment release review for the same business unit.</text>
  <text x="684" y="544" class="small" text-anchor="start">Next step: split approval from maintenance, end the risky delegation overlap, and keep the tenant draft unpublished until SoD review clears.</text>
  <rect x="666" y="574" width="150" height="40" rx="14" fill="#2563EB"/>
  <text x="741" y="600" class="inverse" text-anchor="middle">Review matrix</text>
  <rect x="830" y="574" width="136" height="40" rx="14" fill="#EEF2FF"/>
  <text x="898" y="600" class="body" text-anchor="middle">Open conflict</text>
  <rect x="980" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1053" y="600" class="body" text-anchor="middle">Review delegation</text>
  <circle cx="666" cy="638" r="3" fill="#2563EB"/>
  <text x="678" y="642" class="body" text-anchor="start">High-risk roles require tenant rationale and reviewer ownership</text>
  <circle cx="666" cy="658" r="3" fill="#2563EB"/>
  <text x="678" y="662" class="body" text-anchor="start">Delegated access remains time-bound with visible exclusions</text>
  <circle cx="666" cy="682" r="3" fill="#2563EB"/>
  <text x="678" y="686" class="body" text-anchor="start">Warnings stay pinned until conflicting privileges are separated</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3" text-anchor="start">High-risk roles and exception posture</text>
  <text x="312" y="754" class="small" text-anchor="start">Tenant-side privileged roles are explicit so elevated grants never hide inside normal administration</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body" text-anchor="start">4 high-risk roles carry payroll, bank, or identity reset authority</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">Break-glass access is visible but remains outside day-to-day tenant edits</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">Role owners must recertify exceptions every 90 days</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">Inactive delegates cannot retain privileged review rights</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3" text-anchor="start">Segregation-of-duties review posture</text>
  <text x="664" y="754" class="small" text-anchor="start">SoD work stays close to the matrix so review posture guides edits before publish</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body" text-anchor="start">9 open conflicts grouped by procure-to-pay and payroll release patterns</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">Reviewer posture shows proposed fix, role owner, and next certification date</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Warnings distinguish draft-only issues from already assigned user exposure</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body" text-anchor="start">Publish stays blocked while unresolved conflicts affect active tenant roles</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">7</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3" text-anchor="start">Pinned role-governance lenses</text>
  <text x="312" y="994" class="small" text-anchor="start">Admins can pin tenant role family, delegated state, high-risk status, SoD cluster, and review posture</text>
