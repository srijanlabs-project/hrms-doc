  <text x="1252" y="362" class="metric" text-anchor="start">03</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3" text-anchor="start">Tenant roles and permission matrix behavior</text>
  <text x="312" y="464" class="small" text-anchor="start">The matrix stays visible because org admins and security admins need row-and-column evidence</text>
  <rect x="312" y="482" width="296" height="34" rx="10" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="328" y="503" class="tab" text-anchor="start">Role</text>
  <text x="410" y="503" class="tab" text-anchor="start">Core HR</text>
  <text x="484" y="503" class="tab" text-anchor="start">Payroll</text>
  <text x="554" y="503" class="tab" text-anchor="start">Audit</text>
  <rect x="312" y="518" width="296" height="32" rx="8" fill="#FFFFFF" stroke="#E6EDF5" stroke-width="1"/>
  <text x="328" y="539" class="tiny" text-anchor="start">Org Admin</text>
