<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="#F4F7FB"/>
  <rect width="390" height="92" fill="#10324A"/>
  <text x="20" y="36" class="inverse">Enterprise HRMS</text>
  <rect x="286" y="18" width="84" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="328" y="36" class="inverse" text-anchor="middle">Brand</text>
  <text x="20" y="76" class="h2inv">Brand and Comms</text>

  <rect x="16" y="108" width="104" height="28" rx="14" fill="#DBEAFE"/>
  <text x="68" y="126" class="small" text-anchor="middle">Brand pack</text>
  <circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="127" class="inverse" text-anchor="middle">1</text>
  <rect x="130" y="108" width="116" height="28" rx="14" fill="#DCFCE7"/>
  <text x="188" y="126" class="small" text-anchor="middle">Senders 03</text>
  <rect x="256" y="108" width="98" height="28" rx="14" fill="#FEE2E2"/>
  <text x="305" y="126" class="small" text-anchor="middle">Blocks 02</text>

  <rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="34" y="190" class="body">Search assets, senders, templates, locales, or review notes</text>
  <circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="173" class="inverse" text-anchor="middle">2</text>

  <rect x="16" y="228" width="358" height="164" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="252" class="h3">Logo pack and tenant identity cues</text>
  <text x="32" y="270" class="small">The mobile review starts with brand posture, not final graphic polish.</text>
  <circle cx="34" cy="284" r="3" fill="#2563EB"/>
  <text x="46" y="288" class="body">ApexOne People logo, teal primary, and amber accent stay grouped.</text>
  <circle cx="34" cy="304" r="3" fill="#2563EB"/>
  <text x="46" y="308" class="body">Monochrome seal is mandatory for letters and compliance documents.</text>
  <circle cx="34" cy="324" r="3" fill="#2563EB"/>
  <text x="46" y="328" class="body">Dark-header and print-safe variants are required before publish.</text>
  <circle cx="34" cy="344" r="3" fill="#2563EB"/>
  <text x="46" y="348" class="body">Draft brand packs do not affect live employee journeys yet.</text>
  <circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="249" class="inverse" text-anchor="middle">3</text>

  <rect x="16" y="408" width="358" height="180" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="432" class="h3">Sender setup and document identity preview</text>
  <text x="32" y="450" class="small">Email origin and document shells remain linked in one review stack.</text>
  <circle cx="34" cy="462" r="3" fill="#2563EB"/>
  <text x="46" y="466" class="body">people@apexone.com is DKIM verified for onboarding, leave, and payroll notices.</text>
  <circle cx="34" cy="482" r="3" fill="#2563EB"/>
  <text x="46" y="486" class="body">Offer letters, payslip covers, and HR notices share seal and signature blocks.</text>
  <circle cx="34" cy="502" r="3" fill="#2563EB"/>
  <text x="46" y="506" class="body">Preview by locale and event is required before going live.</text>
  <circle cx="34" cy="522" r="3" fill="#2563EB"/>
  <text x="46" y="526" class="body">Test sends route only to review inboxes until publication is complete.</text>
  <rect x="30" y="540" width="144" height="40" rx="14" fill="#2563EB"/>
  <text x="102" y="566" class="inverse" text-anchor="middle">Preview docs</text>
  <rect x="188" y="540" width="168" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="272" y="566" class="body" text-anchor="middle">Test sender</text>
  <circle cx="30" cy="424" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="429" class="inverse" text-anchor="middle">4</text>

  <rect x="16" y="604" width="358" height="132" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="628" class="h3">Review and publish guardrails</text>
  <text x="32" y="646" class="small">Verification and legal review remain visible before a pack is activated.</text>
  <circle cx="34" cy="658" r="3" fill="#2563EB"/>
  <text x="46" y="662" class="body">Missing sender verification or signature approval blocks publication.</text>
  <circle cx="34" cy="678" r="3" fill="#2563EB"/>
  <text x="46" y="682" class="body">Audit tracks who changed assets, which events changed, and when it went live.</text>
  <circle cx="34" cy="698" r="3" fill="#2563EB"/>
  <text x="46" y="702" class="body">Provider-owned legal shells remain read-only inside the tenant workspace.</text>
  <circle cx="30" cy="620" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="30" y="625" class="inverse" text-anchor="middle">5</text>

  <rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="34" y="780" class="h2">Mobile notes</text>
  <circle cx="40" cy="804" r="12" fill="#2563EB"/>
  <text x="40" y="808" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="806" class="annoTitle">Identity pack review</text>
  <text x="62" y="824" class="annoText">Mobile preserves brand posture, sender verification, and publish gating while detailed editing and asset management stay desktop-led.</text>
</svg>
