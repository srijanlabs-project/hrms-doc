<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Localization</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Runtime</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Bundles</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Fallback</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Analytics</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">PROD</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Localization Diagnostics</text><rect x="296" y="152" width="104" height="28" rx="14" fill="#DBEAFE"/><text x="348.0" y="170" class="small" text-anchor="middle">Locales 18</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="412" y="152" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="468.0" y="170" class="small" text-anchor="middle">Fallback 3</text><rect x="536" y="152" width="108" height="28" rx="14" fill="#FEE2E2"/><text x="590.0" y="170" class="small" text-anchor="middle">Pending 1</text><rect x="808" y="146" width="164" height="40" rx="14" fill="#2563EB"/><text x="890.0" y="172" class="inverse" text-anchor="middle">Run probe</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="984" y="146" width="156" height="40" rx="14" fill="#0F766E"/><text x="1062.0" y="172" class="inverse" text-anchor="middle">Publish bundle</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search locale, module, bundle key, preview surface, or missing-resource incident</text><rect x="856" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="902.0" y="244" class="small" text-anchor="middle">Matrix</text><rect x="958" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/><text x="1013.0" y="244" class="small" text-anchor="middle">Fallback</text><rect x="1078" y="226" width="58" height="28" rx="14" fill="#10324A"/><text x="1107.0" y="244" class="inverse" text-anchor="middle">Probe</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Complete</text><text x="364" y="362" class="metric" text-anchor="start">94.6%</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Fallback 24h</text><text x="586" y="362" class="metric" text-anchor="start">312</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="808" y="332" class="small" text-anchor="start">Cache hit</text><text x="808" y="362" class="metric" text-anchor="start">97%</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="1030" y="332" class="small" text-anchor="start">Missing</text><text x="1030" y="362" class="metric" text-anchor="start">21</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Locales</text><text x="1252" y="362" class="metric" text-anchor="start">18</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Locale health and module matrix</text><text x="312" y="464" class="small" text-anchor="start">Runtime bundle truth and missing-resource signals outrank editing convenience</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Payments module missing 12 labels in fr-FR</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Policy portal uses fallback in 3 locales</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">2 bundles still stale after last publish</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Unsafe markup flag raised in one email template</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Fallback path and live preview</text><text x="664" y="464" class="small" text-anchor="start">Fallback chain, format preview, and cache state stay in one diagnostic surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Runtime preview</text><text x="684" y="522" class="body" text-anchor="start">The Spanish payslip subject is serving the default English bundle because the country override is missing and cache invalidation did not complete.</text><text x="684" y="544" class="small" text-anchor="start">Next step: compare locale bundle, flush stale cache, and publish only after mandatory-locale checks pass.</text><rect x="666" y="574" width="154" height="40" rx="14" fill="#2563EB"/><text x="743.0" y="600" class="inverse" text-anchor="middle">Compare locale</text><rect x="834" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="896.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="148" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1046.0" y="600" class="body" text-anchor="middle">Open blockers</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Publish readiness and blocker log</text><text x="312" y="754" class="small" text-anchor="start">Mandatory locales, cache rules, and impacted modules remain visible before release</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">1 publish pending translator sign-off</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">2 mandatory locales missing on onboarding journey</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Cache invalidation blocked in one edge region</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">4 modules will consume the changed namespace</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Incidents and terminology review</text><text x="664" y="754" class="small" text-anchor="start">Operational incidents and advisory AI suggestions stay secondary to runtime blockers</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">3 missing-resource incidents opened today</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 inconsistent terms detected across leave labels</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Reviewer comments pending on one medical-policy bundle</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">AI terminology suggestions available for 6 keys</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned localization lenses</text><text x="312" y="994" class="small" text-anchor="start">Localization admins can pin locale, module, surface, incident, and fallback-focused diagnostic views</text><rect x="320" y="990" width="96" height="28" rx="14" fill="#DCFCE7"/><text x="368.0" y="1008" class="small" text-anchor="middle">fr-FR</text><rect x="428" y="990" width="104" height="28" rx="14" fill="#DBEAFE"/><text x="480.0" y="1008" class="small" text-anchor="middle">Payroll</text><rect x="544" y="990" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="592.0" y="1008" class="small" text-anchor="middle">Email</text><rect x="652" y="990" width="116" height="28" rx="14" fill="#FEE2E2"/><text x="710.0" y="1008" class="small" text-anchor="middle">Fallback</text><rect x="780" y="990" width="96" height="28" rx="14" fill="#EDE9FE"/><text x="828.0" y="1008" class="small" text-anchor="middle">Cache</text><rect x="888" y="990" width="110" height="28" rx="14" fill="#F8FAFC"/><text x="943.0" y="1008" class="small" text-anchor="middle">Preview</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Runtime-first diagnostics</text><text x="1224" y="224" class="annoText" text-anchor="start">This screen prioritizes runtime defects and fallback behavior before bulk translation editing.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Fallback always visible</text><text x="1224" y="276" class="annoText" text-anchor="start">Fallback chain clarity prevents teams from confusing safe defaults with complete localization.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Preview beside health</text><text x="1224" y="328" class="annoText" text-anchor="start">Date, currency, and copy preview sit next to defects because many localization issues are formatting issues.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Publish is gated</text><text x="1224" y="380" class="annoText" text-anchor="start">Draft-ready and runtime-safe are treated as separate states to avoid premature release.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Cache is explicit</text><text x="1224" y="432" class="annoText" text-anchor="start">Stale bundles are surfaced because localization incidents often come from invalidation failures.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Ownership in context</text><text x="1224" y="484" class="annoText" text-anchor="start">Locale owner and reviewer context help resolve issues without switching to another admin surface.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">AI is advisory</text><text x="1224" y="536" class="annoText" text-anchor="start">Suggestions improve terminology consistency but never replace human publish control.</text></svg>
