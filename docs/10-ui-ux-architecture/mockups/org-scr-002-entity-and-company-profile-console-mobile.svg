  <text x="40" y="808" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="806" class="annoTitle" text-anchor="start">Scope before edit</text>
  <text x="62" y="824" class="annoText" text-anchor="start">Small screens keep hierarchy, governance, and compliance summary ahead of field-level editing.</text>
