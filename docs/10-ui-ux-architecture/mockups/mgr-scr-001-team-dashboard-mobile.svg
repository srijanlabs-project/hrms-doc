<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">Manager</text><text x="20" y="76" class="h2inv" text-anchor="start">Team Dashboard</text><rect x="16" y="108" width="116" height="28" rx="14" fill="#FEE2E2"/><text x="74.0" y="126" class="small" text-anchor="middle">Approvals 11</text><rect x="140" y="108" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="201.0" y="126" class="small" text-anchor="middle">Absence spike</text><rect x="270" y="108" width="104" height="28" rx="14" fill="#DBEAFE"/><text x="322.0" y="126" class="small" text-anchor="middle">Reviews 5</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="34" y="190" class="body" text-anchor="start">Search, ask, or type a manager command</text><circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="173" class="inverse" text-anchor="middle">2</text><rect x="16" y="228" width="358" height="146" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="252" class="h3" text-anchor="start">Priority approvals</text><text x="32" y="270" class="small" text-anchor="start">Approvals remain the first operational surface on mobile</text><circle cx="34" cy="280" r="3" fill="#2563EB"/><text x="46" y="284" class="body" text-anchor="start">Leave request due today</text><circle cx="34" cy="300" r="3" fill="#2563EB"/><text x="46" y="304" class="body" text-anchor="start">Promotion request with budget note</text><circle cx="34" cy="320" r="3" fill="#2563EB"/><text x="46" y="324" class="body" text-anchor="start">Travel approval needs finance concurrence</text><circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="249" class="inverse" text-anchor="middle">3</text><rect x="16" y="390" width="358" height="182" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="414" class="h3" text-anchor="start">Manager copilot</text><text x="32" y="432" class="small" text-anchor="start">Risk summary and guided actions stay compact but explicit</text><circle cx="34" cy="442" r="3" fill="#2563EB"/><text x="46" y="446" class="body" text-anchor="start">Absence spike may affect tomorrow shift coverage</text><circle cx="34" cy="462" r="3" fill="#2563EB"/><text x="46" y="466" class="body" text-anchor="start">Suggested step: open attendance exceptions</text><circle cx="34" cy="482" r="3" fill="#2563EB"/><text x="46" y="486" class="body" text-anchor="start">Ask why this recommendation appeared</text><circle cx="34" cy="502" r="3" fill="#2563EB"/><text x="46" y="506" class="body" text-anchor="start">Escalate to HRBP when needed</text><rect x="30" y="516" width="146" height="36" rx="12" fill="#2563EB"/><text x="103" y="540" class="inverse" text-anchor="middle">Review actions</text><rect x="190" y="516" width="170" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="275" y="540" class="body" text-anchor="middle">Open approvals queue</text><circle cx="30" cy="406" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="411" class="inverse" text-anchor="middle">4</text><rect x="16" y="588" width="358" height="148" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="612" class="h3" text-anchor="start">Team health and growth</text><text x="32" y="630" class="small" text-anchor="start">Attendance, reviews, skills, and hiring collapse into one summary stack</text><circle cx="34" cy="640" r="3" fill="#2563EB"/><text x="46" y="644" class="body" text-anchor="start">Two probation endings this month</text><circle cx="34" cy="660" r="3" fill="#2563EB"/><text x="46" y="664" class="body" text-anchor="start">Two skills-based mobility matches</text><circle cx="34" cy="680" r="3" fill="#2563EB"/><text x="46" y="684" class="body" text-anchor="start">One requisition blocked</text><circle cx="34" cy="700" r="3" fill="#2563EB"/><text x="46" y="704" class="body" text-anchor="start">Low sentiment trend flagged</text><circle cx="30" cy="604" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="609" class="inverse" text-anchor="middle">5</text><rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="780" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="804" r="12" fill="#2563EB"/><text x="40" y="808" class="inverse" text-anchor="middle">1</text><text x="62" y="806" class="annoTitle" text-anchor="start">Queue-led mobile</text><text x="62" y="824" class="annoText" text-anchor="start">Small screens prioritize the approvals queue and team exception handling before broader insight detail.</text></svg>
