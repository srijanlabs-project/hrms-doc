"#FEE2E2"/><text x="1069" y="644" class="body" text-anchor="middle">Reject</text><rect x="874" y="672" width="256" height="120" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="890" y="700" class="small" text-anchor="start">Comment draft</text><circle cx="874" cy="286" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="874" y="291" class="inverse" text-anchor="middle">4</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Urgency chips</text><text x="1224" y="224" class="annoText" text-anchor="start">Top presets help users pivot between workload contexts quickly.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Filter discipline</text><text x="1224" y="276" class="annoText" text-anchor="start">High-density queue screens still expose clear filter and sort controls.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">List-first processing</text><text x="1224" y="328" class="annoText" text-anchor="start">Table lets reviewers triage multiple tasks before opening one.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">In-context decisions</text><text x="1224" y="380" class="annoText" text-anchor="start">Approval actions remain beside history, comments, and source metadata.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Bulk-safe design</text><text x="1224" y="432" class="annoText" text-anchor="start">Queue density supports future low-risk bulk actions without redesign.</text><circle cx="1110" cy="620" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="1110" y="625" class="inverse" text-anchor="middle">5</text></svg>
