<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Governed Repository and Profile View</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Repository</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Preview</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Versions</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Retention</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Links</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Documents</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Document Repository</text><rect x="296" y="152" width="126" height="28" rx="14" fill="#DBEAFE"/><text x="359.0" y="170" class="small" text-anchor="middle">Files 18.2k</text><rect x="434" y="152" width="156" height="28" rx="14" fill="#FEF3C7"/><text x="512.0" y="170" class="small" text-anchor="middle">Sensitive 214</text><rect x="602" y="152" width="150" height="28" rx="14" fill="#FEE2E2"/><text x="677.0" y="170" class="small" text-anchor="middle">Expiring 32</text><rect x="808" y="146" width="182" height="40" rx="14" fill="#2563EB"/><text x="899" y="172" class="inverse" text-anchor="middle">Review document</text><rect x="1002" y="146" width="156" height="40" rx="14" fill="#0F766E"/><text x="1080" y="172" class="inverse" text-anchor="middle">Open version</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search file, employee, case, OCR text, document type, or retention status</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="964" y="226" width="118" height="28" rx="14" fill="#EAF2F8"/><text x="1023.0" y="244" class="small" text-anchor="middle">Preview</text><rect x="1092" y="226" width="48" height="28" rx="14" fill="#10324A"/><text x="1116.0" y="244" class="inverse" text-anchor="middle">Docs</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Files</text><text x="364" y="362" class="metric" text-anchor="start">18.2k</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="586" y="332" class="small" text-anchor="start">Missing req</text><text x="586" y="362" class="metric" text-anchor="start">27</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Sensitive</text><text x="808" y="362" class="metric" text-anchor="start">214</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Legal hold</text><text x="1030" y="362" class="metric" text-anchor="start">08</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Versions</text><text x="1252" y="362" class="metric" text-anchor="start">412</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Repository explorer and missing-evidence queue</text><text x="312" y="464" class="small" text-anchor="start">Users need missing, expired, and sensitive-document context before opening file detail</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">27 required documents still missing or rejected</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">32 employee evidence files expire this month</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">8 investigation-related files on legal hold</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">High-sensitivity passport documents restrict download</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI classification and metadata review</text><text x="664" y="464" class="small" text-anchor="start">AI can extract metadata and classify document type, but humans keep override and access-control authority</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI metadata note</text><text x="684" y="522" class="body" text-anchor="start">The uploaded file likely contains a passport, suggested sensitivity class high, expiry 18 Nov 2028, and OCR confidence 84% pending verifier confirmation.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: confirm extracted fields, review access mask, and publish metadata only after verifier acceptance.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review metadata</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Open preview</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Version lineage and sharing controls</text><text x="312" y="754" class="small" text-anchor="start">Preview, superseded history, and download restrictions stay near the selected document</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Version 4 superseded version 3 last week</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Download blocked for non-HR viewers</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Watermark required on print for sensitive docs</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Employee acknowledgment pending for 6 policy letters</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Retention, audit, and linked-record impact</text><text x="664" y="754" class="small" text-anchor="start">Retention state, legal hold, and linked-entity visibility belong in the same repository profile</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Retention due for 14 contractor files</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Document linked to employee, case, and exit checklist</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Audit trail shows 3 recent sensitive views</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">1 OCR field override still awaiting verifier sign-off</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned document lenses</text><text x="312" y="994" class="small" text-anchor="start">Operations teams can pin sensitivity, expiry, legal hold, required-document, and linked-record repository views</text><rect x="320" y="990" width="110" height="28" rx="14" fill="#DCFCE7"/><text x="375.0" y="1008" class="small" text-anchor="middle">Passport</text><rect x="442" y="990" width="112" height="28" rx="14" fill="#DBEAFE"/><text x="498.0" y="1008" class="small" text-anchor="middle">Expiry</text><rect x="566" y="990" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="627.0" y="1008" class="small" text-anchor="middle">Sensitive</text><rect x="700" y="990" width="120" height="28" rx="14" fill="#FEE2E2"/><text x="760.0" y="1008" class="small" text-anchor="middle">Legal hold</text><rect x="832" y="990" width="130" height="28" rx="14" fill="#EDE9FE"/><text x="897.0" y="1008" class="small" text-anchor="middle">Required</text><rect x="974" y="990" width="134" height="28" rx="14" fill="#F8FAFC"/><text x="1041.0" y="1008" class="small" text-anchor="middle">OCR review</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Repository-first hero strip</text><text x="1224" y="224" class="annoText" text-anchor="start">Top actions prioritize governed review and version inspection because document operations are sensitive and evidence-driven.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Security-trimmed search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search is modeled around file, metadata, OCR, and retention attributes while assuming strict result trimming by access rights.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Governance KPI row</text><text x="1224" y="328" class="annoText" text-anchor="start">The KPI strip highlights missing evidence, sensitive content, legal hold, and version activity above the fold.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Explorer before preview</text><text x="1224" y="380" class="annoText" text-anchor="start">The left card keeps repository risk and missing-document context primary before users open a file preview.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Overrideable document AI</text><text x="1224" y="432" class="annoText" text-anchor="start">AI is used to accelerate metadata extraction and classification, but human verification and security control stay explicit.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Version and retention together</text><text x="1224" y="484" class="annoText" text-anchor="start">Supersession, retention, legal hold, and audit lineage remain adjacent because they jointly determine file usability.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Evidence-management lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned views reflect how HR ops and compliance teams revisit the repository by sensitivity, expiry, and verification state.</text></svg>
