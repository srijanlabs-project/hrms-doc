<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Approvals, Coverage, and Delegation</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Inbox</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Team Calendar</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Delegation</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Escalations</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Policy</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">History</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Leave</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Leave Approval Queue</text><rect x="296" y="152" width="126" height="28" rx="14" fill="#DBEAFE"/><text x="359.0" y="170" class="small" text-anchor="middle">Pending 38</text><rect x="434" y="152" width="144" height="28" rx="14" fill="#FEE2E2"/><text x="506.0" y="170" class="small" text-anchor="middle">Escalated 04</text><rect x="590" y="152" width="150" height="28" rx="14" fill="#FEF3C7"/><text x="665.0" y="170" class="small" text-anchor="middle">Conflict 06</text><rect x="808" y="146" width="182" height="40" rx="14" fill="#2563EB"/><text x="899" y="172" class="inverse" text-anchor="middle">Review queue</text><rect x="1002" y="146" width="156" height="40" rx="14" fill="#0F766E"/><text x="1080" y="172" class="inverse" text-anchor="middle">Delegate backup</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, leave type, team, balance exception, or escalation</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="964" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/><text x="1019.0" y="244" class="small" text-anchor="middle">Coverage</text><rect x="1084" y="226" width="56" height="28" rx="14" fill="#10324A"/><text x="1112.0" y="244" class="inverse" text-anchor="middle">Queue</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Pending</text><text x="364" y="362" class="metric" text-anchor="start">38</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="586" y="332" class="small" text-anchor="start">Escalated</text><text x="586" y="362" class="metric" text-anchor="start">04</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Conflicts</text><text x="808" y="362" class="metric" text-anchor="start">06</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Bal holds</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">SLA</text><text x="1252" y="362" class="metric" text-anchor="start">7h</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Approval inbox and blockers</text><text x="312" y="464" class="small" text-anchor="start">Managers need pending requests, blackout risk, and balance exceptions before approval</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">38 requests pending across 7 teams</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">4 escalated items breached approval SLA</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">3 requests blocked by insufficient balance</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">2 quarter-close blackout exceptions need HR review</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI coverage explanation and action cues</text><text x="664" y="464" class="small" text-anchor="start">AI can summarize coverage impact and policy context, but approve or reject remains human-owned</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI team-impact summary</text><text x="684" y="522" class="body" text-anchor="start">Approving Ankit Sharma&#x27;s leave on Friday will leave support pod B below minimum coverage unless delegate Meera shifts one backup associate.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: inspect team calendar, assign delegate approver for weekend, and revalidate leave balance at final approval.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Open calendar</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Revalidate balance</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Delegation and backup state</text><text x="312" y="754" class="small" text-anchor="start">Delegation, out-of-office approvers, and backup routing stay near the queue</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Weekend delegate active for 2 managers</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">1 backup approver missing in sales north</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Escalation route switches to HR after 24h</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Coverage substitute identified for 5 requests</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Validation, notifications, and audit</text><text x="664" y="754" class="small" text-anchor="start">Final approval checks and employee communication belong in the same operating surface</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Final approval rechecks balance and employment state</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">7 notification drafts queued after decision</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">2 approved leaves need roster sync</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Masked medical leave note visible only to HR</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned leave lenses</text><text x="312" y="994" class="small" text-anchor="start">Approvers can pin team, leave type, escalation, blackout, and coverage-oriented queue views</text><rect x="320" y="990" width="104" height="28" rx="14" fill="#DCFCE7"/><text x="372.0" y="1008" class="small" text-anchor="middle">Pod B</text><rect x="436" y="990" width="116" height="28" rx="14" fill="#DBEAFE"/><text x="494.0" y="1008" class="small" text-anchor="middle">Sick leave</text><rect x="564" y="990" width="118" height="28" rx="14" fill="#FEF3C7"/><text x="623.0" y="1008" class="small" text-anchor="middle">Escalated</text><rect x="694" y="990" width="120" height="28" rx="14" fill="#FEE2E2"/><text x="754.0" y="1008" class="small" text-anchor="middle">Blackout</text><rect x="826" y="990" width="118" height="28" rx="14" fill="#EDE9FE"/><text x="885.0" y="1008" class="small" text-anchor="middle">Delegate</text><rect x="956" y="990" width="152" height="28" rx="14" fill="#F8FAFC"/><text x="1032.0" y="1008" class="small" text-anchor="middle">Coverage risk</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Queue before decision</text><text x="1224" y="224" class="annoText" text-anchor="start">The top actions focus on queue and delegation because approvals depend on coverage context first.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Team-aware search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search is tuned to employee, leave type, team, balance, and escalation objects rather than static leave history.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Approval risk KPI row</text><text x="1224" y="328" class="annoText" text-anchor="start">The KPI strip highlights escalations, conflicts, balance holds, and SLA pressure above the fold.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Inbox before calendar depth</text><text x="1224" y="380" class="annoText" text-anchor="start">The left card keeps the queue and blocker signals primary before wider team-calendar navigation.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable approval AI</text><text x="1224" y="432" class="annoText" text-anchor="start">AI support summarizes coverage impact and policy logic without making the decision for the approver.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Validation beside notification</text><text x="1224" y="484" class="annoText" text-anchor="start">Approval checks, downstream sync, and employee communication stay in the same workspace.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Queue triage lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned views match how managers and HR approvers revisit leave decisions by team and exception type.</text></svg>
