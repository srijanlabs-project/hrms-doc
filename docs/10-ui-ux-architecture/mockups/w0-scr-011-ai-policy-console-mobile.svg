"h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="774" r="12" fill="#2563EB"/><text x="40" y="778" class="inverse" text-anchor="middle">1</text><text x="62" y="776" class="annoTitle" text-anchor="start">Governance first</text><text x="62" y="794" class="annoText" text-anchor="start">Mobile keeps alerts, draft state, and approval context ahead of lower-priority detail.</text><circle cx="40" cy="826" r="12" fill="#2563EB"/><text x="40" y="830" class="inverse" text-anchor="middle">2</text><text x="62" y="828" class="annoTitle" text-anchor="start">No blind publish</text><text x="62" y="846" class="annoText" text-anchor="start">Release actions remain downstream of evaluation and incident visibility.</text></svg>
