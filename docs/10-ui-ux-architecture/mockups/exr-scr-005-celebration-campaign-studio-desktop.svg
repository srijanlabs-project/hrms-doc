  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D" stroke="#15803D" stroke-width="1"/><text x="364" y="332" class="small">Active campaigns</text><text x="364" y="362" class="metric">14</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706" stroke="#D97706" stroke-width="1"/><text x="586" y="332" class="small">Today</text><text x="586" y="362" class="metric">03</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318" stroke="#B42318" stroke-width="1"/><text x="808" y="332" class="small">Queued assets</text><text x="808" y="362" class="metric">86</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB" stroke="#2563EB" stroke-width="1"/><text x="1030" y="332" class="small">Needs approval</text><text x="1030" y="362" class="metric">04</text>
  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Campaign builder and schedule workflow</text>
  <text x="312" y="464" class="small">Structural mockup for development-ready requirements coverage.</text>
  <circle cx='314' cy='492' r='3' fill='#2563EB'/><text x="326" y="496" class="body">HR should control campaign theme, timing, and audience rules.</text><circle cx='314' cy='514' r='3' fill='#2563EB'/><text x="326" y="518" class="body">Birthday, anniversary, and join-date flows reuse one studio.</text><circle cx='314' cy='536' r='3' fill='#2563EB'/><text x="326" y="540" class="body">Preview and approval states must stay explicit.</text>
  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Generated cards, copy packs, and approvals</text>
  <text x="664" y="464" class="small">Annotated operational surface with action and governance context.</text>
  <circle cx='666' cy='492' r='3' fill='#2563EB'/><text x="678" y="496" class="body">Generated assets include card image, copy, and publish channel.</text><circle cx='666' cy='514' r='3' fill='#2563EB'/><text x="678" y="518" class="body">Consent and missing-photo fallback must be visible.</text><circle cx='666' cy='536' r='3' fill='#2563EB'/><text x="678" y="540" class="body">Locale and occasion templates should remain editable before release.</text>
  <rect x="296" y="712" width="862" height="222" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">Primary workspace layout</text>
  <rect x="320" y="760" width="516" height="146" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="340" y="788" class="body">Left surface: queue, builder, or briefing stack depending on screen purpose</text>
  <rect x="856" y="760" width="278" height="146" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="876" y="788" class="body">Right surface: detail, explanation, route, or preview pane</text>
  <rect x="320" y="924" width="814" height="94" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="340" y="952" class="body">Lower strip: audit, campaigns, history, metrics, or next-action utilities</text>
  <rect x="1178" y="206" width="238" height="812" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="1196" y="236" class="annoTitle">Mockup notes</text>
  <circle cx='1198' cy='272' r='3' fill='#2563EB'/><text x="1210" y="276" class="body">Desktop board exists for implementation mapping.</text><circle cx='1198' cy='294' r='3' fill='#2563EB'/><text x="1210" y="298" class="body">Mobile pair exists for parity and planning.</text><circle cx='1198' cy='316' r='3' fill='#2563EB'/><text x="1210" y="320" class="body">Condition variants are captured in the catalog.</text><circle cx='1198' cy='338' r='3' fill='#2563EB'/><text x="1210" y="342" class="body">Use this as annotated structure, not final UI polish.</text>
  <text x="24" y="1248" class="small">Innovation mockup extension</text>
