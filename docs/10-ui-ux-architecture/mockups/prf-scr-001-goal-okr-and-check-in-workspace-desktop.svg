  <rect x="992" y="574" width="140" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1062" y="600" class="body" text-anchor="middle">Request review</text>
  <circle cx="666" cy="638" r="3" fill="#2563EB"/>
  <text x="678" y="642" class="body" text-anchor="start">Workflow overlays make manager acknowledgment visible without turning the page into a queue</text>
  <circle cx="666" cy="658" r="3" fill="#2563EB"/>
  <text x="678" y="662" class="body" text-anchor="start">Prompting favors concise progress, blockers, and support asks</text>
  <circle cx="666" cy="682" r="3" fill="#2563EB"/>
  <text x="678" y="686" class="body" text-anchor="start">Review-due cues stay stronger than passive completion widgets</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">6</text>

