  <text x="312" y="736" class="h3" text-anchor="start">Competency reminders and coaching signals</text>
  <text x="312" y="754" class="small" text-anchor="start">The dashboard includes capability growth so goals do not drift away from role expectations</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
