  <text x="678" y="774" class="body" text-anchor="start">3 check-ins due this week outrank lower-priority KPI grooming</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">One frozen goal remains read-only until the review conversation finishes</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Weight changes trigger a governed acknowledgment path instead of silent edits</text>
