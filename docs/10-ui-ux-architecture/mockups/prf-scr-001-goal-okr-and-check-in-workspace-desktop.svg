  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile preserves momentum</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">The smaller variant keeps due work and governed edits ahead of dense planning views.</text>
