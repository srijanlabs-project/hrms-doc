  <text x="1224" y="206" class="annoTitle" text-anchor="start">Goals stay operational</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">This screen treats performance management as active work, not a decorative summary.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Weights are first-class</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">Weighted progress belongs in the main structure because it changes how overall completion is read.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Workflow overlays matter</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">DB-01 alone is not enough here; review and acknowledgment cues need to sit directly on the operational surface.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">Check-ins lead action</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Prompts for current conversations should outrank passive KPI browsing.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Competencies stay near goals</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">Behavior and capability reminders belong in the same workspace so coaching remains grounded.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Review-due is explicit</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">Cycle state cues should say what is blocked, not merely that a cycle exists.</text>
