  <text x="326" y="682" class="body" text-anchor="start">Workflow overlays show where progress updates still need manager response</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">5</text>

