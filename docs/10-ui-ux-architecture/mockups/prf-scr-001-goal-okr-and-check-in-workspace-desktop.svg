  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">1:1 notes surface only as prompts, not full confidential transcripts</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">Coaching needs sit beside KPI misses to keep support actionable</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">Review-due competency evidence remains clearly incomplete until acknowledged</text>

