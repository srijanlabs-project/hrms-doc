  <text x="664" y="464" class="small" text-anchor="start">The immediate action stays explainable: what changed, what evidence exists, and what needs discussion</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="684" y="496" class="small" text-anchor="start">Weekly check-in guidance</text>
  <text x="684" y="522" class="body" text-anchor="start">Weighted progress improved on two hiring goals, but one competency reminder and one skipped manager check-in still block the mid-cycle review from closing cleanly.</text>
  <text x="684" y="544" class="small" text-anchor="start">Next step: record progress, note blockers, attach evidence, and request manager acknowledgment where the cycle requires it.</text>
  <rect x="666" y="574" width="152" height="40" rx="14" fill="#2563EB"/>
  <text x="742" y="600" class="inverse" text-anchor="middle">Record check-in</text>
  <rect x="832" y="574" width="146" height="40" rx="14" fill="#EEF2FF"/>
