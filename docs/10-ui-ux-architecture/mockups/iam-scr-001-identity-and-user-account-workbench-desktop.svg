<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/>
  <rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/>
  <text x="52" y="72" class="inverse" text-anchor="start">Admin Workbench</text>
  <rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/>
  <text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text>
  <rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/>
  <text x="60" y="168" class="inverse" text-anchor="start">Accounts</text>
  <rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="220" class="inverse" text-anchor="start">Authentication</text>
  <rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="272" class="inverse" text-anchor="start">Provisioning</text>
  <rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="324" class="inverse" text-anchor="start">Risk flags</text>
  <rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="376" class="inverse" text-anchor="start">Admin review</text>
  <rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="428" class="inverse" text-anchor="start">Help</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="338" y="61" class="small" text-anchor="start">Search user, email, invite, auth issue, connector event, or review task</text>
  <rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1103" y="58" class="small" text-anchor="middle">IAM</text>
  <rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1204" y="58" class="small" text-anchor="middle">Alerts 09</text>
  <rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1309" y="58" class="small" text-anchor="middle">Tasks 14</text>
  <rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/>

  <text x="310" y="128" class="title" text-anchor="start">Identity and User Account Workbench</text>
  <rect x="296" y="152" width="118" height="28" rx="14" fill="#DBEAFE"/>
  <text x="355" y="170" class="small" text-anchor="middle">Users 4.8k</text>
  <circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="312" y="171" class="inverse" text-anchor="middle">1</text>
  <rect x="426" y="152" width="104" height="28" rx="14" fill="#FEF3C7"/>
  <text x="478" y="170" class="small" text-anchor="middle">MFA gap 42</text>
  <rect x="542" y="152" width="118" height="28" rx="14" fill="#FEE2E2"/>
  <text x="601" y="170" class="small" text-anchor="middle">Flags 17</text>
  <rect x="808" y="146" width="188" height="40" rx="14" fill="#2563EB"/>
  <text x="902" y="172" class="inverse" text-anchor="middle">Open flagged accounts</text>
  <circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="820" y="151" class="inverse" text-anchor="middle">2</text>
  <rect x="1008" y="146" width="172" height="40" rx="14" fill="#0F766E"/>
  <text x="1094" y="172" class="inverse" text-anchor="middle">Start admin review</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="338" y="249" class="body" text-anchor="start">Search directory account, worker ID, invite batch, SSO state, risk class, or disabled user</text>
  <rect x="856" y="226" width="74" height="28" rx="14" fill="#EAF2F8"/>
  <text x="893" y="244" class="small" text-anchor="middle">Users</text>
  <rect x="940" y="226" width="96" height="28" rx="14" fill="#EAF2F8"/>
  <text x="988" y="244" class="small" text-anchor="middle">Invites</text>
  <rect x="1046" y="226" width="76" height="28" rx="14" fill="#10324A"/>
  <text x="1084" y="244" class="inverse" text-anchor="middle">Review</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">3</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small" text-anchor="start">Active users</text>
  <text x="364" y="362" class="metric" text-anchor="start">4.8k</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">4</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="586" y="332" class="small" text-anchor="start">Pending invites</text>
  <text x="586" y="362" class="metric" text-anchor="start">63</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="808" y="332" class="small" text-anchor="start">Risk flagged</text>
  <text x="808" y="362" class="metric" text-anchor="start">17</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="1030" y="332" class="small" text-anchor="start">MFA resets</text>
  <text x="1030" y="362" class="metric" text-anchor="start">11</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/>
  <text x="1252" y="332" class="small" text-anchor="start">Disabled</text>
  <text x="1252" y="362" class="metric" text-anchor="start">28</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3" text-anchor="start">User roster and account status lane</text>
  <text x="312" y="464" class="small" text-anchor="start">Tenant admins need lifecycle state, directory state, and ownership cues before acting.</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body" text-anchor="start">Active, locked, suspended, and disabled states grouped</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body" text-anchor="start">Primary email, worker ID, and source system visible inline</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body" text-anchor="start">Invite acceptance and last sign-in signal stale accounts</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body" text-anchor="start">Break-glass or service identities clearly separated</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3" text-anchor="start">Authentication posture and risk review</text>
  <text x="664" y="464" class="small" text-anchor="start">Credential, MFA, and conditional-access posture sit beside the current risk explanation.</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="684" y="496" class="small" text-anchor="start">Flagged account insight</text>
  <text x="684" y="522" class="body" text-anchor="start">A newly invited payroll approver has not completed MFA enrollment, attempted sign-in from an unmanaged device, and still holds time-bound elevated access pending manager confirmation.</text>
  <text x="684" y="544" class="small" text-anchor="start">Next step: verify invite ownership, require MFA, reduce access scope, or suspend until review completes.</text>
  <rect x="666" y="574" width="150" height="40" rx="14" fill="#2563EB"/>
  <text x="741" y="600" class="inverse" text-anchor="middle">Open user card</text>
  <rect x="830" y="574" width="136" height="40" rx="14" fill="#EEF2FF"/>
  <text x="898" y="600" class="body" text-anchor="middle">Require MFA</text>
  <rect x="980" y="574" width="132" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1046" y="600" class="body" text-anchor="middle">Suspend account</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3" text-anchor="start">Invite and provisioning queue</text>
  <text x="312" y="754" class="small" text-anchor="start">The workbench keeps manual invites, connector-created users, and deprovisioning exceptions together.</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body" text-anchor="start">63 invites split into draft, sent, expired, and bounced</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">12 provisioning retries waiting on connector health</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">Joiner templates apply tenant-safe default roles only</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">Offboarding failures remain visible until deprovision confirmed</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3" text-anchor="start">Admin review actions and audit cues</text>
  <text x="664" y="754" class="small" text-anchor="start">Tenant admins need scoped actions with evidence and an obvious audit trail.</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body" text-anchor="start">Approve, resend invite, reset auth, disable, and unlock actions are policy-scoped</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">Sensitive actions require reason capture and dual review when risk is high</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Recent admin actions remain pinned beside the user context</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body" text-anchor="start">Export and API changes stay out of scope for this tenant-side screen</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">7</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3" text-anchor="start">Pinned identity lenses</text>
  <text x="312" y="994" class="small" text-anchor="start">Admins can keep the highest-value slices close without leaving the governed workbench.</text>
  <rect x="320" y="990" width="92" height="28" rx="14" fill="#DCFCE7"/>
  <text x="366" y="1008" class="small" text-anchor="middle">New hires</text>
  <rect x="424" y="990" width="74" height="28" rx="14" fill="#DBEAFE"/>
  <text x="461" y="1008" class="small" text-anchor="middle">MFA</text>
  <rect x="510" y="990" width="92" height="28" rx="14" fill="#FEF3C7"/>
  <text x="556" y="1008" class="small" text-anchor="middle">Expired</text>
  <rect x="614" y="990" width="98" height="28" rx="14" fill="#FEE2E2"/>
  <text x="663" y="1008" class="small" text-anchor="middle">Flagged</text>
  <rect x="724" y="990" width="118" height="28" rx="14" fill="#EDE9FE"/>
  <text x="783" y="1008" class="small" text-anchor="middle">Disabled</text>
  <rect x="854" y="990" width="112" height="28" rx="14" fill="#F8FAFC"/>
  <text x="910" y="1008" class="small" text-anchor="middle">Audit-ready</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">8</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle" text-anchor="start">Workbench starts with people</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">Identity admins begin from account inventory and state before deeper policy detail.</text>

  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Auth posture is adjacent</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">MFA, sign-in risk, and access context remain next to the user record so action is explainable.</text>

  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Invite state is first-class</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">Tenant admins often spend as much time on joiner invites and retries as on steady-state accounts.</text>

  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">Risk resists convenience</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Higher-risk actions should require evidence and reasons instead of casual bulk execution.</text>

  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Tenant-safe scope only</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">This screen stops at user and tenant controls and avoids platform-wide identity administration.</text>

  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Deprovision completion matters</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">Disable is not treated as finished until downstream provisioning confirms closure.</text>

  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile stays accountable</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">The smaller layout keeps triage and review intact so auth or account blockers do not wait for desktop.</text>
</svg>
