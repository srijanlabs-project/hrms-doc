 text-anchor="start">ESS</text><text x="1066.5600000000002" y="788" class="body" text-anchor="start">OTP</text><line x1="304" y1="800" x2="1150" y2="800" stroke="#D9E2EC" stroke-width="1"/><text x="308" y="830" class="body" text-anchor="start">uan</text><text x="445.92" y="830" class="body" text-anchor="start">UAN</text><text x="601.08" y="830" class="body" text-anchor="start">String</text><text x="704.52" y="830" class="body" text-anchor="start">No</text><text x="807.96" y="830" class="body" text-anchor="start">Restricted</text><text x="911.4000000000001" y="830" class="body" text-anchor="start">Payroll</text><text x="1066.5600000000002" y="830" class="body" text-anchor="start">12 digits</text><line x1="304" y1="842" x2="1150" y2="842" stroke="#D9E2EC" stroke-width="1"/><circle cx="314" cy="578" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="583" class="inverse" text-anchor="middle">5</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Utility actions</text><text x="1224" y="224" class="annoText" text-anchor="start">Compare and export stay near the page title because they affect the entire entity context.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Navigation tree</text><text x="1224" y="276" class="annoText" text-anchor="start">Domain and entity selection remains the first action path for advanced users.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Summary block</text><text x="1224" y="328" class="annoText" text-anchor="start">Key ownership and classification details are visible before scrolling the field table.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Impact awareness</text><text x="1224" y="380" class="annoText" text-anchor="start">Dependency visibility prevents unsafe metadata changes and supports implementation planning.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Field plane</text><text x="1224" y="432" class="annoText" text-anchor="start">The table is the deepest data layer and is intentionally desktop-primary.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Restricted data handling</text><text x="1224" y="484" class="annoText" text-anchor="start">Sensitive fields need classification and masking indicators in-line.</text><circle cx="744" cy="578" r="14" fill="#B42318" stroke="white" stroke-width="3"/><text x="744" y="583" class="inverse" text-anchor="middle">6</text></svg>
