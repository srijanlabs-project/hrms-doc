<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">Tenant</text><text x="20" y="76" class="h2inv" text-anchor="start">Configuration Catalog</text><rect x="16" y="108" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="34" y="144" class="body" text-anchor="start">Search config key, label, or category</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="16" y="182" width="90" height="28" rx="14" fill="#2563EB"/><text x="61.0" y="200" class="inverse" text-anchor="middle">Workflow</text><rect x="114" y="182" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="157.0" y="200" class="small" text-anchor="middle">Identity</text><rect x="208" y="182" width="82" height="28" rx="14" fill="#FEE2E2"/><text x="249.0" y="200" class="small" text-anchor="middle">High risk</text><circle cx="28" cy="196" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="201" class="inverse" text-anchor="middle">2</text><rect x="16" y="224" width="358" height="202" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="248" class="h3" text-anchor="start">Selected config</text><text x="32" y="266" class="small" text-anchor="start">Mobile opens one config at a time with stacked lineage details</text><circle cx="34" cy="274" r="3" fill="#2563EB"/><text x="46" y="278" class="body" text-anchor="start">Approval max level</text><circle cx="34" cy="294" r="3" fill="#2563EB"/><text x="46" y="298" class="body" text-anchor="start">Current effective value: 4</text><circle cx="34" cy="314" r="3" fill="#2563EB"/><text x="46" y="318" class="body" text-anchor="start">Inherited from tenant override</text><circle cx="34" cy="334" r="3" fill="#2563EB"/><text x="46" y="338" class="body" text-anchor="start">Validation and dependencies</text><circle cx="30" cy="240" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="245" class="inverse" text-anchor="middle">3</text><rect x="16" y="442" width="358" height="170" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="466" class="h3" text-anchor="start">Change proposal flow</text><text x="32" y="484" class="small" text-anchor="start">Proposal becomes a guided full-screen stepper on mobile</text><circle cx="34" cy="492" r="3" fill="#2563EB"/><text x="46" y="496" class="body" text-anchor="start">Enter value</text><circle cx="34" cy="512" r="3" fill="#2563EB"/><text x="46" y="516" class="body" text-anchor="start">Pick scope</text><circle cx="34" cy="532" r="3" fill="#2563EB"/><text x="46" y="536" class="body" text-anchor="start">Effective date</text><circle cx="34" cy="552" r="3" fill="#2563EB"/><text x="46" y="556" class="body" text-anchor="start">Impact note</text><rect x="30" y="564" width="330" height="34" rx="12" fill="#0F766E"/><text x="195" y="586" class="inverse" text-anchor="middle">Continue proposal</text><circle cx="30" cy="458" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="463" class="inverse" text-anchor="middle">4</text><rect x="16" y="628" width="358" height="198" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="656" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="680" r="12" fill="#2563EB"/><text x="40" y="684" class="inverse" text-anchor="middle">1</text><text x="62" y="682" class="annoTitle" text-anchor="start">Search-first entry</text><text x="62" y="700" class="annoText" text-anchor="start">Users locate a single key first instead of working across three desktop panels.</text><circle cx="40" cy="732" r="12" fill="#2563EB"/><text x="40" y="736" class="inverse" text-anchor="middle">2</text><text x="62" y="734" class="annoTitle" text-anchor="start">Step flow conversion</text><text x="62" y="752" class="annoText" text-anchor="start">Proposal and compare actions become guided steps to protect accuracy on small screens.</text><circle cx="40" cy="784" r="12" fill="#2563EB"/><text x="40" y="788" class="inverse" text-anchor="middle">3</text><text x="62" y="786" class="annoTitle" text-anchor="start">Provider-safe boundary</text><text x="62" y="804" class="annoText" text-anchor="start">Read-only provider-owned values should remain visible but clearly non-editable.</text></svg>
