<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">People Operations Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">HR Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People Ops</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Joiners</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Documents</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Exceptions</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Reports</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Joiners</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Onboarding and Preboarding Console</text><rect x="296" y="152" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="344.0" y="170" class="small" text-anchor="middle">Preboarding</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="404" y="152" width="74" height="28" rx="14" fill="#FEE2E2"/><text x="441.0" y="170" class="small" text-anchor="middle">Blocked</text><rect x="490" y="152" width="62" height="28" rx="14" fill="#DCFCE7"/><text x="521.0" y="170" class="small" text-anchor="middle">Ready</text><rect x="808" y="146" width="176" height="40" rx="14" fill="#2563EB"/><text x="896.0" y="172" class="inverse" text-anchor="middle">Create joiner case</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="996" y="146" width="182" height="40" rx="14" fill="#0F766E"/><text x="1087.0" y="172" class="inverse" text-anchor="middle">Promote ready case</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search joiner, requisition, offer, joining date, location, or blocker within authorized scope</text><rect x="856" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/><text x="911.0" y="244" class="small" text-anchor="middle">Due in 7 days</text><rect x="976" y="226" width="104" height="28" rx="14" fill="#EAF2F8"/><text x="1028.0" y="244" class="small" text-anchor="middle">Docs pending</text><rect x="1090" y="226" width="72" height="28" rx="14" fill="#10324A"/><text x="1126.0" y="244" class="inverse" text-anchor="middle">Activate</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Due 7d</text><text x="364" y="362" class="metric" text-anchor="start">18</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">At risk</text><text x="586" y="362" class="metric" text-anchor="start">06</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Docs</text><text x="808" y="362" class="metric" text-anchor="start">11</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Prov block</text><text x="1030" y="362" class="metric" text-anchor="start">05</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Ready</text><text x="1252" y="362" class="metric" text-anchor="start">07</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Joiner readiness board</text><text x="312" y="464" class="small" text-anchor="start">Date-driven queue grouped by stage, risk, and upcoming join date</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Preboarding and onboarding share one rail</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Upcoming joiners clustered by date and location</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">At-risk cases surface missing blockers first</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Deferred, withdrawn, and no-show states remain visible</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Activation gate and blocker triage</text><text x="664" y="464" class="small" text-anchor="start">Mandatory tasks, documents, and dependent teams must clear before activation</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Need-to-know masking</text><text x="684" y="522" class="body" text-anchor="start">Offer and compensation detail stays masked for non-authorized roles while overrides and join-date changes remain auditable.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open blockers, reassign an owner, promote a ready case, or activate only after gates clear.</text><rect x="666" y="574" width="146" height="40" rx="14" fill="#2563EB"/><text x="739.0" y="600" class="inverse" text-anchor="middle">Open blockers</text><rect x="826" y="574" width="122" height="40" rx="14" fill="#EEF2FF"/><text x="887.0" y="600" class="body" text-anchor="middle">Reassign</text><rect x="962" y="574" width="112" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1018.0" y="600" class="body" text-anchor="middle">Activate</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Checklist and owner backlog</text><text x="312" y="754" class="small" text-anchor="start">Operational load across HR, manager, payroll, IT, security, and facilities</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Task backlog grouped by owner group</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Overdue items highlighted above informational tasks</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Rejected documents return with reason codes</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Manager-unassigned cases visible as blockers</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Document and provisioning dependency tracker</text><text x="664" y="754" class="small" text-anchor="start">Readiness depends on linked evidence and downstream requests, not task counts alone</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Identity, tax, bank, and contract evidence linked</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Provisioning tickets show pending to done</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Background verification can block or warn</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Every case keeps source-offer linkage and history</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned joiner lenses</text><text x="312" y="994" class="small" text-anchor="start">HR operations can pin due-date, blocked, document, and provisioning views for repeat onboarding work</text><rect x="320" y="990" width="56" height="28" rx="14" fill="#DCFCE7"/><text x="348.0" y="1008" class="small" text-anchor="middle">Today</text><rect x="388" y="990" width="70" height="28" rx="14" fill="#DBEAFE"/><text x="423.0" y="1008" class="small" text-anchor="middle">7 Days</text><rect x="470" y="990" width="72" height="28" rx="14" fill="#FEF3C7"/><text x="506.0" y="1008" class="small" text-anchor="middle">Blocked</text><rect x="554" y="990" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="600.0" y="1008" class="small" text-anchor="middle">Documents</text><rect x="658" y="990" width="98" height="28" rx="14" fill="#EDE9FE"/><text x="707.0" y="1008" class="small" text-anchor="middle">Provisioning</text><rect x="768" y="990" width="60" height="28" rx="14" fill="#F8FAFC"/><text x="798.0" y="1008" class="small" text-anchor="middle">Ready</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Date-first triage</text><text x="1224" y="224" class="annoText" text-anchor="start">HR operations should read by upcoming join date before browsing cases.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Preboard to onboard continuity</text><text x="1224" y="276" class="annoText" text-anchor="start">One console prevents handoff gaps between accepted offer and active employee.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Blockers outrank volume</text><text x="1224" y="328" class="annoText" text-anchor="start">Risk and prerequisites matter more than total task count.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Need-to-know masking</text><text x="1224" y="380" class="annoText" text-anchor="start">Offer and compensation context should remain limited to authorized roles.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Activation is gated</text><text x="1224" y="432" class="annoText" text-anchor="start">Ready-looking cases still cannot activate until mandatory steps clear.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Tenant-only business plane</text><text x="1224" y="484" class="annoText" text-anchor="start">The shell must stay inside customer HR operations, not provider admin.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile favors urgency</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should surface due-today, blocked, and reminder actions first.</text></svg>
