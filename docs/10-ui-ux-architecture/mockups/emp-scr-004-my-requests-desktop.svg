<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">My Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">All requests</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Drafts</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">In progress</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Closed</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Templates</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">SLA Risk 1</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">My Requests</text><rect x="296" y="152" width="74" height="28" rx="14" fill="#DBEAFE"/><text x="333.0" y="170" class="small" text-anchor="middle">Open 5</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="382" y="152" width="86" height="28" rx="14" fill="#FEF3C7"/><text x="425.0" y="170" class="small" text-anchor="middle">Drafts 2</text><rect x="480" y="152" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="526.0" y="170" class="small" text-anchor="middle">Returned 1</text><rect x="808" y="146" width="150" height="40" rx="14" fill="#2563EB"/><text x="883.0" y="172" class="inverse" text-anchor="middle">Start request</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="970" y="146" width="144" height="40" rx="14" fill="#0F766E"/><text x="1042.0" y="172" class="inverse" text-anchor="middle">Resume draft</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search request ID, type, status, owner group, or attachment</text><rect x="856" y="226" width="70" height="28" rx="14" fill="#EAF2F8"/><text x="891.0" y="244" class="small" text-anchor="middle">Open</text><rect x="936" y="226" width="82" height="28" rx="14" fill="#EAF2F8"/><text x="977.0" y="244" class="small" text-anchor="middle">Drafts</text><rect x="1028" y="226" width="90" height="28" rx="14" fill="#10324A"/><text x="1073.0" y="244" class="inverse" text-anchor="middle">Returned</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Open</text><text x="364" y="362" class="metric" text-anchor="start">05</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Drafts</text><text x="586" y="362" class="metric" text-anchor="start">02</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Pending</text><text x="808" y="362" class="metric" text-anchor="start">01</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">SLA risk</text><text x="1030" y="362" class="metric" text-anchor="start">01</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Closed</text><text x="1252" y="362" class="metric" text-anchor="start">12</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Open request queue</text><text x="312" y="464" class="small" text-anchor="start">A single employee-facing queue spans HR, payroll, workplace, and support requests</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Address change under review</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Employment letter request in progress</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Tax declaration draft saved</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">IT access case awaits attachment</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">SLA and routing transparency</text><text x="664" y="464" class="small" text-anchor="start">Current owner group, ETA, and request path stay visible without exposing internal notes</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Routing cue</text><text x="684" y="522" class="body" text-anchor="start">Employees can see owner group and SLA guidance, while restricted linked-case detail and internal handling notes remain hidden.</text><text x="684" y="544" class="small" text-anchor="start">Next step: resume a draft, withdraw an eligible request, or open the status timeline for a live case.</text><rect x="666" y="574" width="128" height="40" rx="14" fill="#2563EB"/><text x="730.0" y="600" class="inverse" text-anchor="middle">New request</text><rect x="808" y="574" width="112" height="40" rx="14" fill="#EEF2FF"/><text x="864.0" y="600" class="body" text-anchor="middle">Withdraw</text><rect x="934" y="574" width="136" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1002.0" y="600" class="body" text-anchor="middle">View timeline</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Draft and returned actions</text><text x="312" y="754" class="small" text-anchor="start">The most important work is what the employee still needs to complete</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Bank-change request returned for proof</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Travel draft incomplete</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Reimbursement template suggested</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Overdue attachment highlighted</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Timeline and outcomes</text><text x="664" y="754" class="small" text-anchor="start">Status movement, visible comments, and closure evidence stay together in one record view</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Manager approval finished yesterday</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Payroll owner updated ETA</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Help case escalated to L2</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Closure summary downloadable where allowed</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned request lenses</text><text x="312" y="994" class="small" text-anchor="start">Employees can pin draft, returned, payroll-impact, and help-oriented views for repeat use</text><rect x="320" y="990" width="76" height="28" rx="14" fill="#DCFCE7"/><text x="358.0" y="1008" class="small" text-anchor="middle">Drafts</text><rect x="408" y="990" width="84" height="28" rx="14" fill="#DBEAFE"/><text x="450.0" y="1008" class="small" text-anchor="middle">Returned</text><rect x="504" y="990" width="76" height="28" rx="14" fill="#FEF3C7"/><text x="542.0" y="1008" class="small" text-anchor="middle">Pending</text><rect x="592" y="990" width="78" height="28" rx="14" fill="#FEE2E2"/><text x="631.0" y="1008" class="small" text-anchor="middle">Payroll</text><rect x="682" y="990" width="72" height="28" rx="14" fill="#EDE9FE"/><text x="718.0" y="1008" class="small" text-anchor="middle">Closed</text><rect x="766" y="990" width="62" height="28" rx="14" fill="#F8FAFC"/><text x="797.0" y="1008" class="small" text-anchor="middle">Help</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">One center replaces fragments</text><text x="1224" y="224" class="annoText" text-anchor="start">Requests should not be scattered across forms, inboxes, and email trails.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Scope stays self-only</text><text x="1224" y="276" class="annoText" text-anchor="start">Employees should only see their own cases unless explicit delegation is active.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">SLA builds trust</text><text x="1224" y="328" class="annoText" text-anchor="start">Owner group and timing need to be visible without leaking restricted internals.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Drafts outrank history</text><text x="1224" y="380" class="annoText" text-anchor="start">Returned and incomplete work deserves more emphasis than passive closure lists.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Payroll warnings are early</text><text x="1224" y="432" class="annoText" text-anchor="start">Cutoff and dependency cues should appear before submission, not only after delay.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Duplicates are prevented</text><text x="1224" y="484" class="annoText" text-anchor="start">The screen should help users avoid raising the same issue twice.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile favors resumption</text><text x="1224" y="536" class="annoText" text-anchor="start">Fast status checks and one-thumb draft continuation matter on small screens.</text></svg>
