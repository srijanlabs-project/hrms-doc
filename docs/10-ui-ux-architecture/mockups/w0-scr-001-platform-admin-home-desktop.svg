ic" text-anchor="start">03</text><rect x="1184" y="152" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="164" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="182" class="small" text-anchor="start">Review SLA</text><text x="1252" y="212" class="metric" text-anchor="start">7h</text><circle cx="322" cy="196" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="322" y="201" class="inverse" text-anchor="middle">4</text><rect x="296" y="272" width="332" height="268" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="296" class="h3" text-anchor="start">Action queue</text><text x="312" y="314" class="small" text-anchor="start">Urgent provider-side work needing decisions</text><circle cx="314" cy="330" r="3" fill="#2563EB"/><text x="326" y="334" class="body" text-anchor="start">Tenant provisioning approval</text><circle cx="314" cy="350" r="3" fill="#2563EB"/><text x="326" y="354" class="body" text-anchor="start">Privacy exception review</text><circle cx="314" cy="370" r="3" fill="#2563EB"/><text x="326" y="374" class="body" text-anchor="start">Support-session approval</text><circle cx="314" cy="390" r="3" fill="#2563EB"/><text x="326" y="394" class="body" text-anchor="start">Failed config publish</text><circle cx="324" cy="292" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="324" y="297" class="inverse" text-anchor="middle">5</text><rect x="648" y="272" width="510" height="268" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="296" class="h3" text-anchor="start">Platform health grid</text><text x="664" y="314" class="small" text-anchor="start">Shared service readiness and evidence signals</text><rect x="664" y="324" width="142" height="86" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="678" y="348" class="h3" text-anchor="start">Identity</text><text x="678" y="372" class="small" text-anchor="start">Healthy with drill-down path</text><rect x="822" y="324" width="142" height="86" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="836" y="348" class="h3" text-anchor="start">Notification</text><text x="836" y="372" class="small" text-anchor="start">Healthy with drill-down path</text><rect x="980" y="324" width="142" height="86" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="994" y="348" class="h3" text-anchor="start">Audit</text><text x="994" y="372" class="small" text-anchor="start">Healthy with drill-down path</text><rect x="664" y="428" width="142" height="86" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="678" y="452" class="h3" text-anchor="start">Event Bus</text><text x="678" y="476" class="small" text-anchor="start">Healthy with drill-down path</text><rect x="822" y="428" width="142" height="86" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="836" y="452" class="h3" text-anchor="start">Backup</text><text x="836" y="476" class="small" text-anchor="start">Healthy with drill-down path</text><rect x="980" y="428" width="142" height="86" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="994" y="452" class="h3" text-anchor="start">Integrations</text><text x="994" y="476" class="small" text-anchor="start">Healthy with drill-down path</text><circle cx="670" cy="292" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="670" y="297" class="inverse" text-anchor="middle">6</text><rect x="296" y="560" width="332" height="250" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="584" class="h3" text-anchor="start">Admin shortcuts</text><text x="312" y="602" class="small" text-anchor="start">Command paths into governed control-plane tools</text><circle cx="314" cy="618" r="3" fill="#2563EB"/><text x="326" y="622" class="body" text-anchor="start">Config catalog</text><circle cx="314" cy="638" r="3" fill="#2563EB"/><text x="326" y="642" class="body" text-anchor="start">Metadata explorer</text><circle cx="314" cy="658" r="3" fill="#2563EB"/><text x="326" y="662" class="body" text-anchor="start">Workflow admin</text><circle cx="314" cy="678" r="3" fill="#2563EB"/><text x="326" y="682" class="body" text-anchor="start">Policy and access admin</text><circle cx="314" cy="698" r="3" fill="#2563EB"/><text x="326" y="702" class="body" text-anchor="start">Tenant management</text><rect x="648" y="560" width="510" height="250" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="584" class="h3" text-anchor="start">Risk and exceptions</text><text x="664" y="602" class="small" text-anchor="start">Signals that outrank convenience actions</text><circle cx="666" cy="618" r="3" fill="#2563EB"/><text x="678" y="622" class="body" text-anchor="start">Privileged access review overdue</text><circle cx="666" cy="638" r="3" fill="#2563EB"/><text x="678" y="642" class="body" text-anchor="start">Data retention warning in EU region</text><circle cx="666" cy="658" r="3" fill="#2563EB"/><text x="678" y="662" class="body" text-anchor="start">Backup verification exception</text><circle cx="666" cy="678" r="3" fill="#2563EB"/><text x="678" y="682" class="body" text-anchor="start">Access-review campaign breach</text><circle cx="650" cy="582" r="14" fill="#B42318" stroke="white" stroke-width="3"/><text x="650" y="587" class="inverse" text-anchor="middle">7</text><rect x="296" y="830" width="862" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="854" class="h3" text-anchor="start">Recent activity timeline</text><text x="312" y="872" class="small" text-anchor="start">Tenant lifecycle, failed job, support, and rollback chronology</text><line x1="340" y1="904" x2="1068" y2="904" stroke="#D9E2EC" stroke-width="3"/><circle cx="364" cy="904" r="8" fill="#2563EB"/><text x="334" y="932" class="small" text-anchor="start">Tenant provisioned</text><circle cx="560" cy="904" r="8" fill="#2563EB"/><text x="530" y="932" class="small" text-anchor="start">Sync failed</text><circle cx="756" cy="904" r="8" fill="#2563EB"/><text x="726" y="932" class="small" text-anchor="start">Support review</text><circle cx="952" cy="904" r="8" fill="#2563EB"/><text x="922" y="932" class="small" text-anchor="start">Rollback closed</text><circle cx="320" cy="850" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="855" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Governed shell</text><text x="1224" y="224" class="annoText" text-anchor="start">Provider-only shell keeps global navigation visually separate from tenant workspaces.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Persistent command access</text><text x="1224" y="276" class="annoText" text-anchor="start">Search, alert, and task chips stay visible for fast operational jumps.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Header context</text><text x="1224" y="328" class="annoText" text-anchor="start">Environment and screen identity remain visible to avoid production mistakes.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Signal strip above fold</text><text x="1224" y="380" class="annoText" text-anchor="start">Critical metrics appear before detail panels and are designed for drill-down.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Action-first queue</text><text x="1224" y="432" class="annoText" text-anchor="start">Urgent approvals sit left for immediate triage before deeper health analysis.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Service health grid</text><text x="1224" y="484" class="annoText" text-anchor="start">Shared platform services show a common card pattern and status summary.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Risk emphasis</text><text x="1224" y="536" class="annoText" text-anchor="start">Security and privacy warnings are visually stronger than shortcuts or reports.</text><circle cx="1202" cy="568" r="12" fill="#2563EB"/><text x="1202" y="572" class="inverse" text-anchor="middle">8</text><text x="1224" y="570" class="annoTitle" text-anchor="start">Chronology panel</text><text x="1224" y="588" class="annoText" text-anchor="start">Timeline preserves incident sequencing for ops, support, and audit teams.</text></svg>
