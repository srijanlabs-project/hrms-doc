  </defs>
  <rect width="1440" height="1180" fill="#F4F7FB"/>
  <rect x="24" y="24" width="248" height="1132" rx="24" fill="#10324A" filter="url(#shadow)"/>
  <text x="52" y="70" class="inverse">My Workspace</text>
  <rect x="40" y="98" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/>
