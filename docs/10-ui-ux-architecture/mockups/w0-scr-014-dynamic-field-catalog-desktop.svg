<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Fields</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Catalog</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Entities</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Usage</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Preview</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Schema Gov</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Dynamic Field Catalog</text><rect x="296" y="152" width="106" height="28" rx="14" fill="#DBEAFE"/><text x="349.0" y="170" class="small" text-anchor="middle">Active 186</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="414" y="152" width="90" height="28" rx="14" fill="#FEF3C7"/><text x="459.0" y="170" class="small" text-anchor="middle">Draft 9</text><rect x="516" y="152" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="572.0" y="170" class="small" text-anchor="middle">Breaking 4</text><rect x="808" y="146" width="156" height="40" rx="14" fill="#2563EB"/><text x="886.0" y="172" class="inverse" text-anchor="middle">Create field</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="976" y="146" width="162" height="40" rx="14" fill="#0F766E"/><text x="1057.0" y="172" class="inverse" text-anchor="middle">Compare usage</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search entity, field key, type, validation, API flag, or downstream usage</text><rect x="856" y="226" width="94" height="28" rx="14" fill="#EAF2F8"/><text x="903.0" y="244" class="small" text-anchor="middle">Catalog</text><rect x="960" y="226" width="90" height="28" rx="14" fill="#EAF2F8"/><text x="1005.0" y="244" class="small" text-anchor="middle">Usage</text><rect x="1060" y="226" width="48" height="28" rx="14" fill="#10324A"/><text x="1084.0" y="244" class="inverse" text-anchor="middle">Edit</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Entities</text><text x="364" y="362" class="metric" text-anchor="start">05</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">No validate</text><text x="586" y="362" class="metric" text-anchor="start">07</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Null risk</text><text x="808" y="362" class="metric" text-anchor="start">12</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">API exposed</text><text x="1030" y="362" class="metric" text-anchor="start">38</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Translations</text><text x="1252" y="362" class="metric" text-anchor="start">12</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Entity catalog and field inventory</text><text x="312" y="464" class="small" text-anchor="start">Grid-first governance helps admins compare many schema decisions at once</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Employee entity has 64 active custom fields</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">7 fields missing validation rules</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">4 draft fields expose breaking-type risk</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">12 fields still missing translated labels</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Field editor and runtime preview</text><text x="664" y="464" class="small" text-anchor="start">Editing stays tied to safety signals, usage, and contextual preview</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Breaking-change warning</text><text x="684" y="522" class="body" text-anchor="start">Changing employee_grade from master-ref to text would invalidate form bindings, API contracts, and reporting filters across three modules.</text><text x="684" y="544" class="small" text-anchor="start">Next step: compare usage, define migration path, and publish only after downstream impact is accepted.</text><rect x="666" y="574" width="150" height="40" rx="14" fill="#2563EB"/><text x="741.0" y="600" class="inverse" text-anchor="middle">Review usage</text><rect x="830" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="892.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="968" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1041.0" y="600" class="body" text-anchor="middle">Open preview</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Usage and downstream impact</text><text x="312" y="754" class="small" text-anchor="start">Forms, reports, search, and integrations reveal whether a field change is safe</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">3 forms consume employee_grade</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">2 payroll reports filter on this field</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Search index refresh needed after publish</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Masking inheritance active on 1 sensitive field</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Validation and activation guardrails</text><text x="664" y="754" class="small" text-anchor="start">Validation gaps and activation risks remain visible before schema changes go live</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Historical-data impact affects 24k rows</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Required flag change will alter import rules</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">1 API client still relies on legacy key</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Activation blocked until translation set is complete</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned field-governance lenses</text><text x="312" y="994" class="small" text-anchor="start">Platform admins can pin entity, type, API, validation, and breaking-change views</text><rect x="320" y="990" width="110" height="28" rx="14" fill="#DCFCE7"/><text x="375.0" y="1008" class="small" text-anchor="middle">Employee</text><rect x="442" y="990" width="112" height="28" rx="14" fill="#DBEAFE"/><text x="498.0" y="1008" class="small" text-anchor="middle">Reference</text><rect x="566" y="990" width="82" height="28" rx="14" fill="#FEF3C7"/><text x="607.0" y="1008" class="small" text-anchor="middle">API</text><rect x="660" y="990" width="116" height="28" rx="14" fill="#FEE2E2"/><text x="718.0" y="1008" class="small" text-anchor="middle">Breaking</text><rect x="788" y="990" width="102" height="28" rx="14" fill="#EDE9FE"/><text x="839.0" y="1008" class="small" text-anchor="middle">Preview</text><rect x="902" y="990" width="96" height="28" rx="14" fill="#F8FAFC"/><text x="950.0" y="1008" class="small" text-anchor="middle">Usage</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Grid before form</text><text x="1224" y="224" class="annoText" text-anchor="start">Schema governance depends on comparing many fields before opening one editor.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Exposure visible early</text><text x="1224" y="276" class="annoText" text-anchor="start">API, masking, and search flags are treated as risk signals, not hidden metadata.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Usage beside edit</text><text x="1224" y="328" class="annoText" text-anchor="start">Downstream consumers stay adjacent so unsafe field changes are visible immediately.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Key and type emphasis</text><text x="1224" y="380" class="annoText" text-anchor="start">The hardest-to-change attributes are surfaced early in the edit flow.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Preview in context</text><text x="1224" y="432" class="annoText" text-anchor="start">Runtime preview shows whether configuration decisions actually make sense to end users.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Breaking vs invalid</text><text x="1224" y="484" class="annoText" text-anchor="start">The design distinguishes immediate validation errors from future migration risk.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">AI suggests, admins decide</text><text x="1224" y="536" class="annoText" text-anchor="start">AI can spot redundancy or validation gaps, but activation remains a governed action.</text></svg>
