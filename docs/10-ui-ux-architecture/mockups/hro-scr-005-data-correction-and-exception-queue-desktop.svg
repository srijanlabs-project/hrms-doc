<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">People Operations Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">HR Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People Ops</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Exceptions</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">People Data</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Reports</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Exceptions</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Data Correction and Exception Queue</text><rect x="296" y="152" width="94" height="28" rx="14" fill="#FEF3C7"/><text x="343.0" y="170" class="small" text-anchor="middle">Needs review</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="402" y="152" width="102" height="28" rx="14" fill="#FEE2E2"/><text x="453.0" y="170" class="small" text-anchor="middle">Payroll-aware</text><rect x="516" y="152" width="112" height="28" rx="14" fill="#DBEAFE"/><text x="572.0" y="170" class="small" text-anchor="middle">Masked compare</text><rect x="808" y="146" width="152" height="40" rx="14" fill="#2563EB"/><text x="884.0" y="172" class="inverse" text-anchor="middle">Open exception</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="972" y="146" width="180" height="40" rx="14" fill="#0F766E"/><text x="1062.0" y="172" class="inverse" text-anchor="middle">Route for approval</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, field, exception code, source system, case, or payroll impact within authorized scope</text><rect x="856" y="226" width="116" height="28" rx="14" fill="#EAF2F8"/><text x="914.0" y="244" class="small" text-anchor="middle">Pending approval</text><rect x="982" y="226" width="88" height="28" rx="14" fill="#EAF2F8"/><text x="1026.0" y="244" class="small" text-anchor="middle">Backdated</text><rect x="1080" y="226" width="106" height="28" rx="14" fill="#10324A"/><text x="1133.0" y="244" class="inverse" text-anchor="middle">Payroll impact</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Open</text><text x="364" y="362" class="metric" text-anchor="start">22</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Payroll</text><text x="586" y="362" class="metric" text-anchor="start">07</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Backdated</text><text x="808" y="362" class="metric" text-anchor="start">05</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Overdue</text><text x="1030" y="362" class="metric" text-anchor="start">04</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Dup risk</text><text x="1252" y="362" class="metric" text-anchor="start">06</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Exception queue and category stack</text><text x="312" y="464" class="small" text-anchor="start">One queue for personal, employment, master-data, and source-sync issues</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Rows grouped by exception code and severity</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Personal-data errors distinct from employment conflicts</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Duplicate-candidate and invalid-contact clusters separated</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Integration-origin exceptions show source and retry state</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Before-after compare and action rail</text><text x="664" y="464" class="small" text-anchor="start">Current, proposed, and policy state must be visible before any correction decision</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Masked compare</text><text x="684" y="522" class="body" text-anchor="start">Masked values remain masked unless reveal is authorized, while backdated and payroll-impacting updates require explicit approval and audit lineage.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open evidence, route approval, send back, or escalate payroll impact before any correction is applied.</text><rect x="666" y="574" width="144" height="40" rx="14" fill="#2563EB"/><text x="738.0" y="600" class="inverse" text-anchor="middle">Open evidence</text><rect x="824" y="574" width="144" height="40" rx="14" fill="#EEF2FF"/><text x="896.0" y="600" class="body" text-anchor="middle">Approve route</text><rect x="982" y="574" width="156" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1060.0" y="600" class="body" text-anchor="middle">Escalate payroll</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Root-cause and trend panel</text><text x="312" y="754" class="small" text-anchor="start">Operations teams need to spot recurring quality problems, not only clear single records</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Invalid contact patterns trend by unit</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Manager-assignment anomalies grouped separately</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Duplicate-record clusters show likely source channel</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Import or integration spikes easy to isolate</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Downstream impact and history</text><text x="664" y="754" class="small" text-anchor="start">Correction safety depends on knowing payroll, reporting, and timeline effects before apply</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Payroll and reporting impact badges sit above chronology</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Future-dated conflicts and overlaps remain visible</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Audit log captures field-level changes and masked views</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Employee timeline and linked cases one click away</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned exception lenses</text><text x="312" y="994" class="small" text-anchor="start">HR operations can pin payroll, backdated, personal-data, and duplicate-risk views for repeat exception handling</text><rect x="320" y="990" width="108" height="28" rx="14" fill="#DCFCE7"/><text x="374.0" y="1008" class="small" text-anchor="middle">Payroll impact</text><rect x="440" y="990" width="88" height="28" rx="14" fill="#DBEAFE"/><text x="484.0" y="1008" class="small" text-anchor="middle">Backdated</text><rect x="540" y="990" width="104" height="28" rx="14" fill="#FEF3C7"/><text x="592.0" y="1008" class="small" text-anchor="middle">Personal data</text><rect x="656" y="990" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="702.0" y="1008" class="small" text-anchor="middle">Employment</text><rect x="760" y="990" width="108" height="28" rx="14" fill="#EDE9FE"/><text x="814.0" y="1008" class="small" text-anchor="middle">Duplicate risk</text><rect x="880" y="990" width="128" height="28" rx="14" fill="#F8FAFC"/><text x="944.0" y="1008" class="small" text-anchor="middle">Awaiting evidence</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Queue not overwrite</text><text x="1224" y="224" class="annoText" text-anchor="start">Sensitive corrections should route through governed exception handling.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Evidence stays attached</text><text x="1224" y="276" class="annoText" text-anchor="start">Attachments and reasons need to stay beside the decision.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Masked compare is mandatory</text><text x="1224" y="328" class="annoText" text-anchor="start">Comparison views must preserve masking and reveal rules.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Effective dates matter</text><text x="1224" y="380" class="annoText" text-anchor="start">Backdated and future-dated changes need conflict cues before approval.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Downstream impact is explicit</text><text x="1224" y="432" class="annoText" text-anchor="start">Payroll, reporting, and timeline effects should appear before commit.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Disabled actions explain why</text><text x="1224" y="484" class="annoText" text-anchor="start">Policy or privacy blocks should be explained, not silently hidden.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile is approval-first</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should focus on triage, evidence review, and escalation.</text></svg>
