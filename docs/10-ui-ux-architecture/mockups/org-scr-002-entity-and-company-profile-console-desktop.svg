  <text x="326" y="504" class="body" text-anchor="start">Company: ApexOne Services India Pvt Ltd, company code AOS-IN</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body" text-anchor="start">Legal entity: ApexOne Technologies India Pvt Ltd, entity code ATI-01</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body" text-anchor="start">Holding company: ApexOne Holdings Singapore Pte Ltd with APAC cost-book link</text>
  <circle cx="314" cy="560" r="3" fill="#2563EB"/>
  <text x="326" y="564" class="body" text-anchor="start">Business use: employee administration, payroll, statutory filing, vendor invoicing</text>
  <circle cx="314" cy="580" r="3" fill="#2563EB"/>
  <text x="326" y="584" class="body" text-anchor="start">Profile status shows implementation completeness, not final brand polish</text>

