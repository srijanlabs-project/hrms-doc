  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">9</text>
  <text x="312" y="976" class="h3" text-anchor="start">Pinned org-profile lenses</text>
  <text x="312" y="994" class="small" text-anchor="start">Org admins and implementation leads can jump between the highest-value structural slices</text>
