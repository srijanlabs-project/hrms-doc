  <text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle" text-anchor="start">Tenant-safe shell</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">The screen is explicitly tenant-scoped and avoids provider control-plane cues.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Admin-profile hybrid</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">It reads like a profile summary first, then expands into governed admin maintenance.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Search plus scope chips</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">Entity filtering, effective status, and controlled-field cues stay above the fold.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">KPI row</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Readiness, approvals, future dates, gaps, and ownership summarize setup health fast.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Believable hierarchy</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">Tenant, company, legal entity, and holding company are shown with real enterprise semantics.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Governance before edit</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">Maker-checker, backup owners, and freeze windows are visible before any publish action.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Compliance IDs grounded</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">Statutory identifiers and effective dates make the structural screen feel implementation-real.</text>
  <circle cx="1202" cy="568" r="12" fill="#2563EB"/>
  <text x="1202" y="572" class="inverse" text-anchor="middle">8</text>
  <text x="1224" y="570" class="annoTitle" text-anchor="start">Ownership matrix</text>
  <text x="1224" y="588" class="annoText" text-anchor="start">Each domain shows who owns it and which downstream systems inherit the configuration.</text>
  <circle cx="1202" cy="620" r="12" fill="#2563EB"/>
  <text x="1202" y="624" class="inverse" text-anchor="middle">9</text>
  <text x="1224" y="622" class="annoTitle" text-anchor="start">Pinned lenses</text>
  <text x="1224" y="640" class="annoText" text-anchor="start">The repeated admin review paths are compressed into reusable chips at the bottom.</text>
