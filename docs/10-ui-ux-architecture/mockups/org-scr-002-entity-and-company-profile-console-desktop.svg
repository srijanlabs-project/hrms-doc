  <rect x="418" y="990" width="98" height="28" rx="14" fill="#DBEAFE"/>
  <text x="467" y="1008" class="small" text-anchor="middle">Governance</text>
  <rect x="528" y="990" width="92" height="28" rx="14" fill="#FEF3C7"/>
  <text x="574" y="1008" class="small" text-anchor="middle">Effective</text>
  <rect x="632" y="990" width="112" height="28" rx="14" fill="#FEE2E2"/>
  <text x="688" y="1008" class="small" text-anchor="middle">Compliance IDs</text>
  <rect x="756" y="990" width="94" height="28" rx="14" fill="#EDE9FE"/>
  <text x="803" y="1008" class="small" text-anchor="middle">Ownership</text>
  <rect x="862" y="990" width="84" height="28" rx="14" fill="#F8FAFC"/>
  <text x="904" y="1008" class="small" text-anchor="middle">Audit log</text>

