  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">8</text>
  <text x="664" y="736" class="h3" text-anchor="start">Configuration ownership and downstream scope</text>
  <text x="664" y="754" class="small" text-anchor="start">Ownership clarifies who maintains each profile domain and which systems inherit it</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body" text-anchor="start">Tax and statutory IDs: compliance team owns, payroll and finance consume</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">Registered address and signatory matrix: legal operations owns, contracts inherit</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Default branding, email footer, and seal assets: implementation lead owns during rollout</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body" text-anchor="start">Entity-to-cost-center mapping: finance ops owns, ERP and analytics inherit</text>
  <circle cx="666" cy="850" r="3" fill="#2563EB"/>
  <text x="678" y="854" class="body" text-anchor="start">SSO domain and delegated admins: platform admin owns, entity profile only references</text>

