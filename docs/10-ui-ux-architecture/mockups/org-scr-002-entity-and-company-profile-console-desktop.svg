  <text x="664" y="464" class="small" text-anchor="start">Governed ownership, maker-checker, and implementation handoff sit beside profile actions</text>
  <rect x="666" y="470" width="474" height="98" rx="12" fill="#FBFDFF" stroke="#D9E2EC"/>
  <text x="684" y="494" class="small" text-anchor="start">Governance summary</text>
  <text x="684" y="518" class="body" text-anchor="start">Primary owner: Nisha Rao, Org Admin. Reviewer: Arvind Menon, Finance Controller.</text>
  <text x="684" y="540" class="body" text-anchor="start">Compliance approver: Kavya Iyer. Implementation steward: Rahul Sethi. Dual approval required for statutory identifiers.</text>
  <rect x="666" y="586" width="130" height="40" rx="14" fill="#2563EB"/>
  <text x="731" y="612" class="inverse" text-anchor="middle">Open approvals</text>
  <rect x="810" y="586" width="144" height="40" rx="14" fill="#EEF2FF"/>
  <text x="882" y="612" class="body" text-anchor="middle">Review change log</text>
  <rect x="968" y="586" width="152" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="1044" y="612" class="body" text-anchor="middle">Assign backup owner</text>
  <circle cx="684" cy="646" r="3" fill="#2563EB"/>
  <text x="696" y="650" class="body" text-anchor="start">Effective-from edits route through governance before downstream payroll and ERP sync</text>
  <circle cx="684" cy="666" r="3" fill="#2563EB"/>
  <text x="696" y="670" class="body" text-anchor="start">Entity freeze window visible for month-end close and statutory return periods</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <circle cx="314" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="733" class="inverse" text-anchor="middle">7</text>
  <text x="312" y="736" class="h3" text-anchor="start">Effective details and compliance identifiers</text>
  <text x="312" y="754" class="small" text-anchor="start">Enterprise setup needs believable statutory and operational anchors</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body" text-anchor="start">Effective from 01 Apr 2026, incorporation 18 Sep 2018, books close 31 Mar</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">CIN U72900KA2018PTC118245 and PAN AAECA4821F stay in governed profile fields</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">GSTIN 29AAECA4821F1ZQ and TAN BLRA10234B support payroll and invoicing rules</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">PF KN/BNG/48231 and ESIC 53-00-198765-000-0101 show statutory ownership</text>

