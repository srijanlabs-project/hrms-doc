xt><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Topic grid</text><text x="1224" y="328" class="annoText" text-anchor="start">Operators can compare route health across the runtime in one dense surface.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Recovery actions</text><text x="1224" y="380" class="annoText" text-anchor="start">Failure diagnosis and replay-safe actions stay together to reduce context switching.</text></svg>
