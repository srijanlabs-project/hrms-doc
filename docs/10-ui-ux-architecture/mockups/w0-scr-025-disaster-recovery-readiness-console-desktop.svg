<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Readiness</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Dependencies</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Drills</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Owners</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Summary</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">DR</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Disaster Recovery Readiness</text><rect x="296" y="152" width="114" height="28" rx="14" fill="#DBEAFE"/><text x="353.0" y="170" class="small" text-anchor="middle">Posture 92%</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="422" y="152" width="84" height="28" rx="14" fill="#FEF3C7"/><text x="464.0" y="170" class="small" text-anchor="middle">RTO 3</text><rect x="518" y="152" width="102" height="28" rx="14" fill="#FEE2E2"/><text x="569.0" y="170" class="small" text-anchor="middle">Drill 14d</text><rect x="808" y="146" width="194" height="40" rx="14" fill="#2563EB"/><text x="905.0" y="172" class="inverse" text-anchor="middle">Open breached service</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="1014" y="146" width="184" height="40" rx="14" fill="#0F766E"/><text x="1106.0" y="172" class="inverse" text-anchor="middle">Launch DR rehearsal</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search service tier, region, dependency, drill evidence, or remediation owner</text><rect x="856" y="226" width="66" height="28" rx="14" fill="#EAF2F8"/><text x="889.0" y="244" class="small" text-anchor="middle">Map</text><rect x="932" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="978.0" y="244" class="small" text-anchor="middle">RTO/RPO</text><rect x="1034" y="226" width="54" height="28" rx="14" fill="#10324A"/><text x="1061.0" y="244" class="inverse" text-anchor="middle">Drill</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Tier-1</text><text x="364" y="362" class="metric" text-anchor="start">22</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">RPO ok</text><text x="586" y="362" class="metric" text-anchor="start">91%</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Failed tests</text><text x="808" y="362" class="metric" text-anchor="start">03</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Failover</text><text x="1030" y="362" class="metric" text-anchor="start">18m</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Deps risk</text><text x="1252" y="362" class="metric" text-anchor="start">07</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Readiness queue and issue log</text><text x="312" y="464" class="small" text-anchor="start">DR is judged by readiness gaps and owner action, not by backup counts alone</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">3 services breached target RTO</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">7 critical dependencies still at risk</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Issue log grouped by severity and owner</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">One board-level summary request pending refresh</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Dependency map and drill evidence</text><text x="664" y="464" class="small" text-anchor="start">Service dependencies, drill results, and posture remain in one resilience surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Readiness insight</text><text x="684" y="522" class="body" text-anchor="start">The payroll notification stack can fail over within target, but one document-storage dependency still pushes full business recovery beyond the committed RTO.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect dependency owners, review drill evidence, and raise remediation before the next executive checkpoint.</text><rect x="666" y="574" width="150" height="40" rx="14" fill="#2563EB"/><text x="741.0" y="600" class="inverse" text-anchor="middle">Open dependency</text><rect x="830" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="892.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="968" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1041.0" y="600" class="body" text-anchor="middle">View summary</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">RTO and RPO posture matrix</text><text x="312" y="754" class="small" text-anchor="start">Recovery-time and recovery-point posture are evaluated together for each critical capability</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">22 tier-1 services covered</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">3 failed DR tests remain open</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Average simulated failover time is 18 minutes</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">2 capability rows still need cross-region validation</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Owners, exercises, and board summary</text><text x="664" y="754" class="small" text-anchor="start">Leadership and ops share the same evidence base, but with different reading depth</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Next scheduled DR exercise in 6 days</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 owners overdue on remediation</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Executive summary ready for board pack</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">One failed drill elevated above standard trend view</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned DR-readiness lenses</text><text x="312" y="994" class="small" text-anchor="start">Ops and leadership can pin region, tier, drill, dependency, and board-summary views</text><rect x="320" y="990" width="82" height="28" rx="14" fill="#DCFCE7"/><text x="361.0" y="1008" class="small" text-anchor="middle">Tier-1</text><rect x="414" y="990" width="122" height="28" rx="14" fill="#DBEAFE"/><text x="475.0" y="1008" class="small" text-anchor="middle">Cross-region</text><rect x="548" y="990" width="104" height="28" rx="14" fill="#FEF3C7"/><text x="600.0" y="1008" class="small" text-anchor="middle">Drill fail</text><rect x="664" y="990" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="720.0" y="1008" class="small" text-anchor="middle">Dependency</text><rect x="788" y="990" width="84" height="28" rx="14" fill="#EDE9FE"/><text x="830.0" y="1008" class="small" text-anchor="middle">Owner</text><rect x="884" y="990" width="80" height="28" rx="14" fill="#F8FAFC"/><text x="924.0" y="1008" class="small" text-anchor="middle">Board</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Posture before counts</text><text x="1224" y="224" class="annoText" text-anchor="start">The screen leads with readiness gaps because DR is judged by recoverability, not activity volume.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Dependencies in main plane</text><text x="1224" y="276" class="annoText" text-anchor="start">Downstream service breakage is visible early so operators can understand true recovery impact.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">RTO and RPO together</text><text x="1224" y="328" class="annoText" text-anchor="start">Leadership and ops both need timing and data-loss posture in one shared view.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Drill evidence is first-class</text><text x="1224" y="380" class="annoText" text-anchor="start">Untested recovery is not trusted recovery, so exercises stay visible above the fold.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Owner-oriented issue log</text><text x="1224" y="432" class="annoText" text-anchor="start">Remediation assignment is part of the readiness surface, not a separate operational task.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Failed drill state escalates</text><text x="1224" y="484" class="annoText" text-anchor="start">Failed-test variants outrank the default order to keep remediation urgent.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Executive mode simplifies</text><text x="1224" y="536" class="annoText" text-anchor="start">Board-summary variants reduce density without changing the underlying shell.</text></svg>
