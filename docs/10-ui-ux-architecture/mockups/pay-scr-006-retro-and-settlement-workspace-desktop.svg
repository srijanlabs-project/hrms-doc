<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Payroll Control</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Settlements</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Retro Cases</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Recoveries</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Release</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Payroll</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Retro and Settlement Workspace</text><rect x="296" y="152" width="124" height="28" rx="14" fill="#DBEAFE"/><text x="358.0" y="170" class="small" text-anchor="middle">FNF pending 26</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="432" y="152" width="131" height="28" rx="14" fill="#FEF3C7"/><text x="497.5" y="170" class="small" text-anchor="middle">Retro impact 14</text><rect x="575" y="152" width="138" height="28" rx="14" fill="#FEE2E2"/><text x="644.0" y="170" class="small" text-anchor="middle">Approval hold 08</text><rect x="808" y="146" width="145" height="40" rx="14" fill="#2563EB"/><text x="880.5" y="172" class="inverse" text-anchor="middle">Review settlement</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="965" y="146" width="110" height="40" rx="14" fill="#0F766E"/><text x="1020.0" y="172" class="inverse" text-anchor="middle">Open release</text><rect x="1087" y="146" width="108" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1141.0" y="172" class="body" text-anchor="middle">Open hold</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, exit case, retro run, recovery item, bank status, or approval hold</text><rect x="856" y="226" width="75" height="28" rx="14" fill="#EAF2F8"/><text x="893.5" y="244" class="small" text-anchor="middle">Filters</text><rect x="941" y="226" width="64" height="28" rx="14" fill="#EAF2F8"/><text x="973.0" y="244" class="small" text-anchor="middle">Stage</text><rect x="1015" y="226" width="75" height="28" rx="14" fill="#10324A"/><text x="1052.5" y="244" class="inverse" text-anchor="middle">Release</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="364" y="332" class="small" text-anchor="start">FNF pending</text><text x="364" y="362" class="metric" text-anchor="start">26</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Retro cases</text><text x="586" y="362" class="metric" text-anchor="start">14</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Negative net</text><text x="808" y="362" class="metric" text-anchor="start">04</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1030" y="332" class="small" text-anchor="start">Approval holds</text><text x="1030" y="362" class="metric" text-anchor="start">08</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="1252" y="332" class="small" text-anchor="start">Payment ready</text><text x="1252" y="362" class="metric" text-anchor="start">19</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Settlement and retro priority queue</text><text x="312" y="464" class="small" text-anchor="start">Payroll needs case-stage clarity before approval or payment release.</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Four FNF cases recalculated after final-day changes</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Leave encashment is loaded for eleven separation cases</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Three retro deltas tie back to late attendance corrections</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Two cases remain blocked by asset recovery</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI readiness and blocker guidance</text><text x="664" y="464" class="small" text-anchor="start">AI can summarize blocker patterns but cannot approve or release.</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Settlement-guidance note</text><text x="684" y="522" class="body" text-anchor="start">A shared cutoff snapshot issue is affecting multiple FNF and retro cases together.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect source totals, confirm recoveries, and reopen approval only after recalculation.</text><rect x="666" y="574" width="117" height="40" rx="14" fill="#2563EB"/><text x="724.5" y="600" class="inverse" text-anchor="middle">Review totals</text><rect x="797" y="574" width="108" height="40" rx="14" fill="#EEF2FF"/><text x="851.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="919" y="574" width="108" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="973.0" y="600" class="body" text-anchor="middle">Open hold</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Recovery and waiver controls</text><text x="312" y="754" class="small" text-anchor="start">Negative-net and exception logic should remain visible beside the case.</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Recovery priority nets loans before notice shortfall</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Negative net cases require waiver or recovery-plan approval</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Masked bank details stay hidden for non-release roles</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Each recovery line links back to its source module</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Release and reconciliation status</text><text x="664" y="754" class="small" text-anchor="start">Release path and downstream payment posture belong in one workspace.</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Twelve cases pay through payroll and seven through off-cycle</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Three payment-ready cases still wait for bank readiness</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">One exit rescind event has frozen release controls</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Released-but-unpaid aging remains visible by channel</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned workspace lenses</text><text x="312" y="994" class="small" text-anchor="start">Repeat views keep the highest-value slices close without re-filtering.</text><rect x="320" y="990" width="89" height="28" rx="14" fill="#DCFCE7"/><text x="364.5" y="1008" class="small" text-anchor="middle">India FNF</text><rect x="421" y="990" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="469.0" y="1008" class="small" text-anchor="middle">Retro July</text><rect x="529" y="990" width="110" height="28" rx="14" fill="#FEF3C7"/><text x="584.0" y="1008" class="small" text-anchor="middle">Negative net</text><rect x="651" y="990" width="117" height="28" rx="14" fill="#FEE2E2"/><text x="709.5" y="1008" class="small" text-anchor="middle">Approval hold</text><rect x="780" y="990" width="89" height="28" rx="14" fill="#EDE9FE"/><text x="824.5" y="1008" class="small" text-anchor="middle">Off-cycle</text><rect x="881" y="990" width="145" height="28" rx="14" fill="#F8FAFC"/><text x="953.5" y="1008" class="small" text-anchor="middle">Clearance blocked</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Settlement-first actions</text><text x="1224" y="224" class="annoText" text-anchor="start">The hero actions should orient users to review and release work, not passive browsing.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Cutoff-aware search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search should target cases, recoveries, retro runs, and release artifacts.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Outcome KPI mix</text><text x="1224" y="328" class="annoText" text-anchor="start">Operational load and financial risk should appear together in the metric row.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Case snapshots matter</text><text x="1224" y="380" class="annoText" text-anchor="start">Users need governed settlement cases, not scattered component logs.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">AI has no authority</text><text x="1224" y="432" class="annoText" text-anchor="start">AI may explain blockers but cannot approve, waive, or pay.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Recovery policy visible</text><text x="1224" y="484" class="annoText" text-anchor="start">Negative-net rules should sit beside release decisions.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Channel lenses stay close</text><text x="1224" y="536" class="annoText" text-anchor="start">Teams repeatedly split work by FNF, retro, hold, and payment route.</text></svg>
