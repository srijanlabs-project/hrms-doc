  <text x="684" y="592" class="body" text-anchor="start">1,248 workers, 37 managers, 18 cost centers, 4 profit centers, and 2 acting-manager gaps are in scope.</text>
  <text x="684" y="612" class="small" text-anchor="start">Next step: open the reporting map, compare against Q1, and trace cost or project rollups before publish.</text>
