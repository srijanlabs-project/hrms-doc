<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Team Command Center</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Dashboard</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Attendance</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Performance</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Hiring</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Scoped</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Team People List</text><rect x="296" y="152" width="82" height="28" rx="14" fill="#DCFCE7"/><text x="337.0" y="170" class="small" text-anchor="middle">My team</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="390" y="152" width="128" height="28" rx="14" fill="#DBEAFE"/><text x="454.0" y="170" class="small" text-anchor="middle">Direct + indirect</text><rect x="530" y="152" width="126" height="28" rx="14" fill="#FEF3C7"/><text x="593.0" y="170" class="small" text-anchor="middle">Delegation-aware</text><rect x="808" y="146" width="142" height="40" rx="14" fill="#2563EB"/><text x="879.0" y="172" class="inverse" text-anchor="middle">Open profile</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="962" y="146" width="152" height="40" rx="14" fill="#0F766E"/><text x="1038.0" y="172" class="inverse" text-anchor="middle">Start check-in</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, team, location, skill, job title, or employee ID</text><rect x="856" y="226" width="72" height="28" rx="14" fill="#EAF2F8"/><text x="892.0" y="244" class="small" text-anchor="middle">Directs</text><rect x="938" y="226" width="84" height="28" rx="14" fill="#EAF2F8"/><text x="980.0" y="244" class="small" text-anchor="middle">Probation</text><rect x="1032" y="226" width="104" height="28" rx="14" fill="#10324A"/><text x="1084.0" y="244" class="inverse" text-anchor="middle">Missing data</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Team size</text><text x="364" y="362" class="metric" text-anchor="start">24</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Directs</text><text x="586" y="362" class="metric" text-anchor="start">08</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Probation</text><text x="808" y="362" class="metric" text-anchor="start">02</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Joiners 30d</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Data gaps</text><text x="1252" y="362" class="metric" text-anchor="start">04</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Roster and filter stack</text><text x="312" y="464" class="small" text-anchor="start">Managers need a fast list-first team surface before drilling into profiles</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Direct and indirect reports grouped separately</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Title, location, tenure, and chain shown per row</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Sensitive pay and medical data absent from roster</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Delegated-team rows carry a scope badge</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Selected employee summary</text><text x="664" y="464" class="small" text-anchor="start">Profile launch, status context, and next manager actions stay in one review pane</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Scope-safe profile cue</text><text x="684" y="522" class="body" text-anchor="start">The selected employee card shows role, attendance trend, leave status, goals, and pending requests while restricted fields remain masked by policy.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open the employee profile, start a check-in, or review open actions without losing filter context.</text><rect x="666" y="574" width="136" height="40" rx="14" fill="#2563EB"/><text x="734.0" y="600" class="inverse" text-anchor="middle">Open profile</text><rect x="816" y="574" width="110" height="40" rx="14" fill="#EEF2FF"/><text x="871.0" y="600" class="body" text-anchor="middle">Timeline</text><rect x="940" y="574" width="140" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1010.0" y="600" class="body" text-anchor="middle">Start check-in</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Team composition and workload lenses</text><text x="312" y="754" class="small" text-anchor="start">The people list doubles as an operational roster for workload, readiness, and coverage checks</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Segment by location, shift, employment type, and critical skill</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Probation endings and reporting-line changes highlighted</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Leave overlap and attendance exceptions flagged</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Quick pivot into org and reporting structure context</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Follow-ups and people risks</text><text x="664" y="754" class="small" text-anchor="start">Roster work stays actionable when pending manager tasks and people issues are visible</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">3 missing acknowledgments need follow-up</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 employees are mobility-ready</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">1 reporting-line change pending effective date</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Low-sentiment signal shown only as safe manager alert</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned team lenses</text><text x="312" y="994" class="small" text-anchor="start">Managers can pin direct-report, probation, skill, and data-quality views for repeat reviews</text><rect x="320" y="990" width="72" height="28" rx="14" fill="#DCFCE7"/><text x="356.0" y="1008" class="small" text-anchor="middle">Directs</text><rect x="404" y="990" width="82" height="28" rx="14" fill="#DBEAFE"/><text x="445.0" y="1008" class="small" text-anchor="middle">Probation</text><rect x="498" y="990" width="72" height="28" rx="14" fill="#FEF3C7"/><text x="534.0" y="1008" class="small" text-anchor="middle">Joiners</text><rect x="582" y="990" width="108" height="28" rx="14" fill="#FEE2E2"/><text x="636.0" y="1008" class="small" text-anchor="middle">Critical skills</text><rect x="702" y="990" width="68" height="28" rx="14" fill="#EDE9FE"/><text x="736.0" y="1008" class="small" text-anchor="middle">Remote</text><rect x="782" y="990" width="84" height="28" rx="14" fill="#F8FAFC"/><text x="824.0" y="1008" class="small" text-anchor="middle">Data gaps</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">List-first manager flow</text><text x="1224" y="224" class="annoText" text-anchor="start">Managers usually enter through people lookup, so the roster outranks deep profile detail.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Permission-safe summary</text><text x="1224" y="276" class="annoText" text-anchor="start">Only operationally useful fields should appear in the list.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Delegation clarity</text><text x="1224" y="328" class="annoText" text-anchor="start">Delegated-team visibility must be unmistakable to prevent out-of-scope action.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Fast profile launch</text><text x="1224" y="380" class="annoText" text-anchor="start">The right pane should help decide whether a full profile view is necessary.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Operational filters win</text><text x="1224" y="432" class="annoText" text-anchor="start">Manager questions differ from master-data maintenance categories.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">No compensation leakage</text><text x="1224" y="484" class="annoText" text-anchor="start">The roster must never become a backdoor into pay or grievance data.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Reusable people lens</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned filters should support recurring team-review rituals.</text></svg>
