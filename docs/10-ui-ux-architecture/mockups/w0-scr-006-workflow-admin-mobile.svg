<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">PROD</text><text x="20" y="76" class="h2inv" text-anchor="start">Workflow Administration</text><rect x="16" y="108" width="104" height="28" rx="14" fill="#DBEAFE"/><text x="68.0" y="126" class="small" text-anchor="middle">Drafts 12</text><rect x="128" y="108" width="120" height="28" rx="14" fill="#FEE2E2"/><text x="188.0" y="126" class="small" text-anchor="middle">Stuck items 6</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="16" y="154" width="358" height="176" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="178" class="h3" text-anchor="start">Workflow list</text><text x="32" y="196" class="small" text-anchor="start">Selection-first mobile workflow administration</text><circle cx="34" cy="206" r="3" fill="#2563EB"/><text x="46" y="210" class="body" text-anchor="start">Hiring approval</text><circle cx="34" cy="226" r="3" fill="#2563EB"/><text x="46" y="230" class="body" text-anchor="start">Leave approval</text><circle cx="34" cy="246" r="3" fill="#2563EB"/><text x="46" y="250" class="body" text-anchor="start">Exit clearance</text><circle cx="34" cy="266" r="3" fill="#2563EB"/><text x="46" y="270" class="body" text-anchor="start">Document review</text><circle cx="30" cy="170" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="175" class="inverse" text-anchor="middle">2</text><rect x="16" y="346" width="358" height="196" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="370" class="h3" text-anchor="start">Selected route</text><text x="32" y="388" class="small" text-anchor="start">Published and draft route summary in stacked form</text><circle cx="34" cy="400" r="3" fill="#2563EB"/><text x="46" y="404" class="body" text-anchor="start">Published v6 and Draft v7</text><circle cx="34" cy="420" r="3" fill="#2563EB"/><text x="46" y="424" class="body" text-anchor="start">Submit -&gt; Manager -&gt; HR -&gt; Security</text><circle cx="34" cy="440" r="3" fill="#2563EB"/><text x="46" y="444" class="body" text-anchor="start">Escalates after 24h</text><circle cx="34" cy="460" r="3" fill="#2563EB"/><text x="46" y="464" class="body" text-anchor="start">Delegation allowed</text><circle cx="30" cy="362" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="367" class="inverse" text-anchor="middle">3</text><rect x="16" y="558" width="358" height="148" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="582" class="h3" text-anchor="start">Execution health</text><text x="32" y="600" class="small" text-anchor="start">Stuck and failed transitions remain visible on mobile</text><circle cx="34" cy="608" r="3" fill="#2563EB"/><text x="46" y="612" class="body" text-anchor="start">Active 128</text><circle cx="34" cy="628" r="3" fill="#2563EB"/><text x="46" y="632" class="body" text-anchor="start">Stuck 6</text><circle cx="34" cy="648" r="3" fill="#2563EB"/><text x="46" y="652" class="body" text-anchor="start">Failed 3</text><circle cx="30" cy="574" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="579" class="inverse" text-anchor="middle">4</text><rect x="16" y="722" width="358" height="104" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="750" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="774" r="12" fill="#2563EB"/><text x="40" y="778" class="inverse" text-anchor="middle">1</text><text x="62" y="776" class="annoTitle" text-anchor="start">List first</text><text x="62" y="794" class="annoText" text-anchor="start">Mobile prioritizes choosing a workflow, then understanding route and health in stacked cards.</text><circle cx="40" cy="826" r="12" fill="#2563EB"/><text x="40" y="830" class="inverse" text-anchor="middle">2</text><text x="62" y="828" class="annoTitle" text-anchor="start">Reduced version depth</text><text x="62" y="846" class="annoText" text-anchor="start">Deep compare and rollback remain desktop-oriented actions even though the status is visible here.</text></svg>
