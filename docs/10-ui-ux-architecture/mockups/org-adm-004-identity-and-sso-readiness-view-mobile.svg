<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#F4F7FB"/>
  <rect width="390" height="92" fill="#10324A"/>
  <text x="20" y="36" class="inverse">Enterprise HRMS</text>
  <rect x="286" y="18" width="84" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="328" y="36" class="inverse" text-anchor="middle">Org Admin</text>
  <text x="20" y="76" class="h2inv">Identity and SSO</text>

  <rect x="16" y="108" width="358" height="96" rx="16" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="30" y="136" class="small">Apex Retail Holdings</text>
  <text x="30" y="170" class="metric">91%</text>
  <text x="92" y="170" class="body">readiness</text>
  <rect x="248" y="122" width="110" height="28" rx="14" fill="#DCFCE7"/>
  <text x="303" y="140" class="small" text-anchor="middle">Domains 03</text>
  <rect x="248" y="156" width="110" height="28" rx="14" fill="#FEE2E2"/>
  <text x="303" y="174" class="small" text-anchor="middle">SCIM 02</text>
  <circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="127" class="inverse" text-anchor="middle">1</text>

  <rect x="16" y="220" width="358" height="164" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="244" class="h3">Tenant launch readiness</text>
  <text x="32" y="262" class="small">Mobile keeps launch evidence, verified domains, and provider boundaries together</text>
  <circle cx="34" cy="280" r="3" fill="#2563EB"/>
  <text x="46" y="284" class="body">login.apexpeople.in and hr.apexretail.com are verified for production routing</text>
  <circle cx="34" cy="300" r="3" fill="#2563EB"/>
  <text x="46" y="304" class="body">SP metadata and callback paths matched sandbox and production on 15 Jul 2026</text>
  <circle cx="34" cy="320" r="3" fill="#2563EB"/>
  <text x="46" y="324" class="body">Break-glass admin access remains outside normal SSO disable actions</text>
  <circle cx="34" cy="340" r="3" fill="#2563EB"/>
  <text x="46" y="344" class="body">Provider managed fields show read-only labels instead of editable controls</text>
  <circle cx="30" cy="236" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="241" class="inverse" text-anchor="middle">2</text>

  <rect x="16" y="400" width="358" height="176" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="424" class="h3">Provider and provisioning health</text>
  <text x="32" y="442" class="small">Read-only provider cues and SCIM operations collapse into one action stack</text>
  <circle cx="34" cy="454" r="3" fill="#2563EB"/>
  <text x="46" y="458" class="body">NameID format and conditional-access settings are provider managed and link out</text>
  <circle cx="34" cy="474" r="3" fill="#2563EB"/>
  <text x="46" y="478" class="body">Last delta sync completed 12 minutes ago with 2 manager mismatches pending review</text>
  <circle cx="34" cy="494" r="3" fill="#2563EB"/>
  <text x="46" y="498" class="body">Connector pause impacts provisioning only and does not terminate active user sessions</text>
  <rect x="30" y="528" width="136" height="40" rx="14" fill="#2563EB"/>
  <text x="98" y="554" class="inverse" text-anchor="middle">Review SCIM</text>
  <rect x="180" y="528" width="156" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="258" y="554" class="body" text-anchor="middle">Open provider doc</text>
  <circle cx="30" cy="416" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="421" class="inverse" text-anchor="middle">3</text>

  <rect x="16" y="592" width="358" height="144" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="616" class="h3">MFA posture and diagnostics</text>
  <text x="32" y="634" class="small">Assurance drift, export step-up, and tenant-safe traces stay readable on mobile</text>
  <circle cx="34" cy="644" r="3" fill="#2563EB"/>
  <text x="46" y="648" class="body">11 users remain on SMS fallback while enrollment tasks and reminders are open</text>
  <circle cx="34" cy="664" r="3" fill="#2563EB"/>
  <text x="46" y="668" class="body">Payroll export, permissions, and privacy approvals trigger step-up verification</text>
  <circle cx="34" cy="684" r="3" fill="#2563EB"/>
  <text x="46" y="688" class="body">Masked sign-in trace and claim drift evidence can be downloaded without secrets</text>
  <circle cx="30" cy="608" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="30" y="613" class="inverse" text-anchor="middle">4</text>

  <rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="34" y="780" class="h2">Mobile notes</text>
  <circle cx="40" cy="804" r="12" fill="#2563EB"/>
  <text x="40" y="808" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="806" class="annoTitle">Readiness before configuration</text>
  <text x="62" y="824" class="annoText">Mobile prioritizes launch evidence, provider-managed cues, SCIM health, and MFA posture before deeper admin paths.</text>
</svg>
