-anchor="start">Mobile notes</text><circle cx="40" cy="774" r="12" fill="#2563EB"/><text x="40" y="778" class="inverse" text-anchor="middle">1</text><text x="62" y="776" class="annoTitle" text-anchor="start">Stacked editing</text><text x="62" y="794" class="annoText" text-anchor="start">Mobile uses compact channel switching and stacked preview instead of desktop side panels.</text><circle cx="40" cy="826" r="12" fill="#2563EB"/><text x="40" y="830" class="inverse" text-anchor="middle">2</text><text x="62" y="828" class="annoTitle" text-anchor="start">Condensed diagnostics</text><text x="62" y="846" class="annoText" text-anchor="start">Operational send failures remain visible but secondary to template editing.</text></svg>
