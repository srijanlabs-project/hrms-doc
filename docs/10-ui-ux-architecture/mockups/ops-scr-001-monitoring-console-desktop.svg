  <text x="60" y="428" class="inverse" text-anchor="start">Incidents</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="338" y="61" class="small" text-anchor="start">Search service, queue, worker, runtime log, incident, or deployment event</text>
  <rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1103" y="58" class="small" text-anchor="middle">Ops</text>
  <rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1204" y="58" class="small" text-anchor="middle">Alerts 13</text>
  <rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1309" y="58" class="small" text-anchor="middle">Tasks 11</text>
  <rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/>

  <text x="310" y="128" class="title" text-anchor="start">Monitoring Console</text>
  <rect x="296" y="152" width="108" height="28" rx="14" fill="#FEE2E2"/>
  <text x="350" y="170" class="small" text-anchor="middle">Degraded 03</text>
  <circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="312" y="171" class="inverse" text-anchor="middle">1</text>
  <rect x="416" y="152" width="108" height="28" rx="14" fill="#FEF3C7"/>
  <text x="470" y="170" class="small" text-anchor="middle">Lag 02</text>
  <rect x="536" y="152" width="118" height="28" rx="14" fill="#DBEAFE"/>
  <text x="595" y="170" class="small" text-anchor="middle">Jobs 14 fail</text>
  <rect x="808" y="146" width="188" height="40" rx="14" fill="#2563EB"/>
  <text x="902" y="172" class="inverse" text-anchor="middle">Open degraded services</text>
  <circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="820" y="151" class="inverse" text-anchor="middle">2</text>
  <rect x="1008" y="146" width="170" height="40" rx="14" fill="#0F766E"/>
  <text x="1093" y="172" class="inverse" text-anchor="middle">Create incident handoff</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="338" y="249" class="body" text-anchor="start">Search runtime service, message queue, failed job, alert policy, correlation ID, or log burst</text>
  <rect x="856" y="226" width="88" height="28" rx="14" fill="#EAF2F8"/>
  <text x="900" y="244" class="small" text-anchor="middle">Services</text>
  <rect x="954" y="226" width="72" height="28" rx="14" fill="#EAF2F8"/>
  <text x="990" y="244" class="small" text-anchor="middle">Logs</text>
  <rect x="1036" y="226" width="84" height="28" rx="14" fill="#10324A"/>
  <text x="1078" y="244" class="inverse" text-anchor="middle">Alerts</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">3</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small" text-anchor="start">Healthy svcs</text>
  <text x="364" y="362" class="metric" text-anchor="start">27/30</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">4</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="586" y="332" class="small" text-anchor="start">Worst lag</text>
  <text x="586" y="362" class="metric" text-anchor="start">48s</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="808" y="332" class="small" text-anchor="start">Job failures</text>
  <text x="808" y="362" class="metric" text-anchor="start">14</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="1030" y="332" class="small" text-anchor="start">Sev 1 open</text>
  <text x="1030" y="362" class="metric" text-anchor="start">01</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/>
  <text x="1252" y="332" class="small" text-anchor="start">DLQ depth</text>
  <text x="1252" y="362" class="metric" text-anchor="start">86</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3" text-anchor="start">Service health and workload posture</text>
  <text x="312" y="464" class="small" text-anchor="start">Operators need current health, queue behavior, and failure concentration before opening logs.</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body" text-anchor="start">API gateway and payroll calc healthy in prod</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body" text-anchor="start">Notification runtime degraded after retry storm</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body" text-anchor="start">Recruiting export queue lagging in EU region</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body" text-anchor="start">Document render workers failing on one template pack</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3" text-anchor="start">Runtime logs and degraded-state drilldown</text>
  <text x="664" y="464" class="small" text-anchor="start">The selected incident keeps log context, blast radius, and safe recovery actions in one surface.</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="684" y="496" class="small" text-anchor="start">Log insight</text>
  <text x="684" y="522" class="body" text-anchor="start">A notification batch retried 12 times after a downstream mail provider timeout, which inflated queue lag and pushed two worker pools into degraded state without full service loss.</text>
  <text x="684" y="544" class="small" text-anchor="start">Next step: inspect the correlated log burst, drain or replay only safe messages, and keep the degraded callout visible until backlog normalizes.</text>
  <rect x="666" y="574" width="128" height="40" rx="14" fill="#2563EB"/>
  <text x="730" y="600" class="inverse" text-anchor="middle">Open logs</text>
  <rect x="808" y="574" width="136" height="40" rx="14" fill="#EEF2FF"/>
  <text x="876" y="600" class="body" text-anchor="middle">Drain queue</text>
  <rect x="958" y="574" width="154" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1035" y="600" class="body" text-anchor="middle">Pause retries</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3" text-anchor="start">Queue lag and failed-job lane</text>
  <text x="312" y="754" class="small" text-anchor="start">Queue depth, retry backlog, and stuck jobs remain visible together because they often share a cause.</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body" text-anchor="start">2 queues above lag threshold for more than 10 minutes</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">14 failed jobs clustered under document rendering</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">86 dead-letter messages waiting for operator decision</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">Replay remains blocked for mixed-success batches</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3" text-anchor="start">Alert severity and operator handoff</text>
  <text x="664" y="754" class="small" text-anchor="start">Severity, ownership, and degraded-state communication stay bound to the same ops record.</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body" text-anchor="start">1 Sev 1 incident routed to platform on-call</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">4 Sev 2 alerts still owned by module operators</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Customer-facing degraded banner tied to notification flow only</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body" text-anchor="start">Runbook step history remains attached for audit and shift handoff</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">7</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3" text-anchor="start">Pinned monitoring lenses</text>
  <text x="312" y="994" class="small" text-anchor="start">Ops teams can keep their most critical slices close without rebuilding filters during an incident.</text>
  <rect x="320" y="990" width="92" height="28" rx="14" fill="#DCFCE7"/>
  <text x="366" y="1008" class="small" text-anchor="middle">Healthy</text>
  <rect x="424" y="990" width="100" height="28" rx="14" fill="#DBEAFE"/>
  <text x="474" y="1008" class="small" text-anchor="middle">Logs spike</text>
  <rect x="536" y="990" width="86" height="28" rx="14" fill="#FEF3C7"/>
  <text x="579" y="1008" class="small" text-anchor="middle">Lagging</text>
  <rect x="634" y="990" width="88" height="28" rx="14" fill="#FEE2E2"/>
  <text x="678" y="1008" class="small" text-anchor="middle">Sev 1</text>
  <rect x="734" y="990" width="76" height="28" rx="14" fill="#EDE9FE"/>
  <text x="772" y="1008" class="small" text-anchor="middle">DLQ</text>
  <rect x="822" y="990" width="110" height="28" rx="14" fill="#F8FAFC"/>
  <text x="877" y="1008" class="small" text-anchor="middle">Runbooks</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">8</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle" text-anchor="start">Degraded first</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">Operators need degraded-state visibility before generic green metrics because partial outages still matter.</text>

  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Signal strip stays compact</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">Service health, lag, failures, severity, and DLQ depth stay scannable before any drilldown.</text>

  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Logs with action context</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">Runtime logs are paired with safe actions so operators do not jump between separate surfaces during incidents.</text>

  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">Queues and jobs stay linked</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Queue lag and failed jobs are shown together because one often explains the other in ops work.</text>

  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Severity needs ownership</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">Alert counts alone are weak; the screen keeps severity tied to owner, banner scope, and handoff state.</text>

  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Degraded is not failed</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">This mockup explicitly supports partial service degradation rather than collapsing everything into binary up or down.</text>

  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile remains triage-safe</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">The mobile variant keeps signals, logs, and recovery-safe actions visible so incident work does not wait for desktop.</text>
</svg>
