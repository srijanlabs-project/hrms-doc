<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Candidate Review</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Profile</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Resume</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Screening</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Interviews</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">BGV</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Communication</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Recruit</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Candidate Profile</text><rect x="296" y="152" width="122" height="28" rx="14" fill="#DCFCE7"/><text x="357.0" y="170" class="small" text-anchor="middle">Fit score 82</text><rect x="430" y="152" width="138" height="28" rx="14" fill="#FEF3C7"/><text x="499.0" y="170" class="small" text-anchor="middle">BGV pending</text><rect x="580" y="152" width="156" height="28" rx="14" fill="#FEE2E2"/><text x="658.0" y="170" class="small" text-anchor="middle">Sensitive notes</text><rect x="808" y="146" width="176" height="40" rx="14" fill="#2563EB"/><text x="896" y="172" class="inverse" text-anchor="middle">Review profile</text><rect x="996" y="146" width="162" height="40" rx="14" fill="#0F766E"/><text x="1077" y="172" class="inverse" text-anchor="middle">Draft message</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search resume section, note, interview summary, or candidate artifact</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="964" y="226" width="118" height="28" rx="14" fill="#EAF2F8"/><text x="1023.0" y="244" class="small" text-anchor="middle">Evidence</text><rect x="1092" y="226" width="48" height="28" rx="14" fill="#10324A"/><text x="1116.0" y="244" class="inverse" text-anchor="middle">Open</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Stage</text><text x="364" y="362" class="metric" text-anchor="start">Interview</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="586" y="332" class="small" text-anchor="start">Assessments</text><text x="586" y="362" class="metric" text-anchor="start">02</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Interviews</text><text x="808" y="362" class="metric" text-anchor="start">03</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="1030" y="332" class="small" text-anchor="start">Duplicates</text><text x="1030" y="362" class="metric" text-anchor="start">01</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Comms drafts</text><text x="1252" y="362" class="metric" text-anchor="start">04</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Candidate summary</text><text x="312" y="464" class="small" text-anchor="start">Core profile, source, and screening status stay visible before deeper evidence review</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Nisha Verma - Java Backend Engineer</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Notice period 30 days and location Pune</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Referral source with high prior conversion</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Questionnaire complete and assessment score above cut-off</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI evidence and communication assistance</text><text x="664" y="464" class="small" text-anchor="start">AI can summarize fit, interviews, and draft outreach but recruiters retain progression control</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI candidate summary</text><text x="684" y="522" class="body" text-anchor="start">Candidate fits requisition due to strong API experience, immediate project-domain overlap, and acceptable compensation expectation.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: confirm duplicate warning, review panel feedback summary, and send interview-confirmation draft.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review summary</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Open draft</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Risk and evidence panels</text><text x="312" y="754" class="small" text-anchor="start">Duplicate checks, BGV state, and sensitive notes must remain explicit and permission-aware</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">1 possible duplicate via phone and resume similarity</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">BGV vendor callback pending for previous employment</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Sensitive recruiter note masked for non-privileged viewers</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Offer range fit within approved band</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Interview and activity timeline</text><text x="664" y="754" class="small" text-anchor="start">Feedback summaries, schedule state, and communication artifacts stay in one profile flow</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Tech panel summary generated yesterday</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Manager interview scheduled for Friday 11:30</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Candidate asked relocation question via portal</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">4 recruiter message drafts awaiting review</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned profile lenses</text><text x="312" y="994" class="small" text-anchor="start">Recruiters can switch among fit, duplicate, BGV, interview, and communication evidence views</text><rect x="320" y="990" width="102" height="28" rx="14" fill="#DCFCE7"/><text x="371.0" y="1008" class="small" text-anchor="middle">Fit view</text><rect x="434" y="990" width="116" height="28" rx="14" fill="#DBEAFE"/><text x="492.0" y="1008" class="small" text-anchor="middle">Resume</text><rect x="562" y="990" width="104" height="28" rx="14" fill="#FEF3C7"/><text x="614.0" y="1008" class="small" text-anchor="middle">BGV</text><rect x="678" y="990" width="122" height="28" rx="14" fill="#FEE2E2"/><text x="739.0" y="1008" class="small" text-anchor="middle">Duplicate</text><rect x="812" y="990" width="118" height="28" rx="14" fill="#EDE9FE"/><text x="871.0" y="1008" class="small" text-anchor="middle">Interview</text><rect x="942" y="990" width="154" height="28" rx="14" fill="#F8FAFC"/><text x="1019.0" y="1008" class="small" text-anchor="middle">Communication</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Action plus outreach</text><text x="1224" y="224" class="annoText" text-anchor="start">The top strip balances candidate review with governed communication drafting.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Artifact search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search is tuned for resume, notes, summaries, and evidence rather than just candidate identity.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Profile state row</text><text x="1224" y="328" class="annoText" text-anchor="start">Stage, assessments, interviews, duplicates, and drafts stay visible above the fold.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Profile before activity</text><text x="1224" y="380" class="annoText" text-anchor="start">The left summary card grounds recruiters in objective candidate context first.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable AI assist</text><text x="1224" y="432" class="annoText" text-anchor="start">AI fit and communication support remains transparent and separate from final recruiter decisions.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Evidence continuity</text><text x="1224" y="484" class="annoText" text-anchor="start">Risk, timeline, summaries, and communication artifacts are kept in one review surface.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Permission-aware lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Profile views reflect how recruiters pivot between screening, BGV, and communication evidence.</text></svg>
