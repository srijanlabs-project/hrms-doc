<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Shared Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Profile</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Delegation</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Security</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Sessions</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Devices</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Preferences</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Delegate 1</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Profile and Delegation Switch</text><rect x="296" y="152" width="100" height="28" rx="14" fill="#DBEAFE"/><text x="346.0" y="170" class="small" text-anchor="middle">Role stack 2</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="408" y="152" width="82" height="28" rx="14" fill="#DCFCE7"/><text x="449.0" y="170" class="small" text-anchor="middle">MFA on</text><rect x="502" y="152" width="102" height="28" rx="14" fill="#FEF3C7"/><text x="553.0" y="170" class="small" text-anchor="middle">Support off</text><rect x="808" y="146" width="150" height="40" rx="14" fill="#2563EB"/><text x="883.0" y="172" class="inverse" text-anchor="middle">Switch role</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="970" y="146" width="176" height="40" rx="14" fill="#0F766E"/><text x="1058.0" y="172" class="inverse" text-anchor="middle">Create delegation</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search role, delegate, session, device, or privacy setting</text><rect x="856" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/><text x="911.0" y="244" class="small" text-anchor="middle">Delegations</text><rect x="976" y="226" width="96" height="28" rx="14" fill="#EAF2F8"/><text x="1024.0" y="244" class="small" text-anchor="middle">Sessions</text><rect x="1082" y="226" width="82" height="28" rx="14" fill="#10324A"/><text x="1123.0" y="244" class="inverse" text-anchor="middle">Devices</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Active roles</text><text x="364" y="362" class="metric" text-anchor="start">02</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Delegations</text><text x="586" y="362" class="metric" text-anchor="start">01</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Pending</text><text x="808" y="362" class="metric" text-anchor="start">01</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Sessions</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Devices</text><text x="1252" y="362" class="metric" text-anchor="start">02</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Identity and role summary</text><text x="312" y="464" class="small" text-anchor="start">Current actor, role stack, tenant context, and acted-for identity stay above the fold</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Employee plus Org Admin role stack active</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Tenant context visible in session header</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Acting-for identity state always explicit</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Profile and privacy posture shown together</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Security and access controls</text><text x="664" y="464" class="small" text-anchor="start">Delegation, MFA, and session safety remain explainable in one global profile surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Delegation trust cue</text><text x="684" y="522" class="body" text-anchor="start">Support-session state appears as an audited notice while role switch, delegation scope, and session controls remain self-service actions only.</text><text x="684" y="544" class="small" text-anchor="start">Next step: switch role, review delegation scope, or revoke a risky session without leaving the shared shell.</text><rect x="666" y="574" width="132" height="40" rx="14" fill="#2563EB"/><text x="732.0" y="600" class="inverse" text-anchor="middle">Open MFA</text><rect x="812" y="574" width="132" height="40" rx="14" fill="#EEF2FF"/><text x="878.0" y="600" class="body" text-anchor="middle">End session</text><rect x="958" y="574" width="144" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1030.0" y="600" class="body" text-anchor="middle">Access history</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Delegation coverage</text><text x="312" y="754" class="small" text-anchor="start">Time-bound delegations show scope, approver state, and non-delegable exclusions</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Leave approvals delegated till 19 Jul</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Payroll and legal actions excluded</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Dual attribution enabled for audit</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Pending approval visible on queued delegation</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Sessions and privacy activity</text><text x="664" y="754" class="small" text-anchor="start">Trusted devices, revoked sessions, and recent security events stay visible in one place</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Chrome on Windows active now</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Trusted iPhone expires in 14 days</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">One session revoked yesterday</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Privacy notice acknowledgment recorded</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned profile lenses</text><text x="312" y="994" class="small" text-anchor="start">Users can pin role, delegation, session, device, and audit-oriented views for repeat access</text><rect x="320" y="990" width="104" height="28" rx="14" fill="#DCFCE7"/><text x="372.0" y="1008" class="small" text-anchor="middle">My profile</text><rect x="436" y="990" width="100" height="28" rx="14" fill="#DBEAFE"/><text x="486.0" y="1008" class="small" text-anchor="middle">Acting as</text><rect x="548" y="990" width="108" height="28" rx="14" fill="#FEF3C7"/><text x="602.0" y="1008" class="small" text-anchor="middle">Delegations</text><rect x="668" y="990" width="94" height="28" rx="14" fill="#FEE2E2"/><text x="715.0" y="1008" class="small" text-anchor="middle">Sessions</text><rect x="774" y="990" width="86" height="28" rx="14" fill="#EDE9FE"/><text x="817.0" y="1008" class="small" text-anchor="middle">Devices</text><rect x="872" y="990" width="72" height="28" rx="14" fill="#F8FAFC"/><text x="908.0" y="1008" class="small" text-anchor="middle">Audit</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Shared but role-safe</text><text x="1224" y="224" class="annoText" text-anchor="start">The screen serves employee and Org Admin personas without leaking provider controls.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Active role stays visible</text><text x="1224" y="276" class="annoText" text-anchor="start">Delegation only works when acted-for identity is permanently obvious.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Security is self-service</text><text x="1224" y="328" class="annoText" text-anchor="start">This surface supports session and MFA management, not business processing.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Support state is distinct</text><text x="1224" y="380" class="annoText" text-anchor="start">Support-session presence must look like a notice, not a normal user mode.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Masking remains visible</text><text x="1224" y="432" class="annoText" text-anchor="start">Restricted settings should show guarded treatment instead of disappearing silently.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Trust signals stay close</text><text x="1224" y="484" class="annoText" text-anchor="start">Session and device evidence needs to sit beside delegation actions.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile stays practical</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens prioritize switching role, delegation state, and revoke-session actions.</text></svg>
