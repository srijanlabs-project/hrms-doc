iddle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Dense event grid</text><text x="1224" y="328" class="annoText" text-anchor="start">Analysts can scan many events before opening one in detail.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Masked diff logic</text><text x="1224" y="380" class="annoText" text-anchor="start">Selected-event detail keeps masking and value changes inseparable.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Chronology support</text><text x="1224" y="432" class="annoText" text-anchor="start">Entity timeline supports sequence reconstruction after the immediate event review.</text></svg>
