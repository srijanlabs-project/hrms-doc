<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Retention</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Legal Hold</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Archive</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Purge Jobs</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Evidence</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Governance</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Retention and Legal-Hold Control Center</text><rect x="296" y="152" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="342.0" y="170" class="small" text-anchor="middle">Holds 27</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="400" y="152" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="461.0" y="170" class="small" text-anchor="middle">Purge 18.4k</text><rect x="534" y="152" width="108" height="28" rx="14" fill="#FEE2E2"/><text x="588.0" y="170" class="small" text-anchor="middle">Blocked 42</text><rect x="808" y="146" width="162" height="40" rx="14" fill="#2563EB"/><text x="889.0" y="172" class="inverse" text-anchor="middle">Run simulation</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="982" y="146" width="168" height="40" rx="14" fill="#0F766E"/><text x="1066.0" y="172" class="inverse" text-anchor="middle">Apply legal hold</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search policy, jurisdiction, hold case, purge job, archived batch, or retention class</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Policies</text><rect x="964" y="226" width="78" height="28" rx="14" fill="#EAF2F8"/><text x="1003.0" y="244" class="small" text-anchor="middle">Jobs</text><rect x="1052" y="226" width="54" height="28" rx="14" fill="#10324A"/><text x="1079.0" y="244" class="inverse" text-anchor="middle">Hold</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Eligible</text><text x="364" y="362" class="metric" text-anchor="start">18.4k</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Holds</text><text x="586" y="362" class="metric" text-anchor="start">27</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Archive q</text><text x="808" y="362" class="metric" text-anchor="start">410</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Failed jobs</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Storage</text><text x="1252" y="362" class="metric" text-anchor="start">9.2TB</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Retention policy inventory and simulation</text><text x="312" y="464" class="small" text-anchor="start">Policy design and disposal impact are reviewed in one cockpit</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">EU personnel files follow anonymize-first rule</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">18.4k records are now purge eligible</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">410 records need archive before purge</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Country override warning raised for 2 cohorts</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Legal-hold workspace and evidence</text><text x="664" y="464" class="small" text-anchor="start">Hold management and proof-of-disposal stay visible beside eligibility math</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Hold block insight</text><text x="684" y="522" class="body" text-anchor="start">42 purge-eligible records remain blocked because a disciplinary case hold overlaps the payroll retention window in one legal entity.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect hold scope, run simulation, and release or retain only after legal review completes.</text><rect x="666" y="574" width="146" height="40" rx="14" fill="#2563EB"/><text x="739.0" y="600" class="inverse" text-anchor="middle">Open hold</text><rect x="826" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="888.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="964" y="574" width="148" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1038.0" y="600" class="body" text-anchor="middle">Run simulation</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Execution monitor</text><text x="312" y="754" class="small" text-anchor="start">Scheduled jobs, failures, and blocked records remain visible before any disposal run</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">3 failed retention jobs need retry</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">2 archive jobs await storage verification</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Blocked-by-hold records separated from technical failures</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Purge schedule paused for one jurisdiction</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Evidence and exception ledger</text><text x="664" y="754" class="small" text-anchor="start">Proof of disposal and anomaly notes remain first-class outputs</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Proof-of-disposal bundle ready for 6 completed jobs</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Anonymization evidence stored for 3 batches</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">1 policy exception awaits compliance sign-off</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Storage trend spike detected in archive tier</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned retention-governance lenses</text><text x="312" y="994" class="small" text-anchor="start">Governance teams can pin hold, purge, archive, jurisdiction, and evidence-oriented views</text><rect x="320" y="990" width="108" height="28" rx="14" fill="#DCFCE7"/><text x="374.0" y="1008" class="small" text-anchor="middle">Exited emp</text><rect x="440" y="990" width="118" height="28" rx="14" fill="#DBEAFE"/><text x="499.0" y="1008" class="small" text-anchor="middle">Payroll docs</text><rect x="570" y="990" width="78" height="28" rx="14" fill="#FEF3C7"/><text x="609.0" y="1008" class="small" text-anchor="middle">Hold</text><rect x="660" y="990" width="84" height="28" rx="14" fill="#FEE2E2"/><text x="702.0" y="1008" class="small" text-anchor="middle">Purge</text><rect x="756" y="990" width="102" height="28" rx="14" fill="#EDE9FE"/><text x="807.0" y="1008" class="small" text-anchor="middle">Evidence</text><rect x="870" y="990" width="62" height="28" rx="14" fill="#F8FAFC"/><text x="901.0" y="1008" class="small" text-anchor="middle">EU</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Hold outranks purge</text><text x="1224" y="224" class="annoText" text-anchor="start">Legal block conditions override housekeeping and are surfaced before throughput signals.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Simulation before execution</text><text x="1224" y="276" class="annoText" text-anchor="start">Impact preview gets prime space so admins inspect consequences before archive or purge.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Policy and jobs together</text><text x="1224" y="328" class="annoText" text-anchor="start">Rule design and scheduler behavior coexist because retention failures come from both.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Evidence is visible</text><text x="1224" y="380" class="annoText" text-anchor="start">Destruction and anonymization proof is kept on-screen because audit readiness is a first-class output.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Jurisdiction warnings nearby</text><text x="1224" y="432" class="annoText" text-anchor="start">Country overrides appear where record counts are reviewed so constraints are obvious early.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Blocked-by-hold is distinct</text><text x="1224" y="484" class="annoText" text-anchor="start">Legal blockers are visually separated from ordinary technical failures and retries.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile supervises safely</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support monitoring and hold actions while bulk execution stays desktop-governed.</text></svg>
