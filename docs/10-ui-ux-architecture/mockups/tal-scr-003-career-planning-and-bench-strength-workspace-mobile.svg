  <text x="62" y="1460" class="annoText">Future demand helps leaders judge whether current depth is enough.</text>
  <circle cx="40" cy="1488" r="12" fill="#2563EB"/>
  <text x="40" y="1492" class="inverse" text-anchor="middle">5</text>
  <text x="62" y="1490" class="annoTitle">Linked to succession</text>
  <text x="62" y="1508" class="annoText">Career paths should connect back to succession planning.</text>
