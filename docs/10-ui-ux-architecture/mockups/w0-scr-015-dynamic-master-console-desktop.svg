<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Masters</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Catalog</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Tree</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Imports</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Exports</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Reference Data</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Dynamic Master Console</text><rect x="296" y="152" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="342.0" y="170" class="small" text-anchor="middle">Sets 74</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="400" y="152" width="110" height="28" rx="14" fill="#FEF3C7"/><text x="455.0" y="170" class="small" text-anchor="middle">Pending 11</text><rect x="522" y="152" width="108" height="28" rx="14" fill="#FEE2E2"/><text x="576.0" y="170" class="small" text-anchor="middle">Blockers 3</text><rect x="808" y="146" width="164" height="40" rx="14" fill="#2563EB"/><text x="890.0" y="172" class="inverse" text-anchor="middle">Import values</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="984" y="146" width="162" height="40" rx="14" fill="#0F766E"/><text x="1065.0" y="172" class="inverse" text-anchor="middle">Publish changes</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search master set, code, hierarchy, replacement path, or import batch</text><rect x="856" y="226" width="78" height="28" rx="14" fill="#EAF2F8"/><text x="895.0" y="244" class="small" text-anchor="middle">Tree</text><rect x="944" y="226" width="88" height="28" rx="14" fill="#EAF2F8"/><text x="988.0" y="244" class="small" text-anchor="middle">Import</text><rect x="1042" y="226" width="72" height="28" rx="14" fill="#10324A"/><text x="1078.0" y="244" class="inverse" text-anchor="middle">Publish</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Sets</text><text x="364" y="362" class="metric" text-anchor="start">74</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Value changes</text><text x="586" y="362" class="metric" text-anchor="start">11</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Retire blocks</text><text x="808" y="362" class="metric" text-anchor="start">03</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Imports</text><text x="1030" y="362" class="metric" text-anchor="start">02</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Locales</text><text x="1252" y="362" class="metric" text-anchor="start">16</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Master catalog and value tree</text><text x="312" y="464" class="small" text-anchor="start">Flat tables and governed hierarchies coexist because reference data has both forms</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Location master uses 4-level hierarchy</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">11 pending label or code changes</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">3 values blocked from retirement due to active use</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">2 imports still validating locale labels</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Editor, replacement path, and export view</text><text x="664" y="464" class="small" text-anchor="start">Replacement safety and external consumption remain visible while maintaining values</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Retirement risk</text><text x="684" y="522" class="body" text-anchor="start">Retiring grade_band_G5 without replacement would break compensation forms, payroll rules, and two active workflow conditions.</text><text x="684" y="544" class="small" text-anchor="start">Next step: assign replacement path, preview export impact, and publish only when blockers resolve.</text><rect x="666" y="574" width="146" height="40" rx="14" fill="#2563EB"/><text x="739.0" y="600" class="inverse" text-anchor="middle">Review path</text><rect x="826" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="888.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="964" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1037.0" y="600" class="body" text-anchor="middle">Open export</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Usage and import lineage</text><text x="312" y="754" class="small" text-anchor="start">Imports, workflow consumers, and hierarchy usage remain near the selected value</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">4 forms use current location values</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">2 reports flatten this hierarchy</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Import batch 84 has 6 row conflicts</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Workflow conditions reference 3 selected codes</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Locale labels and quality cues</text><text x="664" y="754" class="small" text-anchor="start">Translation completeness and duplicate detection support governed reference data maintenance</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">1 locale label missing in Arabic</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Duplicate candidate pair detected in department list</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">External export preview changed for 2 values</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">AI anomaly review suggested on one import cluster</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned master-data lenses</text><text x="312" y="994" class="small" text-anchor="start">Admins can pin hierarchy, import, export, locale, and retirement-risk views for faster governance work</text><rect x="320" y="990" width="104" height="28" rx="14" fill="#DCFCE7"/><text x="372.0" y="1008" class="small" text-anchor="middle">Location</text><rect x="436" y="990" width="82" height="28" rx="14" fill="#DBEAFE"/><text x="477.0" y="1008" class="small" text-anchor="middle">Tree</text><rect x="530" y="990" width="92" height="28" rx="14" fill="#FEF3C7"/><text x="576.0" y="1008" class="small" text-anchor="middle">Import</text><rect x="634" y="990" width="96" height="28" rx="14" fill="#FEE2E2"/><text x="682.0" y="1008" class="small" text-anchor="middle">Retire</text><rect x="742" y="990" width="92" height="28" rx="14" fill="#EDE9FE"/><text x="788.0" y="1008" class="small" text-anchor="middle">Locale</text><rect x="846" y="990" width="96" height="28" rx="14" fill="#F8FAFC"/><text x="894.0" y="1008" class="small" text-anchor="middle">Export</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Table and tree together</text><text x="1224" y="224" class="annoText" text-anchor="start">Reference-data maintenance needs both flat and hierarchical views in one console.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Usage is central</text><text x="1224" y="276" class="annoText" text-anchor="start">Retiring or replacing values can break many modules, so downstream use stays visible.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Import stays nearby</text><text x="1224" y="328" class="annoText" text-anchor="start">High-volume maintenance is governed without forcing users into a separate workflow.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Replacement is explicit</text><text x="1224" y="380" class="annoText" text-anchor="start">In-use retirement needs a clear path, not just a delete warning.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Locale labels matter</text><text x="1224" y="432" class="annoText" text-anchor="start">Master-data translation gaps are surfaced before they leak into runtime forms.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Exports are operational</text><text x="1224" y="484" class="annoText" text-anchor="start">External systems often need flattened output, so export impact is shown in context.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">AI helps quality only</text><text x="1224" y="536" class="annoText" text-anchor="start">Anomaly detection can assist, but authoritative value changes remain human controlled.</text></svg>
