<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Backups</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Restore</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Catalog</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Verification</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Storage</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Ops</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Backup and Restore Operations Dashboard</text><rect x="296" y="152" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="342.0" y="170" class="small" text-anchor="middle">Failed 3</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="400" y="152" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="448.0" y="170" class="small" text-anchor="middle">Restore 2</text><rect x="508" y="152" width="82" height="28" rx="14" fill="#FEE2E2"/><text x="549.0" y="170" class="small" text-anchor="middle">RPO 1</text><rect x="808" y="146" width="168" height="40" rx="14" fill="#2563EB"/><text x="892.0" y="172" class="inverse" text-anchor="middle">Verify integrity</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="988" y="146" width="188" height="40" rx="14" fill="#0F766E"/><text x="1082.0" y="172" class="inverse" text-anchor="middle">Open restore planner</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search backup job, restore point, environment, tenant scope, or verification incident</text><rect x="856" y="226" width="90" height="28" rx="14" fill="#EAF2F8"/><text x="901.0" y="244" class="small" text-anchor="middle">Catalog</text><rect x="956" y="226" width="84" height="28" rx="14" fill="#EAF2F8"/><text x="998.0" y="244" class="small" text-anchor="middle">Verify</text><rect x="1050" y="226" width="72" height="28" rx="14" fill="#10324A"/><text x="1086.0" y="244" class="inverse" text-anchor="middle">Restore</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Last good</text><text x="364" y="362" class="metric" text-anchor="start">07:10</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Success</text><text x="586" y="362" class="metric" text-anchor="start">99.2%</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Verify fail</text><text x="808" y="362" class="metric" text-anchor="start">03</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">RPO</text><text x="1030" y="362" class="metric" text-anchor="start">01</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Immutable</text><text x="1252" y="362" class="metric" text-anchor="start">92%</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Backup coverage and job monitor</text><text x="312" y="464" class="small" text-anchor="start">Recoverability matters more than raw completion counts</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Last good backup captured at 07:10 UTC</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">3 jobs failed integrity verification</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Documents and DB both covered in current window</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Tenant segregation verified for 2 multi-tenant snapshots</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Restore-point catalog and planner</text><text x="664" y="464" class="small" text-anchor="start">Catalog search and approval-aware restore planning stay in one ops surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Restore insight</text><text x="684" y="522" class="body" text-anchor="start">The most recent payroll-close snapshot is recoverable, but the cross-region document artifact for that point still needs integrity confirmation before full restore approval.</text><text x="684" y="544" class="small" text-anchor="start">Next step: verify artifact chain, select recovery point, and proceed only after blast-radius approval clears.</text><rect x="666" y="574" width="146" height="40" rx="14" fill="#2563EB"/><text x="739.0" y="600" class="inverse" text-anchor="middle">Open catalog</text><rect x="826" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="888.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="964" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1037.0" y="600" class="body" text-anchor="middle">Plan restore</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Verification and anomaly panel</text><text x="312" y="754" class="small" text-anchor="start">Completion and trust are separated so operators can judge backup usability</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">3 checksum failures open</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">1 encryption warning under review</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Chain health degraded for one archive set</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">AI anomaly cue suggests unusual size delta</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Restore workflow and approval</text><text x="664" y="754" class="small" text-anchor="start">Requester, approver, and blast radius remain visible before recovery actions execute</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">2 restore requests currently open</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Approval required for payroll-close scope</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Test restore succeeded in sandbox yesterday</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Recovery checklist attached to selected point</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned resilience lenses</text><text x="312" y="994" class="small" text-anchor="start">Ops teams can pin payroll-close, cross-region, immutable, failed-verify, and tenant-restore views</text><rect x="320" y="990" width="122" height="28" rx="14" fill="#DCFCE7"/><text x="381.0" y="1008" class="small" text-anchor="middle">Payroll close</text><rect x="454" y="990" width="124" height="28" rx="14" fill="#DBEAFE"/><text x="516.0" y="1008" class="small" text-anchor="middle">Cross-region</text><rect x="590" y="990" width="108" height="28" rx="14" fill="#FEF3C7"/><text x="644.0" y="1008" class="small" text-anchor="middle">Immutable</text><rect x="710" y="990" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="766.0" y="1008" class="small" text-anchor="middle">Verify fail</text><rect x="834" y="990" width="88" height="28" rx="14" fill="#EDE9FE"/><text x="878.0" y="1008" class="small" text-anchor="middle">Tenant</text><rect x="934" y="990" width="94" height="28" rx="14" fill="#F8FAFC"/><text x="981.0" y="1008" class="small" text-anchor="middle">Restore</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Recovery beats counts</text><text x="1224" y="224" class="annoText" text-anchor="start">Last good backup and RPO matter more than raw job completion volume.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Backup and restore together</text><text x="1224" y="276" class="annoText" text-anchor="start">Operational confidence comes from linking captured backups to usable restore points.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Catalog is actionable</text><text x="1224" y="328" class="annoText" text-anchor="start">Finding the correct recovery point is treated as a primary operator task.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Verification is separate</text><text x="1224" y="380" class="annoText" text-anchor="start">A completed backup is not assumed to be trusted without integrity evidence.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Approval-aware restore</text><text x="1224" y="432" class="annoText" text-anchor="start">Restore planning includes requester, approver, and blast radius because restore can be risky.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Scope boundaries stay visible</text><text x="1224" y="484" class="annoText" text-anchor="start">Tenant and environment separation reduce wrong-scope recovery mistakes.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile supervises incidents</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support triage and safe actions while complex restore design remains desktop-led.</text></svg>
