  <text x="312" y="446" class="h3">Statutory filing and head-level visibility</text>
  <text x="312" y="464" class="small">Payroll and compliance teams need one dependable workbench for recurring filings.</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>
  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>Each compliance head remains visible with filing state and owner</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Validation blockers stand out before due dates slip</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>Evidence and working files stay attached to the filing context</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Multi-jurisdiction obligations remain easy to compare</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Governed operational follow-through</text>
  <text x="664" y="464" class="small">The workbench should support execution, review, and later audit defense.</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>
  <circle cx='666' cy='482' r='3' fill='#2563EB'/>
<text x='678' y='486' class='body'>Blockers and owner actions remain explicit</text>
<circle cx='666' cy='504' r='3' fill='#2563EB'/>
<text x='678' y='508' class='body'>Due dates stay close to compliance head context</text>
<circle cx='666' cy='526' r='3' fill='#2563EB'/>
<text x='678' y='530' class='body'>History supports future inspections and amendments</text>
<circle cx='666' cy='548' r='3' fill='#2563EB'/>
<text x='678' y='552' class='body'>The workspace helps teams avoid spreadsheet-driven tracking</text>

