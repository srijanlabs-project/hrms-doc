  <text x="1224" y="260" class="annoTitle">Deadline emphasis</text>
  <text x="1224" y="278" class="annoText">Deadlines need stronger emphasis than passive lists.</text>
  <circle cx="1202" cy="312" r="12" fill="#2563EB"/>
  <text x="1202" y="316" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="314" class="annoTitle">Blockers visible</text>
