<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="#F4F7FB"/>
  <rect width="390" height="92" fill="#10324A"/>
  <text x="20" y="36" class="inverse">Enterprise HRMS</text>
  <rect x="286" y="18" width="84" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="328" y="36" class="inverse" text-anchor="middle">Tenant</text>
  <text x="20" y="76" class="h2inv">Tenant Settings</text>

  <rect x="16" y="108" width="104" height="28" rx="14" fill="#DBEAFE"/>
  <text x="68" y="126" class="small" text-anchor="middle">Tenant keys</text>
  <circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="127" class="inverse" text-anchor="middle">1</text>
  <rect x="130" y="108" width="112" height="28" rx="14" fill="#DCFCE7"/>
  <text x="186" y="126" class="small" text-anchor="middle">Inherited 14</text>
  <rect x="252" y="108" width="102" height="28" rx="14" fill="#FEE2E2"/>
  <text x="303" y="126" class="small" text-anchor="middle">Risk 03</text>

  <rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="34" y="190" class="body">Search key, module, source, approver, or guardrail</text>
  <circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="173" class="inverse" text-anchor="middle">2</text>

  <rect x="16" y="228" width="358" height="166" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="252" class="h3">Catalog, defaults, and scope chips</text>
  <text x="32" y="270" class="small">Small-screen review still makes key ownership and inheritance visible.</text>
  <circle cx="34" cy="284" r="3" fill="#2563EB"/>
  <text x="46" y="288" class="body">attendance.cutoff.time inherits from platform and uses tenant timezone.</text>
  <circle cx="34" cy="304" r="3" fill="#2563EB"/>
  <text x="46" y="308" class="body">leave.probation.apply.enabled is a tenant-local override with maker-checker.</text>
  <circle cx="34" cy="324" r="3" fill="#2563EB"/>
  <text x="46" y="328" class="body">Scope chips reveal module, source, and effectivity window.</text>
  <circle cx="34" cy="344" r="3" fill="#2563EB"/>
  <text x="46" y="348" class="body">Platform-owned keys remain visibly read-only on the device.</text>
  <circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="249" class="inverse" text-anchor="middle">3</text>

  <rect x="16" y="410" width="358" height="180" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="434" class="h3">Change approval and high-risk guardrails</text>
  <text x="32" y="452" class="small">High-impact edits keep diff, approvers, and publish status together.</text>
  <circle cx="34" cy="464" r="3" fill="#2563EB"/>
  <text x="46" y="468" class="body">payroll.lock.before.disbursement proposes a shorter finance review window.</text>
  <circle cx="34" cy="484" r="3" fill="#2563EB"/>
  <text x="46" y="488" class="body">Risk tier controls whether Finance head and Org Admin must approve.</text>
  <circle cx="34" cy="504" r="3" fill="#2563EB"/>
  <text x="46" y="508" class="body">Effective date and rollback snapshot are stored with the change set.</text>
  <circle cx="34" cy="524" r="3" fill="#2563EB"/>
  <text x="46" y="528" class="body">Block publish stays available until all guardrails are cleared.</text>
  <rect x="30" y="542" width="118" height="40" rx="14" fill="#2563EB"/>
  <text x="89" y="568" class="inverse" text-anchor="middle">View diff</text>
  <rect x="162" y="542" width="194" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="259" y="568" class="body" text-anchor="middle">Request approvals</text>
  <circle cx="30" cy="426" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="431" class="inverse" text-anchor="middle">4</text>

  <rect x="16" y="606" width="358" height="130" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="630" class="h3">Rollback and audit posture</text>
  <text x="32" y="648" class="small">Admins can still review blast radius and read-only boundaries on mobile.</text>
  <circle cx="34" cy="660" r="3" fill="#2563EB"/>
  <text x="46" y="664" class="body">Preview shows screens, APIs, and jobs that consume the changed key.</text>
  <circle cx="34" cy="680" r="3" fill="#2563EB"/>
  <text x="46" y="684" class="body">Rollback captures previous value, approver chain, and effectivity window.</text>
  <circle cx="34" cy="700" r="3" fill="#2563EB"/>
  <text x="46" y="704" class="body">Platform-owned settings stay read-only even when locally searchable.</text>
  <circle cx="30" cy="622" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="30" y="627" class="inverse" text-anchor="middle">5</text>

  <rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="34" y="780" class="h2">Mobile notes</text>
  <circle cx="40" cy="804" r="12" fill="#2563EB"/>
  <text x="40" y="808" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="806" class="annoTitle">Settings remain governed</text>
  <text x="62" y="824" class="annoText">Mobile preserves scoped review, approval routing, and rollback awareness while denser configuration work stays desktop-led.</text>
</svg>
