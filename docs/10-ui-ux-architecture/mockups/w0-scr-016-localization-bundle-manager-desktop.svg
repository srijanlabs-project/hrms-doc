<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Localization</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Bundles</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Compare</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Preview</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Publish</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">PROD</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Localization Bundle Manager</text><rect x="296" y="152" width="102" height="28" rx="14" fill="#DBEAFE"/><text x="347.0" y="170" class="small" text-anchor="middle">Drafts 12</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="410" y="152" width="102" height="28" rx="14" fill="#FEF3C7"/><text x="461.0" y="170" class="small" text-anchor="middle">Missing 48</text><rect x="524" y="152" width="88" height="28" rx="14" fill="#FEE2E2"/><text x="568.0" y="170" class="small" text-anchor="middle">Queue 3</text><rect x="808" y="146" width="164" height="40" rx="14" fill="#2563EB"/><text x="890.0" y="172" class="inverse" text-anchor="middle">Review bundle</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="984" y="146" width="138" height="40" rx="14" fill="#0F766E"/><text x="1053.0" y="172" class="inverse" text-anchor="middle">Publish</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search locale, namespace, string key, bundle diff, or publish blocker</text><rect x="856" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="902.0" y="244" class="small" text-anchor="middle">Strings</text><rect x="958" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="1007.0" y="244" class="small" text-anchor="middle">Preview</text><rect x="1066" y="226" width="86" height="28" rx="14" fill="#10324A"/><text x="1109.0" y="244" class="inverse" text-anchor="middle">Compare</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Locales</text><text x="364" y="362" class="metric" text-anchor="start">18</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Complete</text><text x="586" y="362" class="metric" text-anchor="start">94.6%</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Fallback 24h</text><text x="808" y="362" class="metric" text-anchor="start">312</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Blocked</text><text x="1030" y="362" class="metric" text-anchor="start">02</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Queue</text><text x="1252" y="362" class="metric" text-anchor="start">03</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Locale catalog and translation grid</text><text x="312" y="464" class="small" text-anchor="start">Controlled editing remains the core surface of this admin console</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">12 draft bundles still open</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">48 strings missing in mandatory locales</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Namespace filters active across payroll and documents</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">1 bundle diff awaiting final reviewer</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Preview, compare, and fallback trace</text><text x="664" y="464" class="small" text-anchor="start">Surface-specific preview and fallback diagnostics stay adjacent to edited content</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Preview insight</text><text x="684" y="522" class="body" text-anchor="start">A missing notification string in de-DE is falling back to en-IN for document delivery while the web bundle remains complete.</text><text x="684" y="544" class="small" text-anchor="start">Next step: compare locale, preview notification output, and publish only after unsafe-markup checks clear.</text><rect x="666" y="574" width="154" height="40" rx="14" fill="#2563EB"/><text x="743.0" y="600" class="inverse" text-anchor="middle">Compare locale</text><rect x="834" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="896.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="148" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1046.0" y="600" class="body" text-anchor="middle">Open readiness</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Publish readiness</text><text x="312" y="754" class="small" text-anchor="start">Mandatory-locale coverage, unsafe markup, and cache notes remain visible before release</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">2 blocked publishes due to missing mandatory strings</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Unsafe markup flagged in one email token</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Cache invalidation notice attached to payroll module</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">4 modules impacted by the selected namespace</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Terminology and incidents</text><text x="664" y="754" class="small" text-anchor="start">Quality suggestions and live incidents remain available without overwhelming the edit surface</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Recent missing-resource incidents linked to two bundles</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">3 terminology inconsistencies detected</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Reviewer comments pending on 1 locale</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">AI translation suggestions queued for 6 strings</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned bundle-management lenses</text><text x="312" y="994" class="small" text-anchor="start">Localization owners can pin locale, namespace, surface, quality, and publish-focused views</text><rect x="320" y="990" width="96" height="28" rx="14" fill="#DCFCE7"/><text x="368.0" y="1008" class="small" text-anchor="middle">de-DE</text><rect x="428" y="990" width="116" height="28" rx="14" fill="#DBEAFE"/><text x="486.0" y="1008" class="small" text-anchor="middle">Documents</text><rect x="556" y="990" width="104" height="28" rx="14" fill="#FEF3C7"/><text x="608.0" y="1008" class="small" text-anchor="middle">Missing</text><rect x="672" y="990" width="114" height="28" rx="14" fill="#FEE2E2"/><text x="729.0" y="1008" class="small" text-anchor="middle">Fallback</text><rect x="798" y="990" width="102" height="28" rx="14" fill="#EDE9FE"/><text x="849.0" y="1008" class="small" text-anchor="middle">Preview</text><rect x="912" y="990" width="100" height="28" rx="14" fill="#F8FAFC"/><text x="962.0" y="1008" class="small" text-anchor="middle">Publish</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Editing leads</text><text x="1224" y="224" class="annoText" text-anchor="start">The translation grid stays primary because this console is about governed content maintenance.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Readiness over polish</text><text x="1224" y="276" class="annoText" text-anchor="start">Publish blockers outrank terminology improvements so release risk is obvious.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Multi-surface preview</text><text x="1224" y="328" class="annoText" text-anchor="start">Web, mobile, email, and document variants are shown separately to catch contextual defects.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Fallback must be visible</text><text x="1224" y="380" class="annoText" text-anchor="start">Fallback behavior is explicit rather than silent so admins can reason about runtime outcomes.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Missing counts are operational</text><text x="1224" y="432" class="annoText" text-anchor="start">Missing-resource counts are hero-level because they are the clearest runtime risk signal.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">AI is subordinate</text><text x="1224" y="484" class="annoText" text-anchor="start">AI translation help stays advisory-only to preserve publisher accountability.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile trims comparison</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support review and quick correction, not dense side-by-side bundle management.</text></svg>
