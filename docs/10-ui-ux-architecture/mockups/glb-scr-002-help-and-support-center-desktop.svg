<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Shared Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Help</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Search</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Cases</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Live Support</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Knowledge</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Status</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Support</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Help and Support Center</text><rect x="296" y="152" width="82" height="28" rx="14" fill="#DBEAFE"/><text x="337.0" y="170" class="small" text-anchor="middle">Cases 3</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="390" y="152" width="86" height="28" rx="14" fill="#FEF3C7"/><text x="433.0" y="170" class="small" text-anchor="middle">Live on</text><rect x="488" y="152" width="84" height="28" rx="14" fill="#FEE2E2"/><text x="530.0" y="170" class="small" text-anchor="middle">KB top</text><rect x="808" y="146" width="176" height="40" rx="14" fill="#2563EB"/><text x="896.0" y="172" class="inverse" text-anchor="middle">Open live support</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="996" y="146" width="144" height="40" rx="14" fill="#0F766E"/><text x="1068.0" y="172" class="inverse" text-anchor="middle">Create case</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search article, process, payroll question, leave help, case, or live-support topic</text><rect x="856" y="226" width="102" height="28" rx="14" fill="#EAF2F8"/><text x="907.0" y="244" class="small" text-anchor="middle">Knowledge</text><rect x="968" y="226" width="78" height="28" rx="14" fill="#EAF2F8"/><text x="1007.0" y="244" class="small" text-anchor="middle">Cases</text><rect x="1056" y="226" width="50" height="28" rx="14" fill="#10324A"/><text x="1081.0" y="244" class="inverse" text-anchor="middle">Help</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Articles</text><text x="364" y="362" class="metric" text-anchor="start">1240</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Open cases</text><text x="586" y="362" class="metric" text-anchor="start">03</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Avg reply</text><text x="808" y="362" class="metric" text-anchor="start">2.1h</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Live agents</text><text x="1030" y="362" class="metric" text-anchor="start">07</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">CSAT</text><text x="1252" y="362" class="metric" text-anchor="start">4.6</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Knowledge search and top topics</text><text x="312" y="464" class="small" text-anchor="start">Self-service help and case creation coexist in one support hub</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Payroll, leave, and onboarding are top search topics</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Search-no-result state can route to case creation</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Status cards show service availability</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Contextual article suggestions update by persona</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Case and live-support workspace</text><text x="664" y="464" class="small" text-anchor="start">Live support and case status remain available without losing knowledge context</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Support insight</text><text x="684" y="522" class="body" text-anchor="start">The user asked about payslip anomalies; relevant knowledge exists, but live support is recommended because the issue also matches an open payroll case with updated agent notes.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open the case thread, review linked article, or escalate to live support based on issue sensitivity.</text><rect x="666" y="574" width="136" height="40" rx="14" fill="#2563EB"/><text x="734.0" y="600" class="inverse" text-anchor="middle">Open case</text><rect x="816" y="574" width="112" height="40" rx="14" fill="#EEF2FF"/><text x="872.0" y="600" class="body" text-anchor="middle">Ask bot</text><rect x="942" y="574" width="136" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1010.0" y="600" class="body" text-anchor="middle">Live support</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Case history and status</text><text x="312" y="754" class="small" text-anchor="start">Users can see what is already open before creating duplicate requests</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">3 open support cases across HR and payroll</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">One case awaiting user attachment</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Latest support note added 40 minutes ago</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Escalation path visible on delayed cases</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">AI and support routing</text><text x="664" y="754" class="small" text-anchor="start">AI help stays assistive while human escalation remains clear for complex issues</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">AI can summarize articles and steps</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Sensitive payroll issues route to humans</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Live support online now in IST hours</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Case-created confirmation returns to this hub</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned support lenses</text><text x="312" y="994" class="small" text-anchor="start">Employees and managers can pin topic, case, live-support, article, and escalation-focused help views</text><rect x="320" y="990" width="90" height="28" rx="14" fill="#DCFCE7"/><text x="365.0" y="1008" class="small" text-anchor="middle">Payroll</text><rect x="422" y="990" width="78" height="28" rx="14" fill="#DBEAFE"/><text x="461.0" y="1008" class="small" text-anchor="middle">Leave</text><rect x="512" y="990" width="66" height="28" rx="14" fill="#FEF3C7"/><text x="545.0" y="1008" class="small" text-anchor="middle">Live</text><rect x="590" y="990" width="80" height="28" rx="14" fill="#FEE2E2"/><text x="630.0" y="1008" class="small" text-anchor="middle">Cases</text><rect x="682" y="990" width="54" height="28" rx="14" fill="#EDE9FE"/><text x="709.0" y="1008" class="small" text-anchor="middle">AI</text><rect x="748" y="990" width="96" height="28" rx="14" fill="#F8FAFC"/><text x="796.0" y="1008" class="small" text-anchor="middle">Escalate</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Self-service and human support together</text><text x="1224" y="224" class="annoText" text-anchor="start">The hub starts with knowledge but never hides the case or live-support paths.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Search failure still helps</text><text x="1224" y="276" class="annoText" text-anchor="start">No-result states convert into guided case creation instead of dead ends.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Case context is preserved</text><text x="1224" y="328" class="annoText" text-anchor="start">Users can see existing case history before opening duplicates.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">AI stays assistive</text><text x="1224" y="380" class="annoText" text-anchor="start">AI can summarize and route, but sensitive issues still escalate clearly to humans.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Status is part of trust</text><text x="1224" y="432" class="annoText" text-anchor="start">Service availability and reply expectations help users choose between self-service and escalation.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Shared global screen</text><text x="1224" y="484" class="annoText" text-anchor="start">The hub connects multiple modules while remaining safe for user-specific context.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile remains full</text><text x="1224" y="536" class="annoText" text-anchor="start">Support requests often happen away from desk, so mobile keeps search, case, and live-support flows.</text></svg>
