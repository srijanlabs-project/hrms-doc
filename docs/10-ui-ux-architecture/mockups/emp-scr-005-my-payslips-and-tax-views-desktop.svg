<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">My Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Pay and Tax</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Payslips</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Tax Declarations</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Year-End Docs</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Pay</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">My Pay and Tax</text><rect x="296" y="152" width="94" height="28" rx="14" fill="#DCFCE7"/><text x="343.0" y="170" class="small" text-anchor="middle">Payslip live</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="402" y="152" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="458.0" y="170" class="small" text-anchor="middle">FY window open</text><rect x="526" y="152" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="574.0" y="170" class="small" text-anchor="middle">Masked IDs</text><rect x="808" y="146" width="178" height="40" rx="14" fill="#2563EB"/><text x="897.0" y="172" class="inverse" text-anchor="middle">View latest payslip</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="998" y="146" width="190" height="40" rx="14" fill="#0F766E"/><text x="1093.0" y="172" class="inverse" text-anchor="middle">Start tax declaration</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search payslip month, deduction, tax proof, reimbursement, or payroll help topic</text><rect x="856" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="902.0" y="244" class="small" text-anchor="middle">Payslips</text><rect x="958" y="226" width="56" height="28" rx="14" fill="#EAF2F8"/><text x="986.0" y="244" class="small" text-anchor="middle">Tax</text><rect x="1024" y="226" width="98" height="28" rx="14" fill="#10324A"/><text x="1073.0" y="244" class="inverse" text-anchor="middle">Secure view</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Payslips</text><text x="364" y="362" class="metric" text-anchor="start">12</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">YTD earn</text><text x="586" y="362" class="metric" text-anchor="start">524k</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">YTD deduct</text><text x="808" y="362" class="metric" text-anchor="start">91k</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Proofs</text><text x="1030" y="362" class="metric" text-anchor="start">02</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Claims</text><text x="1252" y="362" class="metric" text-anchor="start">01</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Payslip timeline and earnings snapshot</text><text x="312" y="464" class="small" text-anchor="start">Month-wise payroll outputs stay easy to compare without exposing payroll-admin controls</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Last 12 published periods listed</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Current month stays pinned first</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Off-cycle or arrears tags shown inline</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">PDF and print-safe actions attach to the active period</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Sensitive tax view and secure actions</text><text x="664" y="464" class="small" text-anchor="start">Tax declarations, masked identifiers, and payroll support stay together in a governed panel</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Secure reveal control</text><text x="684" y="522" class="body" text-anchor="start">Bank references, tax identifiers, and year-end personal tax documents require step-up verification and full audit logging before reveal.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open the latest payslip, start a declaration, or route a correction into payroll support.</text><rect x="666" y="574" width="126" height="40" rx="14" fill="#2563EB"/><text x="729.0" y="600" class="inverse" text-anchor="middle">Open PDF</text><rect x="806" y="574" width="146" height="40" rx="14" fill="#EEF2FF"/><text x="879.0" y="600" class="body" text-anchor="middle">Reveal masked</text><rect x="966" y="574" width="122" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1027.0" y="600" class="body" text-anchor="middle">Ask policy</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Tax declaration and proof tracker</text><text x="312" y="754" class="small" text-anchor="start">Declaration progress is deadline-aware and stays readable by category</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Draft, submitted, verified, and returned items grouped</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Reviewer feedback visible without leaving the page</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Cutoff date tied to payroll lock behavior</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Current estimate compared with prior-year carry-forward</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Reimbursements, bank profile, and year-end docs</text><text x="664" y="754" class="small" text-anchor="start">Financial-service outcomes remain self-only and traceable</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Reimbursement status shown end to end</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Primary bank reference stays masked</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Year-end tax documents listed with history</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Pending verification warns of next payroll impact</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned pay lenses</text><text x="312" y="994" class="small" text-anchor="start">Employees can pin current-period, tax-proof, and year-end views for regular use</text><rect x="320" y="990" width="110" height="28" rx="14" fill="#DCFCE7"/><text x="375.0" y="1008" class="small" text-anchor="middle">Current period</text><rect x="442" y="990" width="58" height="28" rx="14" fill="#DBEAFE"/><text x="471.0" y="1008" class="small" text-anchor="middle">YTD</text><rect x="512" y="990" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="560.0" y="1008" class="small" text-anchor="middle">Tax proofs</text><rect x="620" y="990" width="70" height="28" rx="14" fill="#FEE2E2"/><text x="655.0" y="1008" class="small" text-anchor="middle">Claims</text><rect x="702" y="990" width="86" height="28" rx="14" fill="#EDE9FE"/><text x="745.0" y="1008" class="small" text-anchor="middle">Year-end</text><rect x="800" y="990" width="80" height="28" rx="14" fill="#F8FAFC"/><text x="840.0" y="1008" class="small" text-anchor="middle">Masked</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Self-only finance view</text><text x="1224" y="224" class="annoText" text-anchor="start">This page is for finalized outputs, not payroll administration.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Publication state is explicit</text><text x="1224" y="276" class="annoText" text-anchor="start">Users should know whether a payslip is unpublished, held, or ready.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Sensitive IDs stay masked</text><text x="1224" y="328" class="annoText" text-anchor="start">Reveal actions need clear step-up behavior and audit expectation.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Tax windows matter</text><text x="1224" y="380" class="annoText" text-anchor="start">Declaration cutoffs should be visible before users assume they can still edit.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Reimbursements are outcomes</text><text x="1224" y="432" class="annoText" text-anchor="start">Employees can track payment state without entering back-office bank release flows.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Year-end docs deserve space</text><text x="1224" y="484" class="annoText" text-anchor="start">Seasonal tax traffic makes annual forms a first-class workflow, not a buried download.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Help is nearby</text><text x="1224" y="536" class="annoText" text-anchor="start">Pay anomalies should route into support rather than invite manual workaround.</text></svg>
