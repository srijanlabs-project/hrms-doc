<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Templates</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Documents</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Localization</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Jobs</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Draft</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Document Template Builder</text><rect x="296" y="152" width="108" height="28" rx="14" fill="#DBEAFE"/><text x="350.0" y="170" class="small" text-anchor="middle">Draft v4</text><rect x="416" y="152" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="472.0" y="170" class="small" text-anchor="middle">Jobs failed 3</text><rect x="944" y="146" width="94" height="40" rx="14" fill="#2563EB"/><text x="991" y="172" class="inverse" text-anchor="middle">Preview</text><rect x="1050" y="146" width="108" height="40" rx="14" fill="#0F766E"/><text x="1104" y="172" class="inverse" text-anchor="middle">Publish</text><circle cx="956" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="956" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="220" height="650" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="230" class="h3" text-anchor="start">Template library</text><text x="312" y="248" class="small" text-anchor="start">Find, filter, and select governed templates</text><rect x="314" y="248" width="184" height="34" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="328" y="270" class="small" text-anchor="start">Search template</text><circle cx="314" cy="318" r="3" fill="#2563EB"/><text x="326" y="322" class="body" text-anchor="start">Offer letter</text><circle cx="314" cy="338" r="3" fill="#2563EB"/><text x="326" y="342" class="body" text-anchor="start">Appointment letter</text><circle cx="314" cy="358" r="3" fill="#2563EB"/><text x="326" y="362" class="body" text-anchor="start">Payslip</text><circle cx="314" cy="378" r="3" fill="#2563EB"/><text x="326" y="382" class="body" text-anchor="start">Warning notice</text><circle cx="314" cy="398" r="3" fill="#2563EB"/><text x="326" y="402" class="body" text-anchor="start">Policy acknowledgment</text><circle cx="316" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="316" y="225" class="inverse" text-anchor="middle">2</text><rect x="536" y="206" width="420" height="650" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="552" y="230" class="h3" text-anchor="start">Builder canvas and merge preview</text><text x="552" y="248" class="small" text-anchor="start">Edit content, inspect placeholders, and preview output</text><rect x="554" y="248" width="384" height="320" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="572" y="278" class="small" text-anchor="start">Canvas</text><circle cx="572" cy="322" r="3" fill="#2563EB"/><text x="584" y="326" class="body" text-anchor="start">Header and branding block</text><circle cx="572" cy="342" r="3" fill="#2563EB"/><text x="584" y="346" class="body" text-anchor="start">Recipient details</text><circle cx="572" cy="362" r="3" fill="#2563EB"/><text x="584" y="366" class="body" text-anchor="start">Compensation section</text><circle cx="572" cy="382" r="3" fill="#2563EB"/><text x="584" y="386" class="body" text-anchor="start">Terms and signature block</text><rect x="554" y="588" width="384" height="120" rx="12" fill="#FFF7ED" stroke="#D9E2EC" stroke-width="1"/><text x="572" y="616" class="h3" text-anchor="start">Unresolved placeholders</text><circle cx="572" cy="648" r="3" fill="#2563EB"/><text x="584" y="652" class="body" text-anchor="start">{joining_date} missing</text><circle cx="572" cy="668" r="3" fill="#2563EB"/><text x="584" y="672" class="body" text-anchor="start">{comp_band} missing</text><circle cx="554" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="554" y="225" class="inverse" text-anchor="middle">3</text><rect x="976" y="206" width="182" height="650" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="992" y="230" class="h3" text-anchor="start">Generation monitor</text><text x="992" y="248" class="small" text-anchor="start">Track render jobs, failures, and retries</text><rect x="988" y="246" width="158" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1000" y="258" width="44" height="44" rx="12" fill="#15803D"/><text x="1056" y="276" class="small" text-anchor="start">Success</text><text x="1056" y="306" class="metric" text-anchor="start">94%</text><rect x="988" y="348" width="158" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1000" y="360" width="44" height="44" rx="12" fill="#B42318"/><text x="1056" y="378" class="small" text-anchor="start">Failures</text><text x="1056" y="408" class="metric" text-anchor="start">03</text><circle cx="994" cy="474" r="3" fill="#2563EB"/><text x="1006" y="478" class="body" text-anchor="start">Offer letter render failed</text><circle cx="994" cy="494" r="3" fill="#2563EB"/><text x="1006" y="498" class="body" text-anchor="start">Payslip merge timeout</text><circle cx="994" cy="514" r="3" fill="#2563EB"/><text x="1006" y="518" class="body" text-anchor="start">Retry queued</text><circle cx="990" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="990" y="225" class="inverse" text-anchor="middle">4</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Preview and publish</text><text x="1224" y="224" class="annoText" text-anchor="start">Both actions remain near the page title but draft state is still explicit.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Library selection</text><text x="1224" y="276" class="annoText" text-anchor="start">Template discovery stays separate from editing to protect version governance.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Canvas with warnings</text><text x="1224" y="328" class="annoText" text-anchor="start">Builder and unresolved placeholder alerts stay in the same visual flow.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Job monitor</text><text x="1224" y="380" class="annoText" text-anchor="start">Render-job failures remain adjacent to the template so issue resolution is faster.</text></svg>
