<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Team Command Center</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Dashboard</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Attendance</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Performance</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Hiring</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Queue</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Manager Approvals</text><rect x="296" y="152" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="352.0" y="170" class="small" text-anchor="middle">Action required</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="420" y="152" width="112" height="28" rx="14" fill="#DBEAFE"/><text x="476.0" y="170" class="small" text-anchor="middle">Cross-module</text><rect x="544" y="152" width="130" height="28" rx="14" fill="#FEF3C7"/><text x="609.0" y="170" class="small" text-anchor="middle">Delegation-enabled</text><rect x="808" y="146" width="190" height="40" rx="14" fill="#2563EB"/><text x="903.0" y="172" class="inverse" text-anchor="middle">Open highest priority</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="1010" y="146" width="172" height="40" rx="14" fill="#0F766E"/><text x="1096.0" y="172" class="inverse" text-anchor="middle">Bulk approve safe</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search request, employee, module, reason, or workflow ID</text><rect x="856" y="226" width="62" height="28" rx="14" fill="#EAF2F8"/><text x="887.0" y="244" class="small" text-anchor="middle">Leave</text><rect x="928" y="226" width="76" height="28" rx="14" fill="#EAF2F8"/><text x="966.0" y="244" class="small" text-anchor="middle">Expense</text><rect x="1014" y="226" width="92" height="28" rx="14" fill="#10324A"/><text x="1060.0" y="244" class="inverse" text-anchor="middle">SLA breach</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Pending</text><text x="364" y="362" class="metric" text-anchor="start">18</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Due today</text><text x="586" y="362" class="metric" text-anchor="start">06</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Overdue</text><text x="808" y="362" class="metric" text-anchor="start">04</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Delegated</text><text x="1030" y="362" class="metric" text-anchor="start">02</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Returned</text><text x="1252" y="362" class="metric" text-anchor="start">03</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Approval inbox and triage</text><text x="312" y="464" class="small" text-anchor="start">Managers need urgency, SLA, and module context before detail review</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Overdue first sort is default</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Rows show employee, module, type, and aging</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Bulk select appears only for safe approval types</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Returned items stay visible with latest correction note</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Selected approval detail</text><text x="664" y="464" class="small" text-anchor="start">Decision context, comments, and action controls stay in one pane</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Decision guardrail</text><text x="684" y="522" class="body" text-anchor="start">The detail panel shows policy summary, employee impact, attachments, and prior comments while return and reject require rationale.</text><text x="684" y="544" class="small" text-anchor="start">Next step: approve, return for correction, delegate with expiry, or open source workflow if deeper evidence is needed.</text><rect x="666" y="574" width="108" height="40" rx="14" fill="#2563EB"/><text x="720.0" y="600" class="inverse" text-anchor="middle">Approve</text><rect x="788" y="574" width="108" height="40" rx="14" fill="#EEF2FF"/><text x="842.0" y="600" class="body" text-anchor="middle">Return</text><rect x="910" y="574" width="122" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="971.0" y="600" class="body" text-anchor="middle">Delegate</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Policy and impact checks</text><text x="312" y="754" class="small" text-anchor="start">Approvals should be explainable, not blind, so cutoff rules and team impact stay visible</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Leave shows coverage and blackout warnings</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Expense shows amount and policy variance</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Attendance corrections show punch source</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Travel shows trip dates and policy class</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Delegation, history, and audit cues</text><text x="664" y="754" class="small" text-anchor="start">Managers need to understand who touched a task and whether escalation risk is growing</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">2 items delegated during absence</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">1 item breached reminder threshold</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">History shows actor, timestamp, and channel</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Audit chronology available without leaving queue</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned approval lenses</text><text x="312" y="994" class="small" text-anchor="start">Managers can pin overdue, module, and delegation views for repeat approval sweeps</text><rect x="320" y="990" width="58" height="28" rx="14" fill="#DCFCE7"/><text x="349.0" y="1008" class="small" text-anchor="middle">Today</text><rect x="390" y="990" width="80" height="28" rx="14" fill="#DBEAFE"/><text x="430.0" y="1008" class="small" text-anchor="middle">SLA risk</text><rect x="482" y="990" width="60" height="28" rx="14" fill="#FEF3C7"/><text x="512.0" y="1008" class="small" text-anchor="middle">Leave</text><rect x="554" y="990" width="72" height="28" rx="14" fill="#FEE2E2"/><text x="590.0" y="1008" class="small" text-anchor="middle">Expense</text><rect x="638" y="990" width="66" height="28" rx="14" fill="#EDE9FE"/><text x="671.0" y="1008" class="small" text-anchor="middle">Travel</text><rect x="716" y="990" width="86" height="28" rx="14" fill="#F8FAFC"/><text x="759.0" y="1008" class="small" text-anchor="middle">Delegated</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Queue before detail</text><text x="1224" y="224" class="annoText" text-anchor="start">Approval work is deadline-driven, so the queue must dominate initial hierarchy.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Cross-module consistency</text><text x="1224" y="276" class="annoText" text-anchor="start">Different approval types should still feel unified.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Safe bulk actions</text><text x="1224" y="328" class="annoText" text-anchor="start">Bulk approval belongs only to low-risk items.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Rationale is explicit</text><text x="1224" y="380" class="annoText" text-anchor="start">Return and reject paths need visible comment requirements.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Delegation stays clear</text><text x="1224" y="432" class="annoText" text-anchor="start">Delegated ownership and expiry must be obvious.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">SLA-led prioritization</text><text x="1224" y="484" class="annoText" text-anchor="start">Aging signals matter more than passive summary widgets.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Traceable decisions</text><text x="1224" y="536" class="annoText" text-anchor="start">Every action should preserve a clean audit trail.</text></svg>
