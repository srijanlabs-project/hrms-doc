<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">People Operations Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Workbench</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Lifecycle</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Onboarding</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Documents</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Exceptions</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">HR Ops</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Lifecycle Change Workbench</text><rect x="296" y="152" width="102" height="28" rx="14" fill="#DBEAFE"/><text x="347.0" y="170" class="small" text-anchor="middle">Effective soon</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="410" y="152" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="458.0" y="170" class="small" text-anchor="middle">Approval 11</text><rect x="518" y="152" width="84" height="28" rx="14" fill="#FEE2E2"/><text x="560.0" y="170" class="small" text-anchor="middle">Blocked 4</text><rect x="808" y="146" width="188" height="40" rx="14" fill="#2563EB"/><text x="902.0" y="172" class="inverse" text-anchor="middle">Create lifecycle case</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="1008" y="146" width="214" height="40" rx="14" fill="#0F766E"/><text x="1115.0" y="172" class="inverse" text-anchor="middle">Run pre-effective checks</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, lifecycle case, effective date, approver, or blocker</text><rect x="856" y="226" width="82" height="28" rx="14" fill="#EAF2F8"/><text x="897.0" y="244" class="small" text-anchor="middle">This week</text><rect x="948" y="226" width="84" height="28" rx="14" fill="#EAF2F8"/><text x="990.0" y="244" class="small" text-anchor="middle">Promotion</text><rect x="1042" y="226" width="108" height="28" rx="14" fill="#10324A"/><text x="1096.0" y="244" class="inverse" text-anchor="middle">Payroll impact</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Cases</text><text x="364" y="362" class="metric" text-anchor="start">32</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Pending</text><text x="586" y="362" class="metric" text-anchor="start">11</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Week</text><text x="808" y="362" class="metric" text-anchor="start">08</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Blocked</text><text x="1030" y="362" class="metric" text-anchor="start">04</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Payroll ok</text><text x="1252" y="362" class="metric" text-anchor="start">19</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Lifecycle case queue</text><text x="312" y="464" class="small" text-anchor="start">Queue unifies confirmation, promotion, transfer, and salary-linked cases</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">3 probation confirmations due in 7 days</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">4 movement cases await approver action</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">2 salary revisions approved but unpublished</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">1 intercompany transfer lacks destination prerequisites</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Selected case impact and route</text><text x="664" y="464" class="small" text-anchor="start">Effective date, route, and downstream consequences belong in one decision panel</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Dependency cue</text><text x="684" y="522" class="body" text-anchor="start">Blocked dependencies should show whether the case waits on approval, destination setup, payroll timing, or employee acknowledgment.</text><text x="684" y="544" class="small" text-anchor="start">Next step: review route, open dependency checklist, or hold the case until timing and evidence align.</text><rect x="666" y="574" width="132" height="40" rx="14" fill="#2563EB"/><text x="732.0" y="600" class="inverse" text-anchor="middle">Review route</text><rect x="812" y="574" width="116" height="40" rx="14" fill="#EEF2FF"/><text x="870.0" y="600" class="body" text-anchor="middle">Checklist</text><rect x="942" y="574" width="112" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="998.0" y="600" class="body" text-anchor="middle">Timeline</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Effective-date calendar and checks</text><text x="312" y="754" class="small" text-anchor="start">Timing control is a first-class lifecycle concern, not a footer detail</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">8 actions become effective this week</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">2 cases need employee acknowledgment</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">1 probation extension missing evidence</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Retro salary outcome requires payroll review flag</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Downstream completion and communication</text><text x="664" y="754" class="small" text-anchor="start">A lifecycle action is only done when all consumers finish</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">3 access reprovisioning tasks still open</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 compensation letters ready for release</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">1 payroll publish failure needs rerun</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Employee communication draft prepared</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned lifecycle lenses</text><text x="312" y="994" class="small" text-anchor="start">HR operations can pin confirmation, transfer, salary, and blocked-case views for daily management</text><rect x="320" y="990" width="78" height="28" rx="14" fill="#DCFCE7"/><text x="359.0" y="1008" class="small" text-anchor="middle">This week</text><rect x="410" y="990" width="102" height="28" rx="14" fill="#DBEAFE"/><text x="461.0" y="1008" class="small" text-anchor="middle">Confirmation</text><rect x="524" y="990" width="78" height="28" rx="14" fill="#FEF3C7"/><text x="563.0" y="1008" class="small" text-anchor="middle">Transfer</text><rect x="614" y="990" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="670.0" y="1008" class="small" text-anchor="middle">Salary revision</text><rect x="738" y="990" width="102" height="28" rx="14" fill="#EDE9FE"/><text x="789.0" y="1008" class="small" text-anchor="middle">Cross-entity</text><rect x="852" y="990" width="68" height="28" rx="14" fill="#F8FAFC"/><text x="886.0" y="1008" class="small" text-anchor="middle">Blocked</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Queue-first operations</text><text x="1224" y="224" class="annoText" text-anchor="start">HR operations begins from action queues, not static reporting.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Effective date is control</text><text x="1224" y="276" class="annoText" text-anchor="start">Timing governs payroll, access, benefits, and routing.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Route and blockers together</text><text x="1224" y="328" class="annoText" text-anchor="start">Approval debt and dependency debt are separate and both matter.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Downstream completion matters</text><text x="1224" y="380" class="annoText" text-anchor="start">Approved cases still track payroll, provisioning, and communication.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Maker-checker remains obvious</text><text x="1224" y="432" class="annoText" text-anchor="start">Initiator, approver, and executor may all be different actors.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Lifecycle types share a frame</text><text x="1224" y="484" class="annoText" text-anchor="start">Confirmation, movement, and salary-linked actions coexist in daily HR ops.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile is review-first</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens keep triage and blocker escalation possible while orchestration stays desktop-heavy.</text></svg>
