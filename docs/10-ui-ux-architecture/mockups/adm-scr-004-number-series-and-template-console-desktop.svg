  <text x="60" y="168" class="inverse">Number Series</text>
  <rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="220" class="inverse">Templates</text>
  <rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="272" class="inverse">Scope Ownership</text>
  <rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="324" class="inverse">Collisions</text>
  <rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="376" class="inverse">Draft Governance</text>
  <rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="428" class="inverse">Audit Trail</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="61" class="small">Search series code, prefix token, template, scope owner, or conflict note</text>
  <rect x="1060" y="40" width="98" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1109" y="58" class="small" text-anchor="middle">Org Admin</text>
  <rect x="1172" y="40" width="112" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1228" y="58" class="small" text-anchor="middle">Conflicts 04</text>
  <rect x="1298" y="40" width="102" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1349" y="58" class="small" text-anchor="middle">Drafts 06</text>

  <text x="310" y="128" class="title">Number Series and Template Console</text>
  <rect x="296" y="152" width="112" height="28" rx="14" fill="#DBEAFE"/>
  <text x="352" y="170" class="small" text-anchor="middle">Tenant setup</text>
  <rect x="420" y="152" width="132" height="28" rx="14" fill="#DCFCE7"/>
  <text x="486" y="170" class="small" text-anchor="middle">Platform override 02</text>
  <rect x="564" y="152" width="136" height="28" rx="14" fill="#FEF3C7"/>
  <text x="632" y="170" class="small" text-anchor="middle">No-gap series 03</text>
  <rect x="808" y="146" width="166" height="40" rx="14" fill="#2563EB"/>
  <text x="891" y="172" class="inverse" text-anchor="middle">Review collisions</text>
  <circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="820" y="151" class="inverse" text-anchor="middle">1</text>
  <rect x="986" y="146" width="172" height="40" rx="14" fill="#0F766E"/>
  <text x="1072" y="172" class="inverse" text-anchor="middle">Create series or template</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="249" class="body">Search by sequence code, module, entity scope, template pack, or reservation issue</text>
  <rect x="856" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/>
  <text x="902" y="244" class="small" text-anchor="middle">Series</text>
  <rect x="958" y="226" width="102" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1009" y="244" class="small" text-anchor="middle">Templates</text>
  <rect x="1070" y="226" width="80" height="28" rx="14" fill="#10324A"/>
  <text x="1110" y="244" class="inverse" text-anchor="middle">In use</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">2</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small">Series in use</text>
  <text x="364" y="362" class="metric">19</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">3</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="586" y="332" class="small">Template packs</text>
  <text x="586" y="362" class="metric">07</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="808" y="332" class="small">Draft changes</text>
  <text x="808" y="362" class="metric">06</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#7C3AED"/>
  <text x="1030" y="332" class="small">Scope overrides</text>
  <text x="1030" y="362" class="metric">05</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="1252" y="332" class="small">Collision holds</text>
  <text x="1252" y="362" class="metric">04</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Number series setup queue</text>
  <text x="312" y="464" class="small">Org admin configures business identifiers with explicit scope, cadence, and reservation behavior</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body">EMP-IN-FY26 uses legal-entity scope, yearly reset, counter width 5, and reserve-on-worker-create issuance mode</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body">REQ-APAC-{YYYY}-{seq} remains preview-safe and issues only after requisition approval commits successfully</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body">CASE-SUP-{MM}-{seq} is hot after payroll cutoffs and therefore partitions counters by support queue</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body">No-gap document reference series must record governed void reasons instead of silently skipping abandoned reservations</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Template identity and catalog posture</text>
  <text x="664" y="464" class="small">AD-02 catalog structure keeps template identity, numbering linkage, and publication state in one console frame</text>
  <rect x="666" y="470" width="108" height="28" rx="14" fill="#DBEAFE"/>
  <text x="720" y="488" class="small" text-anchor="middle">Offer pack</text>
  <rect x="786" y="470" width="122" height="28" rx="14" fill="#DCFCE7"/>
  <text x="847" y="488" class="small" text-anchor="middle">Employee code link</text>
  <rect x="920" y="470" width="116" height="28" rx="14" fill="#FEF3C7"/>
  <text x="978" y="488" class="small" text-anchor="middle">Draft pending</text>
  <rect x="1048" y="470" width="92" height="28" rx="14" fill="#EDE9FE"/>
  <text x="1094" y="488" class="small" text-anchor="middle">Owner HR Ops</text>
  <circle cx="666" cy="514" r="3" fill="#2563EB"/>
  <text x="678" y="518" class="body">Template cards show identity code, consuming module, output channel, and bound number series before publication</text>
  <circle cx="666" cy="534" r="3" fill="#2563EB"/>
  <text x="678" y="538" class="body">Offer-letter template TPL-OFFER-STD-IN previews employee code reservation but does not consume a final number in draft mode</text>
  <circle cx="666" cy="554" r="3" fill="#2563EB"/>
  <text x="678" y="558" class="body">Case and document templates expose whether numbering is preview-only, reserve-pending-commit, or immediate issue</text>
  <circle cx="666" cy="574" r="3" fill="#2563EB"/>
  <text x="678" y="578" class="body">Catalog posture also shows language pack, brand pack, and whether a provider-owned template shell is read-only</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">Scope ownership and governance</text>
  <text x="312" y="754" class="small">Tenant-local freedom stays visible, but ownership boundaries are explicit for platform-safe administration</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body">Org admin can change tenant prefixes, reset cadence, and local template labels within approved scope only</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body">Platform admin retains control over base token library, immutable provider templates, and global collision policy</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body">Legal-entity scoped series require maker-checker once live worker, requisition, or case records depend on them</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body">Cross-tenant cloning strips issued counters and forces remap review before any imported draft can publish</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3">Collision, contention, and reservation review</text>
  <text x="664" y="754" class="small">The console treats contention and duplicate risk as operational review items, not hidden runtime assumptions</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body">Two requisition series share an overlapping APAC prefix draft and are blocked until scope ownership is resolved</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body">A hot employee-code stream showed retry spikes last Monday, but atomic issuance kept all final values unique</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body">Reservation expiry is 15 minutes for offer and case templates, with cancellation reason required when no-gap policy applies</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body">Draft comparison highlights where template identity changed without corresponding series or token review</text>
  <circle cx="666" cy="728" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3">Pinned number-series lenses</text>
  <text x="312" y="994" class="small">Admins keep their high-frequency catalog slices one click away across series, templates, and conflict review</text>
  <rect x="320" y="990" width="98" height="28" rx="14" fill="#DCFCE7"/>
  <text x="369" y="1008" class="small" text-anchor="middle">Employee IDs</text>
  <rect x="430" y="990" width="106" height="28" rx="14" fill="#DBEAFE"/>
  <text x="483" y="1008" class="small" text-anchor="middle">Offer packs</text>
  <rect x="548" y="990" width="106" height="28" rx="14" fill="#FEF3C7"/>
  <text x="601" y="1008" class="small" text-anchor="middle">No-gap only</text>
  <rect x="666" y="990" width="120" height="28" rx="14" fill="#EDE9FE"/>
  <text x="726" y="1008" class="small" text-anchor="middle">Scope overrides</text>
  <rect x="798" y="990" width="134" height="28" rx="14" fill="#F8FAFC"/>
  <text x="865" y="1008" class="small" text-anchor="middle">Collision review</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">7</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Conflict review is elevated</text>
  <text x="1224" y="224" class="annoText">The main CTA reflects the highest governance risk: collisions and duplicate-number scenarios.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">Catalog search stays broad</text>
  <text x="1224" y="276" class="annoText">Series, tokens, templates, and ownership all resolve through one AD-02 style finder.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">Health strip before editing</text>
  <text x="1224" y="328" class="annoText">In-use counts, drafts, overrides, and collision holds appear before any deep configuration panel.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Series model is structural</text>
  <text x="1224" y="380" class="annoText">The queue captures cadence, issuance mode, partitioning, and no-gap policy instead of visual template polish.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">Template identity stays governed</text>
  <text x="1224" y="432" class="annoText">Templates are shown as catalog entities with numbering linkage and publication state, not just content previews.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">Ownership boundaries visible</text>
  <text x="1224" y="484" class="annoText">Tenant edits and platform-controlled assets are separated clearly to keep scope safe for org admin.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Conflict operations included</text>
  <text x="1224" y="536" class="annoText">Reservation expiry, retry spikes, overlapping prefixes, and draft drift all stay visible before publish.</text>
</svg>
