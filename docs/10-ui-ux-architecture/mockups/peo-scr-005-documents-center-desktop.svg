<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">People Home</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">People Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Employees</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Documents</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Requirements</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Timeline</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Cases</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Repository</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Documents Center</text><rect x="296" y="152" width="124" height="28" rx="14" fill="#FEF3C7"/><text x="358.0" y="170" class="small" text-anchor="middle">Verify pending</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="432" y="152" width="131" height="28" rx="14" fill="#FEE2E2"/><text x="497.5" y="170" class="small" text-anchor="middle">Restricted docs</text><rect x="575" y="152" width="131" height="28" rx="14" fill="#DBEAFE"/><text x="640.5" y="170" class="small" text-anchor="middle">Retention aware</text><rect x="808" y="146" width="131" height="40" rx="14" fill="#2563EB"/><text x="873.5" y="172" class="inverse" text-anchor="middle">Upload document</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="951" y="146" width="131" height="40" rx="14" fill="#0F766E"/><text x="1016.5" y="172" class="inverse" text-anchor="middle">Verify selected</text><rect x="1094" y="146" width="124" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1156.0" y="172" class="body" text-anchor="middle">Request upload</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search document type, employee, expiry, version, workflow, or retention tag</text><rect x="856" y="226" width="138" height="28" rx="14" fill="#EAF2F8"/><text x="925.0" y="244" class="small" text-anchor="middle">Missing required</text><rect x="1004" y="226" width="124" height="28" rx="14" fill="#EAF2F8"/><text x="1066.0" y="244" class="small" text-anchor="middle">Pending verify</text><rect x="1138" y="226" width="96" height="28" rx="14" fill="#10324A"/><text x="1186.0" y="244" class="inverse" text-anchor="middle">Restricted</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Required</text><text x="364" y="362" class="metric" text-anchor="start">14/16</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Pending verify</text><text x="586" y="362" class="metric" text-anchor="start">03</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="808" y="332" class="small" text-anchor="start">Expiring</text><text x="808" y="362" class="metric" text-anchor="start">02</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="1030" y="332" class="small" text-anchor="start">Restricted</text><text x="1030" y="362" class="metric" text-anchor="start">04</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Upload fails</text><text x="1252" y="362" class="metric" text-anchor="start">01</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Employee document library</text><text x="312" y="464" class="small" text-anchor="start">This is governed evidence, not a generic file dump.</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Document type, owner, and source channel stay visible</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Version and expiry state travel with each file</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Verification status is shown in the same grid</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Process linkage explains why the evidence exists</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Governance, retention, and actions</text><text x="664" y="464" class="small" text-anchor="start">View, download, and print are separate governed behaviors.</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Repository-governance note</text><text x="684" y="522" class="body" text-anchor="start">Sensitive files may be view-only or held under retention and legal-hold policies.</text><text x="684" y="544" class="small" text-anchor="start">Next step: upload a new version, verify the file, or open retention history.</text><rect x="666" y="574" width="124" height="40" rx="14" fill="#2563EB"/><text x="728.0" y="600" class="inverse" text-anchor="middle">Upload version</text><rect x="804" y="574" width="108" height="40" rx="14" fill="#EEF2FF"/><text x="858.0" y="600" class="body" text-anchor="middle">Verify file</text><rect x="926" y="574" width="124" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="988.0" y="600" class="body" text-anchor="middle">Retention view</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Missing and expiring requirements</text><text x="312" y="754" class="small" text-anchor="start">Required-document gaps should outrank passive browsing.</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Missing items are shown by requirement category</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Reminder state stays visible for employee follow-up</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Rejected files list the reason for re-upload</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Expiring mandatory records stay in the same queue</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Version history and audit</text><text x="664" y="754" class="small" text-anchor="start">Evidence lineage and access activity must stay traceable.</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Superseded files remain visible in version history</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Linked case context opens from the same row</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Restricted-view activity is auditable</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Legal-hold state is visible without exposing case detail</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned workspace lenses</text><text x="312" y="994" class="small" text-anchor="start">Repeat views keep the highest-value slices close without re-filtering.</text><rect x="320" y="990" width="82" height="28" rx="14" fill="#DCFCE7"/><text x="361.0" y="1008" class="small" text-anchor="middle">Required</text><rect x="414" y="990" width="82" height="28" rx="14" fill="#DBEAFE"/><text x="455.0" y="1008" class="small" text-anchor="middle">Identity</text><rect x="508" y="990" width="75" height="28" rx="14" fill="#FEF3C7"/><text x="545.5" y="1008" class="small" text-anchor="middle">Payroll</text><rect x="595" y="990" width="75" height="28" rx="14" fill="#FEE2E2"/><text x="632.5" y="1008" class="small" text-anchor="middle">Letters</text><rect x="682" y="990" width="96" height="28" rx="14" fill="#EDE9FE"/><text x="730.0" y="1008" class="small" text-anchor="middle">Restricted</text><rect x="790" y="990" width="82" height="28" rx="14" fill="#F8FAFC"/><text x="831.0" y="1008" class="small" text-anchor="middle">Expiring</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Evidence-first model</text><text x="1224" y="224" class="annoText" text-anchor="start">The workspace should feel like a governed evidence repository.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Permission split</text><text x="1224" y="276" class="annoText" text-anchor="start">View, download, print, and share rights need different cues.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Required before browse</text><text x="1224" y="328" class="annoText" text-anchor="start">Missing required documents should stay more prominent than the archive.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Version lineage</text><text x="1224" y="380" class="annoText" text-anchor="start">Users must know which version is operative and why.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Workflow linkage</text><text x="1224" y="432" class="annoText" text-anchor="start">Repository state should connect clearly to verification and follow-up flows.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Retention visible</text><text x="1224" y="484" class="annoText" text-anchor="start">Legal hold and retention state should never be silent.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile favors completion</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should center required files and safe upload actions.</text></svg>
