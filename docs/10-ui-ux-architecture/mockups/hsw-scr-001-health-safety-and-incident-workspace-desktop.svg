<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Safety Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Incidents</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Investigations</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">CAPA</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Medical</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Audits</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Risk</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Safety</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Health, Safety, and Incident Workspace</text><rect x="296" y="152" width="117" height="28" rx="14" fill="#FEE2E2"/><text x="354.5" y="170" class="small" text-anchor="middle">Incident open</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="425" y="152" width="110" height="28" rx="14" fill="#FEF3C7"/><text x="480.0" y="170" class="small" text-anchor="middle">Medical hold</text><rect x="547" y="152" width="117" height="28" rx="14" fill="#DBEAFE"/><text x="605.5" y="170" class="small" text-anchor="middle">Investigation</text><rect x="808" y="146" width="131" height="40" rx="14" fill="#2563EB"/><text x="873.5" y="172" class="inverse" text-anchor="middle">Review incident</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="951" y="146" width="152" height="40" rx="14" fill="#0F766E"/><text x="1027.0" y="172" class="inverse" text-anchor="middle">Open investigation</text><rect x="1115" y="146" width="110" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1170.0" y="172" class="body" text-anchor="middle">CAPA tracker</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search incident, person, site, severity, corrective action, or medical hold</text><rect x="856" y="226" width="64" height="28" rx="14" fill="#EAF2F8"/><text x="888.0" y="244" class="small" text-anchor="middle">Open</text><rect x="930" y="226" width="64" height="28" rx="14" fill="#EAF2F8"/><text x="962.0" y="244" class="small" text-anchor="middle">CAPA</text><rect x="1004" y="226" width="96" height="28" rx="14" fill="#10324A"/><text x="1052.0" y="244" class="inverse" text-anchor="middle">Restricted</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="364" y="332" class="small" text-anchor="start">Open incidents</text><text x="364" y="362" class="metric" text-anchor="start">12</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Medical holds</text><text x="586" y="362" class="metric" text-anchor="start">04</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="808" y="332" class="small" text-anchor="start">Investigations</text><text x="808" y="362" class="metric" text-anchor="start">07</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1030" y="332" class="small" text-anchor="start">CAPA due</text><text x="1030" y="362" class="metric" text-anchor="start">09</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="1252" y="332" class="small" text-anchor="start">Closed this month</text><text x="1252" y="362" class="metric" text-anchor="start">18</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Incident queue and severity view</text><text x="312" y="464" class="small" text-anchor="start">Operations teams need the queue, site context, and severity in one place.</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Incident rows show person, site, shift, and severity level</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Open incidents stay above closed history and trend views</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Medical-hold cases carry distinct visual weight</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Site clusters help safety teams spot local concentration</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Investigation and evidence rail</text><text x="664" y="464" class="small" text-anchor="start">Investigation work should stay evidence-led and time-bound.</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Safety-control note</text><text x="684" y="522" class="body" text-anchor="start">Evidence, witness notes, and CAPA assignments should remain tied to the incident root record.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect the evidence, open the investigation, and assign CAPA actions.</text><rect x="666" y="574" width="131" height="40" rx="14" fill="#2563EB"/><text x="731.5" y="600" class="inverse" text-anchor="middle">Review evidence</text><rect x="811" y="574" width="108" height="40" rx="14" fill="#EEF2FF"/><text x="865.0" y="600" class="body" text-anchor="middle">Open case</text><rect x="933" y="574" width="108" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="987.0" y="600" class="body" text-anchor="middle">Assign CAPA</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Corrective actions and follow-up</text><text x="312" y="754" class="small" text-anchor="start">CAPA should feel like an operational workflow, not an afterthought.</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Corrective actions track owner, due date, and completion proof</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Overdue CAPA tasks remain visible beside the incident</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Medical-return fit status is linked where relevant</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Regulatory notification steps stay discoverable</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Risk, audit, and trend posture</text><text x="664" y="754" class="small" text-anchor="start">Safety teams need prevention signals, not only case closure.</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Risk hotspot views show recurring site or activity patterns</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Audit findings can link directly into incident follow-up</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Restricted medical detail stays policy-safe</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Trend export and chronology remain available for review</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned workspace lenses</text><text x="312" y="994" class="small" text-anchor="start">Repeat views keep the highest-value slices close without re-filtering.</text><rect x="320" y="990" width="124" height="28" rx="14" fill="#DCFCE7"/><text x="382.0" y="1008" class="small" text-anchor="middle">Open incidents</text><rect x="456" y="990" width="110" height="28" rx="14" fill="#DBEAFE"/><text x="511.0" y="1008" class="small" text-anchor="middle">Medical hold</text><rect x="578" y="990" width="124" height="28" rx="14" fill="#FEF3C7"/><text x="640.0" y="1008" class="small" text-anchor="middle">Investigations</text><rect x="714" y="990" width="72" height="28" rx="14" fill="#FEE2E2"/><text x="750.0" y="1008" class="small" text-anchor="middle">CAPA</text><rect x="798" y="990" width="72" height="28" rx="14" fill="#EDE9FE"/><text x="834.0" y="1008" class="small" text-anchor="middle">Sites</text><rect x="882" y="990" width="72" height="28" rx="14" fill="#F8FAFC"/><text x="918.0" y="1008" class="small" text-anchor="middle">Trend</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Incident-first flow</text><text x="1224" y="224" class="annoText" text-anchor="start">The workspace should orient around active incidents and their severity.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Evidence near action</text><text x="1224" y="276" class="annoText" text-anchor="start">Investigators should not lose evidence context when assigning work.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">CAPA operationalized</text><text x="1224" y="328" class="annoText" text-anchor="start">Corrective actions need equal footing with the root incident.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Medical safe</text><text x="1224" y="380" class="annoText" text-anchor="start">Medical-hold visibility should remain high level and policy-safe.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Risk prevention</text><text x="1224" y="432" class="annoText" text-anchor="start">Trend and hotspot views should support prevention, not just reporting.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Audit connected</text><text x="1224" y="484" class="annoText" text-anchor="start">Audits and incidents should link cleanly where they reinforce each other.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile supports urgency</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should focus on open cases, severity, and immediate follow-up.</text></svg>
