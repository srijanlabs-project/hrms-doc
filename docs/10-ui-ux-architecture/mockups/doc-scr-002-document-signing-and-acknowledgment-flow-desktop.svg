<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Document Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Requests</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Routing</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">OTP</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Evidence</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Expiry</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Documents</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Document Signing and Acknowledgment Flow</text><rect x="296" y="152" width="75" height="28" rx="14" fill="#DBEAFE"/><text x="333.5" y="170" class="small" text-anchor="middle">Sent 42</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="383" y="152" width="117" height="28" rx="14" fill="#FEF3C7"/><text x="441.5" y="170" class="small" text-anchor="middle">OTP verify 11</text><rect x="512" y="152" width="124" height="28" rx="14" fill="#FEE2E2"/><text x="574.0" y="170" class="small" text-anchor="middle">Near expiry 06</text><rect x="808" y="146" width="124" height="40" rx="14" fill="#2563EB"/><text x="870.0" y="172" class="inverse" text-anchor="middle">Review request</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="944" y="146" width="152" height="40" rx="14" fill="#0F766E"/><text x="1020.0" y="172" class="inverse" text-anchor="middle">Resend secure link</text><rect x="1108" y="146" width="110" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1163.0" y="172" class="body" text-anchor="middle">Open OTP log</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search request, document, signer, OTP status, provider ref, expiry, or evidence package</text><rect x="856" y="226" width="75" height="28" rx="14" fill="#EAF2F8"/><text x="893.5" y="244" class="small" text-anchor="middle">Filters</text><rect x="941" y="226" width="68" height="28" rx="14" fill="#EAF2F8"/><text x="975.0" y="244" class="small" text-anchor="middle">Status</text><rect x="1019" y="226" width="64" height="28" rx="14" fill="#10324A"/><text x="1051.0" y="244" class="inverse" text-anchor="middle">Trust</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="364" y="332" class="small" text-anchor="start">Sent</text><text x="364" y="362" class="metric" text-anchor="start">42</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Partially signed</text><text x="586" y="362" class="metric" text-anchor="start">18</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">OTP failures</text><text x="808" y="362" class="metric" text-anchor="start">05</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1030" y="332" class="small" text-anchor="start">Near expiry</text><text x="1030" y="362" class="metric" text-anchor="start">06</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="1252" y="332" class="small" text-anchor="start">Completed</text><text x="1252" y="362" class="metric" text-anchor="start">214</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Request and signer queue</text><text x="312" y="464" class="small" text-anchor="start">Signing flow needs signer order, trust state, and expiry in one view.</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Eleven acknowledgments await OTP verification</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Three offer letters are stuck on counter-signature</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Two external signers use the secure guest route</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">One contract-renewal link expired before completion</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI routing and trust guidance</text><text x="664" y="464" class="small" text-anchor="start">AI may flag weak trust patterns but cannot weaken authentication.</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Signing-trust note</text><text x="684" y="522" class="body" text-anchor="start">Recent OTP failures cluster around one SMS route and should use only approved fallbacks.</text><text x="684" y="544" class="small" text-anchor="start">Next step: review evidence, confirm version lock, and resend only to the current signer.</text><rect x="666" y="574" width="131" height="40" rx="14" fill="#2563EB"/><text x="731.5" y="600" class="inverse" text-anchor="middle">Review evidence</text><rect x="811" y="574" width="108" height="40" rx="14" fill="#EEF2FF"/><text x="865.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="933" y="574" width="110" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="988.0" y="600" class="body" text-anchor="middle">Open OTP log</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">OTP and acknowledgment controls</text><text x="312" y="754" class="small" text-anchor="start">Authentication strength and signer order should remain explicit end to end.</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Max resend count is enforced before manual support review</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Presented document version stays locked once sent</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Sequential and counter-sign steps remain distinct</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Locale-aware consent copy stays aligned to signer language</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Sealing and evidence package</text><text x="664" y="754" class="small" text-anchor="start">Completion should create tamper-evident, searchable proof.</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Completed artifacts are sealed as immutable repository items</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Provider callback verification passed on completed requests</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">IP and device evidence is retained where lawful</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Decline and expiry history stay searchable</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned workspace lenses</text><text x="312" y="994" class="small" text-anchor="start">Repeat views keep the highest-value slices close without re-filtering.</text><rect x="320" y="990" width="110" height="28" rx="14" fill="#DCFCE7"/><text x="375.0" y="1008" class="small" text-anchor="middle">Offer letter</text><rect x="442" y="990" width="72" height="28" rx="14" fill="#DBEAFE"/><text x="478.0" y="1008" class="small" text-anchor="middle">OTP</text><rect x="526" y="990" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="574.0" y="1008" class="small" text-anchor="middle">Sequential</text><rect x="634" y="990" width="103" height="28" rx="14" fill="#FEE2E2"/><text x="685.5" y="1008" class="small" text-anchor="middle">Near expiry</text><rect x="749" y="990" width="89" height="28" rx="14" fill="#EDE9FE"/><text x="793.5" y="1008" class="small" text-anchor="middle">Completed</text><rect x="850" y="990" width="131" height="28" rx="14" fill="#F8FAFC"/><text x="915.5" y="1008" class="small" text-anchor="middle">External signer</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Trust-first actions</text><text x="1224" y="224" class="annoText" text-anchor="start">The flow should foreground review and secure resend rather than raw throughput.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Signature-aware search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search must center on request, signer, OTP, provider, and evidence artifacts.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Lifecycle KPI row</text><text x="1224" y="328" class="annoText" text-anchor="start">Progress, failure, expiry, and completion evidence belong together.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Routing before preview</text><text x="1224" y="380" class="annoText" text-anchor="start">Users should see stuck signer order and expiry risk before file detail.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">AI cannot weaken policy</text><text x="1224" y="432" class="annoText" text-anchor="start">Advisory guidance must never lower OTP or signature strength.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Version lock visible</text><text x="1224" y="484" class="annoText" text-anchor="start">Authentication and presented-document integrity shape legal confidence.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Evidence lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Operations teams revisit signing work by trust pattern and status.</text></svg>
