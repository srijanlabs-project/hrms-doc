<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">Review</text><text x="20" y="76" class="h2inv" text-anchor="start">Access Review Campaign</text><rect x="16" y="108" width="98" height="28" rx="14" fill="#DBEAFE"/><text x="65.0" y="126" class="small" text-anchor="middle">Items 3.2k</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="122" y="108" width="98" height="28" rx="14" fill="#FEF3C7"/><text x="171.0" y="126" class="small" text-anchor="middle">Risk 148</text><rect x="228" y="108" width="88" height="28" rx="14" fill="#FEE2E2"/><text x="272.0" y="126" class="small" text-anchor="middle">SLA 19</text><rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="34" y="190" class="body" text-anchor="start">Search reviewer, role, risk, or remediation state</text><circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="173" class="inverse" text-anchor="middle">2</text><rect x="16" y="228" width="358" height="156" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="252" class="h3" text-anchor="start">Queue and reviewer summary</text><text x="32" y="270" class="small" text-anchor="start">Mobile starts with high-risk queue and aging reviewers</text><circle cx="34" cy="280" r="3" fill="#2563EB"/><text x="46" y="284" class="body" text-anchor="start">3.2k items in scope</text><circle cx="34" cy="300" r="3" fill="#2563EB"/><text x="46" y="304" class="body" text-anchor="start">148 high-risk items</text><circle cx="34" cy="320" r="3" fill="#2563EB"/><text x="46" y="324" class="body" text-anchor="start">19 overdue reviewers</text><circle cx="34" cy="340" r="3" fill="#2563EB"/><text x="46" y="344" class="body" text-anchor="start">3 delegated systems</text><circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="249" class="inverse" text-anchor="middle">3</text><rect x="16" y="400" width="358" height="182" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="424" class="h3" text-anchor="start">Decision and evidence cue</text><text x="32" y="442" class="small" text-anchor="start">Evidence-led review stays actionable on mobile</text><circle cx="34" cy="452" r="3" fill="#2563EB"/><text x="46" y="456" class="body" text-anchor="start">Privileged role idle for 61 days</text><circle cx="34" cy="472" r="3" fill="#2563EB"/><text x="46" y="476" class="body" text-anchor="start">Reviewer cannot self-certify</text><circle cx="34" cy="492" r="3" fill="#2563EB"/><text x="46" y="496" class="body" text-anchor="start">Inspect proof before action</text><circle cx="34" cy="512" r="3" fill="#2563EB"/><text x="46" y="516" class="body" text-anchor="start">Track revoke to closure</text><rect x="30" y="526" width="146" height="40" rx="14" fill="#2563EB"/><text x="103.0" y="552" class="inverse" text-anchor="middle">Open item</text><rect x="190" y="526" width="166" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="273.0" y="552" class="body" text-anchor="middle">Track revoke</text><circle cx="30" cy="416" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="421" class="inverse" text-anchor="middle">4</text><rect x="16" y="598" width="358" height="138" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="622" class="h3" text-anchor="start">Bulk and remediation stack</text><text x="32" y="640" class="small" text-anchor="start">Low-risk bulk paths and downstream closure cues compress into one stack</text><circle cx="34" cy="648" r="3" fill="#2563EB"/><text x="46" y="652" class="body" text-anchor="start">412 low-risk items</text><circle cx="34" cy="668" r="3" fill="#2563EB"/><text x="46" y="672" class="body" text-anchor="start">37 revokes pending</text><circle cx="34" cy="688" r="3" fill="#2563EB"/><text x="46" y="692" class="body" text-anchor="start">2 connector confirmations pending</text><circle cx="34" cy="708" r="3" fill="#2563EB"/><text x="46" y="712" class="body" text-anchor="start">1 self-cert conflict</text><circle cx="30" cy="614" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="619" class="inverse" text-anchor="middle">5</text><rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="780" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="804" r="12" fill="#2563EB"/><text x="40" y="808" class="inverse" text-anchor="middle">1</text><text x="62" y="806" class="annoTitle" text-anchor="start">Decision-complete mobile</text><text x="62" y="824" class="annoText" text-anchor="start">Mobile keeps reviewers able to certify or revoke with evidence instead of falling back to summary-only views.</text></svg>
