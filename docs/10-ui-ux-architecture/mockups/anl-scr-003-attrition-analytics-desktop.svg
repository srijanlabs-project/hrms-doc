<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Retention Intelligence</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Attrition</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Cohorts</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Managers</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Reasons</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Definitions</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Actions</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Analytics</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Attrition Analytics</text><rect x="296" y="152" width="128" height="28" rx="14" fill="#FEE2E2"/><text x="360.0" y="170" class="small" text-anchor="middle">Attrition 12.1%</text><rect x="436" y="152" width="152" height="28" rx="14" fill="#FEF3C7"/><text x="512.0" y="170" class="small" text-anchor="middle">Regrettable 3.4%</text><rect x="600" y="152" width="166" height="28" rx="14" fill="#DBEAFE"/><text x="683.0" y="170" class="small" text-anchor="middle">Threshold breach</text><rect x="808" y="146" width="182" height="40" rx="14" fill="#2563EB"/><text x="899" y="172" class="inverse" text-anchor="middle">Review cohorts</text><rect x="1002" y="146" width="156" height="40" rx="14" fill="#0F766E"/><text x="1080" y="172" class="inverse" text-anchor="middle">Open actions</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search manager, location, exit reason, cohort, or retention theme</text><rect x="856" y="226" width="102" height="28" rx="14" fill="#EAF2F8"/><text x="907.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="968" y="226" width="122" height="28" rx="14" fill="#EAF2F8"/><text x="1029.0" y="244" class="small" text-anchor="middle">Definitions</text><rect x="1100" y="226" width="40" height="28" rx="14" fill="#10324A"/><text x="1120.0" y="244" class="inverse" text-anchor="middle">Risk</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="364" y="332" class="small" text-anchor="start">Overall</text><text x="364" y="362" class="metric" text-anchor="start">12.1%</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Regrettable</text><text x="586" y="362" class="metric" text-anchor="start">3.4%</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="808" y="332" class="small" text-anchor="start">High-risk mgrs</text><text x="808" y="362" class="metric" text-anchor="start">07</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="1030" y="332" class="small" text-anchor="start">First-year</text><text x="1030" y="362" class="metric" text-anchor="start">18%</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Suppressed</text><text x="1252" y="362" class="metric" text-anchor="start">11</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Trend and cohort hotspots</text><text x="312" y="464" class="small" text-anchor="start">Leaders need hot managers, cohorts, and exit-pattern shifts before detailed reasons</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Engineering first-year attrition rising</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">2 managers crossed threshold this month</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">India regrettable attrition above target</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Tenure 0-12 month cohort widening gap</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI trend explanation and retention focus</text><text x="664" y="464" class="small" text-anchor="start">AI can explain patterns and suggest focus areas, but action plans remain owned by HR leadership</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI trend explanation</text><text x="684" y="522" class="body" text-anchor="start">Recent regrettable attrition is concentrated in early-tenure engineers under fast-growing managers with compensation compression and promotion delay signals.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: compare pay bands, inspect manager span, and open retention focus cohort with privacy-safe suppression.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review cohort</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Open action plan</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Definitions and privacy state</text><text x="312" y="754" class="small" text-anchor="start">Formula version, suppression, and sensitive commentary controls must remain visible</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Rolling-average denominator version 4</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Small cohorts below 5 suppressed</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Manager-level exit comments restricted</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Last refresh completed 07:20 IST</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Retention action and related signals</text><text x="664" y="754" class="small" text-anchor="start">Attrition outputs should connect to focus actions and adjacent workforce drivers</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">7 managers in watchlist</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 critical-role loss clusters</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Compensation correlation flagged in one cohort</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Suggested retention review for 36 employees</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned attrition lenses</text><text x="312" y="994" class="small" text-anchor="start">Leaders and HRBPs can pin period, region, tenure, regrettable-loss, and manager-risk views</text><rect x="320" y="990" width="120" height="28" rx="14" fill="#DCFCE7"/><text x="380.0" y="1008" class="small" text-anchor="middle">Rolling 12</text><rect x="452" y="990" width="108" height="28" rx="14" fill="#DBEAFE"/><text x="506.0" y="1008" class="small" text-anchor="middle">India</text><rect x="572" y="990" width="120" height="28" rx="14" fill="#FEF3C7"/><text x="632.0" y="1008" class="small" text-anchor="middle">0-12 mo</text><rect x="704" y="990" width="136" height="28" rx="14" fill="#FEE2E2"/><text x="772.0" y="1008" class="small" text-anchor="middle">Regrettable</text><rect x="852" y="990" width="134" height="28" rx="14" fill="#EDE9FE"/><text x="919.0" y="1008" class="small" text-anchor="middle">Mgr risk</text><rect x="998" y="990" width="110" height="28" rx="14" fill="#F8FAFC"/><text x="1053.0" y="1008" class="small" text-anchor="middle">Privacy</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Retention-first actions</text><text x="1224" y="224" class="annoText" text-anchor="start">Top actions bias toward cohort review and action planning because this screen is for decision support.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Hotspot-oriented search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search is tuned to managers, cohorts, reasons, and retention themes rather than raw employee lookup.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Outcome KPI row</text><text x="1224" y="328" class="annoText" text-anchor="start">The first-row metrics blend overall, regrettable, first-year, and privacy-suppression signals.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Trend before detail</text><text x="1224" y="380" class="annoText" text-anchor="start">The left panel keeps hotspot cohorts and threshold shifts primary before deeper reason analysis.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable attrition AI</text><text x="1224" y="432" class="annoText" text-anchor="start">AI trend explanation remains rationale-led and connected to concrete next analytical steps.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Definitions beside action</text><text x="1224" y="484" class="annoText" text-anchor="start">Formula version, refresh, suppression, and action cues remain in the same workspace.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Leadership lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned views reflect how HRBPs and leaders repeatedly revisit attrition scenarios.</text></svg>
