<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">Documents</text><text x="20" y="76" class="h2inv" text-anchor="start">Signing Flow</text><rect x="16" y="108" width="76" height="28" rx="14" fill="#DBEAFE"/><text x="54.0" y="126" class="small" text-anchor="middle">Sent 42</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="100" y="108" width="72" height="28" rx="14" fill="#FEF3C7"/><text x="136.0" y="126" class="small" text-anchor="middle">OTP 11</text><rect x="180" y="108" width="82" height="28" rx="14" fill="#FEE2E2"/><text x="221.0" y="126" class="small" text-anchor="middle">Expiry 6</text><rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="34" y="190" class="body" text-anchor="start">Search request, signer, OTP, or expiry</text><circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="173" class="inverse" text-anchor="middle">2</text><rect x="16" y="228" width="358" height="156" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="252" class="h3" text-anchor="start">Request and expiry stack</text><text x="32" y="270" class="small" text-anchor="start">Mobile starts with pending signer actions and secure-link risk.</text><circle cx="34" cy="280" r="3" fill="#2563EB"/><text x="46" y="284" class="body" text-anchor="start">OTP verification waits</text><circle cx="34" cy="300" r="3" fill="#2563EB"/><text x="46" y="304" class="body" text-anchor="start">Counter-sign pending</text><circle cx="34" cy="320" r="3" fill="#2563EB"/><text x="46" y="324" class="body" text-anchor="start">Guest signer route active</text><circle cx="34" cy="340" r="3" fill="#2563EB"/><text x="46" y="344" class="body" text-anchor="start">One expired link</text><circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="249" class="inverse" text-anchor="middle">3</text><rect x="16" y="400" width="358" height="182" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="424" class="h3" text-anchor="start">AI trust guidance</text><text x="32" y="442" class="small" text-anchor="start">OTP and routing guidance stays policy-safe on mobile.</text><circle cx="34" cy="452" r="3" fill="#2563EB"/><text x="46" y="456" class="body" text-anchor="start">Failures cluster on one SMS route</text><circle cx="34" cy="472" r="3" fill="#2563EB"/><text x="46" y="476" class="body" text-anchor="start">Keep auth strength intact</text><circle cx="34" cy="492" r="3" fill="#2563EB"/><text x="46" y="496" class="body" text-anchor="start">Use approved fallback only</text><circle cx="34" cy="512" r="3" fill="#2563EB"/><text x="46" y="516" class="body" text-anchor="start">Check callback lag before extend</text><rect x="30" y="526" width="131" height="40" rx="14" fill="#2563EB"/><text x="95.5" y="552" class="inverse" text-anchor="middle">Review evidence</text><rect x="175" y="526" width="98" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="224.0" y="550" class="body" text-anchor="middle">OTP log</text><circle cx="30" cy="416" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="421" class="inverse" text-anchor="middle">4</text><rect x="16" y="598" width="358" height="138" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="622" class="h3" text-anchor="start">Completion summary</text><text x="32" y="640" class="small" text-anchor="start">Status, callback, and sealing cues compress into one trust stack.</text><circle cx="34" cy="648" r="3" fill="#2563EB"/><text x="46" y="652" class="body" text-anchor="start">Completed count visible</text><circle cx="34" cy="668" r="3" fill="#2563EB"/><text x="46" y="672" class="body" text-anchor="start">All sealed on success</text><circle cx="34" cy="688" r="3" fill="#2563EB"/><text x="46" y="692" class="body" text-anchor="start">Decline history traceable</text><circle cx="34" cy="708" r="3" fill="#2563EB"/><text x="46" y="712" class="body" text-anchor="start">Version lock still active</text><circle cx="30" cy="614" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="619" class="inverse" text-anchor="middle">5</text><rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="780" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="804" r="12" fill="#2563EB"/><text x="40" y="808" class="inverse" text-anchor="middle">1</text><text x="62" y="806" class="annoTitle" text-anchor="start">Trust-preserving mobile</text><text x="62" y="824" class="annoText" text-anchor="start">Mobile keeps OTP, signer order, and sealing boundaries visible before resend or cancel.</text></svg>
