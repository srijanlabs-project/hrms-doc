<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">Self</text><text x="20" y="76" class="h2inv" text-anchor="start">Employee Home</text><rect x="16" y="108" width="98" height="28" rx="14" fill="#FEE2E2"/><text x="65.0" y="126" class="small" text-anchor="middle">Due 4</text><rect x="122" y="108" width="96" height="28" rx="14" fill="#DCFCE7"/><text x="170.0" y="126" class="small" text-anchor="middle">Payday</text><rect x="226" y="108" width="120" height="28" rx="14" fill="#DBEAFE"/><text x="286.0" y="126" class="small" text-anchor="middle">Leave 12.5</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="34" y="190" class="body" text-anchor="start">Search, ask, or type a command</text><circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="173" class="inverse" text-anchor="middle">2</text><rect x="16" y="228" width="358" height="146" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="252" class="h3" text-anchor="start">My actions</text><text x="32" y="270" class="small" text-anchor="start">Critical employee tasks appear before passive content</text><circle cx="34" cy="280" r="3" fill="#2563EB"/><text x="46" y="284" class="body" text-anchor="start">Acknowledge policy update</text><circle cx="34" cy="300" r="3" fill="#2563EB"/><text x="46" y="304" class="body" text-anchor="start">Upload tax proof</text><circle cx="34" cy="320" r="3" fill="#2563EB"/><text x="46" y="324" class="body" text-anchor="start">Regularize missing punch</text><circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="249" class="inverse" text-anchor="middle">3</text><rect x="16" y="390" width="358" height="176" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="414" class="h3" text-anchor="start">AI assistant</text><text x="32" y="432" class="small" text-anchor="start">Recommendations and safe actions stack into one mobile card</text><circle cx="34" cy="442" r="3" fill="#2563EB"/><text x="46" y="446" class="body" text-anchor="start">Missing punch found for Tuesday</text><circle cx="34" cy="462" r="3" fill="#2563EB"/><text x="46" y="466" class="body" text-anchor="start">Suggested action: open regularization</text><circle cx="34" cy="482" r="3" fill="#2563EB"/><text x="46" y="486" class="body" text-anchor="start">Ask why this was suggested</text><circle cx="34" cy="502" r="3" fill="#2563EB"/><text x="46" y="506" class="body" text-anchor="start">Escalate to helpdesk if needed</text><rect x="30" y="510" width="154" height="36" rx="12" fill="#2563EB"/><text x="107" y="534" class="inverse" text-anchor="middle">Open suggestion</text><rect x="198" y="510" width="162" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="279" y="534" class="body" text-anchor="middle">Ask policy assistant</text><circle cx="30" cy="406" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="411" class="inverse" text-anchor="middle">4</text><rect x="16" y="582" width="358" height="154" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="606" class="h3" text-anchor="start">Widgets and updates</text><text x="32" y="624" class="small" text-anchor="start">Requests, leave, pay, learning, and announcements collapse into stacked tiles</text><circle cx="34" cy="634" r="3" fill="#2563EB"/><text x="46" y="638" class="body" text-anchor="start">Request pending</text><circle cx="34" cy="654" r="3" fill="#2563EB"/><text x="46" y="658" class="body" text-anchor="start">Payslip ready</text><circle cx="34" cy="674" r="3" fill="#2563EB"/><text x="46" y="678" class="body" text-anchor="start">Learning 2 of 5 complete</text><circle cx="34" cy="694" r="3" fill="#2563EB"/><text x="46" y="698" class="body" text-anchor="start">Hybrid policy announcement</text><circle cx="30" cy="598" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="603" class="inverse" text-anchor="middle">5</text><rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="780" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="804" r="12" fill="#2563EB"/><text x="40" y="808" class="inverse" text-anchor="middle">1</text><text x="62" y="806" class="annoTitle" text-anchor="start">Command-first mobile</text><text x="62" y="824" class="annoText" text-anchor="start">The assistant entry stays near the top because it reduces taps across many employee tasks.</text></svg>
