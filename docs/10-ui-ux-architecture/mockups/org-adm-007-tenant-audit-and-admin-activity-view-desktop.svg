  <circle cx="620" cy="754" r="3" fill="#2563EB"/>
  <text x="632" y="758" class="body">Actor thread shows device, IP region, impersonation flag, and cross-module action sequence</text>
  <circle cx="620" cy="774" r="3" fill="#2563EB"/>
  <text x="632" y="778" class="body">Every risky change requires a reason or linked approval id before the event becomes complete</text>
  <circle cx="620" cy="794" r="3" fill="#2563EB"/>
  <text x="632" y="798" class="body">Export request hook attaches to the originating audit event so downstream privacy review can reuse context</text>
  <circle cx="620" cy="814" r="3" fill="#2563EB"/>
  <text x="632" y="818" class="body">Masked previews show PAN as ABCDE1234F, phone as +91•••••3048, and account as ••••8192</text>
