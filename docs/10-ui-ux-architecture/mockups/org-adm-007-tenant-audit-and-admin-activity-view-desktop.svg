  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Investigation-first header</text>
  <text x="1224" y="224" class="annoText">Primary actions focus on opening an investigation and building an evidence pack rather than editing data.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">Filterable audit model</text>
  <text x="1224" y="276" class="annoText">Actor, object, reason, privacy linkage, and severity are treated as first-class filter dimensions.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">Signal cards compress scope</text>
  <text x="1224" y="328" class="annoText">Volume, critical reviews, export hooks, masked fields, and actor threads summarize the live audit surface.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Filter rail stays visible</text>
  <text x="1224" y="380" class="annoText">The left rail preserves explainable narrowing and helps auditors reproduce the same slice later.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">Masked, not weakened</text>
  <text x="1224" y="432" class="annoText">Sensitive values stay masked while timestamps, actor identity, action type, and reason remain complete.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">Timeline plus export hook</text>
  <text x="1224" y="484" class="annoText">Actor history, admin rationale, and privacy-review handoff live in one forensic workspace.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Desktop supports investigations</text>
  <text x="1224" y="536" class="annoText">The layout is designed for longer audit sessions, comparison work, and evidence-pack preparation.</text>
