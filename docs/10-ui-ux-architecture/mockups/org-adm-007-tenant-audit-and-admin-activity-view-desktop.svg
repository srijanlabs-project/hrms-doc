  <text x="312" y="446" class="h3">Filter rail and investigation scope</text>
  <text x="312" y="464" class="small">Investigative filters stay visible so audit narrowing is explainable and repeatable</text>
  <circle cx="314" cy="482" r="3" fill="#2563EB"/>
  <text x="326" y="486" class="body">Actor: HR Admin, Org Admin, Integration User, Privacy Officer</text>
  <circle cx="314" cy="502" r="3" fill="#2563EB"/>
  <text x="326" y="506" class="body">Event type: role grant, export, SSO change, config publish, break-glass use</text>
  <circle cx="314" cy="522" r="3" fill="#2563EB"/>
  <text x="326" y="526" class="body">Reason present, masked output, escalated severity, and privacy-linked records</text>
  <circle cx="314" cy="542" r="3" fill="#2563EB"/>
  <text x="326" y="546" class="body">Retention and legal hold chips pin the search within policy-safe boundaries</text>
