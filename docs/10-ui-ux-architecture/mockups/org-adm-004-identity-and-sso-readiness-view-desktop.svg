  <rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="324" class="inverse">MFA Posture</text>
  <rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="376" class="inverse">Read-only Providers</text>
  <rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="428" class="inverse">Audit Evidence</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="61" class="small">Search domain, IdP, SCIM connector, MFA control, or tenant trace</text>
  <rect x="1060" y="40" width="110" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1115" y="58" class="small" text-anchor="middle">Org Admin</text>
  <rect x="1184" y="40" width="108" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1238" y="58" class="small" text-anchor="middle">Gaps 05</text>
  <rect x="1306" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1353" y="58" class="small" text-anchor="middle">Prod ready</text>

  <text x="310" y="128" class="title">Identity and SSO Readiness View</text>
  <rect x="296" y="152" width="150" height="28" rx="14" fill="#DBEAFE"/>
  <text x="371" y="170" class="small" text-anchor="middle">Apex Retail Holdings</text>
  <rect x="458" y="152" width="112" height="28" rx="14" fill="#DCFCE7"/>
  <text x="514" y="170" class="small" text-anchor="middle">Entra ID linked</text>
  <rect x="582" y="152" width="126" height="28" rx="14" fill="#FEF3C7"/>
  <text x="645" y="170" class="small" text-anchor="middle">SCIM delta sync</text>
  <rect x="812" y="146" width="170" height="40" rx="14" fill="#2563EB"/>
  <text x="897" y="172" class="inverse" text-anchor="middle">Open readiness review</text>
  <circle cx="824" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="824" y="151" class="inverse" text-anchor="middle">1</text>
  <rect x="994" y="146" width="162" height="40" rx="14" fill="#0F766E"/>
  <text x="1075" y="172" class="inverse" text-anchor="middle">Run sign-in check</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="249" class="body">Search by login domain, claim set, sync job, managed group, or recovery path</text>
  <rect x="856" y="226" width="102" height="28" rx="14" fill="#EAF2F8"/>
  <text x="907" y="244" class="small" text-anchor="middle">This week</text>
  <rect x="968" y="226" width="90" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1013" y="244" class="small" text-anchor="middle">Identity</text>
  <rect x="1068" y="226" width="82" height="28" rx="14" fill="#10324A"/>
  <text x="1109" y="244" class="inverse" text-anchor="middle">Needs fix</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">2</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small">Readiness score</text>
  <text x="364" y="362" class="metric">91%</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">3</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="586" y="332" class="small">Verified domains</text>
  <text x="586" y="362" class="metric">03</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="808" y="332" class="small">MFA exceptions</text>
  <text x="808" y="362" class="metric">11</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#0F766E"/>
  <text x="1030" y="332" class="small">SCIM alerts</text>
  <text x="1030" y="362" class="metric">02</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="1252" y="332" class="small">Read-only links</text>
  <text x="1252" y="362" class="metric">04</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Domain and launch readiness</text>
  <text x="312" y="464" class="small">The org admin sees tenant-owned launch evidence before deeper identity edits or provider escalations</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body">login.apexpeople.in and hr.apexretail.com are verified with branded sign-in routing active</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body">SP metadata and callback URLs passed sandbox and production comparison on 15 Jul 2026</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body">Break-glass local admin remains isolated from SSO lockout and provider-controlled edits</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body">Provider managed cues clearly mark fields that can only be changed in Entra ID or Okta</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">IdP and provisioning readiness map</text>
  <text x="664" y="464" class="small">Provider trust, SCIM health, and read-only boundaries share one operator-safe review surface</text>
  <rect x="666" y="476" width="474" height="66" rx="12" fill="#FBFDFF" stroke="#D9E2EC"/>
  <text x="684" y="500" class="small">Provider-managed controls</text>
  <text x="684" y="524" class="body">NameID format, signing algorithm, and conditional-access policy are read only here and link back to the identity provider console.</text>
  <rect x="666" y="560" width="138" height="40" rx="14" fill="#EEF2FF"/>
  <text x="735" y="586" class="body" text-anchor="middle">Open provider doc</text>
  <rect x="818" y="560" width="132" height="40" rx="14" fill="#2563EB"/>
  <text x="884" y="586" class="inverse" text-anchor="middle">Review SCIM</text>
  <rect x="964" y="560" width="138" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="1033" y="586" class="body" text-anchor="middle">Download trace</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>
  <circle cx="666" cy="618" r="3" fill="#2563EB"/>
  <text x="678" y="622" class="body">Last delta sync ran 12 minutes ago with 2 manager resolution mismatches queued for review</text>
  <circle cx="666" cy="638" r="3" fill="#2563EB"/>
  <text x="678" y="642" class="body">Provisioning pause affects onboarding updates only and does not interrupt active SSO sessions</text>
  <circle cx="666" cy="658" r="3" fill="#2563EB"/>
  <text x="678" y="662" class="body">Deprovision policy is mapped to exit status and legal entity without exposing provider secrets</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">MFA posture and exception stack</text>
  <text x="312" y="754" class="small">Assurance level is framed as posture and recovery status, not as raw policy syntax</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body">Privileged admins require phishing-resistant MFA on new device registration and export actions</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body">11 users remain on SMS fallback while authenticator enrollment tasks are open</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body">Step-up verification applies to payroll exports, permission edits, and privacy request approvals</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body">Trusted-device grace periods and emergency bypass approvals remain audit visible</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3">Readiness evidence and tenant-safe diagnostics</text>
  <text x="664" y="754" class="small">The view offers repeat-safe identity diagnostics and status evidence without crossing provider authority boundaries</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body">Domain verification history shows DNS proof, last check time, and org-owned approver trail</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body">Claim drift notice highlights mapping deltas and routes platform-only issues to provider escalation</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body">Certificate rollover checklist includes impact preview for sign-in, mobile app, and employee portal flows</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body">Exportable evidence pack contains masked trace data, no secrets, and links back to immutable audit events</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3">Pinned readiness lenses</text>
  <text x="312" y="994" class="small">Frequently revisited identity slices remain one click away for launch review and ongoing tenant operations</text>
  <rect x="320" y="990" width="110" height="28" rx="14" fill="#DCFCE7"/>
  <text x="375" y="1008" class="small" text-anchor="middle">Verified domains</text>
  <rect x="442" y="990" width="98" height="28" rx="14" fill="#DBEAFE"/>
  <text x="491" y="1008" class="small" text-anchor="middle">SCIM drift</text>
  <rect x="552" y="990" width="108" height="28" rx="14" fill="#FEF3C7"/>
  <text x="606" y="1008" class="small" text-anchor="middle">MFA gaps</text>
  <rect x="672" y="990" width="120" height="28" rx="14" fill="#FEE2E2"/>
  <text x="732" y="1008" class="small" text-anchor="middle">Cert rollover</text>
  <rect x="804" y="990" width="126" height="28" rx="14" fill="#F8FAFC"/>
  <text x="867" y="1008" class="small" text-anchor="middle">Provider managed</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">7</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Tenant-side launch framing</text>
  <text x="1224" y="224" class="annoText">The top action bar stays focused on readiness review and safe sign-in checks, not raw provider editing.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">Identity search model</text>
  <text x="1224" y="276" class="annoText">Admins can pivot by domain, sync job, managed group, and recovery trace from one lookup pattern.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">KPI row exposes posture</text>
  <text x="1224" y="328" class="annoText">Readiness, domain count, MFA exceptions, SCIM alerts, and managed-provider boundaries lead the page.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Provider-managed cues</text>
  <text x="1224" y="380" class="annoText">Fields controlled in Entra ID or Okta are explicitly marked read only so tenant admins do not infer false control.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">SCIM stays operational</text>
  <text x="1224" y="432" class="annoText">Provisioning health, pause behavior, and mismatch review appear as workflow-safe operator tasks.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">Evidence over syntax</text>
  <text x="1224" y="484" class="annoText">MFA posture, certificate rollover, and domain verification are presented as evidence and remediation states.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Desktop favors synthesis</text>
  <text x="1224" y="536" class="annoText">Org admins can review launch confidence, provider boundaries, and diagnostic routes in one continuous scan.</text>
</svg>
