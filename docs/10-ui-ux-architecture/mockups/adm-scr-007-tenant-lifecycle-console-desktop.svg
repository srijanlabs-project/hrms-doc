  <text x="312" y="446" class="h3">Tenant lifecycle queue</text>
  <text x="312" y="464" class="small">Platform admin and implementation lead triage stage movement, blockers, and approvals here</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body">Nexa Retail UAE awaits domain verification and outbound email allow-list confirmation</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body">Ardent Labs India is scheduled for production activation on 22 Jul 2026</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body">Southwind GmbH remains suspended pending DPA addendum and billing contact correction</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body">Two sandbox-to-prod cutovers need payroll pack and SSO smoke-test signoff</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
