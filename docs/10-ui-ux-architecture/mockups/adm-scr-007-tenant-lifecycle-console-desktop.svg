  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">Search by dependency</text>
  <text x="1224" y="276" class="annoText">Operators can find tenants through technical blockers, not just customer names.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">Operational KPI strip</text>
  <text x="1224" y="328" class="annoText">Provisioning load, readiness debt, plan drift, and risk are surfaced before tables.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Queue for platform admins</text>
  <text x="1224" y="380" class="annoText">The left column prioritizes who needs attention now across the tenant estate.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">Readiness with stage context</text>
  <text x="1224" y="432" class="annoText">Provisioning state is inseparable from module posture, owners, and launch timing.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">Risk beside activation</text>
  <text x="1224" y="484" class="annoText">Admin-risk signals are intentionally placed next to lifecycle decisions to reduce unsafe launches.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Reusable operating lenses</text>
  <text x="1224" y="536" class="annoText">Pinned filters mirror how platform teams revisit provisioning and suspension cohorts.</text>
