  <text x="312" y="736" class="h3">Activation, suspension, and plan posture</text>
  <text x="312" y="754" class="small">Lifecycle actions carry commercial and operational consequences together</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body">Activation requires legal owner, billing owner, and support-hours confirmation</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body">Suspension retains audit access while login, jobs, and outbound mail are disabled</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body">Plan downgrade is blocked when enabled modules exceed target entitlement pack</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body">Two tenants have temporary storage overages that require plan or archive decisions</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3">Admin-risk overview</text>
  <text x="664" y="754" class="small">Risk summary stays adjacent to lifecycle decisions so activation never happens in a blind spot</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body">One tenant still uses emergency support impersonation with review overdue by 3 days</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body">Three admin-owner mailboxes bounced during provisioning communications this week</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body">API key rotation failed for one suspended tenant that still has integration callbacks enabled</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body">Two lifecycle cases show plan entitlements that no longer match enabled premium modules</text>
