"start">Canvas and preview</text><text x="32" y="378" class="small" text-anchor="start">Builder content is represented as structured sections on mobile</text><circle cx="34" cy="390" r="3" fill="#2563EB"/><text x="46" y="394" class="body" text-anchor="start">Header section</text><circle cx="34" cy="410" r="3" fill="#2563EB"/><text x="46" y="414" class="body" text-anchor="start">Recipient details</text><circle cx="34" cy="430" r="3" fill="#2563EB"/><text x="46" y="434" class="body" text-anchor="start">Terms section</text><circle cx="34" cy="450" r="3" fill="#2563EB"/><text x="46" y="454" class="body" text-anchor="start">Preview merged output</text><rect x="30" y="494" width="330" height="48" rx="12" fill="#FFF7ED" stroke="#D9E2EC" stroke-width="1"/><text x="46" y="522" class="small" text-anchor="start">Unresolved placeholders: joining_date, comp_band</text><circle cx="30" cy="352" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="357" class="inverse" text-anchor="middle">3</text><rect x="16" y="574" width="358" height="132" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="598" class="h3" text-anchor="start">Generation monitor</text><text x="32" y="616" class="small" text-anchor="start">Recent failures and retry status shown as compact cards</text><circle cx="34" cy="624" r="3" fill="#2563EB"/><text x="46" y="628" class="body" text-anchor="start">Success 94%</text><circle cx="34" cy="644" r="3" fill="#2563EB"/><text x="46" y="648" class="body" text-anchor="start">Failures 3</text><circle cx="34" cy="664" r="3" fill="#2563EB"/><text x="46" y="668" class="body" text-anchor="start">Retry queued</text><circle cx="30" cy="590" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="595" class="inverse" text-anchor="middle">4</text><rect x="16" y="722" width="358" height="104" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="750" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="774" r="12" fill="#2563EB"/><text x="40" y="778" class="inverse" text-anchor="middle">1</text><text x="62" y="776" class="annoTitle" text-anchor="start">Section-based builder</text><text x="62" y="794" class="annoText" text-anchor="start">Mobile presents the template as structured sections rather than a full desktop canvas.</text><circle cx="40" cy="826" r="12" fill="#2563EB"/><text x="40" y="830" class="inverse" text-anchor="middle">2</text><text x="62" y="828" class="annoTitle" text-anchor="start">Warning visibility</text><text x="62" y="846" class="annoText" text-anchor="start">Placeholder errors remain highly visible even in the compact flow.</text></svg>
