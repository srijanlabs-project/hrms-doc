<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Team Command Center</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Dashboard</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Attendance</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Hiring</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Mobility</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Manager</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Mobility Proposal Workspace</text><rect x="296" y="152" width="74" height="28" rx="14" fill="#DBEAFE"/><text x="333.0" y="170" class="small" text-anchor="middle">Draft 9</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="382" y="152" width="110" height="28" rx="14" fill="#FEF3C7"/><text x="437.0" y="170" class="small" text-anchor="middle">Budget impact</text><rect x="504" y="152" width="96" height="28" rx="14" fill="#FEE2E2"/><text x="552.0" y="170" class="small" text-anchor="middle">Blockers 2</text><rect x="808" y="146" width="162" height="40" rx="14" fill="#2563EB"/><text x="889.0" y="172" class="inverse" text-anchor="middle">Create proposal</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="982" y="146" width="188" height="40" rx="14" fill="#0F766E"/><text x="1076.0" y="172" class="inverse" text-anchor="middle">Submit for approval</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, proposal id, target role, approver, or effective date</text><rect x="856" y="226" width="88" height="28" rx="14" fill="#EAF2F8"/><text x="900.0" y="244" class="small" text-anchor="middle">Promotion</text><rect x="954" y="226" width="78" height="28" rx="14" fill="#EAF2F8"/><text x="993.0" y="244" class="small" text-anchor="middle">Transfer</text><rect x="1042" y="226" width="128" height="28" rx="14" fill="#10324A"/><text x="1106.0" y="244" class="inverse" text-anchor="middle">Awaiting approval</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Drafts</text><text x="364" y="362" class="metric" text-anchor="start">09</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Under app</text><text x="586" y="362" class="metric" text-anchor="start">05</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Effective</text><text x="808" y="362" class="metric" text-anchor="start">04</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Budget ex</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Pos block</text><text x="1252" y="362" class="metric" text-anchor="start">02</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Current vs proposed assignment</text><text x="312" y="464" class="small" text-anchor="start">Desktop keeps side-by-side structure, manager, grade, and location comparison in one plane</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Senior Analyst proposed to Lead Analyst</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Manager change visible in compare</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">L4 to L5 triggers compensation review</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Effective date requested for 01 Aug with overlap plan</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Impact and approval route</text><text x="664" y="464" class="small" text-anchor="start">Route, budget, and vacancy readiness must be understood before submit</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Route and budget cue</text><text x="684" y="522" class="body" text-anchor="start">If the target position is unavailable or budget is exceeded, submit remains possible only with exception rationale and a broader approval route.</text><text x="684" y="544" class="small" text-anchor="start">Next step: review route, inspect position availability, or hold the proposal till downstream dependencies clear.</text><rect x="666" y="574" width="132" height="40" rx="14" fill="#2563EB"/><text x="732.0" y="600" class="inverse" text-anchor="middle">Review route</text><rect x="812" y="574" width="134" height="40" rx="14" fill="#EEF2FF"/><text x="879.0" y="600" class="body" text-anchor="middle">Open vacancy</text><rect x="960" y="574" width="144" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1032.0" y="600" class="body" text-anchor="middle">Dependency list</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Readiness and dependency checks</text><text x="312" y="754" class="small" text-anchor="start">Proposal quality depends on prerequisites outside the movement form itself</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Destination cost center validated</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Payroll cutoff warning if date slips</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Employee acknowledgment required</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Access reprovisioning task auto-creates after approval</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Timeline, evidence, and related cases</text><text x="664" y="754" class="small" text-anchor="start">Mobility sits beside promotion, compensation, and workforce-planning history</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">1 prior transfer completed last year</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Performance rating supports promotion path</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Succession note marks employee as ready-now</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Linked salary revision case still draft</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned mobility lenses</text><text x="312" y="994" class="small" text-anchor="start">Managers can pin compare, budget, vacancy, and HRBP-dependent views for repeat proposal work</text><rect x="320" y="990" width="92" height="28" rx="14" fill="#DCFCE7"/><text x="366.0" y="1008" class="small" text-anchor="middle">Engineering</text><rect x="424" y="990" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="470.0" y="1008" class="small" text-anchor="middle">Cross-city</text><rect x="528" y="990" width="72" height="28" rx="14" fill="#FEF3C7"/><text x="564.0" y="1008" class="small" text-anchor="middle">L4-L5</text><rect x="612" y="990" width="98" height="28" rx="14" fill="#FEE2E2"/><text x="661.0" y="1008" class="small" text-anchor="middle">Budget risk</text><rect x="722" y="990" width="76" height="28" rx="14" fill="#EDE9FE"/><text x="760.0" y="1008" class="small" text-anchor="middle">Vacancy</text><rect x="810" y="990" width="96" height="28" rx="14" fill="#F8FAFC"/><text x="858.0" y="1008" class="small" text-anchor="middle">Needs HRBP</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Compare is the main work</text><text x="1224" y="224" class="annoText" text-anchor="start">Managers need source and target assignment visible together.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Impact before submit</text><text x="1224" y="276" class="annoText" text-anchor="start">Budget, payroll, and provisioning consequences should appear upstream of routing.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Route is never hidden</text><text x="1224" y="328" class="annoText" text-anchor="start">Approval ownership and exception expansion must remain visible.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Position readiness is explicit</text><text x="1224" y="380" class="annoText" text-anchor="start">Mobility cannot assume target vacancy or position validity.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Compensation dependency stays close</text><text x="1224" y="432" class="annoText" text-anchor="start">Grade-changing moves must show salary implications nearby.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">History supports fairness</text><text x="1224" y="484" class="annoText" text-anchor="start">Prior moves and performance context help explain why the proposal exists.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile is review-first</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support route and blocker handling while dense compare stays desktop-first.</text></svg>
