<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">My Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Benefits and Claims</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Plans</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Enrollment</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Claims</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Dependents</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Benefits</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">My Benefits and Claims</text><rect x="296" y="152" width="98" height="28" rx="14" fill="#DCFCE7"/><text x="345.0" y="170" class="small" text-anchor="middle">Window open</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="406" y="152" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="462.0" y="170" class="small" text-anchor="middle">Claim returned</text><rect x="530" y="152" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="576.0" y="170" class="small" text-anchor="middle">Policy lock</text><rect x="808" y="146" width="176" height="40" rx="14" fill="#2563EB"/><text x="896.0" y="172" class="inverse" text-anchor="middle">Update enrollment</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="996" y="146" width="146" height="40" rx="14" fill="#0F766E"/><text x="1069.0" y="172" class="inverse" text-anchor="middle">Submit claim</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search plan, claim, dependent, insurer contact, reimbursement, or policy document</text><rect x="856" y="226" width="84" height="28" rx="14" fill="#EAF2F8"/><text x="898.0" y="244" class="small" text-anchor="middle">Benefits</text><rect x="950" y="226" width="74" height="28" rx="14" fill="#EAF2F8"/><text x="987.0" y="244" class="small" text-anchor="middle">Claims</text><rect x="1034" y="226" width="86" height="28" rx="14" fill="#10324A"/><text x="1077.0" y="244" class="inverse" text-anchor="middle">Coverage</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Plans</text><text x="364" y="362" class="metric" text-anchor="start">04</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Claims</text><text x="586" y="362" class="metric" text-anchor="start">02</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="808" y="332" class="small" text-anchor="start">Reimburse</text><text x="808" y="362" class="metric" text-anchor="start">01</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="1030" y="332" class="small" text-anchor="start">Dependents</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Window</text><text x="1252" y="362" class="metric" text-anchor="start">7d</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Coverage and plan summary</text><text x="312" y="464" class="small" text-anchor="start">Eligibility, effective dates, and employee cost should be understandable before any change is requested</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Medical, insurance, wellness, and retirement plans grouped</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Employer and employee contribution preview shown</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Waived plans explain eligibility</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Provider docs and contacts stay attached</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Enrollment and claim guidance</text><text x="664" y="464" class="small" text-anchor="start">Windowed plan changes and claim correction paths stay visible in one workspace</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Governed benefits action</text><text x="684" y="522" class="body" text-anchor="start">Outside open enrollment, plan changes lock unless a life event or exception route applies, while returned claims show correction guidance without unnecessary medical detail.</text><text x="684" y="544" class="small" text-anchor="start">Next step: update enrollment, open a returned claim, or ask the benefits assistant while adjudication and payroll deduction processing stay back-office.</text><rect x="666" y="574" width="164" height="40" rx="14" fill="#2563EB"/><text x="748.0" y="600" class="inverse" text-anchor="middle">Update enrollment</text><rect x="844" y="574" width="122" height="40" rx="14" fill="#EEF2FF"/><text x="905.0" y="600" class="body" text-anchor="middle">Open claim</text><rect x="980" y="574" width="134" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1047.0" y="600" class="body" text-anchor="middle">Ask assistant</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Claims and reimbursement tracker</text><text x="312" y="754" class="small" text-anchor="start">Employees should understand status, next step, and settlement path without calling support</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Submitted to reversed claim states visible</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Insurer or TPA reference shown inline</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Bank-paid and payroll-paid reimbursements distinguished</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Missing evidence and deadlines highlighted</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Dependents, nominees, and policy docs</text><text x="664" y="754" class="small" text-anchor="start">Family-linked data stays governed, verified, and privacy-safe</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Dependent verification status visible</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Add or edit routes through governed self-service</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Nominee details distinct from claims</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Policy documents and contacts easy to reopen</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned benefits lenses</text><text x="312" y="994" class="small" text-anchor="start">Employees can pin enrollment, claims, dependent, and coverage views for recurring use</text><rect x="320" y="990" width="94" height="28" rx="14" fill="#DCFCE7"/><text x="367.0" y="1008" class="small" text-anchor="middle">Enrollment</text><rect x="426" y="990" width="72" height="28" rx="14" fill="#DBEAFE"/><text x="462.0" y="1008" class="small" text-anchor="middle">Claims</text><rect x="510" y="990" width="98" height="28" rx="14" fill="#FEF3C7"/><text x="559.0" y="1008" class="small" text-anchor="middle">Dependents</text><rect x="620" y="990" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="666.0" y="1008" class="small" text-anchor="middle">Reimburse</text><rect x="724" y="990" width="100" height="28" rx="14" fill="#EDE9FE"/><text x="774.0" y="1008" class="small" text-anchor="middle">Policy docs</text><rect x="836" y="990" width="82" height="28" rx="14" fill="#F8FAFC"/><text x="877.0" y="1008" class="small" text-anchor="middle">Coverage</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Eligibility-driven self-service</text><text x="1224" y="224" class="annoText" text-anchor="start">Lock rules should be obvious before employees attempt changes.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Medical detail stays minimal</text><text x="1224" y="276" class="annoText" text-anchor="start">Claim status should be actionable without oversharing sensitive health information.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Enrollment windows are core states</text><text x="1224" y="328" class="annoText" text-anchor="start">Open, locked, and life-event conditions belong in the main interaction flow.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Payroll edits stay elsewhere</text><text x="1224" y="380" class="annoText" text-anchor="start">Deduction previews are allowed here, but payroll changes are not.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Returned claims need loops</text><text x="1224" y="432" class="annoText" text-anchor="start">Employees need clear correction paths for common claim failures.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Dependents stay governed</text><text x="1224" y="484" class="annoText" text-anchor="start">Family data should remain tied to verification and evidence expectations.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile favors urgent follow-up</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should make claims and enrollment status easy to act on fast.</text></svg>
