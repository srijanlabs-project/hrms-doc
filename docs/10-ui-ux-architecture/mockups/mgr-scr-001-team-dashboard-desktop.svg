<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Team Command Center</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Dashboard</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Attendance</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Performance</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Hiring</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Manager</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Team Dashboard</text><rect x="296" y="152" width="128" height="28" rx="14" fill="#FEE2E2"/><text x="360.0" y="170" class="small" text-anchor="middle">Approvals 11</text><rect x="436" y="152" width="146" height="28" rx="14" fill="#FEF3C7"/><text x="509.0" y="170" class="small" text-anchor="middle">Absence spike</text><rect x="594" y="152" width="150" height="28" rx="14" fill="#EDE9FE"/><text x="669.0" y="170" class="small" text-anchor="middle">Review cycle live</text><rect x="808" y="146" width="178" height="40" rx="14" fill="#2563EB"/><text x="897" y="172" class="inverse" text-anchor="middle">Ask manager copilot</text><rect x="998" y="146" width="160" height="40" rx="14" fill="#0F766E"/><text x="1078" y="172" class="inverse" text-anchor="middle">Open approvals</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search, ask, or type a command like show team leave risks</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Ask</text><rect x="964" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/><text x="1019.0" y="244" class="small" text-anchor="middle">Command</text><rect x="1084" y="226" width="56" height="28" rx="14" fill="#10324A"/><text x="1112.0" y="244" class="inverse" text-anchor="middle">Go</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="364" y="332" class="small" text-anchor="start">Pending approvals</text><text x="364" y="362" class="metric" text-anchor="start">11</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="586" y="332" class="small" text-anchor="start">Team present</text><text x="586" y="362" class="metric" text-anchor="start">86%</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Leave today</text><text x="808" y="362" class="metric" text-anchor="start">07</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Reviews due</text><text x="1030" y="362" class="metric" text-anchor="start">05</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Risk watch</text><text x="1252" y="362" class="metric" text-anchor="start">03</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Priority approvals</text><text x="312" y="464" class="small" text-anchor="start">Managers need the queue, SLA, and policy context before secondary analytics</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Leave request: Priya Shah - awaiting action today</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Promotion request: Anil Kumar - budget note attached</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Travel approval: Meera Jain - finance concurrence needed</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Expense exception: overtime meal claim returned for review</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Manager copilot and guided actions</text><text x="664" y="464" class="small" text-anchor="start">AI summarizes risk, suggests follow-up, and never bypasses decision control</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI recommendation</text><text x="684" y="522" class="body" text-anchor="start">Three consecutive absences in support pod B may affect shift coverage tomorrow.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: review attendance exceptions, notify backup roster, and check pending leave overlap.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review actions</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Escalate to HRBP</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Team health snapshot</text><text x="312" y="754" class="small" text-anchor="start">Team availability, attendance, and engagement indicators stay close to action</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Support pod B absence spike above threshold</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Two team members on probation ending this month</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">One low-survey sentiment trend needs follow-up</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Delegated approver active for West region</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Growth, hiring, and skills watch</text><text x="664" y="754" class="small" text-anchor="start">The manager landing page must support both daily approvals and talent decisions</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Five reviews due this week</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Two internal mobility matches suggested by skills graph</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">One requisition blocked by interview feedback delay</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Leadership pipeline depth marked medium for engineering pod</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Personalized manager widgets</text><text x="312" y="994" class="small" text-anchor="start">Managers can tailor cards for roster, hiring, reviews, workload, and risk signals by operating context</text><rect x="320" y="990" width="116" height="28" rx="14" fill="#FEE2E2"/><text x="378.0" y="1008" class="small" text-anchor="middle">Approvals</text><rect x="448" y="990" width="124" height="28" rx="14" fill="#DCFCE7"/><text x="510.0" y="1008" class="small" text-anchor="middle">Attendance</text><rect x="584" y="990" width="110" height="28" rx="14" fill="#DBEAFE"/><text x="639.0" y="1008" class="small" text-anchor="middle">Reviews</text><rect x="706" y="990" width="98" height="28" rx="14" fill="#FEF3C7"/><text x="755.0" y="1008" class="small" text-anchor="middle">Hiring</text><rect x="816" y="990" width="144" height="28" rx="14" fill="#EDE9FE"/><text x="888.0" y="1008" class="small" text-anchor="middle">Skills match</text><rect x="972" y="990" width="106" height="28" rx="14" fill="#F8FAFC"/><text x="1025.0" y="1008" class="small" text-anchor="middle">Risks</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Manager-first actions</text><text x="1224" y="224" class="annoText" text-anchor="start">The hero strip balances AI help with direct access to the approvals queue.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Typed command execution</text><text x="1224" y="276" class="annoText" text-anchor="start">Managers can search, ask, or trigger guided commands from one governed entry point.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Actionable team signals</text><text x="1224" y="328" class="annoText" text-anchor="start">Metrics reflect team operations, not employee self-service indicators.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Queue before dashboards</text><text x="1224" y="380" class="annoText" text-anchor="start">Pending decisions are stronger than passive charts because the role is operational.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable risk guidance</text><text x="1224" y="432" class="annoText" text-anchor="start">Copilot recommendations show the reason, next steps, and human escalation path.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Daily plus strategic scope</text><text x="1224" y="484" class="annoText" text-anchor="start">Growth, hiring, risk, and availability sit together because manager work spans both horizons.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Personalization for org context</text><text x="1224" y="536" class="annoText" text-anchor="start">Different managers can surface pods, shifts, or review-heavy widgets based on their teams.</text></svg>
