<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Cutover</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Timeline</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Dependencies</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Checkpoints</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Rollback</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">CUTOVER</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Cutover Command Center</text><rect x="296" y="152" width="114" height="28" rx="14" fill="#DBEAFE"/><text x="353.0" y="170" class="small" text-anchor="middle">Freeze active</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="422" y="152" width="84" height="28" rx="14" fill="#FEF3C7"/><text x="464.0" y="170" class="small" text-anchor="middle">Hold 2</text><rect x="518" y="152" width="122" height="28" rx="14" fill="#FEE2E2"/><text x="579.0" y="170" class="small" text-anchor="middle">Rollback ready</text><rect x="808" y="146" width="170" height="40" rx="14" fill="#2563EB"/><text x="893.0" y="172" class="inverse" text-anchor="middle">Open checkpoint</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="990" y="146" width="188" height="40" rx="14" fill="#0F766E"/><text x="1084.0" y="172" class="inverse" text-anchor="middle">Generate status brief</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search task, owner, dependency, checkpoint, freeze step, or rollback trigger</text><rect x="856" y="226" width="94" height="28" rx="14" fill="#EAF2F8"/><text x="903.0" y="244" class="small" text-anchor="middle">Timeline</text><rect x="960" y="226" width="76" height="28" rx="14" fill="#EAF2F8"/><text x="998.0" y="244" class="small" text-anchor="middle">Graph</text><rect x="1046" y="226" width="46" height="28" rx="14" fill="#10324A"/><text x="1069.0" y="244" class="inverse" text-anchor="middle">Live</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Tasks</text><text x="364" y="362" class="metric" text-anchor="start">84</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Complete</text><text x="586" y="362" class="metric" text-anchor="start">61</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Blocked</text><text x="808" y="362" class="metric" text-anchor="start">06</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Checkpoints</text><text x="1030" y="362" class="metric" text-anchor="start">05/07</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Deps</text><text x="1252" y="362" class="metric" text-anchor="start">12</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Timeline and active sequencing</text><text x="312" y="464" class="small" text-anchor="start">Cutover teams need one synchronized source of truth under time pressure</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Freeze is active across implementation environments</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">84 cutover tasks tracked in current runbook</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">6 tasks blocked on upstream confirmation</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Checkpoint hold active on one payroll validation gate</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Dependency graph and checkpoint control</text><text x="664" y="464" class="small" text-anchor="start">Owners, dependencies, and checkpoint decisions stay linked to current execution state</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Cutover insight</text><text x="684" y="522" class="body" text-anchor="start">The final employee delta load is ready, but the payroll checkpoint cannot advance until the downstream payslip job and signoff evidence both return green.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect dependency owners, clear the checkpoint hold, and keep rollback trigger visibility available throughout the freeze.</text><rect x="666" y="574" width="142" height="40" rx="14" fill="#2563EB"/><text x="737.0" y="600" class="inverse" text-anchor="middle">Open graph</text><rect x="822" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="884.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="960" y="574" width="150" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1035.0" y="600" class="body" text-anchor="middle">Open checkpoint</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Owner status and communications</text><text x="312" y="754" class="small" text-anchor="start">Program leads need synchronized execution and clear accountability by workstream</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Ops, migration, QA, and business owners all visible</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">2 communications drafts pending checkpoint release</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">One environment still in pre-freeze state</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Critical-path lane highlighted for exec review</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Rollback readiness and chronology</text><text x="664" y="754" class="small" text-anchor="start">Rollback triggers stay visible without overpowering the mission-control flow</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Rollback path verified against current freeze stage</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 checkpoint holds still open</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Event chronology retained for audit replay</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Status brief can be exported for leadership</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned cutover lenses</text><text x="312" y="994" class="small" text-anchor="start">Program teams can pin critical path, freeze, owner, checkpoint, and rollback-oriented cutover views</text><rect x="320" y="990" width="118" height="28" rx="14" fill="#DCFCE7"/><text x="379.0" y="1008" class="small" text-anchor="middle">Critical path</text><rect x="450" y="990" width="88" height="28" rx="14" fill="#DBEAFE"/><text x="494.0" y="1008" class="small" text-anchor="middle">Freeze</text><rect x="550" y="990" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="606.0" y="1008" class="small" text-anchor="middle">Checkpoint</text><rect x="674" y="990" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="720.0" y="1008" class="small" text-anchor="middle">Blocked</text><rect x="778" y="990" width="106" height="28" rx="14" fill="#EDE9FE"/><text x="831.0" y="1008" class="small" text-anchor="middle">Rollback</text><rect x="896" y="990" width="74" height="28" rx="14" fill="#F8FAFC"/><text x="933.0" y="1008" class="small" text-anchor="middle">Exec</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Time pressure changes hierarchy</text><text x="1224" y="224" class="annoText" text-anchor="start">The design favors sequencing, blockers, and checkpoint control over broad analytics.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Dependencies stay visible</text><text x="1224" y="276" class="annoText" text-anchor="start">Cutover risk often hides in task relationships, so the graph remains in the main plane.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Checkpoint is operational</text><text x="1224" y="328" class="annoText" text-anchor="start">Checkpoint decisions are shown as active gates, not passive milestone labels.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Owner clarity matters</text><text x="1224" y="380" class="annoText" text-anchor="start">Program managers need immediate accountability without opening separate reports.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Rollback is nearby</text><text x="1224" y="432" class="annoText" text-anchor="start">Rollback readiness stays visible so recovery is always considered during live cutover.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Freeze is explicit</text><text x="1224" y="484" class="annoText" text-anchor="start">Freeze state is shown prominently because many actions depend on it.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile summarizes safely</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support supervision and escalation while dense dependency work remains desktop-led.</text></svg>
