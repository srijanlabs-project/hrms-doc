  <rect width="1440" height="1280" fill="#F4F7FB"/>
  <rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/>
  <text x="52" y="72" class="inverse">Identity Control</text>
  <rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.10)"/>
  <text x="62" y="116" class="inverse">Enterprise HRMS</text>
  <rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/>
  <text x="60" y="168" class="inverse">Delegation Control</text>
  <rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="220" class="inverse">Sessions</text>
  <rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="272" class="inverse">Devices</text>
  <rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="324" class="inverse">Proxy Login</text>
  <rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="376" class="inverse">Support Context</text>
  <rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="428" class="inverse">Audit Review</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="61" class="small">Search delegate, acted-for user, session, device, ticket, or proxy event</text>
  <rect x="1060" y="40" width="110" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1115" y="58" class="small" text-anchor="middle">Security Admin</text>
  <rect x="1184" y="40" width="104" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1236" y="58" class="small" text-anchor="middle">Alerts 07</text>
  <rect x="1302" y="40" width="98" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1351" y="58" class="small" text-anchor="middle">Reviews 05</text>

  <text x="310" y="128" class="title">Delegation Session and Device Control</text>
  <rect x="296" y="152" width="116" height="28" rx="14" fill="#DBEAFE"/>
  <text x="354" y="170" class="small" text-anchor="middle">Org admin lane</text>
  <rect x="424" y="152" width="126" height="28" rx="14" fill="#DCFCE7"/>
  <text x="487" y="170" class="small" text-anchor="middle">Support lead ready</text>
  <rect x="562" y="152" width="136" height="28" rx="14" fill="#FEF3C7"/>
  <text x="630" y="170" class="small" text-anchor="middle">Proxy review due 02</text>
  <rect x="808" y="146" width="172" height="40" rx="14" fill="#2563EB"/>
  <text x="894" y="172" class="inverse" text-anchor="middle">Review support context</text>
  <circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="820" y="151" class="inverse" text-anchor="middle">1</text>
  <rect x="992" y="146" width="166" height="40" rx="14" fill="#0F766E"/>
  <text x="1075" y="172" class="inverse" text-anchor="middle">Create delegation window</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="249" class="body">Search by user, ticket, delegated scope, device trust, or acted-for session risk</text>
  <rect x="856" y="226" width="110" height="28" rx="14" fill="#EAF2F8"/>
  <text x="911" y="244" class="small" text-anchor="middle">Delegations</text>
  <rect x="976" y="226" width="90" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1021" y="244" class="small" text-anchor="middle">Sessions</text>
  <rect x="1076" y="226" width="74" height="28" rx="14" fill="#10324A"/>
  <text x="1113" y="244" class="inverse" text-anchor="middle">High risk</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">2</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small">Active delegations</text>
  <text x="364" y="362" class="metric">11</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">3</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="586" y="332" class="small">Delegated sessions</text>
  <text x="586" y="362" class="metric">08</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="808" y="332" class="small">Untrusted devices</text>
  <text x="808" y="362" class="metric">03</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#7C3AED"/>
  <text x="1030" y="332" class="small">Proxy windows</text>
  <text x="1030" y="362" class="metric">04</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="1252" y="332" class="small">Support context holds</text>
  <text x="1252" y="362" class="metric">02</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Delegation windows and approval queue</text>
  <text x="312" y="464" class="small">Org admin and security admin share one view of time-bound authority, exclusions, and pending reviews</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body">Priya Nair delegates leave, roster, and helpdesk actions to Arjun Rao from 18 Jul to 24 Jul 2026</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body">Payroll release, bank changes, legal entity edits, and user termination remain non-delegable</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body">One delegation awaits security admin signoff because proxy login is requested for after-hours support</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body">Dual attribution is mandatory so acted-for and acting user both appear in approvals and audit events</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Selected delegated session and device review</text>
  <text x="664" y="464" class="small">UT-07 identity clarity combines with AD-04 style evidence, risk, and session inspection</text>
  <rect x="666" y="470" width="94" height="28" rx="14" fill="#DBEAFE"/>
  <text x="713" y="488" class="small" text-anchor="middle">Acted for</text>
  <rect x="772" y="470" width="124" height="28" rx="14" fill="#DCFCE7"/>
  <text x="834" y="488" class="small" text-anchor="middle">Device trusted</text>
  <rect x="908" y="470" width="102" height="28" rx="14" fill="#FEF3C7"/>
  <text x="959" y="488" class="small" text-anchor="middle">Ticket INC-4821</text>
  <rect x="1022" y="470" width="118" height="28" rx="14" fill="#EDE9FE"/>
  <text x="1081" y="488" class="small" text-anchor="middle">Auto-expire 22:00</text>
  <circle cx="666" cy="514" r="3" fill="#2563EB"/>
  <text x="678" y="518" class="body">Active session shows Arjun Rao acting for Priya Nair in India Sales tenant with masked PII banner enabled</text>
  <circle cx="666" cy="534" r="3" fill="#2563EB"/>
  <text x="678" y="538" class="body">Chrome on managed Windows laptop passed device posture and geofenced IP check at 19:14 IST</text>
  <circle cx="666" cy="554" r="3" fill="#2563EB"/>
  <text x="678" y="558" class="body">A second mobile login attempt from an untrusted Android handset was blocked pending step-up verification</text>
  <circle cx="666" cy="574" r="3" fill="#2563EB"/>
  <text x="678" y="578" class="body">Session evidence includes justification ticket, supervisor note, IP, browser fingerprint, and activity transcript pointer</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">Proxy-login controls</text>
  <text x="312" y="754" class="small">Proxy capability is explicit, constrained, and never looks like a normal delegated handoff</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body">Support lead must attach incident or change reference before proxy login can begin</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body">Proxy sessions require MFA re-check, shortened timeout, and read/write scope declaration up front</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body">High-risk actions such as payroll finalization and bank detail edits stay blocked even in support context</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body">Exit control forces summary note and evidence capture before closing the proxied session</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3">Support-context safeguards and collision review</text>
  <text x="664" y="754" class="small">Support visibility, masking, and termination controls stay adjacent to live session evidence</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body">Two support-context sessions are paused because customer approval expired before issue resolution completed</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body">Masked salary, bank, and identity proof zones remain visible as guarded blocks rather than disappearing silently</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body">Org admin can terminate any acted-for session instantly while security admin retains evidence package for later review</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body">Concurrent delegated and proxied access to the same worker record is flagged to avoid ambiguous accountability</text>
  <circle cx="666" cy="728" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3">Pinned delegation lenses</text>
  <text x="312" y="994" class="small">Operators pin the review slices they revisit daily across admin, support, and security work</text>
  <rect x="320" y="990" width="112" height="28" rx="14" fill="#DCFCE7"/>
  <text x="376" y="1008" class="small" text-anchor="middle">Live delegates</text>
  <rect x="444" y="990" width="120" height="28" rx="14" fill="#DBEAFE"/>
  <text x="504" y="1008" class="small" text-anchor="middle">Session review</text>
  <rect x="576" y="990" width="124" height="28" rx="14" fill="#FEF3C7"/>
  <text x="638" y="1008" class="small" text-anchor="middle">Proxy pending</text>
  <rect x="712" y="990" width="126" height="28" rx="14" fill="#EDE9FE"/>
  <text x="775" y="1008" class="small" text-anchor="middle">Device mismatch</text>
  <rect x="850" y="990" width="144" height="28" rx="14" fill="#F8FAFC"/>
  <text x="922" y="1008" class="small" text-anchor="middle">Support hold</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">7</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Support review is elevated</text>
  <text x="1224" y="224" class="annoText">The first action is review-oriented because proxy context changes trust boundaries, not just task ownership.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">Search by evidence</text>
  <text x="1224" y="276" class="annoText">Operators can locate a risky session through tickets, devices, and acted-for state rather than user names alone.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">Health strip before detail</text>
  <text x="1224" y="328" class="annoText">Delegation, device, proxy, and support posture appear ahead of the deeper investigative panels.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Delegation remains bounded</text>
  <text x="1224" y="380" class="annoText">The queue emphasizes windows, exclusions, and approvals so delegation never reads as open-ended access transfer.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">Identity plus evidence</text>
  <text x="1224" y="432" class="annoText">This center panel intentionally merges UT-07 identity clarity with AD-04 session and device evidence.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">Proxy is not a shortcut</text>
  <text x="1224" y="484" class="annoText">Support context shows ticketing, masking, expiry, and termination controls so elevated access stays exceptional.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Pinned review lenses</text>
  <text x="1224" y="536" class="annoText">The saved chips reflect how org admin, security admin, and support lead revisit the same high-risk cohorts.</text>
</svg>
