<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Settings</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Scopes</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">History</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Approval</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Rollback</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">SETTINGS</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">System Settings Console</text><rect x="296" y="152" width="112" height="28" rx="14" fill="#DBEAFE"/><text x="352.0" y="170" class="small" text-anchor="middle">Approvals 3</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="420" y="152" width="110" height="28" rx="14" fill="#FEF3C7"/><text x="475.0" y="170" class="small" text-anchor="middle">High risk 9</text><rect x="542" y="152" width="126" height="28" rx="14" fill="#FEE2E2"/><text x="605.0" y="170" class="small" text-anchor="middle">Rollback 24h</text><rect x="808" y="146" width="188" height="40" rx="14" fill="#2563EB"/><text x="902.0" y="172" class="inverse" text-anchor="middle">Open change request</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="1008" y="146" width="138" height="40" rx="14" fill="#0F766E"/><text x="1077.0" y="172" class="inverse" text-anchor="middle">Rollback</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search setting key, owner, scope, risk class, environment drift, or change request</text><rect x="856" y="226" width="94" height="28" rx="14" fill="#EAF2F8"/><text x="903.0" y="244" class="small" text-anchor="middle">Compare</text><rect x="960" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="1006.0" y="244" class="small" text-anchor="middle">History</text><rect x="1062" y="226" width="46" height="28" rx="14" fill="#10324A"/><text x="1085.0" y="244" class="inverse" text-anchor="middle">Edit</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Active</text><text x="364" y="362" class="metric" text-anchor="start">2148</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Changed 7d</text><text x="586" y="362" class="metric" text-anchor="start">14</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Drift</text><text x="808" y="362" class="metric" text-anchor="start">05</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Validation</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Critical</text><text x="1252" y="362" class="metric" text-anchor="start">09</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Settings domains and key inventory</text><text x="312" y="464" class="small" text-anchor="start">Definition-first tables help operators judge risk before touching values</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">9 high-risk keys in payroll and identity domains</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">3 pending approvals block immediate activation</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Environment drift detected in 5 settings</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">14 critical changes landed in the last 7 days</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Change composer and lineage compare</text><text x="664" y="464" class="small" text-anchor="start">Proposed value, scope lineage, and downstream impact stay in one governed edit surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Change insight</text><text x="684" y="522" class="body" text-anchor="start">Turning on payroll_auto_close at tenant scope would override the provider default and trigger close workflow changes for two active entities.</text><text x="684" y="544" class="small" text-anchor="start">Next step: compare scopes, validate dependencies, and submit approval before scheduling activation.</text><rect x="666" y="574" width="154" height="40" rx="14" fill="#2563EB"/><text x="743.0" y="600" class="inverse" text-anchor="middle">Compare scopes</text><rect x="834" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="896.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1045.0" y="600" class="body" text-anchor="middle">Open history</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Resolution and rollback history</text><text x="312" y="754" class="small" text-anchor="start">Rollback candidates and prior versions stay visible during governed setting changes</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">24-hour rollback window active for 7 keys</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Prior version snapshots stored for all critical settings</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">1 failed validation still unresolved</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Scope lineage differs between provider and tenant</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Runtime risk and incident notes</text><text x="664" y="754" class="small" text-anchor="start">Downstream service impact, cache behavior, and audit duties remain explicit</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Cache TTL refresh required on publish</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Workflow service affected by selected key</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Audit comment mandatory for critical updates</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Linked incident open for one drifted value</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned settings-governance lenses</text><text x="312" y="994" class="small" text-anchor="start">Platform admins can pin domain, risk, scope, rollback, and drift-focused settings views</text><rect x="320" y="990" width="102" height="28" rx="14" fill="#DCFCE7"/><text x="371.0" y="1008" class="small" text-anchor="middle">Payroll</text><rect x="434" y="990" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="482.0" y="1008" class="small" text-anchor="middle">Tenant</text><rect x="542" y="990" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="598.0" y="1008" class="small" text-anchor="middle">High risk</text><rect x="666" y="990" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="712.0" y="1008" class="small" text-anchor="middle">Drift</text><rect x="770" y="990" width="110" height="28" rx="14" fill="#EDE9FE"/><text x="825.0" y="1008" class="small" text-anchor="middle">Rollback</text><rect x="892" y="990" width="100" height="28" rx="14" fill="#F8FAFC"/><text x="942.0" y="1008" class="small" text-anchor="middle">History</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Definition before value</text><text x="1224" y="224" class="annoText" text-anchor="start">Risk class, scope, and owner matter before operators decide whether to edit a setting.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Compare and compose together</text><text x="1224" y="276" class="annoText" text-anchor="start">Safe configuration depends on proposed value and effective lineage being visible together.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Rollback is first-class</text><text x="1224" y="328" class="annoText" text-anchor="start">Operational rollback is surfaced early because configuration mistakes can be production incidents.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Validation is visible</text><text x="1224" y="380" class="annoText" text-anchor="start">Validation failures sit in the KPI row because they directly govern publish safety.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Scope compare is explicit</text><text x="1224" y="432" class="annoText" text-anchor="start">Override behavior is treated as a first-class action to reduce enterprise misconfiguration.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Runtime notes stay nearby</text><text x="1224" y="484" class="annoText" text-anchor="start">Cache and downstream service impact are visible without cluttering the edit flow.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile stays capable</text><text x="1224" y="536" class="annoText" text-anchor="start">Urgent review and rollback can happen away from desk, but dense compare views collapse into drill-down.</text></svg>
