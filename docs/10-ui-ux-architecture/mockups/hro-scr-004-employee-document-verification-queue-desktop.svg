<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">People Operations Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">HR Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">People Ops</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Documents</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Verification Queue</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Retention</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Reports</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Verify</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Employee Document Verification Queue</text><rect x="296" y="152" width="70" height="28" rx="14" fill="#FEF3C7"/><text x="331.0" y="170" class="small" text-anchor="middle">Pending</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="378" y="152" width="86" height="28" rx="14" fill="#DBEAFE"/><text x="421.0" y="170" class="small" text-anchor="middle">Restricted</text><rect x="476" y="152" width="82" height="28" rx="14" fill="#FEE2E2"/><text x="517.0" y="170" class="small" text-anchor="middle">OCR flags</text><rect x="808" y="146" width="168" height="40" rx="14" fill="#2563EB"/><text x="892.0" y="172" class="inverse" text-anchor="middle">Verify document</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="988" y="146" width="172" height="40" rx="14" fill="#0F766E"/><text x="1074.0" y="172" class="inverse" text-anchor="middle">Request reupload</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, document type, case, expiry, verifier, or integrity issue within authorized scope</text><rect x="856" y="226" width="70" height="28" rx="14" fill="#EAF2F8"/><text x="891.0" y="244" class="small" text-anchor="middle">Pending</text><rect x="936" y="226" width="82" height="28" rx="14" fill="#EAF2F8"/><text x="977.0" y="244" class="small" text-anchor="middle">Expiring</text><rect x="1028" y="226" width="88" height="28" rx="14" fill="#10324A"/><text x="1072.0" y="244" class="inverse" text-anchor="middle">Restricted</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Pending</text><text x="364" y="362" class="metric" text-anchor="start">26</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Rejected</text><text x="586" y="362" class="metric" text-anchor="start">05</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Exp 30d</text><text x="808" y="362" class="metric" text-anchor="start">08</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Restricted</text><text x="1030" y="362" class="metric" text-anchor="start">11</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Quality</text><text x="1252" y="362" class="metric" text-anchor="start">07</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Verification queue and category mix</text><text x="312" y="464" class="small" text-anchor="start">Review workload grouped by process, type, owner, and urgency</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Pending items split by onboarding, profile change, payroll, and exit</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Identity, tax, bank, contract, and compliance filters separated</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Expired mandatory documents stay above routine review</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Restricted rows keep access-state indicators visible</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Preview, metadata, and decision rail</text><text x="664" y="464" class="small" text-anchor="start">Reviewers need the file, extracted metadata, and decision controls in one surface</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Restricted preview</text><text x="684" y="522" class="body" text-anchor="start">Restricted categories may use watermark-only preview or block raw download, and every verify, reject, and replace action is audited.</text><text x="684" y="544" class="small" text-anchor="start">Next step: verify, reject with reason, request reupload, or inspect version history without leaving the queue.</text><rect x="666" y="574" width="102" height="40" rx="14" fill="#2563EB"/><text x="717.0" y="600" class="inverse" text-anchor="middle">Verify</text><rect x="782" y="574" width="98" height="36" rx="12" fill="#EEF2FF"/><text x="831.0" y="598" class="body" text-anchor="middle">Reject</text><rect x="894" y="574" width="148" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="968.0" y="600" class="body" text-anchor="middle">Version history</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Risk, retention, and workload signals</text><text x="312" y="754" class="small" text-anchor="start">Queue health depends on verification speed and governed storage handling</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Expired mandatory documents raise alerts</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Unreadable scans and OCR mismatch cluster separately</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Near-purge and legal-hold states remain visible</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Workload segmented by verifier and process</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Version lineage and case context</text><text x="664" y="754" class="small" text-anchor="start">Replacement, supersession, and process linkage must stay traceable</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Replacement preserves immutable prior versions</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Case links connect to onboarding and change workflows</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Checksum and storage-reference changes visible to auditors</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Timeline entry opens from the same review surface</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned verification lenses</text><text x="312" y="994" class="small" text-anchor="start">HR operations can pin pending, restricted, OCR-flag, and retention views for repeat review work</text><rect x="320" y="990" width="70" height="28" rx="14" fill="#DCFCE7"/><text x="355.0" y="1008" class="small" text-anchor="middle">Pending</text><rect x="402" y="990" width="76" height="28" rx="14" fill="#DBEAFE"/><text x="440.0" y="1008" class="small" text-anchor="middle">Rejected</text><rect x="490" y="990" width="82" height="28" rx="14" fill="#FEF3C7"/><text x="531.0" y="1008" class="small" text-anchor="middle">Expiring</text><rect x="584" y="990" width="88" height="28" rx="14" fill="#FEE2E2"/><text x="628.0" y="1008" class="small" text-anchor="middle">Restricted</text><rect x="684" y="990" width="82" height="28" rx="14" fill="#EDE9FE"/><text x="725.0" y="1008" class="small" text-anchor="middle">OCR flag</text><rect x="778" y="990" width="82" height="28" rx="14" fill="#F8FAFC"/><text x="819.0" y="1008" class="small" text-anchor="middle">Retention</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Queue before repository</text><text x="1224" y="224" class="annoText" text-anchor="start">This screen is for operational verification, not broad file browsing.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Preview beside decision</text><text x="1224" y="276" class="annoText" text-anchor="start">Reviewers should compare content and action in one place.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Restricted download behavior</text><text x="1224" y="328" class="annoText" text-anchor="start">Sensitive categories need clear watermark or blocked-download states.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Version lineage is immutable</text><text x="1224" y="380" class="annoText" text-anchor="start">Replacement should never erase prior evidence.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Integrity signals stay visible</text><text x="1224" y="432" class="annoText" text-anchor="start">Malware, checksum, and unreadable-file warnings belong in the main plane.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Reason-coded rejection</text><text x="1224" y="484" class="annoText" text-anchor="start">Structured rejection reasons improve reupload quality.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile compresses preview</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should support decisions and summary metadata, not full viewers.</text></svg>
