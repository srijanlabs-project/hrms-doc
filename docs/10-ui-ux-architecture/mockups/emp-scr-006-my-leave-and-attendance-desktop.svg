<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">My Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Leave and Attendance</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Leave</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Attendance</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Regularization</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Holiday Calendar</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Time</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">My Leave and Attendance</text><rect x="296" y="152" width="98" height="28" rx="14" fill="#FEF3C7"/><text x="345.0" y="170" class="small" text-anchor="middle">Balance low</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="406" y="152" width="108" height="28" rx="14" fill="#FEE2E2"/><text x="460.0" y="170" class="small" text-anchor="middle">Missing punch</text><rect x="526" y="152" width="118" height="28" rx="14" fill="#DBEAFE"/><text x="585.0" y="170" class="small" text-anchor="middle">Holiday overlay</text><rect x="808" y="146" width="138" height="40" rx="14" fill="#2563EB"/><text x="877.0" y="172" class="inverse" text-anchor="middle">Apply leave</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="958" y="146" width="194" height="40" rx="14" fill="#0F766E"/><text x="1055.0" y="172" class="inverse" text-anchor="middle">Regularize attendance</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search leave type, attendance day, holiday, regularization case, comp-off, or shift note</text><rect x="856" y="226" width="68" height="28" rx="14" fill="#EAF2F8"/><text x="890.0" y="244" class="small" text-anchor="middle">Leave</text><rect x="934" y="226" width="104" height="28" rx="14" fill="#EAF2F8"/><text x="986.0" y="244" class="small" text-anchor="middle">Attendance</text><rect x="1048" y="226" width="84" height="28" rx="14" fill="#10324A"/><text x="1090.0" y="244" class="inverse" text-anchor="middle">Calendar</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Annual</text><text x="364" y="362" class="metric" text-anchor="start">12.5d</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Sick</text><text x="586" y="362" class="metric" text-anchor="start">4.0d</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="808" y="332" class="small" text-anchor="start">Present</text><text x="808" y="362" class="metric" text-anchor="start">18</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="1030" y="332" class="small" text-anchor="start">Missing</text><text x="1030" y="362" class="metric" text-anchor="start">01</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Comp-off</text><text x="1252" y="362" class="metric" text-anchor="start">0.5d</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Leave balance and calendar planner</text><text x="312" y="464" class="small" text-anchor="start">Balance visibility and policy-aware timing stay together before submission</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Balances shown by leave type</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Approved and pending leave overlay on the calendar</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Holiday and blackout dates visible</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Half-day and notice rules nearby</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Attendance exceptions and corrective actions</text><text x="664" y="464" class="small" text-anchor="start">Missing punches and regularization remain explainable and deadline-aware</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Exception handling</text><text x="684" y="522" class="body" text-anchor="start">A missing punch or source mismatch must be regularized with evidence before payroll cutoff and still follows policy and manager approval.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open a regularization, apply leave instead, or inspect policy guidance for the day in question.</text><rect x="666" y="574" width="166" height="40" rx="14" fill="#2563EB"/><text x="749.0" y="600" class="inverse" text-anchor="middle">Open regularization</text><rect x="846" y="574" width="126" height="40" rx="14" fill="#EEF2FF"/><text x="909.0" y="600" class="body" text-anchor="middle">Apply leave</text><rect x="986" y="574" width="118" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1045.0" y="600" class="body" text-anchor="middle">Ask policy</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Daily attendance log and shift detail</text><text x="312" y="754" class="small" text-anchor="start">Employees need a readable day ledger before deciding whether to correct, claim, or wait</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">In, out, hours, shift, and status per day</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Late, early-out, missing, holiday, and weekly-off states clear</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Source channel visible without admin diagnostics</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Payroll-locked days stay read-only with explanation</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Comp-off, overtime, and approval trail</text><text x="664" y="754" class="small" text-anchor="start">Leave and time outcomes connect to approved attendance logic, not shortcuts</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Qualified overtime can convert to comp-off</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Leave requests track submitted to cancelled states</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Holiday or rest-day work highlighted</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Returned requests preserve comments and escalation path</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned time lenses</text><text x="312" y="994" class="small" text-anchor="start">Employees can pin balance, punch, calendar, comp-off, and holiday views for daily use</text><rect x="320" y="990" width="74" height="28" rx="14" fill="#DCFCE7"/><text x="357.0" y="1008" class="small" text-anchor="middle">Balance</text><rect x="406" y="990" width="112" height="28" rx="14" fill="#DBEAFE"/><text x="462.0" y="1008" class="small" text-anchor="middle">Missing punch</text><rect x="530" y="990" width="84" height="28" rx="14" fill="#FEF3C7"/><text x="572.0" y="1008" class="small" text-anchor="middle">Calendar</text><rect x="626" y="990" width="88" height="28" rx="14" fill="#FEE2E2"/><text x="670.0" y="1008" class="small" text-anchor="middle">Comp-off</text><rect x="726" y="990" width="78" height="28" rx="14" fill="#EDE9FE"/><text x="765.0" y="1008" class="small" text-anchor="middle">Holiday</text><rect x="816" y="990" width="68" height="28" rx="14" fill="#F8FAFC"/><text x="850.0" y="1008" class="small" text-anchor="middle">Policy</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Policy before submit</text><text x="1224" y="224" class="annoText" text-anchor="start">Leave entry should show rules before rejection ever happens.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Exception trust matters</text><text x="1224" y="276" class="annoText" text-anchor="start">Source reasoning helps employees trust attendance correction flows.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Locked days stay visible</text><text x="1224" y="328" class="annoText" text-anchor="start">Payroll-finalized dates should remain readable but uneditable.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Calendars reduce rework</text><text x="1224" y="380" class="annoText" text-anchor="start">Holiday and blackout overlays reduce avoidable submissions.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Comp-off is governed</text><text x="1224" y="432" class="annoText" text-anchor="start">Earned time should derive from policy-qualified work, not ad hoc entries.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Approval lineage matters</text><text x="1224" y="484" class="annoText" text-anchor="start">Returned or pending cases need visible history for repeat visits.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile favors correction</text><text x="1224" y="536" class="annoText" text-anchor="start">Missing-punch handling is urgent and should stay prominent on small screens.</text></svg>
