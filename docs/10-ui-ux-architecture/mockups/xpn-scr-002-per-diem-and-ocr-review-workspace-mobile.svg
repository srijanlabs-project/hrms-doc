  <text x="44" y="160" class="small">Search OCR, per diem, receipt, mismatch, or category</text>
  <circle cx="44" cy="132" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="44" y="137" class="inverse" text-anchor="middle">1</text>

  <rect x="28" y="188" width="160" height="28" rx="14" fill="#DBEAFE"/>
  <text x="108" y="206" class="small" text-anchor="middle">OCR scan</text>
  <rect x="198" y="188" width="164" height="28" rx="14" fill="#FEF3C7"/>
  <text x="280" y="206" class="small" text-anchor="middle">Per diem</text>

  <rect x="28" y="236" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="264" class="small">Scans</text>
  <text x="44" y="292" class="metric">21</text>
  <rect x="204" y="236" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="220" y="264" class="small">Per diem</text>
  <text x="220" y="292" class="metric">07</text>
  <rect x="28" y="334" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="362" class="small">Mismatch</text>
  <text x="44" y="390" class="metric">03</text>
  <rect x="204" y="334" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="220" y="362" class="small">Rules</text>
  <text x="220" y="390" class="metric">05</text>

  <rect x="28" y="434" width="334" height="46" rx="16" fill="#2563EB"/>
  <text x="195" y="463" class="inverse" text-anchor="middle">Review OCR items</text>
  <circle cx="40" cy="440" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="40" y="445" class="inverse" text-anchor="middle">2</text>
  <rect x="28" y="492" width="334" height="46" rx="16" fill="#0F766E"/>
  <text x="195" y="521" class="inverse" text-anchor="middle">Adjust per diem</text>

  <rect x="28" y="558" width="334" height="262" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="586" class="h3">OCR extraction and rule review</text>
  <text x="44" y="606" class="small">The workspace should make automation helpful without hiding errors.</text>
  <circle cx="40" cy="574" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="40" y="579" class="inverse" text-anchor="middle">3</text>
  <circle cx='42' cy='650' r='3' fill='#2563EB'/>
<text x='54' y='654' class='body'>OCR stays beside evidence</text>
<circle cx='42' cy='672' r='3' fill='#2563EB'/>
<text x='54' y='676' class='body'>Mismatch cues are clear</text>
<circle cx='42' cy='694' r='3' fill='#2563EB'/>
<text x='54' y='698' class='body'>Per diem rules stay contextual</text>

  <rect x="28" y="846" width="334" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="874" class="h3">Automation trust and adjustment</text>
  <text x="44" y="894" class="small">Users need confidence in what the system extracted and what still needs review.</text>
  <circle cx="40" cy="862" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="40" y="867" class="inverse" text-anchor="middle">4</text>
  <circle cx='42' cy='936' r='3' fill='#2563EB'/>
<text x='54' y='940' class='body'>Low-confidence fields stand out</text>
<circle cx='42' cy='958' r='3' fill='#2563EB'/>
<text x='54' y='962' class='body'>Overrides remain traceable</text>
<circle cx='42' cy='980' r='3' fill='#2563EB'/>
<text x='54' y='984' class='body'>Corrections are quick</text>

  <rect x="28" y="1104" width="334" height="392" rx="20" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="1132" class="h3">Mobile annotations</text>
    <circle cx="40" cy="1296" r="12" fill="#2563EB"/>
  <text x="40" y="1300" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="1298" class="annoTitle">OCR beside evidence</text>
  <text x="62" y="1316" class="annoText">OCR is most useful when evidence stays nearby.</text>
  <circle cx="40" cy="1344" r="12" fill="#2563EB"/>
  <text x="40" y="1348" class="inverse" text-anchor="middle">2</text>
  <text x="62" y="1346" class="annoTitle">Mismatch first</text>
  <text x="62" y="1364" class="annoText">Mismatches should surface before users submit claims.</text>
  <circle cx="40" cy="1392" r="12" fill="#2563EB"/>
  <text x="40" y="1396" class="inverse" text-anchor="middle">3</text>
  <text x="62" y="1394" class="annoTitle">Rule context</text>
  <text x="62" y="1412" class="annoText">Per diem rules need contextual visibility.</text>
  <circle cx="40" cy="1440" r="12" fill="#2563EB"/>
  <text x="40" y="1444" class="inverse" text-anchor="middle">4</text>
  <text x="62" y="1442" class="annoTitle">Low-confidence visibility</text>
  <text x="62" y="1460" class="annoText">Low-confidence fields should be obvious.</text>
  <circle cx="40" cy="1488" r="12" fill="#2563EB"/>
  <text x="40" y="1492" class="inverse" text-anchor="middle">5</text>
  <text x="62" y="1490" class="annoTitle">Traceable overrides</text>
  <text x="62" y="1508" class="annoText">Manual corrections must stay traceable.</text>
