<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Scheduling Console</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Scheduler</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Candidates</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Panels</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Calendars</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Conflicts</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Feedback</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Recruit</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Interview Scheduler</text><rect x="296" y="152" width="132" height="28" rx="14" fill="#DBEAFE"/><text x="362.0" y="170" class="small" text-anchor="middle">Today 18</text><rect x="440" y="152" width="152" height="28" rx="14" fill="#FEE2E2"/><text x="516.0" y="170" class="small" text-anchor="middle">Conflicts 04</text><rect x="604" y="152" width="164" height="28" rx="14" fill="#FEF3C7"/><text x="686.0" y="170" class="small" text-anchor="middle">Reschedules 06</text><rect x="808" y="146" width="180" height="40" rx="14" fill="#2563EB"/><text x="898" y="172" class="inverse" text-anchor="middle">Review slots</text><rect x="1000" y="146" width="158" height="40" rx="14" fill="#0F766E"/><text x="1079" y="172" class="inverse" text-anchor="middle">Send invites</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search candidate, panel member, slot, timezone, or meeting room</text><rect x="856" y="226" width="102" height="28" rx="14" fill="#EAF2F8"/><text x="907.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="968" y="226" width="116" height="28" rx="14" fill="#EAF2F8"/><text x="1026.0" y="244" class="small" text-anchor="middle">Calendar</text><rect x="1094" y="226" width="46" height="28" rx="14" fill="#10324A"/><text x="1117.0" y="244" class="inverse" text-anchor="middle">Book</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Upcoming</text><text x="364" y="362" class="metric" text-anchor="start">18</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Backlog</text><text x="586" y="362" class="metric" text-anchor="start">07</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Conflicts</text><text x="808" y="362" class="metric" text-anchor="start">04</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">No-shows</text><text x="1030" y="362" class="metric" text-anchor="start">02</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">SLA</text><text x="1252" y="362" class="metric" text-anchor="start">1.8d</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Scheduling queue</text><text x="312" y="464" class="small" text-anchor="start">Recruiters need interview-ready candidates and unresolved slot issues before calendar detail</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">12 candidates ready for scheduling</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">3 candidate timezone confirmations pending</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">2 panel-composition violations</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">1 onsite room double booking detected</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI slot recommendation</text><text x="664" y="464" class="small" text-anchor="start">AI can recommend feasible slots and backup panels while human schedulers keep final control</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Best-slot suggestion</text><text x="684" y="522" class="body" text-anchor="start">Friday 11:30 IST fits candidate availability, hiring-manager calendar, and mandatory panel mix with no room conflict.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: confirm candidate timezone, attach interview kit, and send bilingual invite.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review slot</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Backup panel</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Calendar and panel state</text><text x="312" y="754" class="small" text-anchor="start">Panel availability, room readiness, and confirmations stay close to the queue</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Panel A fully confirmed</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">1 interviewer decline awaiting replacement</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Virtual room links generated for 9 rounds</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Onsite room capacity warning for Monday</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Reschedule and interview risk</text><text x="664" y="754" class="small" text-anchor="start">Reschedule trends, cancellations, and overdue feedback belong in the scheduler console</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">6 reschedules this week</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 no-show incidents need review</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">4 overdue feedback submissions</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Candidate drop risk high for 1 senior architect round</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned scheduling views</text><text x="312" y="994" class="small" text-anchor="start">Recruiters can pin requisition, location, format, timezone, and conflict-focused views</text><rect x="320" y="990" width="122" height="28" rx="14" fill="#DCFCE7"/><text x="381.0" y="1008" class="small" text-anchor="middle">ENG-214</text><rect x="454" y="990" width="116" height="28" rx="14" fill="#DBEAFE"/><text x="512.0" y="1008" class="small" text-anchor="middle">Virtual</text><rect x="582" y="990" width="120" height="28" rx="14" fill="#FEF3C7"/><text x="642.0" y="1008" class="small" text-anchor="middle">IST to CET</text><rect x="714" y="990" width="122" height="28" rx="14" fill="#FEE2E2"/><text x="775.0" y="1008" class="small" text-anchor="middle">Conflict</text><rect x="848" y="990" width="124" height="28" rx="14" fill="#EDE9FE"/><text x="910.0" y="1008" class="small" text-anchor="middle">Feedback</text><rect x="984" y="990" width="124" height="28" rx="14" fill="#F8FAFC"/><text x="1046.0" y="1008" class="small" text-anchor="middle">SLA watch</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Scheduler-first actions</text><text x="1224" y="224" class="annoText" text-anchor="start">The hero strip prioritizes slot review and invite action because speed and confirmation matter most here.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Calendar-aware search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search is tuned to candidate, panel, slot, and timezone artifacts rather than generic pipeline browsing.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Time-to-schedule signals</text><text x="1224" y="328" class="annoText" text-anchor="start">The KPI strip blends volume, conflict, no-show, and SLA indicators.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Queue before grid</text><text x="1224" y="380" class="annoText" text-anchor="start">The left card keeps scheduling backlog and slot blockers primary before detailed calendar interaction.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable slot AI</text><text x="1224" y="432" class="annoText" text-anchor="start">AI recommendations expose availability and policy rationale before booking decisions.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Risk beside schedule</text><text x="1224" y="484" class="annoText" text-anchor="start">Reschedule, no-show, and overdue-feedback risk stay inside the same operating surface.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Timezone and format lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned views reflect how recruiting teams organize high-volume scheduling work.</text></svg>
