<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">People</text><text x="20" y="76" class="h2inv" text-anchor="start">Lifecycle Wizard</text><rect x="16" y="108" width="89" height="28" rx="14" fill="#DCFCE7"/><text x="60.5" y="126" class="small" text-anchor="middle">Promotion</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="113" y="108" width="82" height="28" rx="14" fill="#DBEAFE"/><text x="154.0" y="126" class="small" text-anchor="middle">Transfer</text><rect x="203" y="108" width="56" height="28" rx="14" fill="#FEE2E2"/><text x="231.0" y="126" class="small" text-anchor="middle">Exit</text><rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="34" y="190" class="body" text-anchor="start">Search action, employee, or pending request</text><circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="173" class="inverse" text-anchor="middle">2</text><rect x="16" y="228" width="358" height="156" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="252" class="h3" text-anchor="start">Action type</text><text x="32" y="270" class="small" text-anchor="start">Mobile starts with the lifecycle path and the current step.</text><circle cx="34" cy="280" r="3" fill="#2563EB"/><text x="46" y="284" class="body" text-anchor="start">Promotion, transfer, or exit</text><circle cx="34" cy="300" r="3" fill="#2563EB"/><text x="46" y="304" class="body" text-anchor="start">Effective date shown</text><circle cx="34" cy="320" r="3" fill="#2563EB"/><text x="46" y="324" class="body" text-anchor="start">Template path visible</text><circle cx="34" cy="340" r="3" fill="#2563EB"/><text x="46" y="344" class="body" text-anchor="start">Risk level visible</text><circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="249" class="inverse" text-anchor="middle">3</text><rect x="16" y="400" width="358" height="182" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="424" class="h3" text-anchor="start">Impact and blockers</text><text x="32" y="442" class="small" text-anchor="start">Preview and validation cues stay visible during the wizard.</text><circle cx="34" cy="452" r="3" fill="#2563EB"/><text x="46" y="456" class="body" text-anchor="start">Payroll effect</text><circle cx="34" cy="472" r="3" fill="#2563EB"/><text x="46" y="476" class="body" text-anchor="start">Org impact</text><circle cx="34" cy="492" r="3" fill="#2563EB"/><text x="46" y="496" class="body" text-anchor="start">Documents required</text><circle cx="34" cy="512" r="3" fill="#2563EB"/><text x="46" y="516" class="body" text-anchor="start">Retro conflicts listed</text><rect x="30" y="526" width="100" height="36" rx="12" fill="#2563EB"/><text x="80.0" y="550" class="inverse" text-anchor="middle">Preview</text><rect x="144" y="526" width="104" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="196.0" y="552" class="body" text-anchor="middle">Validate</text><circle cx="30" cy="416" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="421" class="inverse" text-anchor="middle">4</text><rect x="16" y="598" width="358" height="138" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="622" class="h3" text-anchor="start">Submit readiness</text><text x="32" y="640" class="small" text-anchor="start">Approval and audit readiness compress into one final stack.</text><circle cx="34" cy="648" r="3" fill="#2563EB"/><text x="46" y="652" class="body" text-anchor="start">Approver route</text><circle cx="34" cy="668" r="3" fill="#2563EB"/><text x="46" y="672" class="body" text-anchor="start">Open blockers</text><circle cx="34" cy="688" r="3" fill="#2563EB"/><text x="46" y="692" class="body" text-anchor="start">Timeline outcome</text><circle cx="34" cy="708" r="3" fill="#2563EB"/><text x="46" y="712" class="body" text-anchor="start">Generated tasks linked</text><circle cx="30" cy="614" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="619" class="inverse" text-anchor="middle">5</text><rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="780" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="804" r="12" fill="#2563EB"/><text x="40" y="808" class="inverse" text-anchor="middle">1</text><text x="62" y="806" class="annoTitle" text-anchor="start">Stepper-safe mobile</text><text x="62" y="824" class="annoText" text-anchor="start">Mobile keeps the current step, impact preview, and blockers visible so the wizard remains trustworthy.</text></svg>
