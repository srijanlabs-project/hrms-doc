or="start">role-safe metadata</text><text x="316" y="580" class="h3" text-anchor="start">Tasks</text><rect x="316" y="598" width="480" height="34" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="332" y="620" class="body" text-anchor="start">Task result 1</text><text x="640" y="620" class="small" text-anchor="start">role-safe metadata</text><rect x="316" y="640" width="480" height="34" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="332" y="662" class="body" text-anchor="start">Task result 2</text><text x="640" y="662" class="small" text-anchor="start">role-safe metadata</text><text x="316" y="718" class="h3" text-anchor="start">Records</text><rect x="316" y="736" width="480" height="34" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="332" y="758" class="body" text-anchor="start">Record result 1</text><text x="640" y="758" class="small" text-anchor="start">role-safe metadata</text><rect x="316" y="778" width="480" height="34" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="332" y="800" class="body" text-anchor="start">Record result 2</text><text x="640" y="800" class="small" text-anchor="start">role-safe metadata</text><text x="316" y="856" class="h3" text-anchor="start">Reports</text><rect x="316" y="874" width="480" height="34" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="332" y="896" class="body" text-anchor="start">Report result 1</text><text x="640" y="896" class="small" text-anchor="start">role-safe metadata</text><rect x="316" y="916" width="480" height="34" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="332" y="938" class="body" text-anchor="start">Report result 2</text><text x="640" y="938" class="small" text-anchor="start">role-safe metadata</text><circle cx="320" cy="416" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="421" class="inverse" text-anchor="middle">4</text><rect x="834" y="396" width="324" height="654" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="850" y="420" class="h3" text-anchor="start">Preview panel</text><text x="850" y="438" class="small" text-anchor="start">Selected result preview and fast actions</text><text x="852" y="446" class="h3" text-anchor="start">Configuration Catalog</text><circle cx="852" cy="480" r="3" fill="#2563EB"/><text x="864" y="484" class="body" text-anchor="start">Summary and object path</text><circle cx="852" cy="500" r="3" fill="#2563EB"/><text x="864" y="504" class="body" text-anchor="start">Quick actions</text><circle cx="852" cy="520" r="3" fill="#2563EB"/><text x="864" y="524" class="body" text-anchor="start">Related items</text><circle cx="852" cy="540" r="3" fill="#2563EB"/><text x="864" y="544" class="body" text-anchor="start">Owner and last update</text><circle cx="852" cy="560" r="3" fill="#2563EB"/><text x="864" y="564" class="body" text-anchor="start">Permission notes</text><rect x="852" y="620" width="120" height="36" rx="12" fill="#10324A"/><text x="912" y="644" class="inverse" text-anchor="middle">Open result</text><circle cx="850" cy="416" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="850" y="421" class="inverse" text-anchor="middle">5</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Unified command bar</text><text x="1224" y="224" class="annoText" text-anchor="start">Search and command execution share one dominant entry point.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Memory aids</text><text x="1224" y="276" class="annoText" text-anchor="start">Recent searches and saved commands reduce repeat navigation effort.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Result typing</text><text x="1224" y="328" class="annoText" text-anchor="start">Tabs keep mixed-result sets understandable for admins and reviewers.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Grouped records</text><text x="1224" y="380" class="annoText" text-anchor="start">Results differentiate objects with metadata rather than name alone.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Safe preview</text><text x="1224" y="432" class="annoText" text-anchor="start">Preview allows confident navigation without exposing hidden details.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Role-aware search</text><text x="1224" y="484" class="annoText" text-anchor="start">Scope chip and sensitivity patterns reinforce permission boundaries.</text><circle cx="1010" cy="178" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="1010" y="183" class="inverse" text-anchor="middle">6</text></svg>
