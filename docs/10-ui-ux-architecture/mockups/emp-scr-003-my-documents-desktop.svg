<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">My Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Overview</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Required</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Letters</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Verification</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">History</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Access</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Expiring 2</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">My Documents</text><rect x="296" y="152" width="98" height="28" rx="14" fill="#DCFCE7"/><text x="345.0" y="170" class="small" text-anchor="middle">Verified 18</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="406" y="152" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="452.0" y="170" class="small" text-anchor="middle">Pending 2</text><rect x="510" y="152" width="96" height="28" rx="14" fill="#FEF3C7"/><text x="558.0" y="170" class="small" text-anchor="middle">Rejected 1</text><rect x="808" y="146" width="168" height="40" rx="14" fill="#2563EB"/><text x="892.0" y="172" class="inverse" text-anchor="middle">Upload document</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="988" y="146" width="156" height="40" rx="14" fill="#0F766E"/><text x="1066.0" y="172" class="inverse" text-anchor="middle">Replace version</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search document name, category, status, case link, or expiry</text><rect x="856" y="226" width="88" height="28" rx="14" fill="#EAF2F8"/><text x="900.0" y="244" class="small" text-anchor="middle">Required</text><rect x="954" y="226" width="82" height="28" rx="14" fill="#EAF2F8"/><text x="995.0" y="244" class="small" text-anchor="middle">Pending</text><rect x="1046" y="226" width="84" height="28" rx="14" fill="#10324A"/><text x="1088.0" y="244" class="inverse" text-anchor="middle">Expiring</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Verified</text><text x="364" y="362" class="metric" text-anchor="start">18</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Pending</text><text x="586" y="362" class="metric" text-anchor="start">02</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Expiring</text><text x="808" y="362" class="metric" text-anchor="start">02</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Rejected</text><text x="1030" y="362" class="metric" text-anchor="start">01</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Letters</text><text x="1252" y="362" class="metric" text-anchor="start">04</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Document center by category</text><text x="312" y="464" class="small" text-anchor="start">Identity, employment, education, and tax artifacts stay grouped by requirement and state</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">PAN verified already</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Address proof awaits review</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Employment letter ready</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Older education certificate superseded</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Secure upload and access policy</text><text x="664" y="464" class="small" text-anchor="start">Upload, watermark, and restricted-download behavior stay explainable in one self-service panel</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Access policy</text><text x="684" y="522" class="body" text-anchor="start">Restricted categories can preview with watermark only, while downloads may be blocked by policy, legal hold, or verification state.</text><text x="684" y="544" class="small" text-anchor="start">Next step: upload a missing or clearer file, inspect rejection reason, or replace an expiring version.</text><rect x="666" y="574" width="132" height="40" rx="14" fill="#2563EB"/><text x="732.0" y="600" class="inverse" text-anchor="middle">Upload file</text><rect x="812" y="574" width="108" height="40" rx="14" fill="#EEF2FF"/><text x="866.0" y="600" class="body" text-anchor="middle">Replace</text><rect x="934" y="574" width="130" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="999.0" y="600" class="body" text-anchor="middle">Why rejected</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Missing and expiring requirements</text><text x="312" y="754" class="small" text-anchor="start">Compliance gaps and rejection guidance remain visible for fast correction</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Passport expires in 62 days</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">One rejected bank proof needs clearer scan</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Joining checklist complete except NDA renewal</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Expiry reminders enabled for critical categories</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Version and case-linked activity</text><text x="664" y="754" class="small" text-anchor="start">Employees can trace verification, replacement lineage, and linked business cases without admin controls</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Tax proof linked to declaration case</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Relieving letter v2 replaced v1</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">HR verified ID yesterday</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Retention policy enforced but abstracted</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned document lenses</text><text x="312" y="994" class="small" text-anchor="start">Users can pin required, pending, expiring, and employment-letter views for repeat follow-up</text><rect x="320" y="990" width="86" height="28" rx="14" fill="#DCFCE7"/><text x="363.0" y="1008" class="small" text-anchor="middle">Required</text><rect x="418" y="990" width="90" height="28" rx="14" fill="#DBEAFE"/><text x="463.0" y="1008" class="small" text-anchor="middle">Verified</text><rect x="520" y="990" width="82" height="28" rx="14" fill="#FEF3C7"/><text x="561.0" y="1008" class="small" text-anchor="middle">Pending</text><rect x="614" y="990" width="84" height="28" rx="14" fill="#FEE2E2"/><text x="656.0" y="1008" class="small" text-anchor="middle">Expiring</text><rect x="710" y="990" width="78" height="28" rx="14" fill="#EDE9FE"/><text x="749.0" y="1008" class="small" text-anchor="middle">Letters</text><rect x="800" y="990" width="78" height="28" rx="14" fill="#F8FAFC"/><text x="839.0" y="1008" class="small" text-anchor="middle">History</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Category-first organization</text><text x="1224" y="224" class="annoText" text-anchor="start">Users should hunt by lifecycle category, not raw file list.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Requirement and status together</text><text x="1224" y="276" class="annoText" text-anchor="start">Trust comes from seeing why a file exists and what state it is in.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Replace, don&#x27;t overwrite</text><text x="1224" y="328" class="annoText" text-anchor="start">Version-safe upload matters for evidence and history.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Reason-coded failures</text><text x="1224" y="380" class="annoText" text-anchor="start">Rejected documents should explain what needs to change right where the employee is looking.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Restricted access is explicit</text><text x="1224" y="432" class="annoText" text-anchor="start">Watermark or blocked download states should never feel silent or broken.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Case context stays linked</text><text x="1224" y="484" class="annoText" text-anchor="start">Documents tied to business flows need visible context without leaking admin internals.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile upload matters</text><text x="1224" y="536" class="annoText" text-anchor="start">Reupload and camera capture need to remain first-class on small screens.</text></svg>
