<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">People Operations Hub</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Workbench</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Lifecycle</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Onboarding</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Documents</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Exceptions</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">HR Ops</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Employee Master Workbench</text><rect x="296" y="152" width="104" height="28" rx="14" fill="#FEE2E2"/><text x="348.0" y="170" class="small" text-anchor="middle">Duplicates 14</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="412" y="152" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="458.0" y="170" class="small" text-anchor="middle">Bulk batch</text><rect x="516" y="152" width="92" height="28" rx="14" fill="#FEF3C7"/><text x="562.0" y="170" class="small" text-anchor="middle">Masked IDs</text><rect x="808" y="146" width="160" height="40" rx="14" fill="#2563EB"/><text x="888.0" y="172" class="inverse" text-anchor="middle">Create employee</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="980" y="146" width="174" height="40" rx="14" fill="#0F766E"/><text x="1067.0" y="172" class="inverse" text-anchor="middle">Review duplicates</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, person id, manager, legal entity, or duplicate clue</text><rect x="856" y="226" width="62" height="28" rx="14" fill="#EAF2F8"/><text x="887.0" y="244" class="small" text-anchor="middle">Active</text><rect x="928" y="226" width="68" height="28" rx="14" fill="#EAF2F8"/><text x="962.0" y="244" class="small" text-anchor="middle">Joiners</text><rect x="1006" y="226" width="66" height="28" rx="14" fill="#10324A"/><text x="1039.0" y="244" class="inverse" text-anchor="middle">Masked</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Workers</text><text x="364" y="362" class="metric" text-anchor="start">24.8k</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Dupes</text><text x="586" y="362" class="metric" text-anchor="start">14</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Sensitive</text><text x="808" y="362" class="metric" text-anchor="start">07</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Org 7d</text><text x="1030" y="362" class="metric" text-anchor="start">31</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Sync ex</text><text x="1252" y="362" class="metric" text-anchor="start">05</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Employee master grid</text><text x="312" y="464" class="small" text-anchor="start">Dense roster scanning, source ownership, and status review start the workbench</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">284 records in current filter</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">3 future-dated manager changes scheduled</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">2 import-created workers need review</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">1 active worker still mapped to inactive manager</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Selected employee profile and mask state</text><text x="664" y="464" class="small" text-anchor="start">Authoritative, editable, derived, and synchronized attributes stay distinguishable</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Governed reveal</text><text x="684" y="522" class="body" text-anchor="start">Reveal and edit actions must respect field ownership, masking policy, and effective-dated history rather than acting like destructive overwrite.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open the full profile, reveal authorized fields, or resolve duplicate and source conflicts first.</text><rect x="666" y="574" width="132" height="40" rx="14" fill="#2563EB"/><text x="732.0" y="600" class="inverse" text-anchor="middle">Open profile</text><rect x="812" y="574" width="136" height="40" rx="14" fill="#EEF2FF"/><text x="880.0" y="600" class="body" text-anchor="middle">Reveal fields</text><rect x="962" y="574" width="124" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1024.0" y="600" class="body" text-anchor="middle">View lineage</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Duplicate and bulk update queue</text><text x="312" y="754" class="small" text-anchor="start">Identity hygiene and controlled high-volume changes belong in the same console</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">14 likely duplicate matches need adjudication</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Bulk batch limited to cost center and manager remap</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">2 records blocked by protected-field differences</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Rehire candidate matched to prior history</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Downstream impact and audit timeline</text><text x="664" y="754" class="small" text-anchor="start">Employee-master actions are safe only when consumers and history remain visible</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Leave, attendance, and payroll consumers will receive events</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Timeline shows create, import, correction, and manager-change lineage</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">1 sensitive-field approval blocks final save</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Cross-system person id mismatch flagged</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned master-data lenses</text><text x="312" y="994" class="small" text-anchor="start">HR operations can pin duplicate, manager-change, import-batch, and masked-ID views for repeat maintenance</text><rect x="320" y="990" width="92" height="28" rx="14" fill="#DCFCE7"/><text x="366.0" y="1008" class="small" text-anchor="middle">New joiners</text><rect x="424" y="990" width="104" height="28" rx="14" fill="#DBEAFE"/><text x="476.0" y="1008" class="small" text-anchor="middle">Duplicate risk</text><rect x="540" y="990" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="601.0" y="1008" class="small" text-anchor="middle">Manager changes</text><rect x="674" y="990" width="112" height="28" rx="14" fill="#FEE2E2"/><text x="730.0" y="1008" class="small" text-anchor="middle">Payroll impact</text><rect x="798" y="990" width="98" height="28" rx="14" fill="#EDE9FE"/><text x="847.0" y="1008" class="small" text-anchor="middle">Masked IDs</text><rect x="908" y="990" width="104" height="28" rx="14" fill="#F8FAFC"/><text x="960.0" y="1008" class="small" text-anchor="middle">Import batch</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Source-of-truth workbench</text><text x="1224" y="224" class="annoText" text-anchor="start">HR ops starts from roster density, not isolated record detail.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Field-state clarity</text><text x="1224" y="276" class="annoText" text-anchor="start">Authoritative, editable, derived, and synchronized values must look different.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Mask by default</text><text x="1224" y="328" class="annoText" text-anchor="start">Sensitive IDs stay hidden until reveal is authorized.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Duplicates surface early</text><text x="1224" y="380" class="annoText" text-anchor="start">Identity conflict handling should appear before record creation and bulk updates.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">History over overwrite</text><text x="1224" y="432" class="annoText" text-anchor="start">Effective-dated lineage matters wherever payroll or approval outcomes change.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Bulk edit stays governed</text><text x="1224" y="484" class="annoText" text-anchor="start">High-volume changes need scope and protected-field warnings nearby.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile is triage-first</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support review and follow-up while dense grids remain desktop-only.</text></svg>
