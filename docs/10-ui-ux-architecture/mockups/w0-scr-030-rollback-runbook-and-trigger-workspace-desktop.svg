<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Rollback</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Triggers</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Steps</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Restore</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Reconcile</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">ROLLBACK</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Rollback Runbook and Trigger Workspace</text><rect x="296" y="152" width="118" height="28" rx="14" fill="#DBEAFE"/><text x="355.0" y="170" class="small" text-anchor="middle">Triggers armed</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="426" y="152" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="487.0" y="170" class="small" text-anchor="middle">Irreversible 2</text><rect x="560" y="152" width="92" height="28" rx="14" fill="#FEE2E2"/><text x="606.0" y="170" class="small" text-anchor="middle">Approve 1</text><rect x="808" y="146" width="182" height="40" rx="14" fill="#2563EB"/><text x="899.0" y="172" class="inverse" text-anchor="middle">Open trigger matrix</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="1002" y="146" width="182" height="40" rx="14" fill="#0F766E"/><text x="1093.0" y="172" class="inverse" text-anchor="middle">Review restore path</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search trigger, runbook step, restore point, irreversible action, or reconciliation task</text><rect x="856" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/><text x="902.0" y="244" class="small" text-anchor="middle">Triggers</text><rect x="958" y="226" width="76" height="28" rx="14" fill="#EAF2F8"/><text x="996.0" y="244" class="small" text-anchor="middle">Steps</text><rect x="1044" y="226" width="72" height="28" rx="14" fill="#10324A"/><text x="1080.0" y="244" class="inverse" text-anchor="middle">Restore</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Triggers</text><text x="364" y="362" class="metric" text-anchor="start">09</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Steps</text><text x="586" y="362" class="metric" text-anchor="start">31</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Irrev</text><text x="808" y="362" class="metric" text-anchor="start">02</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Points</text><text x="1030" y="362" class="metric" text-anchor="start">06</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Recon</text><text x="1252" y="362" class="metric" text-anchor="start">04</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Trigger matrix and decision thresholds</text><text x="312" y="464" class="small" text-anchor="start">Rollback decisions must be explicit, auditable, and grounded in clear triggers</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">9 rollback triggers currently armed</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">2 irreversible steps already reached</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">One executive approval still pending</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Trigger thresholds differ by workstream</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Step tracker and restore path</text><text x="664" y="464" class="small" text-anchor="start">Runbook sequencing and restore readiness remain visible before any rollback executes</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Rollback insight</text><text x="684" y="522" class="body" text-anchor="start">The employee import can be reversed, but one payroll-close step crossed an irreversible boundary, so rollback now requires a restore-and-reconcile path rather than a simple command reversal.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect restore points, confirm executive approval, and track reconciliation obligations before triggering rollback.</text><rect x="666" y="574" width="142" height="40" rx="14" fill="#2563EB"/><text x="737.0" y="600" class="inverse" text-anchor="middle">Open trigger</text><rect x="822" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="884.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="960" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1033.0" y="600" class="body" text-anchor="middle">Open restore</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Irreversible-step warnings</text><text x="312" y="754" class="small" text-anchor="start">Point-of-no-return cues outrank convenience summaries once rollback becomes real</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">2 steps crossed irreversible boundary</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Current stage linked to restore point RP-06</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Approval required before trigger execution</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Operator acknowledgment still pending</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Reconciliation and final status</text><text x="664" y="754" class="small" text-anchor="start">Rollback is only complete after reconciliation and final-status evidence are captured</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">4 reconciliation tasks remain if triggered</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Final status panel tracks completion chronology</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Restore validation required after execution</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Audit note prepared for executive review</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned rollback lenses</text><text x="312" y="994" class="small" text-anchor="start">Ops and program leads can pin trigger, restore, irreversible-step, and reconciliation-oriented rollback views</text><rect x="320" y="990" width="90" height="28" rx="14" fill="#DCFCE7"/><text x="365.0" y="1008" class="small" text-anchor="middle">Trigger</text><rect x="422" y="990" width="92" height="28" rx="14" fill="#DBEAFE"/><text x="468.0" y="1008" class="small" text-anchor="middle">Restore</text><rect x="526" y="990" width="120" height="28" rx="14" fill="#FEF3C7"/><text x="586.0" y="1008" class="small" text-anchor="middle">Irreversible</text><rect x="658" y="990" width="98" height="28" rx="14" fill="#FEE2E2"/><text x="707.0" y="1008" class="small" text-anchor="middle">Approval</text><rect x="768" y="990" width="84" height="28" rx="14" fill="#EDE9FE"/><text x="810.0" y="1008" class="small" text-anchor="middle">Recon</text><rect x="864" y="990" width="72" height="28" rx="14" fill="#F8FAFC"/><text x="900.0" y="1008" class="small" text-anchor="middle">Final</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Triggers govern rollback</text><text x="1224" y="224" class="annoText" text-anchor="start">Rollback begins with explicit decision thresholds, not with technical buttons.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Restore path stays nearby</text><text x="1224" y="276" class="annoText" text-anchor="start">Once irreversible steps exist, restore planning becomes part of rollback, not a separate concern.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Irreversible warnings escalate</text><text x="1224" y="328" class="annoText" text-anchor="start">Point-of-no-return cues outrank lower-value summary content when risk increases.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Approval is visible</text><text x="1224" y="380" class="annoText" text-anchor="start">Executive authorization remains explicit because rollback can itself be a major business event.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Reconciliation completes rollback</text><text x="1224" y="432" class="annoText" text-anchor="start">Execution is not treated as done until downstream data and process reconciliation finishes.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Chronology matters</text><text x="1224" y="484" class="annoText" text-anchor="start">Final-status and step history remain visible for later audit and recovery review.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile stays reduced</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens support trigger review and escalation while dense runbook control stays desktop-oriented.</text></svg>
