<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/>
  <rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/>
  <text x="52" y="72" class="inverse" text-anchor="start">Release Control</text>
  <rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/>
  <text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text>
  <rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/>
  <text x="60" y="168" class="inverse" text-anchor="start">Releases</text>
  <rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="220" class="inverse" text-anchor="start">Rings</text>
  <rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="272" class="inverse" text-anchor="start">Toggles</text>
  <rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="324" class="inverse" text-anchor="start">Schedule</text>
  <rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="376" class="inverse" text-anchor="start">Rollback</text>
  <rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/>
  <text x="60" y="428" class="inverse" text-anchor="start">Audit</text>

  <rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="338" y="61" class="small" text-anchor="start">Search release bundle, ring, feature flag, environment, approval, or rollback pack</text>
  <rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1103" y="58" class="small" text-anchor="middle">Ops</text>
  <rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/>
  <text x="1204" y="58" class="small" text-anchor="middle">Alerts 07</text>
  <rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1309" y="58" class="small" text-anchor="middle">Tasks 09</text>
  <rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/>

  <text x="310" y="128" class="title" text-anchor="start">Release and Feature-Toggle Console</text>
  <rect x="296" y="152" width="116" height="28" rx="14" fill="#DBEAFE"/>
  <text x="354" y="170" class="small" text-anchor="middle">Ring 2 live</text>
  <circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="312" y="171" class="inverse" text-anchor="middle">1</text>
  <rect x="424" y="152" width="126" height="28" rx="14" fill="#FEF3C7"/>
  <text x="487" y="170" class="small" text-anchor="middle">Approvals 06</text>
  <rect x="562" y="152" width="148" height="28" rx="14" fill="#DCFCE7"/>
  <text x="636" y="170" class="small" text-anchor="middle">Rollback ready</text>
  <rect x="808" y="146" width="174" height="40" rx="14" fill="#2563EB"/>
  <text x="895" y="172" class="inverse" text-anchor="middle">Review rollout plan</text>
  <circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="820" y="151" class="inverse" text-anchor="middle">2</text>
  <rect x="994" y="146" width="184" height="40" rx="14" fill="#0F766E"/>
  <text x="1086" y="172" class="inverse" text-anchor="middle">Open approval evidence</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="338" y="249" class="body" text-anchor="start">Search environment, release train, feature toggle, rollout window, rollback script, or approval packet</text>
  <rect x="856" y="226" width="80" height="28" rx="14" fill="#EAF2F8"/>
  <text x="896" y="244" class="small" text-anchor="middle">Rings</text>
  <rect x="946" y="226" width="88" height="28" rx="14" fill="#EAF2F8"/>
  <text x="990" y="244" class="small" text-anchor="middle">Toggles</text>
  <rect x="1044" y="226" width="90" height="28" rx="14" fill="#10324A"/>
  <text x="1089" y="244" class="inverse" text-anchor="middle">Approve</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">3</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small" text-anchor="start">Live toggles</text>
  <text x="364" y="362" class="metric" text-anchor="start">42</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">4</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/>
  <text x="586" y="332" class="small" text-anchor="start">Pending approvals</text>
  <text x="586" y="362" class="metric" text-anchor="start">06</text>

  <rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="752" y="314" width="44" height="44" rx="12" fill="#2563EB"/>
  <text x="808" y="332" class="small" text-anchor="start">Scheduled waves</text>
  <text x="808" y="362" class="metric" text-anchor="start">04</text>

  <rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="974" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="1030" y="332" class="small" text-anchor="start">Drift flags</text>
  <text x="1030" y="362" class="metric" text-anchor="start">02</text>

  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/>
  <text x="1252" y="332" class="small" text-anchor="start">Rollback packs</text>
  <text x="1252" y="362" class="metric" text-anchor="start">03</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3" text-anchor="start">Release rings and environment scope</text>
  <text x="312" y="464" class="small" text-anchor="start">Operators need to see where a release sits before they decide what to promote or pause.</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body" text-anchor="start">Ring 0 canary active in internal sandbox only</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body" text-anchor="start">Ring 1 validated across UAT and pilot tenants</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body" text-anchor="start">Ring 2 live for payroll and leave modules in prod</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body" text-anchor="start">General release blocked until drift flags clear in EU prod</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3" text-anchor="start">Toggle state and approval-safe rollout</text>
  <text x="664" y="464" class="small" text-anchor="start">Feature toggle controls remain tied to release evidence, timing, and approver accountability.</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="684" y="496" class="small" text-anchor="start">Rollout insight</text>
  <text x="684" y="522" class="body" text-anchor="start">The new attendance anomaly detector is enabled in Ring 2 for India entities only, scheduled for broader APAC rollout after payroll close, and cannot progress without product and operations approval evidence.</text>
  <text x="684" y="544" class="small" text-anchor="start">Next step: verify ring health, approve the scheduled wave, or hold the toggle if rollback readiness drops below policy.</text>
  <rect x="666" y="574" width="152" height="40" rx="14" fill="#2563EB"/>
  <text x="742" y="600" class="inverse" text-anchor="middle">Approve wave</text>
  <rect x="832" y="574" width="136" height="40" rx="14" fill="#EEF2FF"/>
  <text x="900" y="600" class="body" text-anchor="middle">Pause toggle</text>
  <rect x="982" y="574" width="144" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1054" y="600" class="body" text-anchor="middle">Prep rollback</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3" text-anchor="start">Scheduled rollout and gate checks</text>
  <text x="312" y="754" class="small" text-anchor="start">Time-windowed rollout cues remain close to dependency gates because timing is part of release safety.</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body" text-anchor="start">4 scheduled waves staged over the next 48 hours</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">Payroll-close blackout blocks one production toggle</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">Ring promotion requires synthetic-check evidence</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">Environment drift prevents auto-promotion in EU prod</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3" text-anchor="start">Rollback readiness and audit trail</text>
  <text x="664" y="754" class="small" text-anchor="start">Rollback is treated as a first-class release outcome with evidence, scripts, and approver history.</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body" text-anchor="start">3 rollback packs validated against the current release bundle</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">Approval packet stores who enabled each production toggle and why</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Emergency toggle flips still require post-hoc audit justification</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body" text-anchor="start">Release notes, scripts, and blast radius remain linked to the same record</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">7</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3" text-anchor="start">Pinned release lenses</text>
  <text x="312" y="994" class="small" text-anchor="start">Release managers can keep their most critical scopes close without changing workspaces mid-rollout.</text>
  <rect x="320" y="990" width="88" height="28" rx="14" fill="#DCFCE7"/>
  <text x="364" y="1008" class="small" text-anchor="middle">Canary</text>
  <rect x="420" y="990" width="92" height="28" rx="14" fill="#DBEAFE"/>
  <text x="466" y="1008" class="small" text-anchor="middle">Ring 2</text>
  <rect x="524" y="990" width="92" height="28" rx="14" fill="#FEF3C7"/>
  <text x="570" y="1008" class="small" text-anchor="middle">Pending</text>
  <rect x="628" y="990" width="82" height="28" rx="14" fill="#FEE2E2"/>
  <text x="669" y="1008" class="small" text-anchor="middle">Drift</text>
  <rect x="722" y="990" width="92" height="28" rx="14" fill="#EDE9FE"/>
  <text x="768" y="1008" class="small" text-anchor="middle">Rollback</text>
  <rect x="826" y="990" width="100" height="28" rx="14" fill="#F8FAFC"/>
  <text x="876" y="1008" class="small" text-anchor="middle">Approvals</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">8</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle" text-anchor="start">Rings before toggles</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">Release managers first need to know where code is live before they reason about feature state.</text>

  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Toggle state needs scope</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">A flag is only meaningful when the environment, entity, and ring scope are obvious.</text>

  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Schedule is operational risk</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">Blackout windows, payroll close, and staggered waves affect release safety as much as code quality does.</text>

  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">Rollback is first-class</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Rollback readiness is shown as a primary signal rather than buried behind an emergency-only path.</text>

  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Approvals need evidence</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">This screen assumes production flag changes and promotions must leave behind an audit-safe approval record.</text>

  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Hybrid release surface</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">The design mixes deployment sequencing and configuration control because real operations teams manage both together.</text>

  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile supports safe oversight</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">The mobile variant keeps rollout state, approvals, and rollback cues visible without inviting broad unsafe edits.</text>
</svg>
