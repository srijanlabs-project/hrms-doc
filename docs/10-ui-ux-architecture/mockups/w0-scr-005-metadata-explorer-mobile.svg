<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">v2.6</text><text x="20" y="76" class="h2inv" text-anchor="start">Metadata Explorer</text><rect x="16" y="108" width="358" height="126" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="132" class="h3" text-anchor="start">Selected entity</text><text x="32" y="150" class="small" text-anchor="start">Mobile supports quick metadata lookup, not full authoring</text><circle cx="34" cy="158" r="3" fill="#2563EB"/><text x="46" y="162" class="body" text-anchor="start">Employee entity</text><circle cx="34" cy="178" r="3" fill="#2563EB"/><text x="46" y="182" class="body" text-anchor="start">Owner service</text><circle cx="34" cy="198" r="3" fill="#2563EB"/><text x="46" y="202" class="body" text-anchor="start">Classification summary</text><circle cx="30" cy="124" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="129" class="inverse" text-anchor="middle">1</text><rect x="16" y="248" width="358" height="188" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="272" class="h3" text-anchor="start">Field summary</text><text x="32" y="290" class="small" text-anchor="start">Fields shown as drill-down cards instead of a dense desktop table</text><rect x="30" y="298" width="330" height="32" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="42" y="320" class="body" text-anchor="start">employeeCode</text><text x="280" y="320" class="small" text-anchor="start">View detail</text><rect x="30" y="340" width="330" height="32" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="42" y="362" class="body" text-anchor="start">dateOfBirth</text><text x="280" y="362" class="small" text-anchor="start">View detail</text><rect x="30" y="382" width="330" height="32" rx="10" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="42" y="404" class="body" text-anchor="start">panNumber</text><text x="280" y="404" class="small" text-anchor="start">View detail</text><circle cx="30" cy="264" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="269" class="inverse" text-anchor="middle">2</text><rect x="16" y="452" width="358" height="156" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="476" class="h3" text-anchor="start">Dependencies</text><text x="32" y="494" class="small" text-anchor="start">Impact and downstream usage collapse into expandable sections</text><circle cx="34" cy="502" r="3" fill="#2563EB"/><text x="46" y="506" class="body" text-anchor="start">Forms</text><circle cx="34" cy="522" r="3" fill="#2563EB"/><text x="46" y="526" class="body" text-anchor="start">APIs</text><circle cx="34" cy="542" r="3" fill="#2563EB"/><text x="46" y="546" class="body" text-anchor="start">Reports</text><circle cx="34" cy="562" r="3" fill="#2563EB"/><text x="46" y="566" class="body" text-anchor="start">Rules</text><circle cx="30" cy="468" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="473" class="inverse" text-anchor="middle">3</text><rect x="16" y="624" width="358" height="202" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="652" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="676" r="12" fill="#2563EB"/><text x="40" y="680" class="inverse" text-anchor="middle">1</text><text x="62" y="678" class="annoTitle" text-anchor="start">Lookup orientation</text><text x="62" y="696" class="annoText" text-anchor="start">Mobile is intentionally optimized for lookup and review, not heavy metadata administration.</text><circle cx="40" cy="728" r="12" fill="#2563EB"/><text x="40" y="732" class="inverse" text-anchor="middle">2</text><text x="62" y="730" class="annoTitle" text-anchor="start">Table deconstruction</text><text x="62" y="748" class="annoText" text-anchor="start">Dense field tables break into card drill-downs to preserve readability.</text><circle cx="40" cy="780" r="12" fill="#2563EB"/><text x="40" y="784" class="inverse" text-anchor="middle">3</text><text x="62" y="782" class="annoTitle" text-anchor="start">Desktop-preferred depth</text><text x="62" y="800" class="annoText" text-anchor="start">Deep comparison and export still primarily belong to desktop usage.</text></svg>
