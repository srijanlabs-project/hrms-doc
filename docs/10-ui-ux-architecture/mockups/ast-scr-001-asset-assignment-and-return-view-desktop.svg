<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Asset Desk</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Assets</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Assignments</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Returns</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Clearance</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Recoveries</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Audit</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Assets</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Asset Assignment and Return View</text><rect x="296" y="152" width="124" height="28" rx="14" fill="#FEE2E2"/><text x="358.0" y="170" class="small" text-anchor="middle">Return overdue</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="432" y="152" width="131" height="28" rx="14" fill="#FEF3C7"/><text x="497.5" y="170" class="small" text-anchor="middle">Damage reported</text><rect x="575" y="152" width="124" height="28" rx="14" fill="#DBEAFE"/><text x="637.0" y="170" class="small" text-anchor="middle">Exit clearance</text><rect x="808" y="146" width="110" height="40" rx="14" fill="#2563EB"/><text x="863.0" y="172" class="inverse" text-anchor="middle">Review asset</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="930" y="146" width="138" height="40" rx="14" fill="#0F766E"/><text x="999.0" y="172" class="inverse" text-anchor="middle">Open return desk</text><rect x="1080" y="146" width="117" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1138.5" y="172" class="body" text-anchor="middle">Open recovery</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search asset, employee, serial, return case, damage note, or clearance status</text><rect x="856" y="226" width="103" height="28" rx="14" fill="#EAF2F8"/><text x="907.5" y="244" class="small" text-anchor="middle">Assignments</text><rect x="969" y="226" width="75" height="28" rx="14" fill="#EAF2F8"/><text x="1006.5" y="244" class="small" text-anchor="middle">Returns</text><rect x="1054" y="226" width="96" height="28" rx="14" fill="#10324A"/><text x="1102.0" y="244" class="inverse" text-anchor="middle">Restricted</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Assigned</text><text x="364" y="362" class="metric" text-anchor="start">326</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="586" y="332" class="small" text-anchor="start">Overdue</text><text x="586" y="362" class="metric" text-anchor="start">14</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Damage</text><text x="808" y="362" class="metric" text-anchor="start">06</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Clearance</text><text x="1030" y="362" class="metric" text-anchor="start">11</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Recoveries</text><text x="1252" y="362" class="metric" text-anchor="start">04</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Assignment and return queue</text><text x="312" y="464" class="small" text-anchor="start">Custody, return state, and clearance posture need one operational view.</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Assignment rows show asset class, holder, and custody evidence</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">Return-due items are grouped above routine active assets</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Damage notes remain visible before closure</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Exit-linked returns show the related clearance packet</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Custody evidence and decision rail</text><text x="664" y="464" class="small" text-anchor="start">Return, replace, and recover actions should stay evidence-led.</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Asset-control note</text><text x="684" y="522" class="body" text-anchor="start">Return closure should require custody proof, condition review, and policy-safe recovery logic.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect custody evidence, confirm return condition, and close or recover.</text><rect x="666" y="574" width="131" height="40" rx="14" fill="#2563EB"/><text x="731.5" y="600" class="inverse" text-anchor="middle">Review evidence</text><rect x="811" y="574" width="110" height="40" rx="14" fill="#EEF2FF"/><text x="866.0" y="600" class="body" text-anchor="middle">Close return</text><rect x="935" y="574" width="124" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="997.0" y="600" class="body" text-anchor="middle">Start recovery</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Damage, loss, and recovery lane</text><text x="312" y="754" class="small" text-anchor="start">Condition and financial consequence need to stay near the return workflow.</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Damage cases show severity and repair path</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Loss cases keep insurer or recovery references visible</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Chargeback logic stays linked to payroll or settlement flow</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Replacement asset linkage preserves continuity</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Clearance and audit readiness</text><text x="664" y="754" class="small" text-anchor="start">Exit dependency and custody history should remain auditable.</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Exit clearance cannot close while asset blockers remain</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Asset history shows assign, swap, return, and repair events</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Restricted assets keep tighter action controls</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Return SLA and overdue posture remain visible</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned workspace lenses</text><text x="312" y="994" class="small" text-anchor="start">Repeat views keep the highest-value slices close without re-filtering.</text><rect x="320" y="990" width="82" height="28" rx="14" fill="#DCFCE7"/><text x="361.0" y="1008" class="small" text-anchor="middle">Assigned</text><rect x="414" y="990" width="75" height="28" rx="14" fill="#DBEAFE"/><text x="451.5" y="1008" class="small" text-anchor="middle">Returns</text><rect x="501" y="990" width="72" height="28" rx="14" fill="#FEF3C7"/><text x="537.0" y="1008" class="small" text-anchor="middle">Damage</text><rect x="585" y="990" width="89" height="28" rx="14" fill="#FEE2E2"/><text x="629.5" y="1008" class="small" text-anchor="middle">Clearance</text><rect x="686" y="990" width="96" height="28" rx="14" fill="#EDE9FE"/><text x="734.0" y="1008" class="small" text-anchor="middle">Recoveries</text><rect x="794" y="990" width="75" height="28" rx="14" fill="#F8FAFC"/><text x="831.5" y="1008" class="small" text-anchor="middle">History</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Custody first</text><text x="1224" y="224" class="annoText" text-anchor="start">The workspace should revolve around who holds what and in what condition.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Return above archive</text><text x="1224" y="276" class="annoText" text-anchor="start">Overdue returns should outrank passive asset inventory browsing.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Evidence-led close</text><text x="1224" y="328" class="annoText" text-anchor="start">Return decisions need custody proof and condition cues in the same view.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Recovery linked</text><text x="1224" y="380" class="annoText" text-anchor="start">Damage and loss should connect directly to recovery and settlement implications.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Exit-aware</text><text x="1224" y="432" class="annoText" text-anchor="start">Clearance dependency should be visible the moment a case is linked to exit.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Restricted assets</text><text x="1224" y="484" class="annoText" text-anchor="start">Sensitive assets need stronger action and visibility boundaries.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile triage</text><text x="1224" y="536" class="annoText" text-anchor="start">Small screens should center return urgency, condition, and next safe action.</text></svg>
