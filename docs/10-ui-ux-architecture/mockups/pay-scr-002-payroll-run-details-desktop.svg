"14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Payroll Run Details</text><rect x="296" y="152" width="132" height="28" rx="14" fill="#DBEAFE"/><text x="362.0" y="170" class="small" text-anchor="middle">Employees 2.4k</text><rect x="440" y="152" width="138" height="28" rx="14" fill="#FEE2E2"/><text x="509.0" y="170" class="small" text-anchor="middle">Blockers 19</text><rect x="590" y="152" width="132" height="28" rx="14" fill="#FEF3C7"/><text x="656.0" y="170" class="small" text-anchor="middle">Recalc 42</text><rect x="808" y="146" width="182" height="40" rx="14" fill="#2563EB"/><text x="899" y="172" class="inverse" text-anchor="middle">Resolve blockers</text><rect x="1002" y="146" width="156" height="40" rx="14" fill="#0F766E"/><text x="1080" y="172" class="inverse" text-anchor="middle">Approve run</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search employee, exception, input source, pay component, or recalculation issue</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="964" y="226" width="118" height="28" rx="14" fill="#EAF2F8"/><text x="1023.0" y="244" class="small" text-anchor="middle">Variance</text><rect x="1092" y="226" width="48" height="28" rx="14" fill="#10324A"/><text x="1116.0" y="244" class="inverse" text-anchor="middle">Run</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Inputs</text><text x="364" y="362" class="metric" text-anchor="start">96%</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="586" y="332" class="small" text-anchor="start">Blockers</text><text x="586" y="362" class="metric" text-anchor="start">19</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="808" y="332" class="small" text-anchor="start">Warnings</text><text x="808" y="362" class="metric" text-anchor="start">42</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Net delta</text><text x="1030" y="362" class="metric" text-anchor="start">1.8%</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Bank</text><text x="1252" y="362" class="metric" text-anchor="start">Ready</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Input readiness and exception queue</text><text x="312" y="464" class="small" text-anchor="start">Payroll ops need source completeness and blocking exceptions before employee drill-down</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">Attendance feed complete for 96% employees</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">19 blocking exceptions across 11 employees</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">42 warnings relate to arrears and rounding</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Bank advice can generate only after blocker count is zero</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI anomaly and variance explanation</text><text x="664" y="464" class="small" text-anchor="start">AI can highlight unusual pay changes and reconciliation signals, but cannot auto-close the run</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI payroll anomaly note</text><text x="684" y="522" class="body" text-anchor="start">Net pay spike is concentrated in 3 employees due to loss-of-pay reversal arrears and one late incentive import that was not present in the prior run.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: inspect impacted employees, confirm approval evidence for reversals, and rerun validation before close.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Open variance</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Open impacted emp</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Employee drill-down and recalculation state</text><text x="312" y="754" class="small" text-anchor="start">Employee-level fixes, recalculation impact, and source lineage stay near the run queue</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">11 employees need detailed exception review</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">42 rows require recompute after input correction</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">1 settlement employee pending finance sign-off</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Prior-run compare available for all blocker cases</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Approval, close checklist, and downstream outputs</text><text x="664" y="754" class="small" text-anchor="start">Approval evidence, close readiness, and payout outputs belong in the same run cockpit</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">Approver chain requires payroll lead then finance</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Bank advice and payslip jobs stay locked while blockers remain</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">GL export variance within threshold after warning-only items</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Run audit snapshot captured before close</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned payroll lenses</text><text x="312" y="994" class="small" text-anchor="start">Payroll teams can pin company, month, exception, arrear, and payout-focused run views</text><rect x="320" y="990" width="112" height="28" rx="14" fill="#DCFCE7"/><text x="376.0" y="1008" class="small" text-anchor="middle">Jul 2026</text><rect x="444" y="990" width="110" height="28" rx="14" fill="#DBEAFE"/><text x="499.0" y="1008" class="small" text-anchor="middle">India</text><rect x="566" y="990" width="118" height="28" rx="14" fill="#FEF3C7"/><text x="625.0" y="1008" class="small" text-anchor="middle">Blockers</text><rect x="696" y="990" width="108" height="28" rx="14" fill="#FEE2E2"/><text x="750.0" y="1008" class="small" text-anchor="middle">Arrears</text><rect x="816" y="990" width="112" height="28" rx="14" fill="#EDE9FE"/><text x="872.0" y="1008" class="small" text-anchor="middle">Bank file</text><rect x="940" y="990" width="168" height="28" rx="14" fill="#F8FAFC"/><text x="1024.0" y="1008" class="small" text-anchor="middle">LOP reversal</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Close-gated hero strip</text><text x="1224" y="224" class="annoText" text-anchor="start">Top actions focus on blocker resolution and controlled approval because payroll close is irreversible.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Run-aware search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search is tuned to employee, source, exception, component, and recalculation artifacts.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Blocking-first KPI row</text><text x="1224" y="328" class="annoText" text-anchor="start">The KPI strip keeps blockers, warnings, and delta signals visible before any approval action.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Readiness before drill-down</text><text x="1224" y="380" class="annoText" text-anchor="start">The left card keeps input completeness and queue severity primary before deeper employee inspection.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable payroll AI</text><text x="1224" y="432" class="annoText" text-anchor="start">AI anomalies are rationale-led and explicitly stop short of approving or closing the run.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Outputs gated by readiness</text><text x="1224" y="484" class="annoText" text-anchor="start">Bank advice, payslips, and GL downstream outputs stay visibly dependent on blocker clearance.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Run triage lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned views match how payroll teams revisit runs by month, country, exception, and payout artifact.</text></svg>
