<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Campaigns</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Queue</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">High Risk</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Remediation</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Evidence</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Review</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Access Review Campaign Workspace</text><rect x="296" y="152" width="108" height="28" rx="14" fill="#DBEAFE"/><text x="350.0" y="170" class="small" text-anchor="middle">Items 3.2k</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="416" y="152" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="477.0" y="170" class="small" text-anchor="middle">High risk 148</text><rect x="550" y="152" width="110" height="28" rx="14" fill="#FEE2E2"/><text x="605.0" y="170" class="small" text-anchor="middle">Overdue 19</text><rect x="808" y="146" width="188" height="40" rx="14" fill="#2563EB"/><text x="902.0" y="172" class="inverse" text-anchor="middle">Open high-risk queue</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="1008" y="146" width="154" height="40" rx="14" fill="#0F766E"/><text x="1085.0" y="172" class="inverse" text-anchor="middle">Bulk low-risk</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search reviewer, system, role family, delegated access, risk class, or remediation task</text><rect x="856" y="226" width="78" height="28" rx="14" fill="#EAF2F8"/><text x="895.0" y="244" class="small" text-anchor="middle">Queue</text><rect x="944" y="226" width="96" height="28" rx="14" fill="#EAF2F8"/><text x="992.0" y="244" class="small" text-anchor="middle">Evidence</text><rect x="1050" y="226" width="62" height="28" rx="14" fill="#10324A"/><text x="1081.0" y="244" class="inverse" text-anchor="middle">Decide</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Complete</text><text x="364" y="362" class="metric" text-anchor="start">61%</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">High risk</text><text x="586" y="362" class="metric" text-anchor="start">148</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Revokes</text><text x="808" y="362" class="metric" text-anchor="start">37</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">SLA</text><text x="1030" y="362" class="metric" text-anchor="start">19</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Self cert</text><text x="1252" y="362" class="metric" text-anchor="start">04</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Campaign scope and review queue</text><text x="312" y="464" class="small" text-anchor="start">Certification throughput starts from actionable review items, not campaign metadata</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">3.2k access items in scope</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">148 high-risk rows need explicit review</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">19 reviewer SLAs are overdue</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Delegated access active across 3 systems</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Decision panel and evidence</text><text x="664" y="464" class="small" text-anchor="start">Certify, revoke, delegate, and comment stay adjacent to proof and owner context</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Review insight</text><text x="684" y="522" class="body" text-anchor="start">A privileged finance export role was last used 61 days ago and the current reviewer cannot self-certify because the grant was requested within the same cost center.</text><text x="684" y="544" class="small" text-anchor="start">Next step: inspect evidence, certify or revoke explicitly, and track downstream revocation to completion.</text><rect x="666" y="574" width="146" height="40" rx="14" fill="#2563EB"/><text x="739.0" y="600" class="inverse" text-anchor="middle">Open item</text><rect x="826" y="574" width="124" height="40" rx="14" fill="#EEF2FF"/><text x="888.0" y="600" class="body" text-anchor="middle">Ask why</text><rect x="964" y="574" width="146" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1037.0" y="600" class="body" text-anchor="middle">Track revoke</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Bulk low-risk lane</text><text x="312" y="754" class="small" text-anchor="start">Policy-safe bulk certification is separated from high-risk decision work</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Low-risk group contains 412 items</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">High-risk items explicitly excluded</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Reviewer comment optional on safe bulk certify</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">One dormant-service-account cluster needs manual review</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Remediation tracker</text><text x="664" y="754" class="small" text-anchor="start">Access revocation is not complete until downstream connectors confirm closure</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">37 revokes pending remediation</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">2 connectors still unconfirmed</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Certification snapshot frozen for audit</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">1 reviewer-item self-cert conflict flagged</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned access-review lenses</text><text x="312" y="994" class="small" text-anchor="start">Reviewers can pin privileged, dormant, delegated, orphaned, and payroll-sensitive access views</text><rect x="320" y="990" width="112" height="28" rx="14" fill="#DCFCE7"/><text x="376.0" y="1008" class="small" text-anchor="middle">Privileged</text><rect x="444" y="990" width="102" height="28" rx="14" fill="#DBEAFE"/><text x="495.0" y="1008" class="small" text-anchor="middle">Dormant</text><rect x="558" y="990" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="614.0" y="1008" class="small" text-anchor="middle">Delegated</text><rect x="682" y="990" width="106" height="28" rx="14" fill="#FEE2E2"/><text x="735.0" y="1008" class="small" text-anchor="middle">Orphaned</text><rect x="800" y="990" width="96" height="28" rx="14" fill="#EDE9FE"/><text x="848.0" y="1008" class="small" text-anchor="middle">Payroll</text><rect x="908" y="990" width="100" height="28" rx="14" fill="#F8FAFC"/><text x="958.0" y="1008" class="small" text-anchor="middle">Evidence</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Queue-first workbench</text><text x="1224" y="224" class="annoText" text-anchor="start">This screen starts from decision work, not campaign metadata, because certification throughput matters most.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">High risk resists bulk</text><text x="1224" y="276" class="annoText" text-anchor="start">Bulk actions are visually separated to reinforce policy limits on convenience behavior.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Evidence beside actions</text><text x="1224" y="328" class="annoText" text-anchor="start">Justification, owner context, and last-used proof stay visible while reviewers decide.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Remediation completes the loop</text><text x="1224" y="380" class="annoText" text-anchor="start">Revoked access is tracked until downstream systems confirm closure.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Frozen scope is visible</text><text x="1224" y="432" class="annoText" text-anchor="start">Reviewers can see they are certifying against a stable campaign snapshot.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Self-cert conflicts are explicit</text><text x="1224" y="484" class="annoText" text-anchor="start">Prohibited reviewer-item combinations are surfaced as design rules, not buried in logs.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile remains complete</text><text x="1224" y="536" class="annoText" text-anchor="start">Mobile supports full certify or revoke flows because campaign progress can stall without it.</text></svg>
