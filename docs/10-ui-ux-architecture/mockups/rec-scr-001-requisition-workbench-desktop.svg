<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Demand and Approval Workbench</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Requisitions</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Posting</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Pipeline</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Aging</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">History</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Recruit</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Requisition Workbench</text><rect x="296" y="152" width="120" height="28" rx="14" fill="#DBEAFE"/><text x="356.0" y="170" class="small" text-anchor="middle">Open 46</text><rect x="428" y="152" width="152" height="28" rx="14" fill="#FEF3C7"/><text x="504.0" y="170" class="small" text-anchor="middle">Approvals 09</text><rect x="592" y="152" width="146" height="28" rx="14" fill="#FEE2E2"/><text x="665.0" y="170" class="small" text-anchor="middle">On hold 04</text><rect x="808" y="146" width="188" height="40" rx="14" fill="#2563EB"/><text x="902" y="172" class="inverse" text-anchor="middle">Review requisition</text><rect x="1008" y="146" width="150" height="40" rx="14" fill="#0F766E"/><text x="1083" y="172" class="inverse" text-anchor="middle">Open posting</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search requisition, manager, skill, budget band, approval stage, or aging risk</text><rect x="856" y="226" width="98" height="28" rx="14" fill="#EAF2F8"/><text x="905.0" y="244" class="small" text-anchor="middle">Filters</text><rect x="964" y="226" width="118" height="28" rx="14" fill="#EAF2F8"/><text x="1023.0" y="244" class="small" text-anchor="middle">Approval</text><rect x="1092" y="226" width="48" height="28" rx="14" fill="#10324A"/><text x="1116.0" y="244" class="inverse" text-anchor="middle">Open</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">2</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Open reqs</text><text x="364" y="362" class="metric" text-anchor="start">46</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Awaiting app</text><text x="586" y="362" class="metric" text-anchor="start">09</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Aging 15d+</text><text x="808" y="362" class="metric" text-anchor="start">07</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Confidential</text><text x="1030" y="362" class="metric" text-anchor="start">05</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Fill diff</text><text x="1252" y="362" class="metric" text-anchor="start">11</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">3</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Demand queue and approval backlog</text><text x="312" y="464" class="small" text-anchor="start">Recruiting teams need approval, aging, and posting-readiness context before pipeline browsing</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">9 requisitions awaiting finance or hiring-head approval</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">7 requisitions crossed aging threshold without publish</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">4 roles paused due to budget freeze</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">2 confidential roles have restricted recruiter visibility</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">4</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">AI sourcing and fill-difficulty guidance</text><text x="664" y="464" class="small" text-anchor="start">AI can suggest posting strategy and fill difficulty, but publishing remains controlled by recruiting and approvers</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">AI requisition guidance</text><text x="684" y="522" class="body" text-anchor="start">The senior data engineer requisition is likely to be hard to fill because location flexibility is low and notice-period requirement is tighter than current market supply.</text><text x="684" y="544" class="small" text-anchor="start">Suggested next step: widen sourcing mix, compare compensation range, and publish externally after approval chain clears.</text><rect x="666" y="574" width="154" height="36" rx="12" fill="#2563EB"/><text x="743" y="598" class="inverse" text-anchor="middle">Review strategy</text><rect x="834" y="574" width="124" height="36" rx="12" fill="#EEF2FF"/><text x="896" y="598" class="body" text-anchor="middle">Ask why</text><rect x="972" y="574" width="168" height="36" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1056" y="598" class="small" text-anchor="middle">Open approval path</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">5</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Posting readiness and amendment state</text><text x="312" y="754" class="small" text-anchor="start">Posting checklist, amendment flow, and demand counters stay near the requisition queue</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">3 requisitions missing JD or interview plan</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">1 approved range amendment pending finance sign-off</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">Hire counter reached limit for 2 requisitions</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Internal posting first rule active for 5 roles</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Pipeline linkage and history</text><text x="664" y="754" class="small" text-anchor="start">Pipeline summary, recruiter assignment, and audit lineage belong in the same hiring-demand workspace</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">12 candidates already linked to ENG-214</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Recruiter reassignment requested for 3 reqs</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">Reopened requisition after failed offer yesterday</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Timeline shows publish, hold, and reopen actions</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">6</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned requisition lenses</text><text x="312" y="994" class="small" text-anchor="start">Recruiters can pin function, urgency, approval, confidentiality, and sourcing-oriented requisition views</text><rect x="320" y="990" width="122" height="28" rx="14" fill="#DCFCE7"/><text x="381.0" y="1008" class="small" text-anchor="middle">Engineering</text><rect x="454" y="990" width="116" height="28" rx="14" fill="#DBEAFE"/><text x="512.0" y="1008" class="small" text-anchor="middle">Urgent</text><rect x="582" y="990" width="122" height="28" rx="14" fill="#FEF3C7"/><text x="643.0" y="1008" class="small" text-anchor="middle">Approval</text><rect x="716" y="990" width="138" height="28" rx="14" fill="#FEE2E2"/><text x="785.0" y="1008" class="small" text-anchor="middle">Confidential</text><rect x="866" y="990" width="116" height="28" rx="14" fill="#EDE9FE"/><text x="924.0" y="1008" class="small" text-anchor="middle">External</text><rect x="994" y="990" width="114" height="28" rx="14" fill="#F8FAFC"/><text x="1051.0" y="1008" class="small" text-anchor="middle">Aging</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">7</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Demand-first hero strip</text><text x="1224" y="224" class="annoText" text-anchor="start">The top actions prioritize requisition review and posting because the core decision is whether demand can safely move into market.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Approval-aware search</text><text x="1224" y="276" class="annoText" text-anchor="start">Search follows requisition, manager, stage, and budget concepts rather than later-stage candidate artifacts.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Backlog KPI row</text><text x="1224" y="328" class="annoText" text-anchor="start">The KPI strip highlights approval, aging, confidentiality, and fill-difficulty signals before users enter detail.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Queue before pipeline</text><text x="1224" y="380" class="annoText" text-anchor="start">The left card keeps demand backlog and approval blockers primary before candidate pipeline curiosity takes over.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Explainable sourcing AI</text><text x="1224" y="432" class="annoText" text-anchor="start">AI guidance stays recommendation-led and connects directly to sourcing and approval decisions.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Posting and history together</text><text x="1224" y="484" class="annoText" text-anchor="start">Amendments, posting readiness, and reopen history stay in one workbench because they affect the same requisition lifecycle.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Demand triage lenses</text><text x="1224" y="536" class="annoText" text-anchor="start">Pinned views reflect how recruiting operations repeatedly slice work by urgency, confidentiality, and approval state.</text></svg>
