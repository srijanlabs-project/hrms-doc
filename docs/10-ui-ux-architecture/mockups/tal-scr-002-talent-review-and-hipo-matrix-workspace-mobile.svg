  <rect x="28" y="188" width="160" height="28" rx="14" fill="#DBEAFE"/>
  <text x="108" y="206" class="small" text-anchor="middle">Matrix view</text>
  <rect x="198" y="188" width="164" height="28" rx="14" fill="#FEF3C7"/>
  <text x="280" y="206" class="small" text-anchor="middle">Confidential</text>

  <rect x="28" y="236" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="264" class="small">Reviewed</text>
  <text x="44" y="292" class="metric">64</text>
  <rect x="204" y="236" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="220" y="264" class="small">HiPo</text>
  <text x="220" y="292" class="metric">14</text>
  <rect x="28" y="334" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="362" class="small">Moves</text>
  <text x="44" y="390" class="metric">06</text>
  <rect x="204" y="334" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="220" y="362" class="small">Panels</text>
  <text x="220" y="390" class="metric">08</text>

  <rect x="28" y="434" width="334" height="46" rx="16" fill="#2563EB"/>
  <text x="195" y="463" class="inverse" text-anchor="middle">Open talent panel</text>
  <circle cx="40" cy="440" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="40" y="445" class="inverse" text-anchor="middle">2</text>
  <rect x="28" y="492" width="334" height="46" rx="16" fill="#0F766E"/>
  <text x="195" y="521" class="inverse" text-anchor="middle">Compare matrix</text>

  <rect x="28" y="558" width="334" height="262" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="586" class="h3">Talent matrix and confidentiality</text>
  <text x="44" y="606" class="small">The matrix must remain readable while protecting highly sensitive talent data.</text>
  <circle cx="40" cy="574" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="40" y="579" class="inverse" text-anchor="middle">3</text>
  <circle cx='42' cy='650' r='3' fill='#2563EB'/>
<text x='54' y='654' class='body'>Matrix remains readable on mobile</text>
<circle cx='42' cy='672' r='3' fill='#2563EB'/>
<text x='54' y='676' class='body'>Confidential handling stays explicit</text>
<circle cx='42' cy='694' r='3' fill='#2563EB'/>
<text x='54' y='698' class='body'>HiPo and bench cues remain visible</text>

  <rect x="28" y="846" width="334" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="874" class="h3">Panel review and action queue</text>
  <text x="44" y="894" class="small">Talent review should end with concrete follow-up, not just labels.</text>
  <circle cx="40" cy="862" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="40" y="867" class="inverse" text-anchor="middle">4</text>
  <circle cx='42' cy='936' r='3' fill='#2563EB'/>
<text x='54' y='940' class='body'>Panel actions are nearby</text>
<circle cx='42' cy='958' r='3' fill='#2563EB'/>
<text x='54' y='962' class='body'>Disagreement becomes visible early</text>
<circle cx='42' cy='980' r='3' fill='#2563EB'/>
<text x='54' y='984' class='body'>History remains available</text>

  <rect x="28" y="1104" width="334" height="392" rx="20" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="1132" class="h3">Mobile annotations</text>
    <circle cx="40" cy="1296" r="12" fill="#2563EB"/>
  <text x="40" y="1300" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="1298" class="annoTitle">Sensitive matrix</text>
  <text x="62" y="1316" class="annoText">Talent matrix views should remain useful without overexposing sensitive data.</text>
  <circle cx="40" cy="1344" r="12" fill="#2563EB"/>
  <text x="40" y="1348" class="inverse" text-anchor="middle">2</text>
  <text x="62" y="1346" class="annoTitle">HiPo with context</text>
  <text x="62" y="1364" class="annoText">HiPo labels need surrounding context and next steps.</text>
  <circle cx="40" cy="1392" r="12" fill="#2563EB"/>
  <text x="40" y="1396" class="inverse" text-anchor="middle">3</text>
  <text x="62" y="1394" class="annoTitle">Panel disagreement visibility</text>
  <text x="62" y="1412" class="annoText">Panel disagreement should be visible before final decisions.</text>
  <circle cx="40" cy="1440" r="12" fill="#2563EB"/>
  <text x="40" y="1444" class="inverse" text-anchor="middle">4</text>
  <text x="62" y="1442" class="annoTitle">Action after review</text>
  <text x="62" y="1460" class="annoText">Every review should generate follow-through actions.</text>
  <circle cx="40" cy="1488" r="12" fill="#2563EB"/>
  <text x="40" y="1492" class="inverse" text-anchor="middle">5</text>
  <text x="62" y="1490" class="annoTitle">Scoped confidentiality</text>
  <text x="62" y="1508" class="annoText">Confidentiality needs obvious scope boundaries.</text>
