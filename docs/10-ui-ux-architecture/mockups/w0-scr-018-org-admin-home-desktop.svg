lass="annoTitle" text-anchor="start">Signal hierarchy</text><text x="1224" y="328" class="annoText" text-anchor="start">Urgent tenant readiness and compliance metrics appear before analytics.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Setup-first guidance</text><text x="1224" y="380" class="annoText" text-anchor="start">Incomplete implementation and expiring connectors receive early visual priority.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Health grid</text><text x="1224" y="432" class="annoText" text-anchor="start">Configuration domains are framed as actionable cards, not generic status blocks.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Trust emphasis</text><text x="1224" y="484" class="annoText" text-anchor="start">Governance and privacy reviews outrank adoption metrics in the reading order.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Admin chronology</text><text x="1224" y="536" class="annoText" text-anchor="start">Recent tenant-admin actions support troubleshooting and audit review.</text></svg>
