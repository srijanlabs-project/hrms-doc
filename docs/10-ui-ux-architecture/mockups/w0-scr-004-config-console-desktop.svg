ll="#2563EB"/><text x="326" y="402" class="body" text-anchor="start">Notifications</text><circle cx="316" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="316" y="225" class="inverse" text-anchor="middle">2</text><rect x="540" y="206" width="380" height="630" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="540" y="206" width="380" height="42" rx="14" fill="#F8FAFC"/><text x="552" y="232" class="small" text-anchor="start">Key</text><text x="650.8" y="232" class="small" text-anchor="start">Label</text><text x="787.5999999999999" y="232" class="small" text-anchor="start">Risk</text><text x="848.3999999999999" y="232" class="small" text-anchor="start">Updated</text><line x1="638.8" y1="216" x2="638.8" y2="824" stroke="#D9E2EC" stroke-width="1"/><line x1="775.5999999999999" y1="216" x2="775.5999999999999" y2="824" stroke="#D9E2EC" stroke-width="1"/><line x1="836.3999999999999" y1="216" x2="836.3999999999999" y2="824" stroke="#D9E2EC" stroke-width="1"/><rect x="541" y="242" width="378" height="42" rx="8" fill="#FBFDFF"/><text x="552" y="264" class="body" text-anchor="start">wf.approval.max</text><text x="650.8" y="264" class="body" text-anchor="start">Approval max level</text><text x="787.5999999999999" y="264" class="body" text-anchor="start">High</text><text x="848.3999999999999" y="264" class="body" text-anchor="start">Today</text><line x1="548" y1="276" x2="912" y2="276" stroke="#D9E2EC" stroke-width="1"/><text x="552" y="306" class="body" text-anchor="start">idp.session.ttl</text><text x="650.8" y="306" class="body" text-anchor="start">Session timeout</text><text x="787.5999999999999" y="306" class="body" text-anchor="start">High</text><text x="848.3999999999999" y="306" class="body" text-anchor="start">Yesterday</text><line x1="548" y1="318" x2="912" y2="318" stroke="#D9E2EC" stroke-width="1"/><rect x="541" y="326" width="378" height="42" rx="8" fill="#FBFDFF"/><text x="552" y="348" class="body" text-anchor="start">brand.primary</text><text x="650.8" y="348" class="body" text-anchor="start">Primary color</text><text x="787.5999999999999" y="348" class="body" text-anchor="start">Low</text><text x="848.3999999999999" y="348" class="body" text-anchor="start">Mon</text><line x1="548" y1="360" x2="912" y2="360" stroke="#D9E2EC" stroke-width="1"/><text x="552" y="390" class="body" text-anchor="start">notif.retry.count</text><text x="650.8" y="390" class="body" text-anchor="start">Retry count</text><text x="787.5999999999999" y="390" class="body" text-anchor="start">Medium</text><text x="848.3999999999999" y="390" class="body" text-anchor="start">Tue</text><line x1="548" y1="402" x2="912" y2="402" stroke="#D9E2EC" stroke-width="1"/><rect x="541" y="410" width="378" height="42" rx="8" fill="#FBFDFF"/><text x="552" y="432" class="body" text-anchor="start">audit.export.retention</text><text x="650.8" y="432" class="body" text-anchor="start">Export retention</text><text x="787.5999999999999" y="432" class="body" text-anchor="start">High</text><text x="848.3999999999999" y="432" class="body" text-anchor="start">Wed</text><line x1="548" y1="444" x2="912" y2="444" stroke="#D9E2EC" stroke-width="1"/><circle cx="556" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="556" y="225" class="inverse" text-anchor="middle">3</text><rect x="940" y="206" width="218" height="630" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="956" y="230" class="h3" text-anchor="start">Effective detail</text><text x="956" y="248" class="small" text-anchor="start">Value lineage and validation stay beside the table</text><circle cx="958" cy="264" r="3" fill="#2563EB"/><text x="970" y="268" class="body" text-anchor="start">Current effective value</text><circle cx="958" cy="284" r="3" fill="#2563EB"/><text x="970" y="288" class="body" text-anchor="start">Scope lineage stack</text><circle cx="958" cy="304" r="3" fill="#2563EB"/><text x="970" y="308" class="body" text-anchor="start">Validation rules</text><circle cx="958" cy="324" r="3" fill="#2563EB"/><text x="970" y="328" class="body" text-anchor="start">Dependencies</text><circle cx="958" cy="344" r="3" fill="#2563EB"/><text x="970" y="348" class="body" text-anchor="start">Editable by</text><circle cx="954" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="954" y="225" class="inverse" text-anchor="middle">4</text><rect x="296" y="856" width="862" height="194" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="880" class="h3" text-anchor="start">Change proposal drawer</text><text x="312" y="898" class="small" text-anchor="start">Targeted override proposal without leaving current context</text><rect x="314" y="904" width="152" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><rect x="482" y="904" width="136" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><rect x="634" y="904" width="170" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><rect x="820" y="904" width="320" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="324" y="930" class="small" text-anchor="start">Value</text><text x="492" y="930" class="small" text-anchor="start">Scope</text><text x="644" y="930" class="small" text-anchor="start">Effective date</text><text x="830" y="930" class="small" text-anchor="start">Impact notes</text><circle cx="314" cy="870" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="875" class="inverse" text-anchor="middle">5</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Governed edit action</text><text x="1224" y="224" class="annoText" text-anchor="start">The change action is elevated but remains approval-aware and scope-bound.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Browse discipline</text><text x="1224" y="276" class="annoText" text-anchor="start">Search and category tree keep the catalog navigable at scale.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Dense but legible table</text><text x="1224" y="328" class="annoText" text-anchor="start">Key metadata stays visible for scanning before opening detail.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Lineage-first detail</text><text x="1224" y="380" class="annoText" text-anchor="start">Why a value is effective is treated as a first-class design concern.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Inline proposal flow</text><text x="1224" y="432" class="annoText" text-anchor="start">Override proposal stays connected to the selected configuration record.</text></svg>
