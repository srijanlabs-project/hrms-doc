FFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1026" y="462" width="44" height="44" rx="12" fill="#2563EB"/><text x="1082" y="480" class="small" text-anchor="start">Escalations</text><text x="1082" y="510" class="metric" text-anchor="start">06</text><circle cx="1016" cy="578" r="3" fill="#2563EB"/><text x="1028" y="582" class="body" text-anchor="start">Payroll command blocked</text><circle cx="1016" cy="598" r="3" fill="#2563EB"/><text x="1028" y="602" class="body" text-anchor="start">PII leak test failed</text><circle cx="1016" cy="618" r="3" fill="#2563EB"/><text x="1028" y="622" class="body" text-anchor="start">Region rule mismatch</text><circle cx="1016" cy="638" r="3" fill="#2563EB"/><text x="1028" y="642" class="body" text-anchor="start">Prompt publish awaiting review</text><circle cx="1018" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="1018" y="225" class="inverse" text-anchor="middle">4</text><rect x="296" y="860" width="862" height="190" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="884" class="h3" text-anchor="start">Compare, approve, and publish</text><text x="312" y="902" class="small" text-anchor="start">Draft-versus-live change review with explicit evidence before release</text><rect x="314" y="904" width="142" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><rect x="472" y="904" width="146" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><rect x="634" y="904" width="176" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><rect x="826" y="904" width="314" height="42" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="326" y="930" class="small" text-anchor="start">Policy diff</text><text x="484" y="930" class="small" text-anchor="start">Risk score</text><text x="646" y="930" class="small" text-anchor="start">Approval chain</text><text x="838" y="930" class="small" text-anchor="start">Release note and rollback note</text><circle cx="314" cy="876" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="881" class="inverse" text-anchor="middle">5</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Publish behind governance</text><text x="1224" y="224" class="annoText" text-anchor="start">Policy publishing is visible, but always framed as a controlled release action.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Catalog-first administration</text><text x="1224" y="276" class="annoText" text-anchor="start">Admins locate policy families and prompt packs quickly before deeper review.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Evaluation beside policy</text><text x="1224" y="328" class="annoText" text-anchor="start">Policy state and evaluation evidence stay together to avoid blind promotion.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Incident visibility</text><text x="1224" y="380" class="annoText" text-anchor="start">Violations and cost spikes remain in the same workspace as policy actions.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Compare before release</text><text x="1224" y="432" class="annoText" text-anchor="start">Draft and live policy comparison is treated as a first-class release ritual.</text></svg>
