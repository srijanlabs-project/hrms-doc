  <rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="1196" y="314" width="44" height="44" rx="12" fill="#B42318"/>
  <text x="1252" y="332" class="small">Expiring certs</text>
  <text x="1252" y="362" class="metric">01</text>

  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">SSO readiness and launch controls</text>
  <text x="312" y="464" class="small">Org and IT admins need safe tenant-side go-live evidence before they touch claim or domain configuration</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body">Primary login domain verified and branded sign-in URL published for hr.acme.in</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body">Sandbox and production metadata match except for one certificate rollover pending approval</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body">Default relay state covers employee and manager portals without provider-side routing changes</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body">Break-glass local admins remain isolated from normal SSO disable and claim-edit actions</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Federation map and trust state</text>
  <text x="664" y="464" class="small">Provider trust, tenant-safe remediation, and certificate health stay together so admins do not have to infer blast radius</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC"/>
  <text x="684" y="496" class="small">Trust review cue</text>
  <text x="684" y="522" class="body">One federation uses a signing certificate that expires on 28 Jul 2026, while backup metadata and issuer match remain healthy for the other active links.</text>
  <text x="684" y="544" class="small">Next step: stage rollover metadata, confirm ACS callback coverage, or download tenant trace without touching provider-only knobs.</text>
  <rect x="666" y="574" width="132" height="40" rx="14" fill="#2563EB"/>
  <text x="732" y="600" class="inverse" text-anchor="middle">Review cert</text>
  <rect x="812" y="574" width="136" height="40" rx="14" fill="#EEF2FF"/>
  <text x="880" y="600" class="body" text-anchor="middle">Open metadata</text>
  <rect x="962" y="574" width="140" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="1032" y="600" class="body" text-anchor="middle">Download trace</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">MFA posture and policy drift</text>
  <text x="312" y="754" class="small">Identity assurance is shown as posture and exceptions, not as raw policy syntax</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body">Privileged admin group requires phishing-resistant MFA on every new device</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body">17 employees still use SMS fallback because authenticator enrollment campaign is incomplete</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body">Step-up challenge is enabled for payroll exports and identity-policy edits</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body">Trusted-device grace periods remain within tenant policy and are audit-visible</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3">Provisioning sync and configuration health</text>
  <text x="664" y="754" class="small">SCIM job status, attribute safety, and tenant-owned routing rules support troubleshooting without exposing provider internals</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body">Last delta sync completed 14 minutes ago with 2 manager attribute mismatches queued for review</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body">Joiner and leaver flows stay mapped to tenant HR identifiers and legal entity scoping</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body">Provisioning pause is limited to the selected connector and does not disable active user sign-in</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body">Config drift notice highlights changed claim mapping, stale endpoint URL, and untested backup cert path</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="312" y="976" class="h3">Tenant-safe troubleshooting cues</text>
  <text x="312" y="994" class="small">Admins can pivot across repeat-safe diagnostic lenses without invoking provider or platform-only recovery actions</text>
  <rect x="320" y="990" width="96" height="28" rx="14" fill="#DCFCE7"/>
  <text x="368" y="1008" class="small" text-anchor="middle">Recent sign-ins</text>
  <rect x="428" y="990" width="92" height="28" rx="14" fill="#DBEAFE"/>
  <text x="474" y="1008" class="small" text-anchor="middle">Claim drift</text>
  <rect x="532" y="990" width="108" height="28" rx="14" fill="#FEF3C7"/>
  <text x="586" y="1008" class="small" text-anchor="middle">Cert rollover</text>
  <rect x="652" y="990" width="96" height="28" rx="14" fill="#FEE2E2"/>
  <text x="700" y="1008" class="small" text-anchor="middle">Sync retries</text>
  <rect x="760" y="990" width="88" height="28" rx="14" fill="#EDE9FE"/>
  <text x="804" y="1008" class="small" text-anchor="middle">MFA gaps</text>
  <rect x="860" y="990" width="86" height="28" rx="14" fill="#F8FAFC"/>
  <text x="903" y="1008" class="small" text-anchor="middle">Audit trail</text>
  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">7</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Tenant-owned boundary</text>
  <text x="1224" y="224" class="annoText">This console stays inside org-admin identity administration and excludes provider control-plane actions.</text>
  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle">Readiness before edits</text>
  <text x="1224" y="276" class="annoText">Go-live and trust evidence appears before claim or connector detail so risky changes are not the default move.</text>
  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle">Signal card hierarchy</text>
  <text x="1224" y="328" class="annoText">SSO, federation, MFA, sync, and certificate status lead the page because they drive operational trust.</text>
  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle">Trust review stays concrete</text>
  <text x="1224" y="380" class="annoText">Certificate expiry, issuer match, and metadata actions are framed as specific admin tasks, not abstract health badges.</text>
  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle">MFA posture is policy-safe</text>
  <text x="1224" y="432" class="annoText">The mockup shows assurance level and drift without exposing secrets or overpromising exact provider mechanics.</text>
  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle">Troubleshooting is scoped</text>
  <text x="1224" y="484" class="annoText">Diagnostic pivots support tenant admins with repeat-safe traces, retries, and audit evidence only.</text>
  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle">Desktop favors synthesis</text>
  <text x="1224" y="536" class="annoText">The layout combines readiness, trust, posture, and recovery context so IT admins can make one informed pass.</text>
</svg>
