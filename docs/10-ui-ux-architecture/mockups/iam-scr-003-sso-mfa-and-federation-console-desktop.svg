  <text x="820" y="151" class="inverse" text-anchor="middle">1</text>
  <rect x="980" y="146" width="170" height="40" rx="14" fill="#0F766E"/>
  <text x="1065" y="172" class="inverse" text-anchor="middle">Run test sign-in</text>

  <rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC"/>
  <text x="338" y="249" class="body">Search domain, claim rule, MFA policy, provisioning object, or certificate thumbprint</text>
  <rect x="856" y="226" width="96" height="28" rx="14" fill="#EAF2F8"/>
  <text x="904" y="244" class="small" text-anchor="middle">This week</text>
  <rect x="962" y="226" width="92" height="28" rx="14" fill="#EAF2F8"/>
  <text x="1008" y="244" class="small" text-anchor="middle">SSO view</text>
  <rect x="1064" y="226" width="86" height="28" rx="14" fill="#10324A"/>
  <text x="1107" y="244" class="inverse" text-anchor="middle">Needs fix</text>
  <circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="221" class="inverse" text-anchor="middle">2</text>

  <rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/>
  <text x="364" y="332" class="small">SSO readiness</text>
  <text x="364" y="362" class="metric">92%</text>
  <circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="321" class="inverse" text-anchor="middle">3</text>

  <rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <rect x="530" y="314" width="44" height="44" rx="12" fill="#0F766E"/>
  <text x="586" y="332" class="small">Federation links</text>
  <text x="586" y="362" class="metric">03</text>

