  <text x="1210" y="58" class="small" text-anchor="middle">Alerts 06</text>
  <rect x="1274" y="40" width="126" height="28" rx="14" fill="#E3F2FD"/>
  <text x="1337" y="58" class="small" text-anchor="middle">Policies 12</text>

  <text x="310" y="128" class="title">SSO MFA and Federation Console</text>
  <rect x="296" y="152" width="118" height="28" rx="14" fill="#DBEAFE"/>
  <text x="355" y="170" class="small" text-anchor="middle">Tenant Acme India</text>
  <rect x="426" y="152" width="108" height="28" rx="14" fill="#DCFCE7"/>
  <text x="480" y="170" class="small" text-anchor="middle">IdP Entra ID</text>
  <rect x="546" y="152" width="116" height="28" rx="14" fill="#FEF3C7"/>
  <text x="604" y="170" class="small" text-anchor="middle">SCIM delta sync</text>
  <rect x="808" y="146" width="160" height="40" rx="14" fill="#2563EB"/>
  <text x="888" y="172" class="inverse" text-anchor="middle">Open trust review</text>
