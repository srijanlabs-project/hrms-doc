<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/>
  <rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/>
  <text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text>
  <rect x="310" y="18" width="60" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="340" y="36" class="inverse" text-anchor="middle">Org</text>
  <text x="20" y="76" class="h2inv" text-anchor="start">Organization Structure Workbench</text>

  <rect x="16" y="108" width="96" height="28" rx="14" fill="#DBEAFE"/>
  <text x="64" y="126" class="small" text-anchor="middle">Nodes 428</text>
  <circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="127" class="inverse" text-anchor="middle">1</text>
  <rect x="120" y="108" width="104" height="28" rx="14" fill="#FEF3C7"/>
  <text x="172" y="126" class="small" text-anchor="middle">Pending 16</text>
  <rect x="232" y="108" width="110" height="28" rx="14" fill="#FEE2E2"/>
  <text x="287" y="126" class="small" text-anchor="middle">Blocks 2</text>

  <rect x="16" y="154" width="358" height="58" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="34" y="190" class="body" text-anchor="start">Search entity, BU, department, campus, or org code</text>
  <circle cx="28" cy="168" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="173" class="inverse" text-anchor="middle">2</text>

  <rect x="16" y="228" width="358" height="162" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="32" y="252" class="h3" text-anchor="start">Hierarchy and pending structure changes</text>
  <text x="32" y="270" class="small" text-anchor="start">Mobile starts with the branches and changes that need an admin decision.</text>
  <circle cx="34" cy="282" r="3" fill="#2563EB"/>
  <text x="46" y="286" class="body" text-anchor="start">06 legal entities, 18 BUs, and 142 departments</text>
  <circle cx="34" cy="302" r="3" fill="#2563EB"/>
  <text x="46" y="306" class="body" text-anchor="start">Digital Platforms has 4 future-dated department moves</text>
  <circle cx="34" cy="322" r="3" fill="#2563EB"/>
  <text x="46" y="326" class="body" text-anchor="start">2 branches blocked by missing payroll mapping</text>
  <circle cx="34" cy="342" r="3" fill="#2563EB"/>
  <text x="46" y="346" class="body" text-anchor="start">Draft Bengaluru Campus stays hidden until publish</text>
  <circle cx="30" cy="244" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="249" class="inverse" text-anchor="middle">3</text>

  <rect x="16" y="406" width="358" height="188" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="32" y="430" class="h3" text-anchor="start">Selected node and safe actions</text>
  <text x="32" y="448" class="small" text-anchor="start">Admins review structure, effectivity, and navigation impact before saving changes.</text>
  <circle cx="34" cy="460" r="3" fill="#2563EB"/>
  <text x="46" y="464" class="body" text-anchor="start">DEP-4412 Shared Services Payroll changes parent on 01 Aug 2026</text>
  <circle cx="34" cy="480" r="3" fill="#2563EB"/>
  <text x="46" y="484" class="body" text-anchor="start">128 incumbents and 3 requisitions inherit the new BU path</text>
  <circle cx="34" cy="500" r="3" fill="#2563EB"/>
  <text x="46" y="504" class="body" text-anchor="start">Preview navigation before publish for local admin visibility</text>
  <circle cx="34" cy="520" r="3" fill="#2563EB"/>
  <text x="46" y="524" class="body" text-anchor="start">Audit lineage keeps create, move, merge, and retire steps</text>
  <rect x="30" y="538" width="136" height="40" rx="14" fill="#2563EB"/>
  <text x="98" y="564" class="inverse" text-anchor="middle">Edit node</text>
  <rect x="180" y="538" width="176" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="268" y="564" class="body" text-anchor="middle">Preview navigation</text>
  <circle cx="30" cy="422" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="427" class="inverse" text-anchor="middle">4</text>

  <rect x="16" y="610" width="358" height="128" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="32" y="634" class="h3" text-anchor="start">Geo, workplace, and publish context</text>
  <text x="32" y="652" class="small" text-anchor="start">Workplace geography and downstream consumers compress into one review stack.</text>
  <circle cx="34" cy="662" r="3" fill="#2563EB"/>
  <text x="46" y="666" class="body" text-anchor="start">Bengaluru Campus Tower 3 Floor 6 is active</text>
  <circle cx="34" cy="682" r="3" fill="#2563EB"/>
  <text x="46" y="686" class="body" text-anchor="start">Mumbai BKC office opens with 5 draft departments</text>
  <circle cx="34" cy="702" r="3" fill="#2563EB"/>
  <text x="46" y="706" class="body" text-anchor="start">Payroll, leave, and requisitions update after publish</text>
  <circle cx="30" cy="626" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="631" class="inverse" text-anchor="middle">5</text>

  <rect x="16" y="754" width="358" height="72" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="34" y="780" class="h2" text-anchor="start">Mobile notes</text>
  <circle cx="40" cy="804" r="12" fill="#2563EB"/>
  <text x="40" y="808" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="806" class="annoTitle" text-anchor="start">Review-first mobile</text>
  <text x="62" y="824" class="annoText" text-anchor="start">Mobile preserves org-change review, publish awareness, and navigation checks while dense tree editing stays desktop-led.</text>
</svg>
