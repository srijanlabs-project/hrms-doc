<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Control Plane</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Home</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Workflow</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Tasks</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Configs</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Audit</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">PROD</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Workflow Administration</text><rect x="296" y="152" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="352.0" y="170" class="small" text-anchor="middle">Publish queue 3</text><rect x="420" y="152" width="108" height="28" rx="14" fill="#E3F2FD"/><text x="474.0" y="170" class="small" text-anchor="middle">Drafts 12</text><rect x="1000" y="146" width="158" height="40" rx="14" fill="#0F766E"/><text x="1079" y="172" class="inverse" text-anchor="middle">Create template</text><circle cx="1014" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="1014" y="151" class="inverse" text-anchor="middle">1</text><rect x="296" y="206" width="252" height="636" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="230" class="h3" text-anchor="start">Workflow catalog</text><text x="312" y="248" class="small" text-anchor="start">Search, filter, and select workflow templates</text><rect x="314" y="248" width="216" height="34" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="328" y="270" class="small" text-anchor="start">Search workflow</text><circle cx="314" cy="318" r="3" fill="#2563EB"/><text x="326" y="322" class="body" text-anchor="start">Hiring approval</text><circle cx="314" cy="338" r="3" fill="#2563EB"/><text x="326" y="342" class="body" text-anchor="start">Leave approval</text><circle cx="314" cy="358" r="3" fill="#2563EB"/><text x="326" y="362" class="body" text-anchor="start">Exit clearance</text><circle cx="314" cy="378" r="3" fill="#2563EB"/><text x="326" y="382" class="body" text-anchor="start">Policy publish</text><circle cx="314" cy="398" r="3" fill="#2563EB"/><text x="326" y="402" class="body" text-anchor="start">Document review</text><circle cx="316" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="316" y="225" class="inverse" text-anchor="middle">2</text><rect x="568" y="206" width="402" height="636" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="584" y="230" class="h3" text-anchor="start">Route preview and version summary</text><text x="584" y="248" class="small" text-anchor="start">Live route, draft state, SLA, and escalation path</text><rect x="586" y="248" width="108" height="28" rx="14" fill="#DCFCE7"/><text x="640.0" y="266" class="small" text-anchor="middle">Published v6</text><rect x="704" y="248" width="88" height="28" rx="14" fill="#DBEAFE"/><text x="748.0" y="266" class="small" text-anchor="middle">Draft v7</text><rect x="586" y="324" width="60" height="60" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="616" y="350" class="small" text-anchor="middle">1</text><text x="616" y="372" class="tiny" text-anchor="middle">Submit</text><line x1="646" y1="354" x2="658" y2="354" stroke="#2563EB" stroke-width="3"/><rect x="658" y="324" width="60" height="60" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="688" y="350" class="small" text-anchor="middle">2</text><text x="688" y="372" class="tiny" text-anchor="middle">Manager</text><line x1="718" y1="354" x2="730" y2="354" stroke="#2563EB" stroke-width="3"/><rect x="730" y="324" width="60" height="60" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="760" y="350" class="small" text-anchor="middle">3</text><text x="760" y="372" class="tiny" text-anchor="middle">HR Review</text><line x1="790" y1="354" x2="802" y2="354" stroke="#2563EB" stroke-width="3"/><rect x="802" y="324" width="60" height="60" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="832" y="350" class="small" text-anchor="middle">4</text><text x="832" y="372" class="tiny" text-anchor="middle">Security</text><line x1="862" y1="354" x2="874" y2="354" stroke="#2563EB" stroke-width="3"/><rect x="874" y="324" width="60" height="60" rx="12" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="904" y="350" class="small" text-anchor="middle">5</text><text x="904" y="372" class="tiny" text-anchor="middle">Close</text><circle cx="586" cy="448" r="3" fill="#2563EB"/><text x="598" y="452" class="body" text-anchor="start">Escalates after 24h</text><circle cx="586" cy="468" r="3" fill="#2563EB"/><text x="598" y="472" class="body" text-anchor="start">Delegation allowed at step 2</text><circle cx="586" cy="488" r="3" fill="#2563EB"/><text x="598" y="492" class="body" text-anchor="start">Security step only for high-risk cases</text><circle cx="586" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="586" y="225" class="inverse" text-anchor="middle">3</text><rect x="990" y="206" width="168" height="636" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="1006" y="230" class="h3" text-anchor="start">Execution health</text><text x="1006" y="248" class="small" text-anchor="start">Stuck items, failures, and active instances</text><rect x="1002" y="246" width="144" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1014" y="258" width="44" height="44" rx="12" fill="#15803D"/><text x="1070" y="276" class="small" text-anchor="start">Active</text><text x="1070" y="306" class="metric" text-anchor="start">128</text><rect x="1002" y="348" width="144" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1014" y="360" width="44" height="44" rx="12" fill="#B42318"/><text x="1070" y="378" class="small" text-anchor="start">Stuck</text><text x="1070" y="408" class="metric" text-anchor="start">06</text><rect x="1002" y="450" width="144" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1014" y="462" width="44" height="44" rx="12" fill="#D97706"/><text x="1070" y="480" class="small" text-anchor="start">Failed</text><text x="1070" y="510" class="metric" text-anchor="start">03</text><circle cx="1008" cy="578" r="3" fill="#2563EB"/><text x="1020" y="582" class="body" text-anchor="start">Approval SLA breach</text><circle cx="1008" cy="598" r="3" fill="#2563EB"/><text x="1020" y="602" class="body" text-anchor="start">Missing approver mapping</text><circle cx="1008" cy="618" r="3" fill="#2563EB"/><text x="1020" y="622" class="body" text-anchor="start">Invalid transition attempt</text><circle cx="1006" cy="220" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="1006" y="225" class="inverse" text-anchor="middle">4</text><rect x="296" y="860" width="862" height="190" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="884" class="h3" text-anchor="start">Version history and change actions</text><text x="312" y="902" class="small" text-anchor="start">Compare, publish, schedule, and rollback-aware controls</text><circle cx="314" cy="912" r="3" fill="#2563EB"/><text x="326" y="916" class="body" text-anchor="start">v7 Draft saved today</text><circle cx="314" cy="932" r="3" fill="#2563EB"/><text x="326" y="936" class="body" text-anchor="start">v6 Published 2 days ago</text><circle cx="314" cy="952" r="3" fill="#2563EB"/><text x="326" y="956" class="body" text-anchor="start">Compare changes</text><circle cx="314" cy="972" r="3" fill="#2563EB"/><text x="326" y="976" class="body" text-anchor="start">Schedule publish</text><circle cx="314" cy="992" r="3" fill="#2563EB"/><text x="326" y="996" class="body" text-anchor="start">Rollback candidate available</text><circle cx="314" cy="876" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="881" class="inverse" text-anchor="middle">5</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Governed creation</text><text x="1224" y="224" class="annoText" text-anchor="start">New workflow creation is visible but framed inside a publish-controlled admin workspace.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Catalog-first selection</text><text x="1224" y="276" class="annoText" text-anchor="start">Admins pick templates quickly before entering route detail or change review.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Route clarity</text><text x="1224" y="328" class="annoText" text-anchor="start">Draft and published versions are shown together so route edits stay understandable.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Health and stuck items</text><text x="1224" y="380" class="annoText" text-anchor="start">Execution problems stay visible beside design detail rather than in a separate monitor.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Version actions</text><text x="1224" y="432" class="annoText" text-anchor="start">Publish, compare, and rollback remain tied to clear version history evidence.</text></svg>
