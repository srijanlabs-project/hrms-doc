<text x='678' y='486' class='body'>Pending approvals and policy holds are clearly labeled</text>
<circle cx='666' cy='504' r='3' fill='#2563EB'/>
<text x='678' y='508' class='body'>Allocation checks prevent over-commitment</text>
<circle cx='666' cy='526' r='3' fill='#2563EB'/>
<text x='678' y='530' class='body'>Life-event and window exceptions stay visible</text>
<circle cx='666' cy='548' r='3' fill='#2563EB'/>
<text x='678' y='552' class='body'>History and confirmation remain easy to retrieve</text>

