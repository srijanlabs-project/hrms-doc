  <text x="312" y="446" class="h3">Plan selection and dependent coverage</text>
  <text x="312" y="464" class="small">Benefits choice should be clear even when rules are complex.</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>
  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>Plan cards show coverage, cost, and dependent impact</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Dependent validation remains visible before submission</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>Enrollment window and lock state are easy to understand</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Flexible-benefit allocation stays close to tax and policy context</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Enrollment workflow and guardrails</text>
  <text x="664" y="464" class="small">The user should understand what can still change and what is already locked.</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>
