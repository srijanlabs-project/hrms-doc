="390" class="body" text-anchor="start">Workflow published</text><text x="270" y="390" class="small" text-anchor="start">Open detail</text><circle cx="30" cy="192" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="197" class="inverse" text-anchor="middle">2</text><rect x="16" y="432" width="358" height="176" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="456" class="h3" text-anchor="start">Selected event detail</text><text x="32" y="474" class="small" text-anchor="start">Summary, diff, masking, and correlation stacked vertically</text><circle cx="34" cy="482" r="3" fill="#2563EB"/><text x="46" y="486" class="body" text-anchor="start">Event summary</text><circle cx="34" cy="502" r="3" fill="#2563EB"/><text x="46" y="506" class="body" text-anchor="start">Before and after values</text><circle cx="34" cy="522" r="3" fill="#2563EB"/><text x="46" y="526" class="body" text-anchor="start">Masked fields</text><circle cx="34" cy="542" r="3" fill="#2563EB"/><text x="46" y="546" class="body" text-anchor="start">Correlation ID</text><circle cx="30" cy="448" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="453" class="inverse" text-anchor="middle">3</text><rect x="16" y="624" width="358" height="104" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="648" class="h3" text-anchor="start">Timeline</text><text x="32" y="666" class="small" text-anchor="start">Related chronology remains visible as a compact sequence</text><circle cx="34" cy="672" r="3" fill="#2563EB"/><text x="46" y="676" class="body" text-anchor="start">Create</text><circle cx="34" cy="692" r="3" fill="#2563EB"/><text x="46" y="696" class="body" text-anchor="start">Update</text><circle cx="34" cy="712" r="3" fill="#2563EB"/><text x="46" y="716" class="body" text-anchor="start">Export</text><circle cx="30" cy="640" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="645" class="inverse" text-anchor="middle">4</text><rect x="16" y="744" width="358" height="82" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="772" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="796" r="12" fill="#2563EB"/><text x="40" y="800" class="inverse" text-anchor="middle">1</text><text x="62" y="798" class="annoTitle" text-anchor="start">Card-based investigation</text><text x="62" y="816" class="annoText" text-anchor="start">Mobile replaces the split view with event cards and a selected-event detail state.</text></svg>
