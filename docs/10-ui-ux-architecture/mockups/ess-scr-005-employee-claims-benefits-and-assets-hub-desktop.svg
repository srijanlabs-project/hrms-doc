  <rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="446" class="h3">Claims, coverage, and asset visibility</text>
  <text x="312" y="464" class="small">Employees should be able to understand benefits and owned assets from one hub.</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>
  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>Open claims and reimbursements remain visible</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Benefit coverage and plan state are easy to review</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>Assigned assets stay visible with return or issue cues</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Important support actions remain nearby</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3">Status and self-service support</text>
  <text x="664" y="464" class="small">The hub should reduce back-and-forth for common employee questions.</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">5</text>
  <circle cx='666' cy='482' r='3' fill='#2563EB'/>
<text x='678' y='486' class='body'>Pending reimbursements and claim returns are clear</text>
<circle cx='666' cy='504' r='3' fill='#2563EB'/>
<text x='678' y='508' class='body'>Benefits and asset history remain accessible</text>
<circle cx='666' cy='526' r='3' fill='#2563EB'/>
<text x='678' y='530' class='body'>Links to detailed workflows are easy to launch</text>
<circle cx='666' cy='548' r='3' fill='#2563EB'/>
<text x='678' y='552' class='body'>Support guidance stays contextual</text>

  <rect x="296" y="712" width="862" height="222" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3">Employee trust and clarity</text>
  <text x="312" y="754" class="small">The screen should feel dependable and low-effort.</text>
  <circle cx="314" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="733" class="inverse" text-anchor="middle">6</text>
  <circle cx='314' cy='782' r='3' fill='#2563EB'/>
<text x='326' y='786' class='body'>Pending items stay above static information</text>
<circle cx='314' cy='804' r='3' fill='#2563EB'/>
<text x='326' y='808' class='body'>History supports self-resolution</text>
<circle cx='314' cy='826' r='3' fill='#2563EB'/>
<text x='326' y='830' class='body'>Asset and benefit state remain easy to understand</text>

  <rect x="1178" y="152" width="238" height="782" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2">Desktop annotations</text>
    <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle">Claims plus benefits</text>
  <text x="1224" y="224" class="annoText">Employees often think in outcomes, not module boundaries.</text>
  <circle cx="1202" cy="258" r="12" fill="#2563EB"/>
  <text x="1202" y="262" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="260" class="annoTitle">Asset context</text>
  <text x="1224" y="278" class="annoText">Asset state should be visible beside claims and benefits context.</text>
  <circle cx="1202" cy="312" r="12" fill="#2563EB"/>
  <text x="1202" y="316" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="314" class="annoTitle">Pending-first design</text>
  <text x="1224" y="332" class="annoText">Pending work should surface before reference information.</text>
  <circle cx="1202" cy="366" r="12" fill="#2563EB"/>
  <text x="1202" y="370" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="368" class="annoTitle">History nearby</text>
  <text x="1224" y="386" class="annoText">History helps users answer their own questions.</text>
  <circle cx="1202" cy="420" r="12" fill="#2563EB"/>
  <text x="1202" y="424" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="422" class="annoTitle">Support linkage</text>
  <text x="1224" y="440" class="annoText">Contextual support reduces ticket creation.</text>
  <circle cx="1202" cy="474" r="12" fill="#2563EB"/>
  <text x="1202" y="478" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="476" class="annoTitle">Low-effort self-service</text>
  <text x="1224" y="494" class="annoText">The hub should feel simple despite many domains.</text>
