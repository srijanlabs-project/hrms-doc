  <circle cx="1202" cy="474" r="12" fill="#2563EB"/>
  <text x="1202" y="478" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="476" class="annoTitle">Engagement without overload</text>
  <text x="1224" y="494" class="annoText">Engagement should not create noise fatigue.</text>
