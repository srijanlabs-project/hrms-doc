  <text x="312" y="446" class="h3">Feed and community activity</text>
  <text x="312" y="464" class="small">Employees should be able to see the social pulse of the company without losing relevance.</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>
  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>Feed highlights relevant updates and posts</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Communities remain easy to browse and join</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>Events and RSVPs stay visible with timing context</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Announcements remain clearly labeled</text>

