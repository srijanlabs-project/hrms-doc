<circle cx='666' cy='526' r='3' fill='#2563EB'/>
<text x='678' y='530' class='body'>Saved and followed items reduce repeat searching</text>
<circle cx='666' cy='548' r='3' fill='#2563EB'/>
<text x='678' y='552' class='body'>History helps employees revisit past activity</text>

