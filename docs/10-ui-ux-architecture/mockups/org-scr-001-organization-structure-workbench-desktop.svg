  <circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="320" y="971" class="inverse" text-anchor="middle">8</text>

  <rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text>
  <circle cx="1202" cy="204" r="12" fill="#2563EB"/>
  <text x="1202" y="208" class="inverse" text-anchor="middle">1</text>
  <text x="1224" y="206" class="annoTitle" text-anchor="start">Org-first signal strip</text>
  <text x="1224" y="224" class="annoText" text-anchor="start">The header surfaces total nodes, pending changes, and publish blockers before browsing.</text>

  <circle cx="1202" cy="256" r="12" fill="#2563EB"/>
  <text x="1202" y="260" class="inverse" text-anchor="middle">2</text>
  <text x="1224" y="258" class="annoTitle" text-anchor="start">Safe create flow</text>
  <text x="1224" y="276" class="annoText" text-anchor="start">Creating an entity or department stays close to impact review because hierarchy errors cascade widely.</text>

  <circle cx="1202" cy="308" r="12" fill="#2563EB"/>
  <text x="1202" y="312" class="inverse" text-anchor="middle">3</text>
  <text x="1224" y="310" class="annoTitle" text-anchor="start">Hierarchy search</text>
  <text x="1224" y="328" class="annoText" text-anchor="start">Admins can search by org code, place, or parent path instead of relying on manual tree expansion.</text>

  <circle cx="1202" cy="360" r="12" fill="#2563EB"/>
  <text x="1202" y="364" class="inverse" text-anchor="middle">4</text>
  <text x="1224" y="362" class="annoTitle" text-anchor="start">Shared KPI row</text>
  <text x="1224" y="380" class="annoText" text-anchor="start">Entities, BUs, departments, workplaces, and publish sets summarize implementation scope quickly.</text>

  <circle cx="1202" cy="412" r="12" fill="#2563EB"/>
  <text x="1202" y="416" class="inverse" text-anchor="middle">5</text>
  <text x="1224" y="414" class="annoTitle" text-anchor="start">Tree plus queue</text>
  <text x="1224" y="432" class="annoText" text-anchor="start">The hierarchy view doubles as a change queue so admins can resolve structure and migration tasks together.</text>

  <circle cx="1202" cy="464" r="12" fill="#2563EB"/>
  <text x="1202" y="468" class="inverse" text-anchor="middle">6</text>
  <text x="1224" y="466" class="annoTitle" text-anchor="start">Selected-node governance</text>
  <text x="1224" y="484" class="annoText" text-anchor="start">Effective date, parent path, and navigation visibility are reviewed before any structure save or publish.</text>

  <circle cx="1202" cy="516" r="12" fill="#2563EB"/>
  <text x="1202" y="520" class="inverse" text-anchor="middle">7</text>
  <text x="1224" y="518" class="annoTitle" text-anchor="start">Geo and nav linkage</text>
  <text x="1224" y="536" class="annoText" text-anchor="start">Workplace geography and admin-controlled navigation are treated as part of structure, not separate setup.</text>
  <circle cx="1202" cy="568" r="12" fill="#2563EB"/>
  <text x="1202" y="572" class="inverse" text-anchor="middle">8</text>
  <text x="1224" y="570" class="annoTitle" text-anchor="start">Mobile stays supervisory</text>
  <text x="1224" y="588" class="annoText" text-anchor="start">Small screens should support review, approval, and publish awareness while dense tree editing remains desktop-led.</text>
