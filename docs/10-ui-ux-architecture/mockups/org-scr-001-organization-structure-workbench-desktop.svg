  <text x="312" y="446" class="h3" text-anchor="start">Hierarchy explorer and change queue</text>
  <text x="312" y="464" class="small" text-anchor="start">Org admins browse legal entity, BU, department, and workplace branches together.</text>
  <circle cx="314" cy="480" r="3" fill="#2563EB"/>
  <text x="326" y="484" class="body" text-anchor="start">ApexOne Holdings contains 3 active group companies and 6 legal entities</text>
  <circle cx="314" cy="500" r="3" fill="#2563EB"/>
  <text x="326" y="504" class="body" text-anchor="start">Digital Platforms BU has 12 departments and 4 future-dated moves</text>
  <circle cx="314" cy="520" r="3" fill="#2563EB"/>
  <text x="326" y="524" class="body" text-anchor="start">2 departments still missing payroll area and cost-center mapping</text>
  <circle cx="314" cy="540" r="3" fill="#2563EB"/>
  <text x="326" y="544" class="body" text-anchor="start">Draft Bengaluru Campus branch is hidden from manager navigation until publish</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">5</text>

  <rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="446" class="h3" text-anchor="start">Selected node workspace and admin controls</text>
  <text x="664" y="464" class="small" text-anchor="start">The chosen node shows effective dating, parentage, and safe navigation rules before save.</text>
  <rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="684" y="496" class="small" text-anchor="start">Selected node</text>
  <text x="684" y="522" class="body" text-anchor="start">Department DEP-4412 Shared Services Payroll will move from Corporate Services to Digital Platforms on 01 Aug 2026 with 128 incumbents and 3 open requisitions affected.</text>
  <text x="684" y="544" class="small" text-anchor="start">Next step: confirm parent path, validate navigation scope, then publish with downstream alerts.</text>
  <rect x="666" y="574" width="136" height="40" rx="14" fill="#2563EB"/>
  <text x="734" y="600" class="inverse" text-anchor="middle">Edit node</text>
  <rect x="816" y="574" width="150" height="40" rx="14" fill="#EEF2FF"/>
  <text x="891" y="600" class="body" text-anchor="middle">Preview navigation</text>
  <rect x="980" y="574" width="134" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="1047" y="600" class="body" text-anchor="middle">View lineage</text>
  <circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="443" class="inverse" text-anchor="middle">6</text>

  <rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="312" y="736" class="h3" text-anchor="start">Geo and workplace structure</text>
  <text x="312" y="754" class="small" text-anchor="start">Location hierarchy and workplace readiness sit beside the org tree because both drive assignment rules.</text>
  <circle cx="314" cy="770" r="3" fill="#2563EB"/>
  <text x="326" y="774" class="body" text-anchor="start">India &gt; Karnataka &gt; Bengaluru Campus &gt; Tower 3 &gt; Floor 6 is active</text>
  <circle cx="314" cy="790" r="3" fill="#2563EB"/>
  <text x="326" y="794" class="body" text-anchor="start">Mumbai BKC office opens on 15 Sep 2026 with 5 draft departments</text>
  <circle cx="314" cy="810" r="3" fill="#2563EB"/>
  <text x="326" y="814" class="body" text-anchor="start">Hybrid workplace tag controls attendance zone and visitor routing</text>
  <circle cx="314" cy="830" r="3" fill="#2563EB"/>
  <text x="326" y="834" class="body" text-anchor="start">2 campuses need building-to-cost-center reconciliation before cutover</text>

  <rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/>
  <text x="664" y="736" class="h3" text-anchor="start">Navigation governance and downstream impact</text>
  <text x="664" y="754" class="small" text-anchor="start">Admin-controlled navigation decides who can see draft or restricted branches across HRMS modules.</text>
  <circle cx="666" cy="770" r="3" fill="#2563EB"/>
  <text x="678" y="774" class="body" text-anchor="start">Manager self service excludes draft departments until publish is complete</text>
  <circle cx="666" cy="790" r="3" fill="#2563EB"/>
  <text x="678" y="794" class="body" text-anchor="start">Payroll, leave, and requisition flows inherit the new BU path after effective date</text>
  <circle cx="666" cy="810" r="3" fill="#2563EB"/>
  <text x="678" y="814" class="body" text-anchor="start">Restricted entities can be hidden from local admins by navigation pack</text>
  <circle cx="666" cy="830" r="3" fill="#2563EB"/>
  <text x="678" y="834" class="body" text-anchor="start">Audit log captures create, move, merge, retire, and publish actions by batch</text>
  <circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="666" y="733" class="inverse" text-anchor="middle">7</text>

