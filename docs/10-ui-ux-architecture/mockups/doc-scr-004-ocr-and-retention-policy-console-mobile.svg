  <circle cx='42' cy='936' r='3' fill='#2563EB'/>
<text x='54' y='940' class='body'>Policy scope remains clear</text>
<circle cx='42' cy='958' r='3' fill='#2563EB'/>
<text x='54' y='962' class='body'>History supports governance</text>
<circle cx='42' cy='980' r='3' fill='#2563EB'/>
<text x='54' y='984' class='body'>Operations plus compliance stay connected</text>

  <rect x="28" y="1104" width="334" height="392" rx="20" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="1132" class="h3">Mobile annotations</text>
    <circle cx="40" cy="1296" r="12" fill="#2563EB"/>
