  <text x="44" y="586" class="h3">OCR trust and retention rule visibility</text>
  <text x="44" y="606" class="small">The console should connect content extraction quality to document lifecycle governance.</text>
  <circle cx="40" cy="574" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
