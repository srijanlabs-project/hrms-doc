  <circle cx="40" cy="1392" r="12" fill="#2563EB"/>
  <text x="40" y="1396" class="inverse" text-anchor="middle">3</text>
  <text x="62" y="1394" class="annoTitle">Expiry nearby</text>
  <text x="62" y="1412" class="annoText">Expiry and retention should remain easy to inspect.</text>
  <circle cx="40" cy="1440" r="12" fill="#2563EB"/>
  <text x="40" y="1444" class="inverse" text-anchor="middle">4</text>
  <text x="62" y="1442" class="annoTitle">Scope remains clear</text>
  <text x="62" y="1460" class="annoText">Policy scope should stay understandable.</text>
  <circle cx="40" cy="1488" r="12" fill="#2563EB"/>
  <text x="40" y="1492" class="inverse" text-anchor="middle">5</text>
  <text x="62" y="1490" class="annoTitle">Operations plus compliance</text>
  <text x="62" y="1508" class="annoText">The console should support both compliance and operations.</text>
