  <text x="312" y="446" class="h3">Pool allocation and grant planning</text>
  <text x="312" y="464" class="small">Variable pay planning should keep incentives, pools, and grants in one governed surface.</text>
  <circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="314" y="443" class="inverse" text-anchor="middle">4</text>
  <circle cx='314' cy='482' r='3' fill='#2563EB'/>
<text x='326' y='486' class='body'>Bonus pools remain visible by team and funding source</text>
<circle cx='314' cy='504' r='3' fill='#2563EB'/>
<text x='326' y='508' class='body'>Grant status and vesting visibility stay close to the employee list</text>
<circle cx='314' cy='526' r='3' fill='#2563EB'/>
<text x='326' y='530' class='body'>Scenario variance is easy to compare</text>
<circle cx='314' cy='548' r='3' fill='#2563EB'/>
<text x='326' y='552' class='body'>Exceptions and caps stand out</text>

