<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="390" height="844" fill="#F4F7FB"/>
  <rect width="390" height="92" fill="#10324A"/>
  <text x="20" y="36" class="inverse">Enterprise HRMS</text>
  <rect x="286" y="18" width="84" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="328" y="36" class="inverse" text-anchor="middle">Org Admin</text>
  <text x="20" y="76" class="h2inv">Number Series</text>

  <rect x="16" y="108" width="358" height="96" rx="16" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="30" y="136" class="small">Series governance overview</text>
  <text x="30" y="170" class="metric">19</text>
  <text x="82" y="170" class="body">series in use</text>
  <rect x="248" y="122" width="110" height="28" rx="14" fill="#DBEAFE"/>
  <text x="303" y="140" class="small" text-anchor="middle">Drafts 06</text>
  <rect x="248" y="156" width="110" height="28" rx="14" fill="#FEE2E2"/>
  <text x="303" y="174" class="small" text-anchor="middle">Holds 04</text>
  <circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="127" class="inverse" text-anchor="middle">1</text>

  <rect x="16" y="220" width="358" height="168" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="244" class="h3">Series setup focus</text>
  <text x="32" y="262" class="small">Mobile keeps scope, issuance mode, and gap policy visible before editing details</text>
  <circle cx="34" cy="280" r="3" fill="#2563EB"/>
  <text x="46" y="284" class="body">EMP-IN-FY26 uses legal-entity scope, yearly reset, width 5, and reserve-on-create behavior</text>
  <circle cx="34" cy="300" r="3" fill="#2563EB"/>
  <text x="46" y="304" class="body">REQ-APAC previews freely but issues only after requisition approval commits</text>
  <circle cx="34" cy="320" r="3" fill="#2563EB"/>
  <text x="46" y="324" class="body">No-gap document numbering requires void reason when reservations expire or are canceled</text>
  <circle cx="34" cy="340" r="3" fill="#2563EB"/>
  <text x="46" y="344" class="body">Hot case-number stream is partitioned by support queue to reduce contention</text>
  <circle cx="30" cy="236" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="241" class="inverse" text-anchor="middle">2</text>

  <rect x="16" y="404" width="358" height="178" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="428" class="h3">Template identity and ownership</text>
  <text x="32" y="446" class="small">The desktop catalog posture becomes one stacked review list on mobile</text>
  <circle cx="34" cy="458" r="3" fill="#2563EB"/>
  <text x="46" y="462" class="body">Offer-letter template shows identity code, channel, language pack, and bound employee-code series</text>
  <circle cx="34" cy="478" r="3" fill="#2563EB"/>
  <text x="46" y="482" class="body">Draft mode can preview reserved numbering without consuming final business identifiers</text>
  <circle cx="34" cy="498" r="3" fill="#2563EB"/>
  <text x="46" y="502" class="body">Org admin edits local labels and prefixes while platform-owned shells remain read-only</text>
  <circle cx="34" cy="518" r="3" fill="#2563EB"/>
  <text x="46" y="522" class="body">Live legal-entity scoped assets require maker-checker before publish</text>
  <circle cx="30" cy="420" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="425" class="inverse" text-anchor="middle">3</text>

  <rect x="16" y="598" width="358" height="138" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="622" class="h3">Collision and reservation safety</text>
  <text x="32" y="640" class="small">Small-screen review still keeps duplicate risk and expiration policy in view</text>
  <circle cx="34" cy="648" r="3" fill="#2563EB"/>
  <text x="46" y="652" class="body">Overlapping APAC prefixes remain blocked until scope ownership is resolved</text>
  <circle cx="34" cy="668" r="3" fill="#2563EB"/>
  <text x="46" y="672" class="body">Atomic issuance preserved uniqueness during Monday retry spikes on employee IDs</text>
  <circle cx="34" cy="688" r="3" fill="#2563EB"/>
  <text x="46" y="692" class="body">Reservation expiry and cancellation reason remain mandatory for no-gap and governed series</text>
  <circle cx="30" cy="614" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="30" y="619" class="inverse" text-anchor="middle">4</text>

  <rect x="16" y="752" width="358" height="74" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="34" y="780" class="h2">Mobile notes</text>
  <circle cx="40" cy="804" r="12" fill="#2563EB"/>
  <text x="40" y="808" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="806" class="annoTitle">Governance before polish</text>
  <text x="62" y="824" class="annoText">Mobile preserves sequence logic, template identity, and collision safety ahead of deeper content editing.</text>
</svg>
