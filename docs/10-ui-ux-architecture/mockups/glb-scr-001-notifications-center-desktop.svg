<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F4F7FB"/><rect x="24" y="24" width="248" height="1232" rx="24" fill="#10324A" filter="url(#shadow)"/><text x="52" y="72" class="inverse" text-anchor="start">Shared Workspace</text><rect x="48" y="92" width="200" height="36" rx="12" fill="rgba(255,255,255,0.1)"/><text x="62" y="116" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="40" y="144" width="216" height="40" rx="12" fill="rgba(255,255,255,0.12)"/><text x="60" y="168" class="inverse" text-anchor="start">Notifications</text><rect x="40" y="196" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="220" class="inverse" text-anchor="start">Tasks</text><rect x="40" y="248" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="272" class="inverse" text-anchor="start">Approvals</text><rect x="40" y="300" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="324" class="inverse" text-anchor="start">Cases</text><rect x="40" y="352" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="376" class="inverse" text-anchor="start">Announcements</text><rect x="40" y="404" width="216" height="40" rx="12" fill="rgba(255,255,255,0.04)"/><text x="60" y="428" class="inverse" text-anchor="start">Help</text><rect x="296" y="24" width="1120" height="64" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="40" width="360" height="32" rx="16" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="61" class="small" text-anchor="start">Search, commands, records, audits...</text><rect x="1060" y="40" width="86" height="28" rx="14" fill="#EAF2F8"/><text x="1103.0" y="58" class="small" text-anchor="middle">Inbox</text><rect x="1160" y="40" width="88" height="28" rx="14" fill="#FDEAD7"/><text x="1204.0" y="58" class="small" text-anchor="middle">Alerts 12</text><rect x="1262" y="40" width="94" height="28" rx="14" fill="#E3F2FD"/><text x="1309.0" y="58" class="small" text-anchor="middle">Tasks 08</text><rect x="1368" y="36" width="32" height="40" rx="16" fill="#DCE7F3"/><text x="310" y="128" class="title" text-anchor="start">Notifications Center</text><rect x="296" y="152" width="96" height="28" rx="14" fill="#DBEAFE"/><text x="344.0" y="170" class="small" text-anchor="middle">Unread 18</text><circle cx="312" cy="166" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="312" y="171" class="inverse" text-anchor="middle">1</text><rect x="404" y="152" width="108" height="28" rx="14" fill="#FEF3C7"/><text x="458.0" y="170" class="small" text-anchor="middle">Actionable 7</text><rect x="524" y="152" width="106" height="28" rx="14" fill="#FEE2E2"/><text x="577.0" y="170" class="small" text-anchor="middle">Archived 42</text><rect x="808" y="146" width="170" height="40" rx="14" fill="#2563EB"/><text x="893.0" y="172" class="inverse" text-anchor="middle">Open actionable</text><circle cx="820" cy="146" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="820" y="151" class="inverse" text-anchor="middle">2</text><rect x="990" y="146" width="154" height="40" rx="14" fill="#0F766E"/><text x="1067.0" y="172" class="inverse" text-anchor="middle">Mark all read</text><rect x="296" y="206" width="862" height="76" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="320" y="226" width="520" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="338" y="249" class="body" text-anchor="start">Search notification, sender, module, case, approval, or announcement</text><rect x="856" y="226" width="84" height="28" rx="14" fill="#EAF2F8"/><text x="898.0" y="244" class="small" text-anchor="middle">Unread</text><rect x="950" y="226" width="102" height="28" rx="14" fill="#EAF2F8"/><text x="1001.0" y="244" class="small" text-anchor="middle">Actionable</text><rect x="1062" y="226" width="58" height="28" rx="14" fill="#10324A"/><text x="1091.0" y="244" class="inverse" text-anchor="middle">Inbox</text><circle cx="320" cy="216" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="221" class="inverse" text-anchor="middle">3</text><rect x="296" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="308" y="314" width="44" height="44" rx="12" fill="#15803D"/><text x="364" y="332" class="small" text-anchor="start">Unread</text><text x="364" y="362" class="metric" text-anchor="start">18</text><circle cx="320" cy="316" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="321" class="inverse" text-anchor="middle">4</text><rect x="518" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="530" y="314" width="44" height="44" rx="12" fill="#D97706"/><text x="586" y="332" class="small" text-anchor="start">Actionable</text><text x="586" y="362" class="metric" text-anchor="start">07</text><rect x="740" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="752" y="314" width="44" height="44" rx="12" fill="#B42318"/><text x="808" y="332" class="small" text-anchor="start">Mentions</text><text x="808" y="362" class="metric" text-anchor="start">04</text><rect x="962" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="974" y="314" width="44" height="44" rx="12" fill="#2563EB"/><text x="1030" y="332" class="small" text-anchor="start">Approvals</text><text x="1030" y="362" class="metric" text-anchor="start">03</text><rect x="1184" y="302" width="198" height="92" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><rect x="1196" y="314" width="44" height="44" rx="12" fill="#0F766E"/><text x="1252" y="332" class="small" text-anchor="start">Cases</text><text x="1252" y="362" class="metric" text-anchor="start">02</text><rect x="296" y="422" width="332" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="446" class="h3" text-anchor="start">Notification inbox and filters</text><text x="312" y="464" class="small" text-anchor="start">Actionable notifications outrank passive announcements in the default reading order</text><circle cx="314" cy="480" r="3" fill="#2563EB"/><text x="326" y="484" class="body" text-anchor="start">7 items require action today</text><circle cx="314" cy="500" r="3" fill="#2563EB"/><text x="326" y="504" class="body" text-anchor="start">3 approval notifications still pending</text><circle cx="314" cy="520" r="3" fill="#2563EB"/><text x="326" y="524" class="body" text-anchor="start">Unread-only filter active on current view</text><circle cx="314" cy="540" r="3" fill="#2563EB"/><text x="326" y="544" class="body" text-anchor="start">Cross-module notifications grouped by source</text><circle cx="314" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="314" y="443" class="inverse" text-anchor="middle">5</text><rect x="648" y="422" width="510" height="270" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="446" class="h3" text-anchor="start">Selected notification detail</text><text x="664" y="464" class="small" text-anchor="start">Context, origin, and next action remain visible without leaving the center</text><rect x="666" y="470" width="474" height="86" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="684" y="496" class="small" text-anchor="start">Actionable item</text><text x="684" y="522" class="body" text-anchor="start">A leave approval reminder references a team-coverage warning and links directly to the approval queue while preserving the original timestamp and sender context.</text><text x="684" y="544" class="small" text-anchor="start">Next step: open the linked action, complete or snooze it, and archive only after the dependent task is resolved.</text><rect x="666" y="574" width="142" height="40" rx="14" fill="#2563EB"/><text x="737.0" y="600" class="inverse" text-anchor="middle">Open action</text><rect x="822" y="574" width="112" height="40" rx="14" fill="#EEF2FF"/><text x="878.0" y="600" class="body" text-anchor="middle">Snooze</text><rect x="948" y="574" width="112" height="40" rx="14" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/><text x="1004.0" y="600" class="body" text-anchor="middle">Archive</text><circle cx="666" cy="438" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="443" class="inverse" text-anchor="middle">6</text><rect x="296" y="712" width="332" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="736" class="h3" text-anchor="start">Preferences and channel summary</text><text x="312" y="754" class="small" text-anchor="start">Users can understand which events reached them and through which channels</text><circle cx="314" cy="770" r="3" fill="#2563EB"/><text x="326" y="774" class="body" text-anchor="start">Email + in-app enabled for approvals</text><circle cx="314" cy="790" r="3" fill="#2563EB"/><text x="326" y="794" class="body" text-anchor="start">Push disabled for low-priority announcements</text><circle cx="314" cy="810" r="3" fill="#2563EB"/><text x="326" y="814" class="body" text-anchor="start">WhatsApp active for payroll-release notices</text><circle cx="314" cy="830" r="3" fill="#2563EB"/><text x="326" y="834" class="body" text-anchor="start">Digest schedule runs at 18:00 local time</text><rect x="648" y="712" width="510" height="220" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="664" y="736" class="h3" text-anchor="start">Archive and chronology</text><text x="664" y="754" class="small" text-anchor="start">Archive state and read history remain visible for later follow-up</text><circle cx="666" cy="770" r="3" fill="#2563EB"/><text x="678" y="774" class="body" text-anchor="start">42 items moved to archive this month</text><circle cx="666" cy="790" r="3" fill="#2563EB"/><text x="678" y="794" class="body" text-anchor="start">Mentions remain pinned for 7 days</text><circle cx="666" cy="810" r="3" fill="#2563EB"/><text x="678" y="814" class="body" text-anchor="start">One notification auto-closed after task completion</text><circle cx="666" cy="830" r="3" fill="#2563EB"/><text x="678" y="834" class="body" text-anchor="start">Chronology retains sender, channel, and read state</text><circle cx="666" cy="728" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="666" y="733" class="inverse" text-anchor="middle">7</text><rect x="296" y="952" width="862" height="98" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="312" y="976" class="h3" text-anchor="start">Pinned notification lenses</text><text x="312" y="994" class="small" text-anchor="start">Users can pin unread, actionable, approval, case, announcement, and archive-oriented views</text><rect x="320" y="990" width="84" height="28" rx="14" fill="#DCFCE7"/><text x="362.0" y="1008" class="small" text-anchor="middle">Unread</text><rect x="416" y="990" width="102" height="28" rx="14" fill="#DBEAFE"/><text x="467.0" y="1008" class="small" text-anchor="middle">Actionable</text><rect x="530" y="990" width="104" height="28" rx="14" fill="#FEF3C7"/><text x="582.0" y="1008" class="small" text-anchor="middle">Approvals</text><rect x="646" y="990" width="80" height="28" rx="14" fill="#FEE2E2"/><text x="686.0" y="1008" class="small" text-anchor="middle">Cases</text><rect x="738" y="990" width="96" height="28" rx="14" fill="#EDE9FE"/><text x="786.0" y="1008" class="small" text-anchor="middle">Mentions</text><rect x="846" y="990" width="92" height="28" rx="14" fill="#F8FAFC"/><text x="892.0" y="1008" class="small" text-anchor="middle">Archive</text><circle cx="320" cy="966" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="320" y="971" class="inverse" text-anchor="middle">8</text><rect x="1178" y="152" width="238" height="898" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="1196" y="180" class="h2" text-anchor="start">Desktop annotations</text><circle cx="1202" cy="204" r="12" fill="#2563EB"/><text x="1202" y="208" class="inverse" text-anchor="middle">1</text><text x="1224" y="206" class="annoTitle" text-anchor="start">Action before awareness</text><text x="1224" y="224" class="annoText" text-anchor="start">The inbox defaults to items needing action so users can clear important work first.</text><circle cx="1202" cy="256" r="12" fill="#2563EB"/><text x="1202" y="260" class="inverse" text-anchor="middle">2</text><text x="1224" y="258" class="annoTitle" text-anchor="start">Context stays with the alert</text><text x="1224" y="276" class="annoText" text-anchor="start">Linked actions preserve sender and source context instead of forcing blind navigation.</text><circle cx="1202" cy="308" r="12" fill="#2563EB"/><text x="1202" y="312" class="inverse" text-anchor="middle">3</text><text x="1224" y="310" class="annoTitle" text-anchor="start">Channel transparency</text><text x="1224" y="328" class="annoText" text-anchor="start">Preference and channel summaries help users understand how the system reached them.</text><circle cx="1202" cy="360" r="12" fill="#2563EB"/><text x="1202" y="364" class="inverse" text-anchor="middle">4</text><text x="1224" y="362" class="annoTitle" text-anchor="start">Archive is operational</text><text x="1224" y="380" class="annoText" text-anchor="start">Archived items still preserve chronology because they often matter for audit or follow-up.</text><circle cx="1202" cy="412" r="12" fill="#2563EB"/><text x="1202" y="416" class="inverse" text-anchor="middle">5</text><text x="1224" y="414" class="annoTitle" text-anchor="start">Unread-only is a mode</text><text x="1224" y="432" class="annoText" text-anchor="start">Unread and actionable states are treated as operational variants, not just filters.</text><circle cx="1202" cy="464" r="12" fill="#2563EB"/><text x="1202" y="468" class="inverse" text-anchor="middle">6</text><text x="1224" y="466" class="annoTitle" text-anchor="start">Global but role-safe</text><text x="1224" y="484" class="annoText" text-anchor="start">The center is shared across modules but still assumes access-safe source links.</text><circle cx="1202" cy="516" r="12" fill="#2563EB"/><text x="1202" y="520" class="inverse" text-anchor="middle">7</text><text x="1224" y="518" class="annoTitle" text-anchor="start">Mobile remains full</text><text x="1224" y="536" class="annoText" text-anchor="start">Notifications must be actionable from small screens, so mobile keeps the full core flow.</text></svg>
