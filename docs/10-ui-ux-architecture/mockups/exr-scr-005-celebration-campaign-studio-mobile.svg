<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1540" viewBox="0 0 390 1540" fill="none">

  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="390" height="1540" fill="#F4F7FB"/>
  <rect x="16" y="16" width="358" height="1508" rx="30" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="28" y="54" class="body">EXR-SCR-005</text>
  <text x="58" y="54" class="body">Celebration Campaign Stu</text>
  <circle cx="314" cy="48" r="12" fill="#EAF2F8"/>
  <circle cx="344" cy="48" r="12" fill="#FDEAD7"/>
  <text x="28" y="96" class="title">Celebration Campaign Studio</text>
  <text x="28" y="118" class="small">Design and schedule AI-assisted birthday, anniversary, and join-</text>
  <rect x="28" y="138" width="334" height="36" rx="18" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="160" class="small">Search task, signal, or explanation</text>
  <rect x="28" y="188" width="105" height="28" rx="14" fill="#FDEAD7" stroke="#FDEAD7" stroke-width="1"/><text x="80.5" y="206" class="small" text-anchor="middle">Celebration</text><rect x="143" y="188" width="92" height="28" rx="14" fill="#EAF2F8" stroke="#EAF2F8" stroke-width="1"/><text x="189.0" y="206" class="small" text-anchor="middle">Scheduled</text>
  <rect x="28" y="236" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="264" class="small">Active campaigns</text>
  <text x="44" y="292" class="metric">14</text>
  <rect x="204" y="236" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="220" y="264" class="small">Today</text>
  <text x="220" y="292" class="metric">03</text>
  <rect x="28" y="334" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="362" class="small">Queued assets</text>
  <text x="44" y="390" class="metric">86</text>
  <rect x="204" y="334" width="158" height="82" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="220" y="362" class="small">Needs approval</text>
  <text x="220" y="390" class="metric">04</text>
  <rect x="28" y="434" width="334" height="46" rx="16" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
  <text x="195" y="463" class="inverse" text-anchor="middle">Primary action</text>
  <rect x="28" y="492" width="334" height="46" rx="16" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
  <text x="195" y="521" class="inverse" text-anchor="middle">Review and continue</text>
  <rect x="28" y="558" width="334" height="262" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="586" class="h3">Campaign builder and schedule workflow</text>
  <text x="44" y="606" class="small">Mobile structural definition for product and engineering teams.</text>
  <circle cx='42' cy='650' r='3' fill='#2563EB'/><text x="54" y="654" class="body">HR should control campaign theme, timing, and audience rules.</text><circle cx='42' cy='672' r='3' fill='#2563EB'/><text x="54" y="676" class="body">Birthday, anniversary, and join-date flows reuse one studio.</text><circle cx='42' cy='694' r='3' fill='#2563EB'/><text x="54" y="698" class="body">Preview and approval states must stay explicit.</text>
  <rect x="28" y="846" width="334" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="874" class="h3">Generated cards, copy packs, and approvals</text>
  <text x="44" y="894" class="small">The mobile view keeps context, action, and audit close together.</text>
  <circle cx='42' cy='936' r='3' fill='#2563EB'/><text x="54" y="940" class="body">Generated assets include card image, copy, and publish channel.</text><circle cx='42' cy='958' r='3' fill='#2563EB'/><text x="54" y="962" class="body">Consent and missing-photo fallback must be visible.</text><circle cx='42' cy='980' r='3' fill='#2563EB'/><text x="54" y="984" class="body">Locale and occasion templates should remain editable before release.</text>
  <rect x="28" y="1104" width="334" height="392" rx="20" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/>
  <text x="44" y="1132" class="h3">Mobile annotations</text>
  <circle cx='42' cy='1180' r='3' fill='#2563EB'/><text x="54" y="1184" class="body">Prioritize the first action and signal.</text><circle cx='42' cy='1202' r='3' fill='#2563EB'/><text x="54" y="1206" class="body">Collapse dense context into expandable cards.</text><circle cx='42' cy='1224' r='3' fill='#2563EB'/><text x="54" y="1228" class="body">Keep audit and routing visible without overload.</text><circle cx='42' cy='1246' r='3' fill='#2563EB'/><text x="54" y="1250" class="body">Use this file as mockup guidance, not final UI.</text>
</svg>