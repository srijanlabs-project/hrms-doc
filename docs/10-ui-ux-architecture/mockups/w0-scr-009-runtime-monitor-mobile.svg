<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FB"/><rect x="0" y="0" width="390" height="92" rx="0" fill="#10324A"/><text x="20" y="36" class="inverse" text-anchor="start">Enterprise HRMS</text><rect x="302" y="18" width="68" height="28" rx="14" fill="rgba(255,255,255,0.12)"/><text x="336" y="36" class="inverse" text-anchor="middle">PROD</text><text x="20" y="76" class="h2inv" text-anchor="start">Runtime Monitor</text><rect x="16" y="108" width="100" height="28" rx="14" fill="#FEE2E2"/><text x="66.0" y="126" class="small" text-anchor="middle">Incidents 2</text><rect x="124" y="108" width="112" height="28" rx="14" fill="#FEF3C7"/><text x="180.0" y="126" class="small" text-anchor="middle">Replay 3</text><circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="28" y="127" class="inverse" text-anchor="middle">1</text><rect x="16" y="154" width="358" height="150" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="178" class="h3" text-anchor="start">Top signals</text><text x="32" y="196" class="small" text-anchor="start">Throughput, failures, lag, and dead-letter counts lead on mobile</text><circle cx="34" cy="206" r="3" fill="#2563EB"/><text x="46" y="210" class="body" text-anchor="start">Throughput 1.2M</text><circle cx="34" cy="226" r="3" fill="#2563EB"/><text x="46" y="230" class="body" text-anchor="start">Failures 128</text><circle cx="34" cy="246" r="3" fill="#2563EB"/><text x="46" y="250" class="body" text-anchor="start">Consumer lag 32s</text><circle cx="34" cy="266" r="3" fill="#2563EB"/><text x="46" y="270" class="body" text-anchor="start">DLQ 41</text><circle cx="30" cy="170" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="175" class="inverse" text-anchor="middle">2</text><rect x="16" y="320" width="358" height="210" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="344" class="h3" text-anchor="start">Route health</text><text x="32" y="362" class="small" text-anchor="start">Routes convert into stacked health cards</text><rect x="30" y="368" width="330" height="38" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="44" y="392" class="body" text-anchor="start">employee.changed healthy</text><rect x="30" y="416" width="330" height="38" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="44" y="440" class="body" text-anchor="start">workflow.updated lagging</text><rect x="30" y="464" width="330" height="38" rx="12" fill="#FBFDFF" stroke="#D9E2EC" stroke-width="1"/><text x="44" y="488" class="body" text-anchor="start">doc.generated failed</text><circle cx="30" cy="336" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="341" class="inverse" text-anchor="middle">3</text><rect x="16" y="546" width="358" height="160" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1" filter="url(#shadow)"/><text x="32" y="570" class="h3" text-anchor="start">Recovery actions</text><text x="32" y="588" class="small" text-anchor="start">Replay and incident actions are grouped in one mobile action zone</text><circle cx="34" cy="596" r="3" fill="#2563EB"/><text x="46" y="600" class="body" text-anchor="start">Failure sample</text><circle cx="34" cy="616" r="3" fill="#2563EB"/><text x="46" y="620" class="body" text-anchor="start">Replay safe</text><circle cx="34" cy="636" r="3" fill="#2563EB"/><text x="46" y="640" class="body" text-anchor="start">Pause consumer</text><circle cx="34" cy="656" r="3" fill="#2563EB"/><text x="46" y="660" class="body" text-anchor="start">Incident handoff</text><circle cx="30" cy="562" r="14" fill="#2563EB" stroke="white" stroke-width="3"/><text x="30" y="567" class="inverse" text-anchor="middle">4</text><rect x="16" y="722" width="358" height="104" rx="18" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="1"/><text x="34" y="750" class="h2" text-anchor="start">Mobile notes</text><circle cx="40" cy="774" r="12" fill="#2563EB"/><text x="40" y="778" class="inverse" text-anchor="middle">1</text><text x="62" y="776" class="annoTitle" text-anchor="start">Operational compression</text><text x="62" y="794" class="annoText" text-anchor="start">Mobile reduces the dense monitor into signals, route cards, and a compact action zone.</text><circle cx="40" cy="826" r="12" fill="#2563EB"/><text x="40" y="830" class="inverse" text-anchor="middle">2</text><text x="62" y="828" class="annoTitle" text-anchor="start">Safe-action framing</text><text x="62" y="846" class="annoText" text-anchor="start">Recovery actions remain visible but clearly separated from passive monitoring.</text></svg>
