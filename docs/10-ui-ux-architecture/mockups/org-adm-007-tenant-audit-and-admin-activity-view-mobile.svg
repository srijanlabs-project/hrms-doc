<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2 { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .h2inv { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: white; }
      .h3 { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .metric { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .body { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .tiny { font: 500 11px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .inverse { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: white; }
      .annoTitle { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #102A43; }
      .annoText { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #486581; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="390" height="844" fill="#F4F7FB"/>
  <rect width="390" height="92" fill="#10324A"/>
  <text x="20" y="36" class="inverse">Enterprise HRMS</text>
  <rect x="286" y="18" width="84" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="328" y="36" class="inverse" text-anchor="middle">Audit</text>
  <text x="20" y="76" class="h2inv">Tenant Audit</text>

  <rect x="16" y="108" width="358" height="96" rx="16" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="30" y="136" class="small">Northwind Logistics</text>
  <text x="30" y="170" class="metric">4.8k</text>
  <text x="94" y="170" class="body">events</text>
  <rect x="248" y="122" width="110" height="28" rx="14" fill="#FEE2E2"/>
  <text x="303" y="140" class="small" text-anchor="middle">Critical 09</text>
  <rect x="248" y="156" width="110" height="28" rx="14" fill="#DBEAFE"/>
  <text x="303" y="174" class="small" text-anchor="middle">Hooks 06</text>
  <circle cx="28" cy="122" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="28" y="127" class="inverse" text-anchor="middle">1</text>

  <rect x="16" y="220" width="358" height="150" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="244" class="h3">Investigation filters</text>
  <text x="32" y="262" class="small">Mobile keeps the narrowing model clear before the admin scans evidence</text>
  <rect x="30" y="270" width="94" height="28" rx="14" fill="#DCFCE7"/>
  <text x="77" y="288" class="small" text-anchor="middle">Actor</text>
  <rect x="132" y="270" width="102" height="28" rx="14" fill="#DBEAFE"/>
  <text x="183" y="288" class="small" text-anchor="middle">Reason</text>
  <rect x="242" y="270" width="114" height="28" rx="14" fill="#FEF3C7"/>
  <text x="299" y="288" class="small" text-anchor="middle">Masked only</text>
  <circle cx="34" cy="316" r="3" fill="#2563EB"/>
  <text x="46" y="320" class="body">Role grants, exports, SSO changes, and break-glass actions remain one-tap filters</text>
  <circle cx="34" cy="336" r="3" fill="#2563EB"/>
  <text x="46" y="340" class="body">Retention and legal-hold chips constrain the result set inside policy boundaries</text>
  <circle cx="30" cy="236" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="241" class="inverse" text-anchor="middle">2</text>

  <rect x="16" y="386" width="358" height="180" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="410" class="h3">Masked activity evidence</text>
  <text x="32" y="428" class="small">The event list keeps audit meaning while protecting sensitive values</text>
  <circle cx="34" cy="438" r="3" fill="#2563EB"/>
  <text x="46" y="442" class="body">16 Jul 2026 10:14 IST, R. Sharma, granted Payroll Approver, reason attached</text>
  <circle cx="34" cy="458" r="3" fill="#2563EB"/>
  <text x="46" y="462" class="body">16 Jul 2026 09:48 IST, P. Nair, opened employee export, fields masked</text>
  <circle cx="34" cy="478" r="3" fill="#2563EB"/>
  <text x="46" y="482" class="body">Masked previews show PAN as ABCDE1234F and phone as +91•••••3048</text>
  <circle cx="34" cy="498" r="3" fill="#2563EB"/>
  <text x="46" y="502" class="body">Every risky action links to actor, object, reason code, IP region, and source path</text>
  <circle cx="30" cy="402" r="14" fill="#2563EB" stroke="white" stroke-width="3"/>
  <text x="30" y="407" class="inverse" text-anchor="middle">3</text>

  <rect x="16" y="582" width="358" height="140" rx="14" fill="#FFFFFF" stroke="#D9E2EC" filter="url(#shadow)"/>
  <text x="32" y="606" class="h3">Actor timeline and export hook</text>
  <text x="32" y="624" class="small">The admin can move from one event to the full actor story or privacy review handoff</text>
  <circle cx="34" cy="634" r="3" fill="#2563EB"/>
  <text x="46" y="638" class="body">Actor thread shows device, region, impersonation flag, and related cross-module actions</text>
  <circle cx="34" cy="654" r="3" fill="#2563EB"/>
  <text x="46" y="658" class="body">Export hook transfers the audit context directly into a privacy or evidence-pack workflow</text>
  <circle cx="34" cy="674" r="3" fill="#2563EB"/>
  <text x="46" y="678" class="body">Downloadable evidence remains masked and linked to immutable audit ids</text>
  <circle cx="30" cy="598" r="14" fill="#B42318" stroke="white" stroke-width="3"/>
  <text x="30" y="603" class="inverse" text-anchor="middle">4</text>

  <rect x="16" y="738" width="358" height="88" rx="18" fill="#F8FBFF" stroke="#D9E2EC"/>
  <text x="34" y="766" class="h2">Mobile notes</text>
  <circle cx="40" cy="790" r="12" fill="#2563EB"/>
  <text x="40" y="794" class="inverse" text-anchor="middle">1</text>
  <text x="62" y="792" class="annoTitle">Forensic clarity first</text>
  <text x="62" y="810" class="annoText">Mobile preserves audit filters, masked evidence, actor timeline, and export handoff before deeper table detail.</text>
</svg>
